  exportMutabakatPdf(ad);
}

/* =========================================================
   MUHASEBE RAPORLARI
   Seçilen tarih aralığı için: alış/satış/KDV, kasa giriş-çıkış, ödeme/
   tahsilat, ve yaklaşık kâr/zarar özetini tek ekranda gösterir.
========================================================= */
function setMuhasebeRaporFiltre(key, val){
  if(!state.muhasebeRaporFiltre) state.muhasebeRaporFiltre = {from:'', to:''};
  state.muhasebeRaporFiltre[key] = val;
  renderContent();
}
function viewMuhasebeRaporlari(){
  const f = state.muhasebeRaporFiltre || {from:'', to:''};
  const from = f.from || todayISO().slice(0,8)+'01';
  const to = f.to || todayISO();

  const alisRows = state.alimlar.filter(a=>(a.tur||'Alış')==='Alış' && a.tarih>=from && a.tarih<=to);
  const satisRows = state.alimlar.filter(a=>(a.tur||'Alış')==='Satış' && a.tarih>=from && a.tarih<=to);
  const toplamAlis = alisRows.reduce((s,a)=>s+Number(a.toplam||0),0);
  const toplamSatis = satisRows.reduce((s,a)=>s+Number(a.toplam||0),0);
  const alisKdv = alisRows.reduce((s,a)=>s+Number(a.kdvTutari||0),0);
  const satisKdv = satisRows.reduce((s,a)=>s+Number(a.kdvTutari||0),0);
  const netKdv = satisKdv - alisKdv;

  const odemeRows = state.odemeler.filter(o=>o.tarih>=from && o.tarih<=to);
  const toplamOdeme = odemeRows.filter(o=>!String(o.tur||'').toUpperCase().includes('TAHSİLAT')).reduce((s,o)=>s+Number(o.tutar||0),0);
  const toplamTahsilat = odemeRows.filter(o=>String(o.tur||'').toUpperCase().includes('TAHSİLAT')).reduce((s,o)=>s+Number(o.tutar||0),0);

  const kasaRows = state.kasaHareketleri.filter(h=>h.tarih>=from && h.tarih<=to);
  const kasaGiris = kasaRows.filter(h=>h.tur==='Giriş').reduce((s,h)=>s+Number(h.tutar||0),0);
  const kasaCikis = kasaRows.filter(h=>h.tur==='Çıkış').reduce((s,h)=>s+Number(h.tutar||0),0);

  const yaklasikKarZarar = toplamSatis - toplamAlis;

  let html = '<div class="section-desc" style="margin-bottom:14px;">Seçtiğiniz tarih aralığı için tüm mali hareketlerin özeti.</div>';

  html += '<div class="card" style="margin-bottom:18px;">' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr;">' +
      '<div class="field" style="margin:0;"><label>Başlangıç</label><input type="date" value="'+from+'" onchange="setMuhasebeRaporFiltre(\'from\',this.value)"></div>' +
      '<div class="field" style="margin:0;"><label>Bitiş</label><input type="date" value="'+to+'" onchange="setMuhasebeRaporFiltre(\'to\',this.value)"></div>' +
    '</div>' +
  '</div>';

  html += '<div class="grid grid-4" style="margin-bottom:18px;">' +
    '<div class="card metric"><div class="metric-label">Toplam alış</div><div class="metric-value">'+money(toplamAlis)+'</div><div class="metric-sub">'+alisRows.length+' kalem</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam satış</div><div class="metric-value">'+money(toplamSatis)+'</div><div class="metric-sub">'+satisRows.length+' kalem</div></div>' +
    '<div class="card metric"><div class="metric-label">Yaklaşık kâr/zarar</div><div class="metric-value" style="color:'+(yaklasikKarZarar>=0?'var(--success)':'var(--danger)')+';">'+money(yaklasikKarZarar)+'</div><div class="metric-sub">satış − alış (genel gider hariç)</div></div>' +
    '<div class="card metric"><div class="metric-label">Net KDV</div><div class="metric-value" style="color:'+(netKdv>0?'var(--danger)':'var(--success)')+';">'+money(Math.abs(netKdv))+'</div><div class="metric-sub">'+(netKdv>0?'Ödenecek':'Devreden/İade')+'</div></div>' +
  '</div>';

  html += '<div class="grid grid-2" style="margin-bottom:18px;">' +
    '<div>' +
      '<h2 class="section-title">KDV Detayı</h2>' +
      '<div class="card"><div class="kv"><span>Satış KDV\'si</span><span class="num">'+money(satisKdv)+'</span></div><div class="kv"><span>Alış KDV\'si</span><span class="num">'+money(alisKdv)+'</span></div><div class="kv" style="border-bottom:0;"><span><b>Net</b></span><span class="num"><b>'+money(netKdv)+'</b></span></div></div>' +
    '</div>' +
    '<div>' +
      '<h2 class="section-title">Ödeme / Tahsilat</h2>' +
      '<div class="card"><div class="kv"><span>Toplam ödeme</span><span class="num">'+money(toplamOdeme)+'</span></div><div class="kv" style="border-bottom:0;"><span>Toplam tahsilat</span><span class="num">'+money(toplamTahsilat)+'</span></div></div>' +
    '</div>' +
  '</div>';

  html += '<h2 class="section-title">Kasa Hareketi (Nakit + Banka toplam)</h2>' +
    '<div class="card" style="max-width:480px;">' +
      '<div class="kv"><span>Toplam giriş</span><span class="num" style="color:var(--success);">'+money(kasaGiris)+'</span></div>' +
      '<div class="kv" style="border-bottom:0;"><span>Toplam çıkış</span><span class="num" style="color:var(--danger);">'+money(kasaCikis)+'</span></div>' +
    '</div>';

  return html;
}

/* =========================================================
   KÂR/ZARAR RAPORU
   Muhasebe Raporları'ndaki "yaklaşık kâr/zarar" (satış−alış, gider hariç)
   yerine, GERÇEK bir gelir tablosu: Satış Geliri − Satılan Malın Maliyeti
   = Brüt Kâr; Brüt Kâr − Faaliyet Giderleri (Gider Yönetimi'nden) = Net
   Kâr/Zarar.
========================================================= */
function setKarZararFiltre(key, val){
  if(!state.karZararFiltre) state.karZararFiltre = {from:'', to:''};
  state.karZararFiltre[key] = val;
  renderContent();
}
function viewKarZararRaporu(){
  const f = state.karZararFiltre || {from:'', to:''};
  const from = f.from || todayISO().slice(0,8)+'01';
  const to = f.to || todayISO();

  const satisRows = state.alimlar.filter(a=>(a.tur||'Alış')==='Satış' && a.tarih>=from && a.tarih<=to);
  const alisRows = state.alimlar.filter(a=>(a.tur||'Alış')==='Alış' && a.tarih>=from && a.tarih<=to);
  const satisGeliri = satisRows.reduce((s,a)=>s+Number(a.toplam||0),0);
  const smm = alisRows.reduce((s,a)=>s+Number(a.toplam||0),0);
  const brutKar = satisGeliri - smm;
  const brutMarj = satisGeliri>0 ? (brutKar/satisGeliri*100) : 0;

  const giderRows = state.giderler.filter(g=>g.tarih>=from && g.tarih<=to);
  const toplamGider = giderRows.reduce((s,g)=>s+g.tutar,0);
  const netKar = brutKar - toplamGider;
  const netMarj = satisGeliri>0 ? (netKar/satisGeliri*100) : 0;

  let html = '<div class="section-desc" style="margin-bottom:14px;">Seçtiğiniz dönem için gerçek gelir tablosu — satış gelirinden satılan malın maliyeti (alış) ve faaliyet giderleri (Gider Yönetimi) düşülerek hesaplanır.</div>';

  html += '<div class="card" style="margin-bottom:18px;">' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr;">' +
      '<div class="field" style="margin:0;"><label>Başlangıç</label><input type="date" value="'+from+'" onchange="setKarZararFiltre(\'from\',this.value)"></div>' +
      '<div class="field" style="margin:0;"><label>Bitiş</label><input type="date" value="'+to+'" onchange="setKarZararFiltre(\'to\',this.value)"></div>' +
    '</div>' +
  '</div>';

  html += '<div class="tbl-wrap" style="margin-bottom:18px;"><table>' +
    '<tbody>' +
      '<tr><td><b>Satış Geliri</b></td><td class="num"><b>'+money(satisGeliri)+'</b></td></tr>' +
      '<tr><td>Satılan Malın Maliyeti (Alış)</td><td class="num">−'+money(smm)+'</td></tr>' +
      '<tr style="background:var(--tfoot-bg);"><td><b>Brüt Kâr</b></td><td class="num" style="color:'+(brutKar>=0?'var(--success)':'var(--danger)')+';"><b>'+money(brutKar)+'</b></td></tr>' +
      '<tr><td>Faaliyet Giderleri</td><td class="num">−'+money(toplamGider)+'</td></tr>' +
      '<tr style="background:var(--tfoot-bg);border-top:2px solid var(--line);"><td style="font-size:15px;"><b>Net Kâr/Zarar</b></td><td class="num" style="font-size:15px;color:'+(netKar>=0?'var(--success)':'var(--danger)')+';"><b>'+money(netKar)+'</b></td></tr>' +
    '</tbody>' +
  '</table></div>';

  html += '<div class="grid grid-4" style="margin-bottom:18px;">' +
    '<div class="card metric"><div class="metric-label">Brüt Kâr Marjı</div><div class="metric-value">%'+num(brutMarj,1)+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Net Kâr Marjı</div><div class="metric-value" style="color:'+(netMarj>=0?'var(--success)':'var(--danger)')+';">%'+num(netMarj,1)+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam Gider</div><div class="metric-value">'+money(toplamGider)+'</div><div class="metric-sub">'+giderRows.length+' kayıt</div></div>' +
    '<div class="card metric"><div class="metric-label">Satış Adedi</div><div class="metric-value">'+satisRows.length+'</div></div>' +
  '</div>';

  const giderKategoriDagilimi = {};
  giderRows.forEach(g=>{ giderKategoriDagilimi[g.kategori] = (giderKategoriDagilimi[g.kategori]||0)+g.tutar; });
  const donutData = Object.keys(giderKategoriDagilimi).map(k=>({label:k, value:giderKategoriDagilimi[k]})).sort((a,b)=>b.value-a.value);

  const bugun = todayISO();
  const aySonBaslangic = (function(){ const d=new Date(bugun+'T00:00:00'); d.setMonth(d.getMonth()-5); d.setDate(1); return dateToLocalISO(d); })();
  const months = monthKeysBetween(aySonBaslangic, bugun);
  const aylikNetKar = months.map(mk=>{
    const s = state.alimlar.filter(a=>(a.tur||'Alış')==='Satış' && String(a.tarih||'').slice(0,7)===mk).reduce((sum,a)=>sum+Number(a.toplam||0),0);
    const a2 = state.alimlar.filter(a=>(a.tur||'Alış')==='Alış' && String(a.tarih||'').slice(0,7)===mk).reduce((sum,a)=>sum+Number(a.toplam||0),0);
    const g = state.giderler.filter(g=>String(g.tarih||'').slice(0,7)===mk).reduce((sum,g)=>sum+g.tutar,0);
    return {key:mk, net: s-a2-g};
  });
  const maxAbsNet = Math.max(1, ...aylikNetKar.map(m=>Math.abs(m.net)));

  html += '<div class="grid grid-2" style="margin-bottom:18px;">' +
    '<div><h2 class="section-title">Dönem Giderlerinin Kategori Dağılımı</h2><div class="card">' + (donutData.length?donutChartHtml(donutData,{centerLabel:'Toplam Gider'}):emptyMini()) + '</div></div>' +
    '<div><h2 class="section-title">Son 6 Ay — Net Kâr/Zarar Trendi</h2><div class="card"><div class="chart-bars">' +
      aylikNetKar.map(m=>(
        '<div class="chart-bar-col"><div class="chart-bar" style="background:'+(m.net>=0?'var(--success)':'var(--danger)')+';height:'+Math.max(2,Math.round(Math.abs(m.net)/maxAbsNet*120))+'px;" title="'+money(m.net)+'"></div><div class="chart-bar-label">'+monthShortLabel(m.key)+'</div></div>'
      )).join('') +
    '</div></div></div>' +
  '</div>';

  return html;
}

/* =========================================================
   ÖDEME EMİRLERİ
   Yönetici "bu firmaya ödeme yapılmalı" dediğinde bir kayıt oluşur —
   muhasebe (ya da kim bakıyorsa) menüde kırmızı bir uyarı görür, tıklayınca
   bekleyen ödeme emirlerinin tam listesini görür. Cari bakiyeyi kendisi
   DEĞİŞTİRMEZ — sadece "ödenmesi gerekiyor" bilgisini taşır; fiilen ödeme
   yapıldığında Ödeme sekmesinden normal şekilde işlenir ve emir "Ödendi"
   olarak işaretlenir.
========================================================= */
function normalizeOdemeEmri(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id']) || '',
    tarih: pickField(rec,['tarih','Tarih']) || '',
    firma: pickField(rec,['firma','Firma']) || '',
    tutar: Number(pickField(rec,['tutar','Tutar']))||0,
    oncelik: pickField(rec,['oncelik','Oncelik']) || 'Normal',
    not: pickField(rec,['not','Not']) || '',
    odemeSekli: pickField(rec,['odemeSekli','OdemeSekli']) || 'Nakit',
    kapsananFaturalar: pickField(rec,['kapsananFaturalar','KapsananFaturalar']) || '',
    durum: pickField(rec,['durum','Durum']) || 'Bekliyor',
    olusturanKullanici: pickField(rec,['olusturanKullanici','OlusturanKullanici']) || '',
    odemeTarihi: pickField(rec,['odemeTarihi','OdemeTarihi']) || ''
  };
}
function odemeEmriDurumBadge(durum){
  const cls = durum==='Ödendi' ? 'badge-success' : durum==='İptal' ? 'badge-primary' : 'badge-danger';
  return '<span class="badge '+cls+'" style="font-weight:600;">'+escapeHtml(durum||'Bekliyor')+'</span>';
}
function bekleyenOdemeEmriSayisi(){
  return (state.odemeEmirleri||[]).filter(o=>(o.durum||'Bekliyor')==='Bekliyor').length;
}
function viewOdemeEmirleri(){
  const list = state.odemeEmirleri.slice().sort((a,b)=>{
    // Bekleyenler üstte, sonra önceliğe (Acil önce), sonra tarihe göre.
    const durumSira = {Bekliyor:0, Ödendi:1, İptal:2};
    const d = (durumSira[a.durum]||0)-(durumSira[b.durum]||0);
    if(d!==0) return d;
    const oncelikSira = {Acil:0, Normal:1};
    const o = (oncelikSira[a.oncelik]||1)-(oncelikSira[b.oncelik]||1);
    if(o!==0) return o;
    return String(b.tarih||'').localeCompare(String(a.tarih||''));
  });
  const bekleyen = list.filter(o=>o.durum==='Bekliyor');
  const toplamBekleyen = bekleyen.reduce((s,o)=>s+o.tutar,0);
  const acilSayisi = bekleyen.filter(o=>o.oncelik==='Acil').length;

  let html = '<div class="section-desc" style="margin-bottom:14px;">Ödenmesi gereken firmaları buradan işaretleyin — bekleyen her emir menüde kırmızı bir uyarı olarak görünür. Fiilen ödemeyi Ödeme sekmesinden yapıp burada "Ödendi" olarak kapatın.</div>';

  html += '<div class="grid grid-3" style="margin-bottom:18px;">' +
    '<div class="card metric"><div class="metric-label">Bekleyen ödeme emri</div><div class="metric-value" style="color:'+(bekleyen.length>0?'var(--danger)':'var(--ink)')+';">'+bekleyen.length+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Bekleyen toplam tutar</div><div class="metric-value" style="color:'+(toplamBekleyen>0?'var(--danger)':'var(--ink)')+';">'+money(toplamBekleyen)+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Acil</div><div class="metric-value" style="color:'+(acilSayisi>0?'var(--danger)':'var(--ink)')+';">'+acilSayisi+'</div></div>' +
  '</div>';

  if(canDo('odemeEmirleri','add')){
    html += '<div style="margin-bottom:14px;"><button class="btn btn-primary" onclick="openOdemeEmriModal()">+ Yeni Ödeme Emri</button></div>';
  }

  if(list.length===0){
    html += emptyState('Henüz ödeme emri yok', 'Yukarıdan ya da Cari Borç Bakiye ekranından ekleyebilirsiniz.');
    return html;
  }

  html += '<div class="tbl-wrap"><table><thead><tr><th>Durum</th><th>Öncelik</th><th>Firma</th><th class="num">Tutar</th><th>Ödeme Şekli</th><th>Kapsam / Not</th><th>Oluşturan</th><th>Tarih</th><th></th></tr></thead><tbody>' +
    list.map(o=>{
      const id = o.ID||o.id;
      return '<tr><td>'+odemeEmriDurumBadge(o.durum)+'</td>' +
        '<td>'+(o.oncelik==='Acil'?'<span class="badge badge-danger" style="font-weight:600;">Acil</span>':'<span class="hint" style="margin:0;">Normal</span>')+'</td>' +
        '<td><b>'+escapeHtml(o.firma)+'</b></td>' +
        '<td class="num">'+money(o.tutar)+'</td>' +
        '<td>'+escapeHtml(o.odemeSekli||'—')+'</td>' +
        '<td style="max-width:260px;font-size:12px;">'+(o.kapsananFaturalar?'<div class="hint" style="margin:0;">'+escapeHtml(o.kapsananFaturalar)+'</div>':'')+(o.not?('<div>'+escapeHtml(o.not)+'</div>'):(o.kapsananFaturalar?'':'—'))+'</td>' +
        '<td>'+escapeHtml(o.olusturanKullanici||'—')+'</td>' +
        '<td>'+fmtDate(o.tarih)+'</td>' +
        '<td style="white-space:nowrap;">' +
          (o.durum==='Bekliyor' && canDo('odemeEmirleri','edit') ?
            '<button class="btn btn-ghost btn-sm" onclick="markOdemeEmriDurum(\''+id+'\',\'Ödendi\')">Ödendi işaretle</button> ' +
            '<button class="btn btn-ghost btn-sm" onclick="markOdemeEmriDurum(\''+id+'\',\'İptal\')">İptal</button>' : '') +
          (canDo('odemeEmirleri','delete') ? ' <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteOdemeEmri(\''+id+'\')">Sil</button>' : '') +
        '</td></tr>';
    }).join('') +
  '</tbody></table></div>';
  return html;
}
// Bir firmanın KAPANMAMIŞ (Açık ya da Kısmi Ödeme durumundaki) alış
// faturalarını, kalan tutarlarıyla birlikte, en eskiden en yeniye sıralı
// döndürür — hem "tutar gir" modundaki FIFO simülasyonu hem "fatura seç"
// modundaki tik kutuları için tek kaynak.
function oeAcikFaturalar(ad){
  const map = computeFaturaOdemeDurumu(ad);
  return Object.keys(map).map(key=>{
    const [tarih, faturaNo] = key.split('|');
    const od = map[key];
    if(od.durum==='Kapandı') return null;
    return {tarih, faturaNo, kalan:od.kalan, toplam:od.odenen+od.kalan, durum:od.durum, paraBirimi:od.paraBirimi||'TL', kur:od.kur||1, dovizKalan:od.dovizKalan||0};
  }).filter(Boolean).sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')));
}
// Firmaya en son ne zaman, ne kadar, hangi şekilde (Nakit/EFT/Çek) ödeme
// yapıldığını bulur (tahsilat hariç, sadece bizim yaptığımız ödemeler).
function oeSonOdemeBilgisi(ad){
  const list = state.odemeler.filter(o=>o.firma===ad && !String(o.tur||'').toUpperCase().includes('TAHSİLAT'))
    .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')));
  return list.length ? list[list.length-1] : null;
}
// Girilen bir tutarın, açık faturaları en eskiden başlayarak hangisini tam
// hangisini kısmi kapsayacağını hesaplar (gerçek ödeme mantığıyla BİREBİR
// aynı FIFO kuralı — bkz. computeFaturaOdemeDurumu). Her kalemde faturanın
// ESAS toplam tutarını ve bu ödemeden SONRA o faturada ne kadar kalacağını
// da taşır (kısmi ödemelerde gösterebilmek için).
function simulateOdemeKapsami(acikFaturalar, tutar){
  let kalanTutar = tutar;
  const kapsam = [];
  for(const f of acikFaturalar){
    if(kalanTutar<=0.005) break;
    if(kalanTutar>=f.kalan-0.005){
      kapsam.push({tarih:f.tarih, faturaNo:f.faturaNo, tutar:f.kalan, tamMi:true, faturaToplam:f.toplam, yeniKalan:0});
      kalanTutar -= f.kalan;
    } else {
      kapsam.push({tarih:f.tarih, faturaNo:f.faturaNo, tutar:kalanTutar, tamMi:false, faturaToplam:f.toplam, yeniKalan:f.kalan-kalanTutar});
      kalanTutar = 0;
    }
  }
  return {kapsam, fazlaKalan:Math.max(0,kalanTutar)};
}
// bakiye/tutar verilirse üstte "bu ödemeden sonra kalan genel borç" özeti
// de gösterir — Ödeme Emri modalı ve Ödeme sekmesi ortak kullanır.
function oeKapsamOnizlemeHtml(kapsam, fazlaKalan, bakiye, tutar){
  let html = '';
  if(bakiye!==undefined && tutar!==undefined){
    const kalanGenelBorc = bakiye - tutar;
    html += '<div class="card" style="margin:10px 0;background:var(--primary-tint);padding:10px 14px;">' +
      '<div class="kv" style="border-bottom:0;padding:2px 0;"><span>Bu ödemeden sonra kalan genel borç</span>' +
      '<span class="num"><b style="color:'+(kalanGenelBorc>0.5?'var(--danger)':'var(--success)')+';">'+money(kalanGenelBorc)+'</b></span></div>' +
    '</div>';
  }
  if(kapsam.length===0) return html + '<div class="hint" style="margin:6px 0 0;">Bu tutarla eşleşen açık fatura yok.</div>';
  html += '<div class="hint" style="margin:8px 0 0;font-weight:600;color:var(--ink);">Bu ödeme şunları kapsayacak:</div>' +
    '<ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;">' +
      kapsam.map(k=>{
        if(k.tamMi){
          return '<li>'+fmtDate(k.tarih)+' · Fatura no: '+(escapeHtml(k.faturaNo)||'—')+' — '+money(k.tutar)+' <span style="color:var(--success);">(tamamen kapanır)</span></li>';
        }
        return '<li>'+fmtDate(k.tarih)+' · Fatura no: '+(escapeHtml(k.faturaNo)||'—')+' — bu ödemeyle '+money(k.tutar)+' ödenir ' +
          '<span style="color:var(--accent);">(KISMİ ödeme — fatura toplamı '+money(k.faturaToplam)+', bu ödemeden sonra kalan: '+money(k.yeniKalan)+')</span></li>';
      }).join('') +
    '</ul>' +
    (fazlaKalan>0.5 ? '<div class="hint" style="margin-top:6px;color:var(--danger);">⚠ '+money(fazlaKalan)+' tutar, hiçbir açık faturayla eşleşmiyor (firmanın tüm açık faturalarından fazla).</div>' : '');
  return html;
}

// Firma değiştikçe (ya da modal ilk açıldığında) bakiye + son ödeme + açık
// fatura listesini yeniden çizer. "onceTutar" sadece ilk açılışta (Cari Borç
// Bakiye'den "Ödeme Emri Oluştur" ile gelindiğinde) tutarı önceden doldurur.
function refreshOdemeEmriPaneli(onceTutar){
  const panel = document.getElementById('oeFirmaPanel');
  const ad = (document.getElementById('oeFirma')||{}).value.trim();
  if(!panel) return;
  if(!ad){ panel.innerHTML=''; return; }
  const bakiye = computeFirmaBakiye(ad).bakiye;
  const sonOdeme = oeSonOdemeBilgisi(ad);
  const acikFaturalar = oeAcikFaturalar(ad);
  window.__oeAcikFaturalar = acikFaturalar; // checkbox/tutar hesaplarında kullanılacak
  window.__oeBakiye = bakiye;

  let html = '<div class="card" style="margin:10px 0;background:var(--paper);">' +
    '<div class="kv"><span>Güncel bakiye</span><span class="num"><b style="color:'+(bakiye>0.5?'var(--danger)':'var(--ink)')+';">'+money(bakiye)+'</b></span></div>' +
    '<div class="kv" style="border-bottom:0;"><span>Son ödeme</span><span class="num">'+(sonOdeme?fmtDate(sonOdeme.tarih)+' · '+money(sonOdeme.tutar)+' · '+escapeHtml(sonOdeme.tur):'—')+'</span></div>' +
  '</div>';

  html += '<div style="display:flex;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;">' +
    '<label style="font-size:13px;font-weight:600;margin:0;">Tutar</label>' +
    '<input id="oeTutar" type="number" step="any" min="0" style="max-width:180px;" value="'+(onceTutar||'')+'" oninput="oeTutarDegisti()">' +
    '<span class="hint" style="margin:0;">— elle girin, ya da aşağıdan fatura seçin</span>' +
  '</div>';

  if(acikFaturalar.length===0){
    html += '<div class="hint" style="margin:6px 0;">Bu firmaya ait açık (ödenmemiş) fatura yok.</div>';
  } else {
    html += '<div class="tbl-wrap" style="max-height:280px;overflow-y:auto;"><table><thead><tr><th></th><th>Tarih</th><th>Fatura No</th><th>Durum</th><th class="num">Kalan</th><th></th></tr></thead><tbody>' +
      acikFaturalar.map((f,i)=>(
        '<tr><td><input type="checkbox" id="oeFat_'+i+'" onchange="oeFaturaSecildi()"></td>' +
        '<td>'+fmtDate(f.tarih)+'</td><td>'+(escapeHtml(f.faturaNo)||'—')+'</td>' +
        '<td>'+(f.durum==='Kısmi Ödeme'?'<span class="badge badge-accent">Kısmi Ödeme</span>':'<span class="badge badge-primary">Açık</span>')+'</td>' +
        '<td class="num">'+money(f.kalan)+'</td>' +
        '<td style="white-space:nowrap;"><button type="button" class="btn btn-ghost btn-sm" onclick="showMukerrerFaturaIcerigi(\''+escapeHtml(ad).replace(/'/g,"\\'")+'\',\''+escapeHtml(f.faturaNo).replace(/'/g,"\\'")+'\',\'Alış\')">Fatura İçeriğini Göster</button></td></tr>'
      )).join('') +
    '</tbody></table></div>';
  }
  html += '<div id="oeKapsamOnizleme"></div>';
  panel.innerHTML = html;
  if(onceTutar) oeTutarDegisti();
}
// Tutar elle değiştirildiğinde: fatura tik kutularını temizler (artık
// tutar-bazlı moddayız) ve FIFO simülasyonuyla önizlemeyi günceller.
function oeTutarDegisti(){
  document.querySelectorAll('[id^="oeFat_"]').forEach(cb=>{ cb.checked=false; });
  const tutar = Number((document.getElementById('oeTutar')||{}).value)||0;
  const acikFaturalar = window.__oeAcikFaturalar||[];
  const onizleme = document.getElementById('oeKapsamOnizleme');
  if(!onizleme) return;
  if(tutar<=0){ onizleme.innerHTML=''; return; }
  const {kapsam, fazlaKalan} = simulateOdemeKapsami(acikFaturalar, tutar);
  onizleme.innerHTML = oeKapsamOnizlemeHtml(kapsam, fazlaKalan, window.__oeBakiye, tutar);
}
// Fatura(lar) tikleyince: tutarı seçilenlerin TOPLAM kalanına eşitler ve
// önizlemeyi (bu sefer gerçek seçime göre, simülasyona gerek kalmadan) gösterir.
function oeFaturaSecildi(){
  const acikFaturalar = window.__oeAcikFaturalar||[];
  const secilenler = [];
  acikFaturalar.forEach((f,i)=>{
    const cb = document.getElementById('oeFat_'+i);
    if(cb && cb.checked) secilenler.push(f);
  });
  const toplam = secilenler.reduce((s,f)=>s+f.kalan,0);
  const tutarEl = document.getElementById('oeTutar');
  if(tutarEl) tutarEl.value = toplam ? (Math.round(toplam*100)/100) : '';
  const onizleme = document.getElementById('oeKapsamOnizleme');
  if(!onizleme) return;
  if(secilenler.length===0){ onizleme.innerHTML=''; return; }
  onizleme.innerHTML = oeKapsamOnizlemeHtml(secilenler.map(f=>({tarih:f.tarih, faturaNo:f.faturaNo, tutar:f.kalan, tamMi:true, faturaToplam:f.toplam, yeniKalan:0})), 0, window.__oeBakiye, toplam);
}
async function saveOdemeEmri(){
  const firma = document.getElementById('oeFirma').value.trim();
  const tutar = Number(document.getElementById('oeTutar').value)||0;
  const odemeSekli = document.getElementById('oeOdemeSekli').value;
  const oncelik = document.getElementById('oeOncelik').value;
  const not = document.getElementById('oeNot').value.trim();
  if(!firma){ toast('Firma girin.'); return; }
  if(tutar<=0){ toast('Tutar 0\'dan büyük olmalı (elle girin ya da fatura seçin).'); return; }
  const acikFaturalar = window.__oeAcikFaturalar||[];
  const {kapsam} = simulateOdemeKapsami(acikFaturalar, tutar);
  const kapsamNot = kapsam.map(k=>fmtDate(k.tarih)+' '+(k.faturaNo||'—')+': '+money(k.tutar)+(k.tamMi?'':' (kısmi)')).join(' · ');
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const rec = {ID:uid('OE'), tarih:todayISO(), firma, tutar, oncelik, not, odemeSekli, kapsananFaturalar:kapsamNot, durum:'Bekliyor', olusturanKullanici:kullanici, odemeTarihi:''};
  state.odemeEmirleri.push(rec);
  await persistOdemeEmirleri();
  closeModal();
  toast('Ödeme emri oluşturuldu: '+firma);
  renderContent();
  renderNav(); // kırmızı rozeti hemen güncelle
  syncOrQueue({action:'addOdemeEmri', data:{tarih:rec.tarih, firma, tutar, oncelik, not, odemeSekli, kapsananFaturalar:kapsamNot, durum:'Bekliyor', olusturanKullanici:kullanici, odemeTarihi:''}}, {entity:'odemeEmri', op:'add', localId:rec.ID});
}
async function markOdemeEmriDurum(id, durum){
  if(!canDo('odemeEmirleri','edit')){ yetkiYokUyar(); return; }
  const idx = state.odemeEmirleri.findIndex(o=>(o.ID||o.id)===id);
  if(idx===-1) return;
  state.odemeEmirleri[idx].durum = durum;
  if(durum==='Ödendi') state.odemeEmirleri[idx].odemeTarihi = todayISO();
  await persistOdemeEmirleri();
  toast('Ödeme emri '+(durum==='Ödendi'?'ödendi olarak işaretlendi.':'iptal edildi.'));
  renderContent();
  renderNav();
  syncOrQueue({action:'updateOdemeEmri', id, data:{durum, odemeTarihi:state.odemeEmirleri[idx].odemeTarihi}}, {entity:'odemeEmri', op:'update', localId:id});
}
async function deleteOdemeEmri(id){
  if(!canDo('odemeEmirleri','delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu ödeme emri silinsin mi?')) return;
  state.odemeEmirleri = state.odemeEmirleri.filter(o=>(o.ID||o.id)!==id);
  await persistOdemeEmirleri();
  renderContent();
  renderNav();
  syncOrQueue({action:'deleteOdemeEmri', id}, {entity:'odemeEmri', op:'delete', localId:id});
}

/* =========================================================
   ÇEK / SENET TAKİBİ
   "Verilen" (firmaya ödeme için verdiğimiz çek) ve "Alınan" (firmadan
   tahsil edeceğimiz çek) olarak iki yönde takip edilir. Durum: Beklemede
   → Tahsil Edildi / Karşılıksız / İptal. Cari bakiyeyi ETKİLEMEZ (bakiye
   hâlâ Alış/Satış/Ödeme/Tahsilat/İade üzerinden hesaplanır) — bu modül
   sadece "elde hangi çekler var, vadeleri ne zaman" takibi içindir.
========================================================= */
function normalizeCek(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id']) || '',
    tur: pickField(rec,['tur','Tur']) || 'Verilen',
    firma: pickField(rec,['firma','Firma']) || '',
    banka: pickField(rec,['banka','Banka']) || '',
    no: pickField(rec,['no','No']) || '',
    tutar: Number(pickField(rec,['tutar','Tutar']))||0,
    vadeTarihi: pickField(rec,['vadeTarihi','VadeTarihi']) || '',
    durum: pickField(rec,['durum','Durum']) || 'Beklemede',
    not: pickField(rec,['not','Not']) || '',
    eklenmeTarihi: pickField(rec,['eklenmeTarihi','EklenmeTarihi']) || ''
  };
}

    filtered.map(c=>{

      return '<tr><td>'+fmtDate(c.vadeTarihi)+(c.durum==='Beklemede'?'<div>'+vadeBadgeHtml(c.vadeTarihi, od)+'</div>':'')+'</td>' +

            '<button class="btn btn-ghost btn-sm btn-danger" onclick="setCekDurum(\''+id+'\',\'Karşılıksız\')">Karşılıksız</button> ' +

    }).join('') +

}
async function addCek(){
  if(!canDo('cekSenet','add')){ yetkiYokUyar(); return; }
  const tur = document.getElementById('cTur').value;
  const firma = document.getElementById('cFirma').value.trim();
  const banka = document.getElementById('cBanka').value.trim();
  const no = document.getElementById('cNo').value.trim();
  const tutar = Number(document.getElementById('cTutar').value)||0;
  const vadeTarihi = document.getElementById('cVade').value;
  const not = document.getElementById('cNot').value.trim();
  if(!firma){ toast('Firma girin.'); return; }
  if(tutar<=0){ toast('Tutar 0\'dan büyük olmalı.'); return; }
  if(!vadeTarihi){ toast('Vade tarihi seçin.'); return; }
  const rec = {ID:uid('CK'), tur, firma, banka, no, tutar, vadeTarihi, durum:'Beklemede', not, eklenmeTarihi:todayISO()};
  state.cekler.push(rec);
  await persistCekler();
  toast('Çek/senet kaydedildi.');
  renderContent();
  syncOrQueue({action:'addCek', data:{tur, firma, banka, no, tutar, vadeTarihi, durum:rec.durum, not, eklenmeTarihi:rec.eklenmeTarihi}}, {entity:'cek', op:'add', localId:rec.ID});
}
async function setCekDurum(id, durum){
  if(!canDo('cekSenet','edit')){ yetkiYokUyar(); return; }
  const idx = state.cekler.findIndex(x=>(x.ID||x.id)===id);
  if(idx===-1) return;
  if(durum==='Karşılıksız' && !confirm('Bu çek karşılıksız olarak işaretlensin mi?')) return;
  state.cekler[idx].durum = durum;
  await persistCekler();
  toast('Durum güncellendi: '+durum);
  renderContent();
  syncOrQueue({action:'updateCek', id, data:{durum}}, {entity:'cek', op:'update', localId:id});
}
async function deleteCek(id){
  if(!canDo('cekSenet','delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu çek/senet kaydı silinsin mi?')) return;
  state.cekler = state.cekler.filter(x=>(x.ID||x.id)!==id);
  await persistCekler();
  renderContent();
  syncOrQueue({action:'deleteCek', id}, {entity:'cek', op:'delete', localId:id});
}

/* =========================================================
   TALEPLER (Depocu -> Yönetici ürün siparişi talebi)
   Akış: Depocu ürün+miktar seçip talep gönderir (Bekliyor) -> Yönetici
   talebi görür, hangi firmaya sipariş vereceğini seçip onaylar (Onaylandı,
   firma o an sabitlenir) -> ürün gelince Yönetici "Faturaya Aktar" ile
   talebi doğrudan Fatura Girişi taslağına döker, fatura no/miktarları
   kontrol edip kaydeder -> talep otomatik "Faturalandı" olur.
========================================================= */
function talepDurumBadge(durum){
  const cls = durum==='Onaylandı' ? 'badge-primary' : durum==='Faturalandı' ? 'badge-success' :
    durum==='İptal' ? 'badge-danger' : 'badge-accent';
  return '<span class="badge '+cls+'">'+escapeHtml(durum||'Bekliyor')+'</span>';
}
// ---- Talep durumu: sayaçlar + tek-tık "hızlı bağlan ve durumu çek" ----
// Yönetici ve depocu tarafında aynı buton/kart tasarımı kullanılıyor.
function talepDurumOf(t){ return t.Durum||t.durum||'Bekliyor'; }
function talepStatusCounts(list){
  const c = {Bekliyor:0, Onaylandı:0, Faturalandı:0, İptal:0};
  list.forEach(t=>{ const d=talepDurumOf(t); if(c[d]===undefined) c[d]=0; c[d]++; });
  return c;
}
function lastTalepSyncLabel(){
  if(!state.lastTalepSyncAt) return 'Henüz kontrol edilmedi';
  try{ return new Date(state.lastTalepSyncAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; }
}
function talepStatusPanel(list){
  const c = talepStatusCounts(list);
  const cards = [
    ['Bekliyor','st-bekliyor'], ['Onaylandı','st-onaylandi'],
    ['Faturalandı','st-faturalandi'], ['İptal','st-iptal']
  ];
  return '<div class="talep-status-grid">' + cards.map(([key,cls])=>(
    '<div class="talep-status-card '+cls+'"><div class="ts-label">'+escapeHtml(key)+'</div><div class="ts-count">'+(c[key]||0)+'</div></div>'
  )).join('') + '</div>';
}
function talepSyncButtonHtml(mobile){
  const label = state.connected ? '⟳ Talep Durumunu Yenile' : '⟳ Bağlan ve Durumu Kontrol Et';
  const sub = 'Son kontrol: '+lastTalepSyncLabel();
  if(mobile){
    return '<div class="m-actions" style="margin-bottom:12px;align-items:center;">' +
      '<button type="button" data-talep-sync class="m-primary" onclick="quickTalepDurumSync()">'+escapeHtml(label)+'</button>' +
      '<span class="m-muted">'+escapeHtml(sub)+'</span>' +
    '</div>';
  }
  return '<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">' +
    '<button type="button" data-talep-sync class="btn btn-sm btn-primary" onclick="quickTalepDurumSync()">'+escapeHtml(label)+'</button>' +
    '<span class="section-desc" style="margin:0;">'+escapeHtml(sub)+'</span>' +
  '</div>';
}
// Tek tık: önce (varsa) bekleyen onay/talep işlemlerini buluta gönderir,
// sonra talep durumlarını buluttan çekip yerelle birleştirir (yerel/henüz
// gönderilmemiş kayıtlar KAYBOLMAZ — mergeByIdKeepLocalOnly ile). Hem
// masaüstü (Talepler sekmesi) hem mobil (Talepler/Onaylar/Ana Sayfa) aynı
// fonksiyonu çağırır.
let talepQuickSyncBusy = false;
async function quickTalepDurumSync(silent){
  if(!state.apiUrl){ if(!silent) toast('Önce Ayarlar sekmesinden bulut bağlantı adresini girin.'); return; }
  if(talepQuickSyncBusy) return;
  talepQuickSyncBusy = true;
  document.querySelectorAll('[data-talep-sync]').forEach(b=>{ b.disabled=true; });
  if(!silent) toast('Talep durumları kontrol ediliyor…');
  try{
    if(state.pendingOps && state.pendingOps.length>0) await flushPendingOps();
    const data = await apiGet('all');
    if(!data || data.ok===false) throw new Error((data&&data.error)||'Bilinmeyen hata');
    if(data.talepler !== undefined) state.talepler = mergeByIdKeepLocalOnly(state.talepler, data.talepler);
    await persistTalepler();
    state.connected = true;
    state.lastTalepSyncAt = new Date().toISOString();
    if(!silent) toast('Talep durumları güncellendi.');
  }catch(e){
    state.connected = false;
    if(!silent) toast('Talep durumları çekilemedi: '+String((e&&e.message)||e));
  }finally{
    talepQuickSyncBusy = false;
    renderShellStatus();
    renderContent();
  }
}
// Teslim alındı: firma siparişi depocuya fiilen teslim ettiğinde depocu

// "ürün elimize ulaştı" bilgisi anında görünür.
function teslimatBadge(t){
  const alindi = t.TeslimAlindi||t.teslimAlindi;
  if(alindi) return '<span class="badge badge-success">✓ Teslim alındı ('+fmtDate(t.TeslimTarihi||t.teslimTarihi)+')</span>';
  return '<span class="badge badge-accent">Bekleniyor</span>';

async function markTeslimAlindi(id){

  state.talepler[idx].TeslimAlindi = '1';
  state.talepler[idx].TeslimTarihi = teslimTarihi;
  await persistTalepler();
  toast('Teslim alındı olarak işaretlendi.');
  renderContent();

function teslimatHucresi(t){
  const id = t.ID||t.id;
  const durum = t.Durum||t.durum;
  const alindi = t.TeslimAlindi||t.teslimAlindi;
  const aktarildi = t.StogaAktarildi||t.stogaAktarildi;

    return teslimatBadge(t) + '<div class="hint" style="margin-top:4px;color:var(--success);">✓ Stoğa aktarıldı</div>';

  return teslimatBadge(t);

// Teslim alınan talep ürünlerini Ürünler kartındaki Stok alanına ekler.

function openStogaAktar(id){

  }).join('');

      '<div class="modal-box" style="max-width:560px;">' +

        '<div class="section-desc" style="margin-top:-6px;">Gelen faturaya göre gerçek teslim alınan miktarları kontrol edin/düzeltin, hangi ambara ekleneceğini seçin, sonra aktarın.</div>' +
        '<div class="field" style="margin-bottom:12px;"><label>Fatura No <span style="font-weight:400;color:var(--faint);">(bu ürünlerin geldiği fatura — yönetici Alış Faturası\'nı girerken bununla eşleştirilir, mükerrer stok girişini önler)</span></label>' +
          '<input id="saFaturaNo" type="text" placeholder="ör. 0877730"></div>' +
        '<div class="field" style="margin-bottom:12px;"><label>Ambar</label><select id="saAmbar">' +
          '<option value="">Ana Ambar</option>' +

        '</select><div class="hint" style="margin-top:4px;">"Ana Ambar" dışında bir ambar seçerseniz, ürün doğrudan o ambara aktarılır (Ana Ambar stoğu değişmez, o ambarın Çıkış raporuna işlenir).</div></div>' +
        rowsHtml +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Vazgeç</button>' +

async function confirmStogaAktar(id){
  const t = state.talepler.find(x=>(x.ID||x.id)===id);
  if(!t) return;
  const kalemler = talepKalemleri(t);
  const ambarSecili = (document.getElementById('saAmbar').value||'').trim();
  const faturaNoEl = document.getElementById('saFaturaNo');
  const stogaAktarilanFaturaNo = faturaNoEl ? faturaNoEl.value.trim() : '';
  const updatedUrunler = [];
  const yeniTransferler = [];
  const tarih = todayISO();
  kalemler.forEach((k,i)=>{
    const el = document.getElementById('sa_'+i);
    const miktar = el ? Number(el.value)||0 : Number(k.miktar)||0;
    if(miktar<=0) return;
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(k.stokKodu||'').toUpperCase());
    if(!u) return;
    if(!ambarSecili){
      // Ana Ambar: doğrudan stoğa eklenir (eski davranış)
      const eski = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
      u.Stok = eski + miktar;
      updatedUrunler.push(u);
    } else {
      // Belirli bir ambar: Ana Ambar stoğu DEĞİŞMEZ — ürün doğrudan o
      // ambara "Çıkış" olarak işlenir, güncel (son alış) fiyatından
      // fiyatlandırılır, o ambarın Çıkış raporuna girer.
      const birimFiyat = getSonAlisFiyati(u.StokKodu||u.stokKodu);
      const rec = {
        ID:uid('TR'), tarih, yon:'Çıkış', ambar:ambarSecili,
        stokKodu:u.StokKodu||u.stokKodu, urunAdi:u.Ad||u.ad, birim:k.birim||u.Birim||u.birim||'',
        miktar, birimFiyat, tutar:miktar*birimFiyat,
        aciklama:'Talepten Stoğa Aktar — doğrudan ambara yönlendirildi'
      };
      state.transferler.push(rec);
      yeniTransferler.push(rec);
    }
  });
  if(updatedUrunler.length) await persistUrunler();
  if(yeniTransferler.length) await persistTransferler();
  const idx = state.talepler.findIndex(x=>(x.ID||x.id)===id);
  if(idx!==-1){ state.talepler[idx].StogaAktarildi = '1'; state.talepler[idx].StogaAktarilanFaturaNo = stogaAktarilanFaturaNo; await persistTalepler(); }
  closeModal();
  toast(ambarSecili ? ('"'+ambarSecili+'" ambarına aktarıldı.') : 'Ana Ambar stoğuna aktarıldı.');
  renderContent();
  updatedUrunler.forEach(u=>{
    syncOrQueue({action:'updateUrun', id:(u.ID||u.id), data:{stok:u.Stok}}, {entity:'urun', op:'update', localId:(u.ID||u.id)});
  });
  yeniTransferler.forEach(rec=>{
    syncOrQueue({action:'addTransfer', data:{tarih:rec.tarih, yon:rec.yon, ambar:rec.ambar, stokKodu:rec.stokKodu, urunAdi:rec.urunAdi, birim:rec.birim, miktar:rec.miktar, birimFiyat:rec.birimFiyat, tutar:rec.tutar, aciklama:rec.aciklama}}, {entity:'transfer', op:'add', localId:rec.ID});
  });
  syncOrQueue({action:'updateTalep', id, data:{stogaAktarildi:'1', stogaAktarilanFaturaNo}}, {entity:'talep', op:'update', localId:id});
}
function talepKalemleri(t){
  try{ return JSON.parse(t.KalemlerJSON!==undefined?t.KalemlerJSON:t.kalemlerJSON||'[]') || []; }

function lookupTalepUrunByKod(i){

// Fatura Girişi'ndeki handleRowKey ile aynı mantık: popover açıkken ok
// tuşları/Enter popover'ı yönetir; ürün alanında Enter Miktar'a, Miktar
// alanında Enter (satır sonundaysa yeni satır açıp) bir sonraki satırın
// ürün alanına geçer — artık fareyle satır eklemeye gerek kalmıyor.
function handleTalepRowKey(event, i, col){
  if(col===0 && state.searchPopover && state.searchPopover.context==='talep' && state.searchPopover.rowIndex===i){
    if(event.key==='ArrowDown'){ event.preventDefault(); moveSearchActive(1); return; }
    if(event.key==='ArrowUp'){ event.preventDefault(); moveSearchActive(-1); return; }
    if(event.key==='Enter'){ event.preventDefault(); chooseActiveSearchResult(); return; }
    if(event.key==='Escape'){ closeUrunSearch(); return; }
  }
  if(event.key !== 'Enter') return;
  event.preventDefault();
  if(col===0){
    const el = document.getElementById('ti_'+i+'_miktar');
    if(el){ el.focus(); el.select&&el.select(); }
    return;
  }
  // col===1 (Miktar): son satırdaysak yeni satır aç, değilse bir sonraki
  // satırın ürün alanına geç.
  if(i+1 >= state.talepDraftItems.length) addTalepDraftRow();
  setTimeout(()=>{ const el=document.getElementById('ti_'+(i+1)+'_urunAdi'); if(el){ el.focus(); } }, 0);
}

function removeTalepDraftRow(i){

  else state.talepDraftItems.splice(i,1);
  renderTalepDraftRows();
}
async function saveTalep(){
  if(!state.currentUser) return;
  if(!canDo('talepler','add')){ yetkiYokUyar(); return; }

  const baslik = baslikEl ? baslikEl.value.trim() : '';
  if(!baslik){ toast('Talebe bir başlık verin (örn. "Dana Eti Siparişi").'); return; }
  const rows = state.talepDraftItems.filter(r=>r.stokKodu.trim() && Number(r.miktar)>0);
  if(rows.length===0){ toast('En az bir ürün ve miktar girin.'); return; }
  const notEl = document.getElementById('talepNot');
  const kalemler = rows.map(r=>({stokKodu:r.stokKodu.trim(), urunAdi:r.urunAdi.trim(), miktar:Number(r.miktar)||0, birim:r.birim||''}));
  const rec = {
    ID: uid('T'), tarih: todayISO(), talepEden: state.currentUser.Ad||state.currentUser.ad,

    not: notEl ? notEl.value.trim() : '', onayTarihi: ''
  };
  const stored = {ID:rec.ID, Tarih:rec.tarih, TalepEden:rec.talepEden, Baslik:rec.baslik, KalemlerJSON:rec.kalemlerJSON, Durum:rec.durum, Firma:rec.firma, Not:rec.not, OnayTarihi:rec.onayTarihi};
  state.talepler.push(stored);

  toast('Talebiniz gönderildi.');
  state.talepDraftItems = [emptyTalepRow()];
  if(baslikEl) baslikEl.value = '';
  renderContent();

/* ---- WhatsApp sipariş mesajı ---- */
// Mesaj biçimi: şirket adı ve tarih satırı WhatsApp'ta KALIN ve BÜYÜK HARF
// görünsün diye *yıldız* ile işaretlenir ve toLocaleUpperCase('tr-TR') ile
// büyütülür (İ/I Türkçe kurallarına göre doğru dönüşür).
function talepWhatsappMesaji(t){
  const kalemler = talepKalemleri(t);
  const sirketSatiri = (state.companyName||'').toLocaleUpperCase('tr-TR');
  const tarihSatiri = (fmtDate(todayISO())+' TARİHLİ SİPARİŞİMİZ.').toLocaleUpperCase('tr-TR');
  let msg = '*'+sirketSatiri+'*\n\n*'+tarihSatiri+'*\n\n';
  if(t.Baslik||t.baslik) msg += (t.Baslik||t.baslik)+'\n\n';
  kalemler.forEach(k=>{ msg += '- '+k.urunAdi+' : '+num(k.miktar,0)+(k.birim?(' '+k.birim):'')+'\n'; });
  const notMetin = t.Not||t.not;
  if(notMetin) msg += '\nNot: '+notMetin;
  return msg;
}
// Firmalar'daki Telefon alanı serbest metin olarak girildiği için (05XX...,
// +90 5XX..., 0392... vb.) rakam dışındaki her şey atılır ve wa.me'nin
// istediği ülke koduyla başlayan biçime (başında 0 olmadan) getirilir.
// Numara zaten bir ülke koduyla giriliyorsa (ör. 90 ile başlıyorsa)
// dokunulmaz; yoksa ve 10 haneliyse başına 90 (Türkiye/KKTC GSM) eklenir.
function firmaTelefonTemiz(tel){
  let digits = String(tel||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.charAt(0)==='0') digits = digits.slice(1);
  if(!digits.startsWith('90') && digits.length<=10) digits = '90'+digits;
  return digits;
}
function sendSiparisWhatsapp(id){
  const t = state.talepler.find(x=>(x.ID||x.id)===id);
  if(!t) return;
  const firmaAd = t.Firma||t.firma;
  if(!firmaAd){ toast('Bu talep için firma seçilmemiş — önce Onayla ile firma belirleyin.'); return; }
  const firma = state.firmalar.find(f=>(f.Ad||f.ad)===firmaAd);
  const tel = firmaTelefonTemiz(firma ? (firma.Telefon||firma.telefon) : '');
  if(!tel){ toast(firmaAd+' firmasının telefon numarası Cari Kart Tanımla\'da kayıtlı değil — önce oradan ekleyin.'); return; }
  const url = 'https://wa.me/'+tel+'?text='+encodeURIComponent(talepWhatsappMesaji(t));
  window.open(url, '_blank');
  if(!(t.SiparisDonusturuldu||t.siparisDonusturuldu)){
    const idx = state.talepler.findIndex(x=>(x.ID||x.id)===id);
    if(idx!==-1){
      state.talepler[idx].SiparisDonusturuldu = '1';
      persistTalepler();
      renderContent();
      syncOrQueue({action:'updateTalep', id, data:{siparisDonusturuldu:'1'}}, {entity:'talep', op:'update', localId:id});
    }
  }
}

function openApproveTalep(id){
  const t = state.talepler.find(x=>(x.ID||x.id)===id);
  if(!t) return;
  const kalemler = talepKalemleri(t);
  const firmaOpts = state.firmalar.map(f=>'<option value="'+escapeHtml(f.Ad||f.ad)+'">').join('');

  // Her kalem için geçmiş firma/fiyat karşılaştırması (Ürün Analiz'deki
  // uaCompute ile aynı veri): en son alınan firma yeşille işaretlenir,
  // diğerlerinin en ucuza göre yüzde farkı rozetle gösterilir. Bir firmaya
  // tıklayınca aşağıdaki "Firma" kutusuna otomatik yazılır.
  let onerilerHtml = '';
  let defaultFirma = '';
  kalemler.forEach(k=>{
    const d = uaCompute(k.stokKodu);
    onerilerHtml += '<div class="talep-oneri-urun"><b>'+escapeHtml(k.urunAdi)+'</b> ' +
      '<span class="hint" style="margin:0;">('+num(k.miktar,0)+' '+(k.birim||'')+')</span>';

      onerilerHtml += '<div class="hint" style="margin-top:4px;">Bu ürün için daha önce alım kaydı yok.</div></div>';
      return;
    }
    const sonFirma = d.firmaStats.slice().sort((a,b)=>String(b.sonTarih||'').localeCompare(String(a.sonTarih||'')))[0];
    if(!defaultFirma) defaultFirma = sonFirma.firma;
    const pills = d.firmaStats.map(f=>{
      const isSon = f.firma===sonFirma.firma;
      const cls = isSon ? 'badge-success' : (f.farkEnUcuz>0.5 ? 'badge-danger' : 'badge-primary');

async function confirmApproveTalep(id){
  const firma = document.getElementById('taFirma').value.trim();

  const idx = state.talepler.findIndex(x=>(x.ID||x.id)===id);
  if(idx===-1) return;
  const onayTarihi = todayISO();
  state.talepler[idx].Durum = 'Onaylandı';
  state.talepler[idx].Firma = firma;
  state.talepler[idx].OnayTarihi = onayTarihi;
  await persistTalepler();
  closeModal();
  toast('Talep onaylandı — '+firma+' firmasına sipariş verildi sayılır.');
  renderContent();

async function rejectTalep(id){
  if(!confirm('Bu talep iptal edilsin mi?')) return;
  const idx = state.talepler.findIndex(x=>(x.ID||x.id)===id);
  if(idx===-1) return;
  state.talepler[idx].Durum = 'İptal';
  await persistTalepler();
  toast('Talep iptal edildi.');

// Onaylanmış bir talebi Fatura Girişi taslağına aktarır: ürün kalemleri
// (stok kodu, ürün adı, miktar, birim) doğrudan satırlara dökülür, firma
// önceden seçilmiş olur, fiyat/KDV/iskonto ürün kartı ya da son alımdan
// otomatik doldurulur. Yönetici sadece fatura no'yu ve miktarları kontrol
// edip kaydeder — kayıt anında bu talep otomatik "Faturalandı" olur.
function transferTalepToFatura(id){
  const t = state.talepler.find(x=>(x.ID||x.id)===id);
  if(!t) return;
  const kalemler = talepKalemleri(t);
  if(kalemler.length===0){ toast('Bu talepte ürün kalemi bulunamadı.'); return; }
  state.draftItems = kalemler.map(k=>Object.assign(emptyDraftRow(), {
    stokKodu: k.stokKodu||'', urunAdi: k.urunAdi||'', miktar: String(k.miktar||''), birim: k.birim||''
  }));
  state.activeTalepId = id;
  goTab('giris');
  const firmaAd = t.Firma||t.firma||'';
  setTimeout(()=>{
    const sel = document.getElementById('gFirmaSelect');
    if(sel && firmaAd && Array.prototype.some.call(sel.options, o=>o.value===firmaAd)){ sel.value = firmaAd; }
    renderDraftRows();
    state.draftItems.forEach((r,i)=>lookupUrun(i));
    toast('Talep, Fatura Girişi\'ne aktarıldı — fatura no ve miktarları kontrol edip kaydedin.');
  }, 60);
}

   hâlâ "Bekliyor" olan teklifler otomatik "Süresi Doldu" gösterilir.

function normalizeTeklif(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id']) || '',
    tarih: pickField(rec,['tarih','Tarih']) || '',
    firma: pickField(rec,['firma','Firma']) || '',
    urunAdi: pickField(rec,['urunAdi','UrunAdi']) || '',
    stokKodu: pickField(rec,['stokKodu','StokKodu']) || '',
    marka: pickField(rec,['marka','Marka']) || '',
    miktar: Number(pickField(rec,['miktar','Miktar']))||0,
    birim: pickField(rec,['birim','Birim']) || '',
    teklifFiyati: Number(pickField(rec,['teklifFiyati','TeklifFiyati']))||0,

function teklifDurumEfektif(t){
  if(t.durum==='Bekliyor' && t.gecerlilikTarihi && t.gecerlilikTarihi<todayISO()) return 'Süresi Doldu';
  return t.durum||'Bekliyor';
}
function teklifDurumBadge(durum){
  const cls = durum==='Kabul Edildi' ? 'badge-success' : durum==='Reddedildi' ? 'badge-danger' : durum==='Süresi Doldu' ? 'badge-primary' : 'badge-accent';

}

async function addTeklif(){
  if(!canDo('teklifler','add')){ yetkiYokUyar(); return; }
  const firma = document.getElementById('tkFirma').value.trim();
  const urunAdi = document.getElementById('tkUrun').value.trim();
  const marka = document.getElementById('tkMarka').value.trim();
  const miktar = Number(document.getElementById('tkMiktar').value)||0;
  const birim = document.getElementById('tkBirim').value.trim();
  const teklifFiyati = Number(document.getElementById('tkFiyat').value)||0;
  const gecerlilikTarihi = document.getElementById('tkGecerlilik').value;
  const not = document.getElementById('tkNot').value.trim();
  if(!firma || !urunAdi){ toast('Firma ve ürün adı girin.'); return; }
  if(teklifFiyati<=0){ toast('Teklif fiyatı 0\'dan büyük olmalı.'); return; }
  const u = state.urunler.find(x=>String(x.Ad||x.ad||'').toLocaleUpperCase('tr-TR')===urunAdi.toLocaleUpperCase('tr-TR'));
  const rec = {ID:uid('TK'), tarih:todayISO(), firma, urunAdi, stokKodu:u?(u.StokKodu||u.stokKodu):'', marka, miktar, birim, teklifFiyati, gecerlilikTarihi, not, durum:'Bekliyor'};
  state.teklifler.push(rec);
  await persistTeklifler();
  toast('Teklif kaydedildi.');
  renderContent();
  syncOrQueue({action:'addTeklif', data:{tarih:rec.tarih, firma, urunAdi, stokKodu:rec.stokKodu, marka, miktar, birim, teklifFiyati, gecerlilikTarihi, not, durum:'Bekliyor'}}, {entity:'teklif', op:'add', localId:rec.ID});
}
async function markTeklifDurum(id, durum){
  if(!canDo('teklifler','edit')){ yetkiYokUyar(); return; }
  const idx = state.teklifler.findIndex(t=>(t.ID||t.id)===id);
  if(idx===-1) return;
  state.teklifler[idx].durum = durum;
  await persistTeklifler();
  toast('Teklif '+(durum==='Kabul Edildi'?'kabul edildi.':'reddedildi.'));
  renderContent();
  syncOrQueue({action:'updateTeklif', id, data:{durum}}, {entity:'teklif', op:'update', localId:id});
}
async function deleteTeklif(id){
  if(!canDo('teklifler','delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu teklif silinsin mi?')) return;
  state.teklifler = state.teklifler.filter(t=>(t.ID||t.id)!==id);
  await persistTeklifler();
  renderContent();
  syncOrQueue({action:'deleteTeklif', id}, {entity:'teklif', op:'delete', localId:id});
}

/* =========================================================
   SÖZLEŞMELİ ÜRÜNLER
   Bir tedarikçiyle belirli bir ürün için belirli bir süre boyunca SABİT
   fiyat üzerinde anlaşıldığında (ör. "KAŞAR PEYNİRİ 1 yıl boyunca 300 TL
   sabit"), burada firma+ürün+fiyat+süre girilip karşılıklı imza alanlı bir
   sözleşme belgesi (PDF) oluşturulur. Süresi dolmaya yaklaşan/dolmuş
   sözleşmeler otomatik olarak işaretlenir.
========================================================= */
function normalizeSozlesme(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id']) || '',
    tarih: pickField(rec,['tarih','Tarih']) || '',
    firma: pickField(rec,['firma','Firma']) || '',
    urunAdi: pickField(rec,['urunAdi','UrunAdi']) || '',
    stokKodu: pickField(rec,['stokKodu','StokKodu']) || '',
    marka: pickField(rec,['marka','Marka']) || '',
    sabitFiyat: Number(pickField(rec,['sabitFiyat','SabitFiyat']))||0,
    birim: pickField(rec,['birim','Birim']) || '',
    baslangicTarihi: pickField(rec,['baslangicTarihi','BaslangicTarihi']) || '',
    bitisTarihi: pickField(rec,['bitisTarihi','BitisTarihi']) || '',
    sartlar: pickField(rec,['sartlar','Sartlar']) || '',
    durum: pickField(rec,['durum','Durum']) || 'Aktif',
    imzaDurumu: pickField(rec,['imzaDurumu','ImzaDurumu']) || 'Bekliyor',
    imzaTarihi: pickField(rec,['imzaTarihi','ImzaTarihi']) || '',
    olusturanKullanici: pickField(rec,['olusturanKullanici','OlusturanKullanici']) || ''
  };
}
function sozlesmeDurumEfektif(s){
  if(s.durum==='İptal') return 'İptal';
  if(!s.bitisTarihi) return 'Aktif';
  const bugun = todayISO();
  if(s.bitisTarihi < bugun) return 'Süresi Doldu';
  const kalanGun = Math.round((new Date(s.bitisTarihi+'T00:00:00') - new Date(bugun+'T00:00:00')) / 86400000);
  if(kalanGun<=30) return 'Süresi Yaklaşıyor';
  return 'Aktif';
}
function sozlesmeDurumBadge(durum){
  const cls = durum==='Aktif' ? 'badge-success' : durum==='Süresi Yaklaşıyor' ? 'badge-accent' : durum==='İptal' ? 'badge-primary' : 'badge-danger';
  return '<span class="badge '+cls+'" style="font-weight:600;">'+escapeHtml(durum)+'</span>';
}
function sozlesmeSureSec(gunSayisi){
  const el = document.getElementById('szBaslangic');
  const baslangic = (el && el.value) ? el.value : todayISO();
  const bitisEl = document.getElementById('szBitis');
  if(!bitisEl) return;
  if(gunSayisi==='ozel') return; // elle girsin
  const d = new Date(baslangic+'T00:00:00');
  d.setDate(d.getDate()+Number(gunSayisi));
  bitisEl.value = dateToLocalISO(d);
}

    '<button class="btn btn-primary" style="margin-top:10px;" onclick="addSozlesme()" '+(canDo('sozlesmeliUrunler','add')?'':'disabled title="Bu işlem için yetkiniz yok"')+'>Sözleşme Ekle</button>' +
  '</div>';

  if(state.sozlesmeler.length===0){
    html += emptyState('Henüz sözleşme yok', 'Yukarıdan ilk sabit fiyat sözleşmesini ekleyin.');
    return html;
  }

  // Başlangıçta bitiş, varsayılan süreye (1 yıl) göre önceden dolduruldu (yukarıda input value'sunda).

  const tumSozlesmeler = state.sozlesmeler.map(s=>Object.assign({}, s, {efektifDurum: sozlesmeDurumEfektif(s)}));
  const aktif = tumSozlesmeler.filter(s=>s.efektifDurum==='Aktif').length;
  const yaklasan = tumSozlesmeler.filter(s=>s.efektifDurum==='Süresi Yaklaşıyor').length;
  const dolmus = tumSozlesmeler.filter(s=>s.efektifDurum==='Süresi Doldu').length;

  html += '<div class="grid grid-4" style="margin-bottom:14px;">' +
    '<div class="card metric"><div class="metric-label">Aktif sözleşme</div><div class="metric-value">'+aktif+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Süresi yaklaşan</div><div class="metric-value" style="color:'+(yaklasan>0?'var(--accent)':'var(--ink)')+';">'+yaklasan+'</div><div class="metric-sub">30 gün içinde</div></div>' +
    '<div class="card metric"><div class="metric-label">Süresi dolmuş</div><div class="metric-value" style="color:'+(dolmus>0?'var(--danger)':'var(--ink)')+';">'+dolmus+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam sözleşme</div><div class="metric-value">'+state.sozlesmeler.length+'</div></div>' +
  '</div>';

  html += '<div class="field" style="max-width:340px;margin-bottom:14px;"><input id="sozlesmeQueryInput" type="text" value="'+escapeHtml(state.sozlesmeQuery||'')+'" placeholder="Firma veya ürün adı…" oninput="setSozlesmeQuery(this.value)"></div>';

  let list = tumSozlesmeler;
  if(q) list = list.filter(s=>(s.firma+' '+s.urunAdi).toLocaleLowerCase('tr-TR').includes(q));
  const durumSira = {'Süresi Yaklaşıyor':0, 'Aktif':1, 'Süresi Doldu':2, 'İptal':3};
  list.sort((a,b)=> (durumSira[a.efektifDurum]-durumSira[b.efektifDurum]) || String(b.tarih||'').localeCompare(String(a.tarih||'')));

  html += '<div class="tbl-wrap"><table><thead><tr><th>Durum</th><th>Firma</th><th>Ürün</th><th class="num">Sabit Fiyat</th><th>Geçerlilik</th><th>İmza</th><th></th></tr></thead><tbody>' +
    list.map(s=>{
      const id = s.ID||s.id;
      const kalanGun = s.bitisTarihi ? Math.round((new Date(s.bitisTarihi+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000) : null;
      return '<tr><td>'+sozlesmeDurumBadge(s.efektifDurum)+(s.efektifDurum==='Süresi Yaklaşıyor'&&kalanGun!==null?'<div class="hint" style="margin:2px 0 0;">'+kalanGun+' gün kaldı</div>':'')+'</td>' +
        '<td><b>'+escapeHtml(s.firma)+'</b></td>' +
        '<td>'+escapeHtml(s.urunAdi)+(s.marka?' <span class="hint" style="margin:0;">('+escapeHtml(s.marka)+')</span>':'')+'</td>' +
        '<td class="num">'+money(s.sabitFiyat)+' / '+escapeHtml(s.birim||'')+'</td>' +
        '<td>'+fmtDate(s.baslangicTarihi)+' — '+fmtDate(s.bitisTarihi)+'</td>' +
        '<td>'+(s.imzaDurumu==='İmzalandı'?'<span class="badge badge-success">İmzalandı</span>':'<span class="badge badge-accent">Bekliyor</span>')+'</td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="btn btn-ghost btn-sm" onclick="sozlesmeOnizle(\''+id+'\')">👁 Ön İzle</button> ' +
          '<button class="btn btn-ghost btn-sm" onclick="sozlesmeBelgesiOlustur(\''+id+'\')">📄 Belge</button> ' +
          (s.imzaDurumu!=='İmzalandı' && canDo('sozlesmeliUrunler','edit') ? '<button class="btn btn-ghost btn-sm" onclick="markSozlesmeImzalandi(\''+id+'\')">İmzalandı İşaretle</button> ' : '') +
          (s.durum!=='İptal' && canDo('sozlesmeliUrunler','edit') ? '<button class="btn btn-ghost btn-sm" onclick="iptalSozlesme(\''+id+'\')">İptal Et</button> ' : '') +
          (canDo('sozlesmeliUrunler','delete') ? '<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteSozlesme(\''+id+'\')">Sil</button>' : '') +
        '</td></tr>';
    }).join('') +
  '</tbody></table></div>';
  return html;
}
async function addSozlesme(){
  if(!canDo('sozlesmeliUrunler','add')){ yetkiYokUyar(); return; }
  const firma = document.getElementById('szFirma').value.trim();
  const urunAdi = document.getElementById('szUrun').value.trim();
  const marka = document.getElementById('szMarka').value.trim();
  const sabitFiyat = Number(document.getElementById('szFiyat').value)||0;
  const birim = document.getElementById('szBirim').value.trim();
  const baslangicTarihi = document.getElementById('szBaslangic').value || todayISO();
  let bitisTarihi = document.getElementById('szBitis').value;
  if(!bitisTarihi){ sozlesmeSureSec(document.getElementById('szSureSec').value); bitisTarihi = document.getElementById('szBitis').value; }
  const sartlar = document.getElementById('szSartlar').value.trim();
  if(!firma || !urunAdi){ toast('Firma ve ürün adı girin.'); return; }
  if(sabitFiyat<=0){ toast('Sabit fiyat 0\'dan büyük olmalı.'); return; }
  if(!bitisTarihi || bitisTarihi<=baslangicTarihi){ toast('Bitiş tarihi başlangıçtan sonra olmalı.'); return; }
  const u = state.urunler.find(x=>String(x.Ad||x.ad||'').toLocaleUpperCase('tr-TR')===urunAdi.toLocaleUpperCase('tr-TR'));
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const rec = {ID:uid('SZ'), tarih:todayISO(), firma, urunAdi, stokKodu:u?(u.StokKodu||u.stokKodu):'', marka, sabitFiyat, birim, baslangicTarihi, bitisTarihi, sartlar, durum:'Aktif', imzaDurumu:'Bekliyor', imzaTarihi:'', olusturanKullanici:kullanici};
  state.sozlesmeler.push(rec);
  await persistSozlesmeler();
  toast('Sözleşme kaydedildi: '+firma+' — '+urunAdi);
  renderContent();
  syncOrQueue({action:'addSozlesme', data:{tarih:rec.tarih, firma, urunAdi, stokKodu:rec.stokKodu, marka, sabitFiyat, birim, baslangicTarihi, bitisTarihi, sartlar, durum:'Aktif', imzaDurumu:'Bekliyor', imzaTarihi:'', olusturanKullanici:kullanici}}, {entity:'sozlesme', op:'add', localId:rec.ID});
}
async function markSozlesmeImzalandi(id){
  if(!canDo('sozlesmeliUrunler','edit')){ yetkiYokUyar(); return; }
  const idx = state.sozlesmeler.findIndex(s=>(s.ID||s.id)===id);
  if(idx===-1) return;
  state.sozlesmeler[idx].imzaDurumu = 'İmzalandı';
  state.sozlesmeler[idx].imzaTarihi = todayISO();
  await persistSozlesmeler();
  toast('Sözleşme imzalandı olarak işaretlendi.');
  renderContent();
  syncOrQueue({action:'updateSozlesme', id, data:{imzaDurumu:'İmzalandı', imzaTarihi:state.sozlesmeler[idx].imzaTarihi}}, {entity:'sozlesme', op:'update', localId:id});
}
async function iptalSozlesme(id){
  if(!canDo('sozlesmeliUrunler','edit')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu sözleşme iptal edilsin mi?', 'Sözleşmeyi İptal Et');
  if(!onay) return;
  const idx = state.sozlesmeler.findIndex(s=>(s.ID||s.id)===id);
  if(idx===-1) return;
  state.sozlesmeler[idx].durum = 'İptal';
  await persistSozlesmeler();
  toast('Sözleşme iptal edildi.');
  renderContent();
  syncOrQueue({action:'updateSozlesme', id, data:{durum:'İptal'}}, {entity:'sozlesme', op:'update', localId:id});
}
async function deleteSozlesme(id){
  if(!canDo('sozlesmeliUrunler','delete')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu sözleşme kaydı silinsin mi?', 'Sözleşmeyi Sil');
  if(!onay) return;
  state.sozlesmeler = state.sozlesmeler.filter(s=>(s.ID||s.id)!==id);
  await persistSozlesmeler();
  renderContent();
  syncOrQueue({action:'deleteSozlesme', id}, {entity:'sozlesme', op:'delete', localId:id});
}

// Karşılıklı imza alanlı, indirilebilir sabit fiyat sözleşme belgesi (PDF).
async function sozlesmeBelgesiOlustur(id){
  const s = state.sozlesmeler.find(x=>(x.ID||x.id)===id);
  if(!s) return;
  if(typeof html2pdf === 'undefined'){ toast('PDF kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin.'); return; }
  toast('Sözleşme belgesi oluşturuluyor…');
  ensurePdfShareStyles();
  const fragment = sozlesmeBelgesiFragment(s);
  const blob = await renderHtmlToPdfBlob(fragment);
  if(!blob) return;
  const safeName = String(s.firma+'-'+s.urunAdi).replace(/[^\w.\-ğüşıöçĞÜŞİÖÇ]+/g,'_');
  downloadBlob(blob, 'sozlesme-'+safeName+'-'+todayISO()+'.pdf');
  toast('Sözleşme belgesi indirildi.');
}
// PDF indirmeden, sözleşme metnini ekranda (modal içinde) önizler.
function sozlesmeOnizle(id){
  const s = state.sozlesmeler.find(x=>(x.ID||x.id)===id);
  if(!s) return;
  ensurePdfShareStyles();
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:720px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
          '<h3 style="margin:0;">Sözleşme Ön İzleme</h3>' +
          '<button class="btn btn-ghost btn-sm" onclick="closeModal()">✕ Kapat</button>' +
        '</div>' +
        '<div style="border:1px solid var(--line-soft);border-radius:8px;padding:4px;max-height:65vh;overflow-y:auto;background:#fff;">' +
          sozlesmeBelgesiFragment(s) +
        '</div>' +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Kapat</button>' +

}

  let html = '<div class="section-desc" style="margin-bottom:14px;">Bir firmayla toplam bir miktar için anlaştığınızda (ör. "1000 teneke ayçiçek yağı"), burada tek seferde kaydedin. Ürün geldikçe (sevk irsaliyesiyle) her teslimatı buradan işleyin — kalan miktar otomatik düşer, sipariş bittiğinde kendiliğinden "Tamamlandı" olur.</div>';

  html += '<div class="card" style="margin-bottom:18px;overflow:visible;">' +
    '<div class="form-row" style="grid-template-columns:1.2fr 1.4fr 1fr;align-items:end;">' +
      '<div class="field"><label>Firma</label><input id="bsFirma" list="bsFirmaList" type="text" placeholder="Tedarikçi adı"><datalist id="bsFirmaList">'+firmaOpts+'</datalist></div>' +
      '<div class="field" style="position:relative;"><label>Ürün</label><input id="bsUrun" type="text" autocomplete="off" placeholder="Ürün adı yazın…" ' +
        'oninput="showUrunSearch(0,this.value,0,\'baglantiliSiparis\')" onfocus="showUrunSearch(0,this.value,0,\'baglantiliSiparis\')" onblur="scheduleCloseUrunSearch()" onkeydown="handleSimpleSearchKey(event,\'baglantiliSiparis\')">' +
        '<div id="urunSearchPop" class="search-popover" style="display:none;" onmousedown="event.preventDefault()"></div>' +
      '</div>' +
      '<div class="field"><label>Marka <span style="font-weight:400;color:var(--faint);">(opsiyonel)</span></label><input id="bsMarka" type="text" placeholder="opsiyonel"></div>' +
    '</div>' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr 1fr 1.3fr;align-items:end;margin-top:8px;">' +
      '<div class="field"><label>Toplam Miktar</label><input id="bsMiktar" type="number" step="any" min="0" placeholder="ör. 1000"></div>' +
      '<div class="field"><label>Birim</label><input id="bsBirim" type="text" placeholder="ör. Teneke"></div>' +
      '<div class="field"><label>Birim Fiyat <span style="font-weight:400;color:var(--faint);">(opsiyonel)</span></label><input id="bsFiyat" type="number" step="any" min="0" placeholder="0,00"></div>' +
      '<div class="field"><label>Ödeme Durumu</label><select id="bsOdemeDurumu"><option value="Ödendi">Ödendi</option><option value="Kısmi Ödendi">Kısmi Ödendi</option><option value="Ödenmedi">Ödenmedi</option></select></div>' +
    '</div>' +
    '<div class="field" style="margin-top:8px;"><label>Not</label><input id="bsNot" type="text" placeholder="opsiyonel — ör. depolama/teslimat koşulu"></div>' +
    '<button class="btn btn-primary" style="margin-top:10px;" onclick="addBaglantiliSiparis()" '+(canDo('baglantiliSiparis','add')?'':'disabled title="Bu işlem için yetkiniz yok"')+'>Bağlantılı Sipariş Ekle</button>' +
  '</div>';

  if(state.baglantiliSiparisler.length===0){
    html += emptyState('Henüz bağlantılı sipariş yok', 'Yukarıdan ilk siparişi ekleyin.');
    return html;
  }

  const tumSiparisler = state.baglantiliSiparisler;
  const aktifSayisi = tumSiparisler.filter(s=>s.durum!=='İptal' && baglantiliSiparisKalan(s)>0.0001).length;
  const tamamlananSayisi = tumSiparisler.filter(s=>s.durum!=='İptal' && baglantiliSiparisKalan(s)<=0.0001).length;
  const toplamBagliTutar = tumSiparisler.filter(s=>s.durum!=='İptal').reduce((sum,s)=>sum+(s.toplamMiktar*s.birimFiyat),0);

  html += '<div class="grid grid-4" style="margin-bottom:14px;">' +
    '<div class="card metric"><div class="metric-label">Aktif sipariş</div><div class="metric-value">'+aktifSayisi+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Tamamlanan</div><div class="metric-value" style="color:var(--success);">'+tamamlananSayisi+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam bağlı tutar</div><div class="metric-value">'+money(toplamBagliTutar)+'</div><div class="metric-sub">fiyatı girilenler</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam sipariş</div><div class="metric-value">'+tumSiparisler.length+'</div></div>' +
  '</div>';

  html += '<div class="field" style="max-width:340px;margin-bottom:14px;"><input id="baglantiliSiparisQueryInput" type="text" value="'+escapeHtml(state.baglantiliSiparisQuery||'')+'" placeholder="Firma veya ürün adı…" oninput="setBaglantiliSiparisQuery(this.value)"></div>';

  let list = tumSiparisler.slice();
  if(q) list = list.filter(s=>(s.firma+' '+s.urunAdi).toLocaleLowerCase('tr-TR').includes(q));
  const durumSirasi = s => s.durum==='İptal' ? 2 : (baglantiliSiparisKalan(s)<=0.0001 ? 1 : 0);
  list.sort((a,b)=> durumSirasi(a)-durumSirasi(b) || String(b.tarih||'').localeCompare(String(a.tarih||'')));

  if(list.length===0){ html += emptyState('Sipariş bulunamadı', 'Farklı bir arama deneyin.'); return html; }

  html += list.map(baglantiliSiparisKartHtml).join('');
  return html;
}
function baglantiliSiparisKartHtml(s){
  const id = s.ID||s.id;
  const teslim = baglantiliSiparisTeslimEdilen(s);
  const kalan = baglantiliSiparisKalan(s);
  const pct = s.toplamMiktar>0 ? Math.min(100, Math.round(teslim/s.toplamMiktar*100)) : 0;
  const tamamlandiMi = kalan<=0.0001;
  const acikMi = state.baglantiliSiparisAcik && state.baglantiliSiparisAcik[id];
  const durumBadge = s.durum==='İptal' ? '<span class="badge badge-primary" style="font-weight:600;">İptal</span>' :
    (tamamlandiMi ? '<span class="badge badge-success" style="font-weight:600;">Tamamlandı</span>' : '<span class="badge badge-accent" style="font-weight:600;">Aktif</span>');
  const odemeBadge = s.odemeDurumu==='Ödendi' ? '<span class="badge badge-success" style="font-weight:600;">Ödendi</span>' :
    s.odemeDurumu==='Kısmi Ödendi' ? '<span class="badge badge-accent" style="font-weight:600;">Kısmi Ödendi</span>' :
    '<span class="badge badge-danger" style="font-weight:600;">Ödenmedi</span>';

  return '<div class="card" style="margin-bottom:14px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:10px;">' +
      '<div><div style="font-weight:700;font-size:15px;">'+escapeHtml(s.firma)+' — '+escapeHtml(s.urunAdi)+(s.marka?' <span class="hint" style="margin:0;">('+escapeHtml(s.marka)+')</span>':'')+'</div>' +
        '<div class="hint" style="margin:2px 0 0;">Sipariş tarihi: '+fmtDate(s.tarih)+(s.birimFiyat?' · Birim fiyat: '+money(s.birimFiyat):'')+(s.not?' · '+escapeHtml(s.not):'')+'</div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+durumBadge+odemeBadge+'</div>' +
    '</div>' +
    '<div style="margin-top:10px;">' +
      '<div class="limit-bar-track" style="height:10px;"><div class="limit-bar-fill" style="width:'+pct+'%;"></div></div>' +
      '<div class="limit-bar-label" style="margin-top:4px;">'+num(teslim,2)+' / '+num(s.toplamMiktar,2)+' '+escapeHtml(s.birim||'')+' teslim alındı (%'+pct+') · Kalan: <b>'+num(kalan,2)+' '+escapeHtml(s.birim||'')+'</b></div>' +
    '</div>' +
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
      (!tamamlandiMi && s.durum!=='İptal' && canDo('baglantiliSiparis','edit') ? '<button class="btn btn-primary btn-sm" onclick="openTeslimatModal(\''+id+'\')">+ Teslimat Kaydet</button>' : '') +
      '<button class="btn btn-ghost btn-sm" onclick="toggleBaglantiliSiparisGecmis(\''+id+'\')">'+(acikMi?'Geçmişi Gizle':'Teslimat Geçmişi ('+(s.teslimatlar||[]).length+')')+'</button>' +
      (s.durum!=='İptal' && !tamamlandiMi && canDo('baglantiliSiparis','edit') ? '<button class="btn btn-ghost btn-sm" onclick="iptalBaglantiliSiparis(\''+id+'\')">İptal Et</button>' : '') +
      (canDo('baglantiliSiparis','delete') ? '<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteBaglantiliSiparis(\''+id+'\')">Sil</button>' : '') +
    '</div>' +
    (acikMi ? baglantiliSiparisGecmisHtml(s) : '') +
  '</div>';
}
function baglantiliSiparisGecmisHtml(s){
  const list = (s.teslimatlar||[]).slice().sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||'')));
  if(list.length===0) return '<div class="hint" style="margin-top:8px;">Henüz teslimat kaydı yok.</div>';
  return '<div class="tbl-wrap" style="margin-top:10px;"><table><thead><tr><th>Tarih</th><th>İrsaliye No</th><th class="num">Miktar</th><th>Not</th><th>Kullanıcı</th><th></th></tr></thead><tbody>' +
    list.map(t=>'<tr><td>'+fmtDate(t.tarih)+'</td><td>'+(escapeHtml(t.irsaliyeNo)||'—')+'</td><td class="num">'+num(t.miktar,2)+' '+escapeHtml(s.birim||'')+'</td><td>'+(escapeHtml(t.not)||'—')+'</td><td>'+(escapeHtml(t.kullanici)||'—')+'</td>' +
      '<td>'+(canDo('baglantiliSiparis','delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteTeslimat(\''+(s.ID||s.id)+'\',\''+t.id+'\')">Sil</button>':'')+'</td></tr>').join('') +
  '</tbody></table></div>';
}
async function addBaglantiliSiparis(){
  if(!canDo('baglantiliSiparis','add')){ yetkiYokUyar(); return; }
  const firma = document.getElementById('bsFirma').value.trim();
  const urunAdi = document.getElementById('bsUrun').value.trim();
  const marka = document.getElementById('bsMarka').value.trim();
  const toplamMiktar = Number(document.getElementById('bsMiktar').value)||0;
  const birim = document.getElementById('bsBirim').value.trim();
  const birimFiyat = Number(document.getElementById('bsFiyat').value)||0;
  const odemeDurumu = document.getElementById('bsOdemeDurumu').value;
  const not = document.getElementById('bsNot').value.trim();
  if(!firma || !urunAdi){ toast('Firma ve ürün adı girin.'); return; }
  if(toplamMiktar<=0){ toast('Toplam miktar 0\'dan büyük olmalı.'); return; }
  if(!birim){ toast('Birim girin (ör. Teneke, KG, AD).'); return; }
  const u = state.urunler.find(x=>String(x.Ad||x.ad||'').toLocaleUpperCase('tr-TR')===urunAdi.toLocaleUpperCase('tr-TR'));
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const rec = {ID:uid('BS'), tarih:todayISO(), firma, urunAdi, stokKodu:u?(u.StokKodu||u.stokKodu):'', marka, toplamMiktar, birim, birimFiyat, odemeDurumu, not, durum:'Aktif', olusturanKullanici:kullanici, teslimatlar:[]};
  state.baglantiliSiparisler.push(rec);
  await persistBaglantiliSiparisler();
  toast('Bağlantılı sipariş kaydedildi: '+firma+' — '+urunAdi);
  renderContent();
  syncOrQueue({action:'addBaglantiliSiparis', data:{tarih:rec.tarih, firma, urunAdi, stokKodu:rec.stokKodu, marka, toplamMiktar, birim, birimFiyat, odemeDurumu, not, durum:'Aktif', olusturanKullanici:kullanici, teslimatlarJSON:'[]'}}, {entity:'baglantiliSiparis', op:'add', localId:rec.ID});
}
function openTeslimatModal(siparisId){
  if(!canDo('baglantiliSiparis','edit')){ yetkiYokUyar(); return; }
  const s = state.baglantiliSiparisler.find(x=>(x.ID||x.id)===siparisId);
  if(!s) return;
  const kalan = baglantiliSiparisKalan(s);
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:460px;">' +
        '<h3>Teslimat Kaydet</h3>' +
        '<div class="hint" style="margin-top:-6px;">'+escapeHtml(s.firma)+' — '+escapeHtml(s.urunAdi)+' · Kalan: <b>'+num(kalan,2)+' '+escapeHtml(s.birim||'')+'</b></div>' +
        '<div class="field" style="margin-top:10px;"><label>Tarih</label><input id="tsTarih" type="date" value="'+todayISO()+'"></div>' +
        '<div class="field"><label>Miktar</label><input id="tsMiktar" type="number" step="any" min="0" max="'+kalan+'" placeholder="0"></div>' +
        '<div class="field"><label>İrsaliye No</label><input id="tsIrsaliyeNo" type="text" placeholder="Sevk irsaliyesi numarası"></div>' +
        '<div class="field"><label>Not</label><input id="tsNot" type="text" placeholder="opsiyonel"></div>' +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Vazgeç</button>' +
          '<button class="btn btn-primary" onclick="saveTeslimat(\''+siparisId+'\')">Kaydet</button></div>' +
      '</div>' +
    '</div>';
}
async function saveTeslimat(siparisId){
  const idx = state.baglantiliSiparisler.findIndex(x=>(x.ID||x.id)===siparisId);
  if(idx===-1) return;
  const s = state.baglantiliSiparisler[idx];
  const kalan = baglantiliSiparisKalan(s);
  const tarih = document.getElementById('tsTarih').value || todayISO();
  const miktar = Number(document.getElementById('tsMiktar').value)||0;
  const irsaliyeNo = document.getElementById('tsIrsaliyeNo').value.trim();
  const not = document.getElementById('tsNot').value.trim();
  if(miktar<=0){ toast('Miktar 0\'dan büyük olmalı.'); return; }
  if(miktar>kalan+0.0001){ toast('Miktar, kalan tutardan ('+num(kalan,2)+' '+(s.birim||'')+') fazla olamaz.'); return; }
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  if(!s.teslimatlar) s.teslimatlar = [];
  s.teslimatlar.push({id:uid('TS'), tarih, miktar, irsaliyeNo, not, kullanici});
  if(baglantiliSiparisKalan(s)<=0.0001) s.durum = 'Tamamlandı';
  await persistBaglantiliSiparisler();
  closeModal();
  toast('Teslimat kaydedildi: '+num(miktar,2)+' '+(s.birim||''));
  renderContent();
  syncOrQueue({action:'updateBaglantiliSiparis', id:siparisId, data:{teslimatlarJSON: JSON.stringify(s.teslimatlar), durum: s.durum}}, {entity:'baglantiliSiparis', op:'update', localId:siparisId});

  const stogaAktar = await evetHayirSor('Bu teslimat ('+num(miktar,2)+' '+(s.birim||'')+') stoğa aktarılsın mı?', 'Stoğa Aktar');
  if(stogaAktar){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(s.stokKodu||'').toUpperCase());
    if(u){
      const eski = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
      u.Stok = eski+miktar;
      await persistUrunler();
      renderContent();
      syncOrQueue({action:'updateUrun', id:(u.ID||u.id), data:{stok:u.Stok}}, {entity:'urun', op:'update', localId:(u.ID||u.id)});
      toast('Stoğa da eklendi.');
    } else {
      toast('Bu ürün Ürünler kartında bulunamadığı için stoğa eklenemedi.');
    }
  }
}
async function deleteTeslimat(siparisId, teslimatId){
  if(!canDo('baglantiliSiparis','delete')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu teslimat kaydı silinsin mi? (Miktar tekrar "kalan"a eklenecek.)', 'Teslimatı Sil');
  if(!onay) return;
  const idx = state.baglantiliSiparisler.findIndex(x=>(x.ID||x.id)===siparisId);
  if(idx===-1) return;
  const s = state.baglantiliSiparisler[idx];
  s.teslimatlar = (s.teslimatlar||[]).filter(t=>t.id!==teslimatId);
  if(baglantiliSiparisKalan(s)>0.0001 && s.durum==='Tamamlandı') s.durum = 'Aktif';
  await persistBaglantiliSiparisler();
  renderContent();
  syncOrQueue({action:'updateBaglantiliSiparis', id:siparisId, data:{teslimatlarJSON: JSON.stringify(s.teslimatlar), durum: s.durum}}, {entity:'baglantiliSiparis', op:'update', localId:siparisId});
}
async function iptalBaglantiliSiparis(id){
  if(!canDo('baglantiliSiparis','edit')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu bağlantılı sipariş iptal edilsin mi? (Teslim alınmamış kalan miktar için artık teslimat kaydedilemez.)', 'Siparişi İptal Et');
  if(!onay) return;
  const idx = state.baglantiliSiparisler.findIndex(s=>(s.ID||s.id)===id);
  if(idx===-1) return;
  state.baglantiliSiparisler[idx].durum = 'İptal';
  await persistBaglantiliSiparisler();
  toast('Sipariş iptal edildi.');
  renderContent();
  syncOrQueue({action:'updateBaglantiliSiparis', id, data:{durum:'İptal'}}, {entity:'baglantiliSiparis', op:'update', localId:id});
}
async function deleteBaglantiliSiparis(id){
  if(!canDo('baglantiliSiparis','delete')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu bağlantılı sipariş kaydı (ve teslimat geçmişi) tamamen silinsin mi?', 'Siparişi Sil');
  if(!onay) return;
  state.baglantiliSiparisler = state.baglantiliSiparisler.filter(s=>(s.ID||s.id)!==id);
  await persistBaglantiliSiparisler();
  renderContent();
  syncOrQueue({action:'deleteBaglantiliSiparis', id}, {entity:'baglantiliSiparis', op:'delete', localId:id});
}

========================================================= */
// "Çevrimiçi" rozeti: kullanıcının son gönderdiği varlık sinyaline
// (SonGorulme, bkz. sendHeartbeatIfDue) göre hesaplanır. Bu alanın diğer
// cihazlara yansıması buluttaki Kod.gs'in "updateKullanici" işleminde bu
// alanı da yazması gerektirir — desteklemiyorsa, sadece KENDİ oturumunuz
// için (bu cihazda) doğru görünür.
function kullaniciDurumBadge(u){
  const son = u.SonGorulme||u.sonGorulme;
  const isSelf = state.currentUser && (state.currentUser.ID||state.currentUser.id)===(u.ID||u.id);
  if(!son) return '<span class="badge" style="background:var(--line-soft);color:var(--muted);">Bilinmiyor</span>';
  const fark = Date.now() - new Date(son).getTime();
  if(isSelf || fark < ONLINE_ESIK_MS) return '<span class="badge badge-success" style="font-weight:600;">● Çevrimiçi</span>';
  const dk = Math.round(fark/60000);
  const metin = dk<1 ? 'az önce görüldü' : dk<60 ? dk+' dk önce görüldü' : (dk<1440 ? Math.round(dk/60)+' sa önce görüldü' : Math.round(dk/1440)+' gün önce görüldü');
  return '<span class="badge" style="background:var(--line-soft);color:var(--muted);">○ '+metin+'</span>';
}
