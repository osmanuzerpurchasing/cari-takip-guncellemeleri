// Ekranın köşesindeki ampul: her işlemden sonra hedefe (bulut ya da yerel
// ağ sunucusu) gönderim başarılıysa (bekleyen işlem kalmadıysa) YEŞİL,
// bekleyen/gönderilememiş bir işlem varsa (ya da bağlantı yoksa) KIRMIZI yanar.
function updateSyncBulb(){
  const dot = document.getElementById('syncBulbDot');
  const label = document.getElementById('syncBulbLabel');
  const timeEl = document.getElementById('syncBulbTime');
  if(!dot) return;
  const modEtiket = state.baglantiModu==='yerelAg' ? 'Yerel ağa' : (state.baglantiModu==='ikisiBirden' ? 'İkisine de' : 'Buluta');
  const pendingCount = (state.pendingOps||[]).length;
  const ok = state.connected && pendingCount===0;
  dot.className = 'sync-bulb-dot ' + (ok ? 'green' : 'red');
  if(label){
    if(state.connecting) label.textContent = 'Bağlanıyor…';
    else if(ok) label.textContent = modEtiket+' işlendi';
    else if(pendingCount>0) label.textContent = pendingCount + ' işlem bekliyor';
    else label.textContent = modEtiket+' bağlı değil';
  }
  if(timeEl){
    timeEl.textContent = state.lastCloudSyncAt ? ('Son yükleme: '+new Date(state.lastCloudSyncAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})) : '';
  }
}
// Bir işlem GERÇEKTEN buluta ulaştığında (bekleyen kuyruğa değil) çağrılır
// — kullanıcının "son yaptığım işlem buluta yüklendi mi?" sorusuna açık
// bir görsel cevap: ampul yeşile döner, kısa süreliğine parlar ve
// "✓ Şimdi buluta yüklendi" yazar, sonra normal duruma döner.
function flashSyncSuccess(){
  state.lastCloudSyncAt = new Date().toISOString();
  updateSyncBulb();
  const dot = document.getElementById('syncBulbDot');
  const label = document.getElementById('syncBulbLabel');
  if(!dot) return;
  dot.classList.remove('pulse');
  void dot.offsetWidth; // animasyonu baştan tetiklemek için reflow
  dot.classList.add('pulse');
  if(label) label.textContent = '✓ Şimdi buluta yüklendi';
  setTimeout(()=>{ updateSyncBulb(); }, 1700);
}

function recipeEsc(v){ return escapeHtml(String(v===undefined||v===null?'':v)); }
function recipeNum(v){ const n=Number(v); return isFinite(n)?n:0; }
function recipeUnit(u){ return String(u||'').trim().toUpperCase().replace('ADET','AD').replace('LİTRE','LT').replace('LITRE','LT').replace('GRAM','GR').replace('KİLOGRAM','KG').replace('KILOGRAM','KG'); }
function recipeConvertedQty(qty, fromUnit, priceUnit){
  qty=recipeNum(qty); fromUnit=recipeUnit(fromUnit); priceUnit=recipeUnit(priceUnit);
  if(fromUnit===priceUnit) return {qty:qty, ok:true};
  if(fromUnit==='GR' && priceUnit==='KG') return {qty:qty/1000, ok:true};
  if(fromUnit==='KG' && priceUnit==='GR') return {qty:qty*1000, ok:true};
  if(fromUnit==='ML' && priceUnit==='LT') return {qty:qty/1000, ok:true};
  if(fromUnit==='LT' && priceUnit==='ML') return {qty:qty*1000, ok:true};
  return {qty:qty, ok:false};
}
function recipeIngredientCalc(m){
  const u=state.urunler.find(x=>(x.ID||x.id)===m.urunId);
  const fiyat=u?recipeNum(u.Fiyat!==undefined?u.Fiyat:u.fiyat):0;
  const fiyatBirim=u?recipeUnit(u.Birim||u.birim):recipeUnit(m.birim);
  const kullanimBirim=recipeUnit(m.birim||fiyatBirim);
  const net=recipeNum(m.miktar);
  const fire=Math.max(0,Math.min(95,recipeNum(m.fire)));
  const brut=net/(1-fire/100);
  const cv=recipeConvertedQty(brut,kullanimBirim,fiyatBirim);
  return {urun:u,fiyat:fiyat,fiyatBirim:fiyatBirim,kullanimBirim:kullanimBirim,net:net,brut:brut,fire:fire,maliyet:cv.qty*fiyat,donusumOk:cv.ok};
}
function recipeTotals(r){
  r=r||{}; const mats=r.malzemeler||[];
  const malzeme=mats.reduce((s,m)=>s+recipeIngredientCalc(m).maliyet,0);
  const genel=malzeme*(1+recipeNum(r.genelGider)/100);
  const pors=Math.max(1,recipeNum(r.porsiyon)||1);
  const porsM=genel/pors;
  const hedef=Math.max(.01,recipeNum(r.hedefFoodCost)||30);
  const onerilenNet=porsM/(hedef/100);
  const kdv=Math.max(0,recipeNum(r.satisKdv));
  const onerilenBrut=onerilenNet*(1+kdv/100);
  const satis=recipeNum(r.satisFiyati);
  const gercekFC=satis>0?(porsM/satis*100):0;
  const kar=satis>0?satis-porsM:0;
  const marj=satis>0?kar/satis*100:0;
  return {malzeme,genel,pors,porsM,hedef,onerilenNet,onerilenBrut,satis,gercekFC,kar,marj};
}

async function confirmReceteStokDus(receteId){
  const r = state.receteler.find(x=>x.id===receteId);
  if(!r) return;
  const kullanilanPorsiyon = Number((document.getElementById('rsdPorsiyon')||{}).value)||0;
  if(kullanilanPorsiyon<=0){ toast('Porsiyon sayısı 0\'dan büyük olmalı.'); return; }
  const tarifPorsiyon = Math.max(1, recipeNum(r.porsiyon)||1);
  const oran = kullanilanPorsiyon/tarifPorsiyon;
  const mats = r.malzemeler||[];
  const dusulecekler = [];
  mats.forEach(m=>{
    const calc = recipeIngredientCalc(m);
    if(!calc.urun) return;
    const cv = recipeConvertedQty(calc.brut, calc.kullanimBirim, calc.fiyatBirim);
    const miktar = cv.qty * oran;
    dusulecekler.push({urun:calc.urun, miktar});
  });
  if(dusulecekler.length===0){ toast('Bu reçetede stoktan düşülecek eşleşen ürün yok.'); closeModal(); return; }
  closeModal();
  for(const d of dusulecekler){
    const idx = state.urunler.findIndex(x=>(x.ID||x.id)===(d.urun.ID||d.urun.id));
    if(idx===-1) continue;
    const u = state.urunler[idx];
    const eskiStok = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
    const yeniStok = eskiStok - d.miktar;
    u.Stok = yeniStok;
    syncOrQueue({action:'updateUrun', id:(u.ID||u.id), data:{stok:yeniStok}}, {entity:'urun', op:'update', localId:(u.ID||u.id)});
  }
  await persistUrunler();
  toast(kullanilanPorsiyon+' '+(r.porsiyonBirim||'porsiyon')+' için '+dusulecekler.length+' malzeme stoktan düşüldü.');
  renderContent();
}

}

function periodTotal(fromISO){
  // Sadece ALIŞ faturaları — Satış faturaları "alım" tutarına karışmasın.
  // "Bugün/Bu hafta/Bu ay/Bu yıl" burada FATURA ÜZERİNDEKİ tarihe göre
  // DEĞİL, faturanın sisteme GİRİLDİĞİ güne (kayitTarihi) göre hesaplanır
  // — tedarikçi siparişi aldığı gün faturayı kesip mal 1-2 gün sonra
  // geldiğinde fatura üzerindeki (geçmiş) tarih girildiğinde bile, "bugün
  // girdiğim faturalar" burada doğru görünsün diye. kayitTarihi olmayan
  // eski kayıtlarda (bu alan eklenmeden önce girilmiş) fatura tarihine
  // geri düşülür.
  const rows = state.alimlar.filter(a => {
    if((a.tur||'Alış')!=='Alış') return false;
    const esasTarih = (a.kayitTarihi ? String(a.kayitTarihi).slice(0,10) : a.tarih);
    return esasTarih >= fromISO;
  });
  return { tutar: rows.reduce((s,a)=>s+Number(a.toplam||0),0), adet: rows.length,
           miktar: rows.reduce((s,a)=>s+Number(a.miktar||0),0) };
}

function viewPano(){
  if(state.alimlar.length===0){
    return emptyState('Henüz alım kaydı yok', 'Fatura girişi sekmesinden ilk alımınızı ekleyin.');
  }
  const today = todayISO();
  const monday = dateToLocalISO(startOfWeek(new Date()));
  const monthStart = today.slice(0,7)+'-01';
  const yearStart = today.slice(0,4)+'-01-01';

  const tToday = periodTotal(today);
  const tWeek = periodTotal(monday);
  const tMonth = periodTotal(monthStart);
  const tYear = periodTotal(yearStart);

  // firma bazlı toplam (top 6) — sadece Alış
  const byFirma = {};
  state.alimlar.forEach(a=>{ if((a.tur||'Alış')!=='Alış') return; byFirma[a.firma] = (byFirma[a.firma]||0) + Number(a.toplam||0); });
  const firmaRows = Object.entries(byFirma).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxFirma = Math.max(1, ...firmaRows.map(r=>r[1]));

  // ürün bazlı toplam (top 6, miktar) — sadece Alış
  const byUrun = {};
  state.alimlar.forEach(a=>{
    if((a.tur||'Alış')!=='Alış') return;
    const key = a.stokKodu + ' — ' + a.urunAdi;
    if(!byUrun[key]) byUrun[key] = {miktar:0, tutar:0, birim:a.birim};
    byUrun[key].miktar += Number(a.miktar||0);
    byUrun[key].tutar += Number(a.toplam||0);
  });
  const urunRows = Object.entries(byUrun).sort((a,b)=>b[1].tutar-a[1].tutar).slice(0,6);
  const maxUrun = Math.max(1, ...urunRows.map(r=>r[1].tutar));

  // Seçilen tarih aralığındaki ay bazlı trend (varsayılan: son 12 ay) — sadece Alış
  const pr = state.panoRange;
  const rangeTo = pr.to || today;
  const rangeFrom = pr.from || (function(){ const d=new Date(rangeTo+'T00:00:00'); d.setMonth(d.getMonth()-11); d.setDate(1); return dateToLocalISO(d); })();
  const months = monthKeysBetween(rangeFrom, rangeTo);
  const monthTotals = months.map(mk=>{
    const rows = state.alimlar.filter(a=>{
      const esasTarih = a.kayitTarihi ? String(a.kayitTarihi).slice(0,10) : a.tarih;
      return esasTarih && esasTarih.slice(0,7)===mk && (a.tur||'Alış')==='Alış';
    });
    return { key:mk, tutar: rows.reduce((s,a)=>s+Number(a.toplam||0),0) };
  });
  const maxMonth = Math.max(1, ...monthTotals.map(m=>m.tutar));

  // Cari borç dağılımı: sadece pozitif bakiyesi olan (borçlu olunan) firmalar
  const borcDagilimi = state.firmalar.map(f=>{
    const ad = f.Ad||f.ad;
    return {label: ad, value: computeFirmaBakiye(ad).bakiye};
  }).filter(x=>x.value>0.5);

  // Stok değeri dağılımı: tedarikçiye (Satıcı) göre — Fiyat × Stok
  const stokByTedarikci = {};
  state.urunler.forEach(u=>{
    const tedarikci = u.Satici||u.satici||'Belirtilmemiş';
    const deger = (Number(u.Fiyat!==undefined?u.Fiyat:u.fiyat)||0) * (Number(u.Stok!==undefined?u.Stok:u.stok)||0);
    stokByTedarikci[tedarikci] = (stokByTedarikci[tedarikci]||0) + deger;
  });
  const stokDagilimi = Object.entries(stokByTedarikci).map(([label,value])=>({label,value}));

  // Nakit akışı öngörüsü + vade takibi listesi
  const vadeliList = vadeliKalemler();
  const in7 = dateToLocalISO((function(){ const d=new Date(); d.setDate(d.getDate()+7); return d; })());
  const in30 = dateToLocalISO((function(){ const d=new Date(); d.setDate(d.getDate()+30); return d; })());
  const odenecek7 = vadeliList.filter(v=>v.yon==='cikis' && v.vadeTarihi<=in7).reduce((s,v)=>s+v.tutar,0);
  const odenecek30 = vadeliList.filter(v=>v.yon==='cikis' && v.vadeTarihi<=in30).reduce((s,v)=>s+v.tutar,0);
  const tahsil30 = vadeliList.filter(v=>v.yon==='giris' && v.vadeTarihi<=in30).reduce((s,v)=>s+v.tutar,0);
  const gecikenSayisi = vadeliList.filter(v=>v.vadeTarihi<today).length;

  return (
    '<div class="grid grid-4">' +
      metricCard('Bugün', tToday.tutar, tToday.adet) +
      metricCard('Bu hafta', tWeek.tutar, tWeek.adet) +
      metricCard('Bu ay', tMonth.tutar, tMonth.adet) +
      metricCard('Bu yıl', tYear.tutar, tYear.adet) +
    '</div>' +

    '<h2 class="section-title">Nakit akışı öngörüsü</h2>' +
    '<div class="grid grid-4">' +
      '<div class="card metric"><div class="metric-label">7 gün içinde ödenecek</div><div class="metric-value" style="color:'+(odenecek7>0?'var(--danger)':'var(--ink)')+';">'+money(odenecek7)+'</div><div class="metric-sub">açık fatura + verilen çek</div></div>' +
      '<div class="card metric"><div class="metric-label">30 gün içinde ödenecek</div><div class="metric-value">'+money(odenecek30)+'</div><div class="metric-sub">açık fatura + verilen çek</div></div>' +
      '<div class="card metric"><div class="metric-label">30 gün içinde tahsil edilecek</div><div class="metric-value" style="color:var(--success);">'+money(tahsil30)+'</div><div class="metric-sub">alınan çek</div></div>' +
      '<div class="card metric"><div class="metric-label">Vadesi geçmiş</div><div class="metric-value" style="color:'+(gecikenSayisi>0?'var(--danger)':'var(--ink)')+';">'+gecikenSayisi+'</div><div class="metric-sub">kayıt · <a href="#cekSenet" style="color:var(--primary);">Çek/Senet Takibi</a></div></div>' +
    '</div>' +

    (vadeliList.length ? (
      '<h2 class="section-title">Vade takibi</h2>' +
      '<div class="card">' +
        '<div class="tbl-wrap" style="border:0;"><table><thead><tr><th>Vade</th><th>Tür</th><th>Firma</th><th>Açıklama</th><th class="num">Tutar</th></tr></thead><tbody>' +
          vadeliList.slice(0,10).map(v=>(
            '<tr><td>'+fmtDate(v.vadeTarihi)+' '+vadeBadgeHtml(v.vadeTarihi, null)+'</td><td>'+escapeHtml(v.tip)+'</td>'+
            '<td>'+escapeHtml(v.firma)+'</td><td>'+escapeHtml(v.aciklama)+'</td>'+
            '<td class="num" style="color:'+(v.yon==='cikis'?'var(--danger)':'var(--success)')+';">'+(v.yon==='cikis'?'-':'+')+money(v.tutar)+'</td></tr>'
          )).join('') +
        '</tbody></table></div>' +
        (vadeliList.length>10 ? '<div class="hint" style="margin-top:8px;">+'+(vadeliList.length-10)+' kayıt daha — tüm liste için Alımlar veya Çek/Senet Takibi sekmesine bakın.</div>' : '') +
      '</div>'
    ) : '') +

    '<h2 class="section-title">Alım tutarı trendi</h2>' +
    '<div class="card">' +
      '<div class="form-row" style="grid-template-columns:1fr 1fr auto;align-items:end;margin-bottom:14px;max-width:460px;">' +
        '<div class="field"><label>Başlangıç</label><input type="date" value="'+rangeFrom+'" onchange="setPanoRange(\'from\',this.value)"></div>' +
        '<div class="field"><label>Bitiş</label><input type="date" value="'+rangeTo+'" onchange="setPanoRange(\'to\',this.value)"></div>' +
        '<button class="btn btn-sm btn-ghost" onclick="resetPanoRange()">Son 12 ay</button>' +
      '</div>' +
      '<div class="chart-bars">' +
        monthTotals.map(m => (
          '<div class="chart-bar-col">' +
            '<div class="chart-bar" style="height:' + Math.max(2, Math.round(m.tutar/maxMonth*120)) + 'px" title="' + money(m.tutar) + '"></div>' +
            '<div class="chart-bar-label">' + monthShortLabel(m.key) + '</div>' +
          '</div>'
        )).join('') +
      '</div>' +
    '</div>' +

    '<div class="grid grid-2">' +
      '<div>' +
        '<h2 class="section-title">Firmaya göre toplam alım</h2>' +
        '<div class="card">' +
          (firmaRows.length ? firmaRows.map(([f,t])=>hbarRow(f, t, maxFirma)).join('') : emptyMini()) +
        '</div>' +
      '</div>' +
      '<div>' +
        '<h2 class="section-title">En çok alınan ürünler (tutar)</h2>' +
        '<div class="card">' +
          (urunRows.length ? urunRows.map(([k,v])=>hbarRow(k, v.tutar, maxUrun)).join('') : emptyMini()) +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="grid grid-2">' +
      '<div>' +
        '<h2 class="section-title">Cari borç dağılımı</h2>' +
        '<div class="card">' + donutChartHtml(borcDagilimi, {centerLabel:'Toplam borç'}) + '</div>' +
      '</div>' +
      '<div>' +
        '<h2 class="section-title">Stok değeri dağılımı (tedarikçiye göre)</h2>' +
        '<div class="card">' + donutChartHtml(stokDagilimi, {centerLabel:'Stok değeri'}) + '</div>' +
      '</div>' +
    '</div>'
  );
}
function setPanoRange(key, val){ state.panoRange[key]=val; renderContent(); }
function resetPanoRange(){ state.panoRange={from:'',to:''}; renderContent(); }
function monthKeysBetween(fromISO, toISO){
  const arr = [];
  const d = new Date(fromISO+'T00:00:00'); d.setDate(1);
  const end = new Date(toISO+'T00:00:00'); end.setDate(1);
  let guard = 0;
  while(d <= end && guard < 240){
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
    d.setMonth(d.getMonth()+1);
    guard++;
  }
  return arr.length ? arr : [toISO.slice(0,7)];
}

function metricCard(label, tutar, adet){
  return '<div class="card metric"><div class="metric-label">' + label + '</div>' +
    '<div class="metric-value">' + money(tutar) + '</div>' +
    '<div class="metric-sub">' + adet + ' kalem</div></div>';
}
function hbarRow(label, val, max){
  return '<div class="hbar-row"><div class="hbar-label" title="'+escapeHtml(label)+'">' + escapeHtml(label) + '</div>' +
    '<div class="hbar-track"><div class="hbar-fill" style="width:' + Math.max(2, Math.round(val/max*100)) + '%"></div></div>' +
    '<div class="hbar-val">' + money(val) + '</div></div>';
}
var DONUT_PALETTE = ['var(--primary)','var(--accent)','var(--danger)','var(--success)','#5B7FBD','#8E6C9E','#4FA1AE','#B5854C'];
// items: [{label, value}] — negatif/sıfır değerler ve 8'den sonrası "Diğer" altında toplanır.
function donutChartHtml(items, opts){
  opts = opts || {};
  const clean = items.filter(it=>Number(it.value)>0).sort((a,b)=>b.value-a.value);
  if(clean.length===0) return emptyMini();
  let shown = clean.slice(0,7);
  const rest = clean.slice(7).reduce((s,it)=>s+it.value,0);
  if(rest>0) shown = shown.concat([{label:'Diğer', value:rest}]);
  const total = shown.reduce((s,it)=>s+it.value,0)||1;
  let acc=0;
  const stops = shown.map((it,i)=>{
    const start = acc/total*360; acc+=it.value; const end=acc/total*360;
    return DONUT_PALETTE[i%DONUT_PALETTE.length]+' '+start.toFixed(2)+'deg '+end.toFixed(2)+'deg';
  }).join(', ');
  const fmt = opts.fmt || money;
  return '<div class="donut-wrap">' +
    '<div class="donut-chart" style="background:conic-gradient('+stops+');">' +

// Frankfurter API (Avrupa Merkez Bankası kaynaklı, ücretsiz, anahtar
// gerektirmeyen, tarayıcıdan doğrudan erişilebilen — CORS açık) üzerinden
// canlı kur çeker. Not: bu, spesifik bir döviz bürosunun (ör. Sun Döviz)
// gişe kurunu DEĞİL, ECB referans kurunu verir — gişe kuruna göre
// çalışmak isterseniz Kur alanına elle kendi kurunuzu yazabilirsiniz.
// TCMB'nin (Türkiye Cumhuriyet Merkez Bankası) today.xml'inden o para
// biriminin SATIŞ (ForexSelling) kurunu okur — bir borcu TL'ye çevirirken
// kullanılan standart kur budur. Bulamazsa null döner.
function tcmbKuruOku(xmlText, kod){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if(doc.querySelector('parsererror')) return null;
  const nodes = doc.getElementsByTagName('Currency');
  for(let i=0;i<nodes.length;i++){
    if(nodes[i].getAttribute('Kod')===kod){
      const el = nodes[i].getElementsByTagName('ForexSelling')[0];
      const v = el ? parseFloat((el.textContent||'').replace(',','.')) : NaN;
      return (v && isFinite(v)) ? v : null;
    }
  }
  return null;
}
// tcmbKuruOku'dan farklı olarak, TCMB'nin GERÇEKTEN ayrı yayınladığı hem
// ForexBuying (Döviz Alış) hem ForexSelling (Döviz Satış) değerlerini birlikte
// okur — Döviz Kurları sekmesindeki otomatik çekmede kullanılır.
function tcmbKurCiftiOku(xmlText, kod){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if(doc.querySelector('parsererror')) return null;
  const nodes = doc.getElementsByTagName('Currency');
  for(let i=0;i<nodes.length;i++){
    if(nodes[i].getAttribute('Kod')===kod){
      const alisEl = nodes[i].getElementsByTagName('ForexBuying')[0];
      const satisEl = nodes[i].getElementsByTagName('ForexSelling')[0];
      const alis = alisEl ? parseFloat((alisEl.textContent||'').replace(',','.')) : NaN;
      const satis = satisEl ? parseFloat((satisEl.textContent||'').replace(',','.')) : NaN;
      if(!isFinite(alis) || !isFinite(satis) || !alis || !satis) return null;
      return {alis, satis};
    }
  }
  return null;
}
// Döviz Kurları sekmesi için: önce TCMB'den GERÇEK alış/satış çiftini almayı
// dener (direkt, olmazsa CORS aktarıcısı üzerinden). TCMB'ye hiç
// ulaşılamazsa, tek bir orta piyasa kuru veren yedek kaynaklara düşer — o
// durumda alış=satış olarak (yaklaşık değer olduğu belirtilerek) döner.
async function fetchDovizKuruCifti(paraBirimi){
  const kod = String(paraBirimi||'').toUpperCase();
  const tcmbUrl = 'https://www.tcmb.gov.tr/kurlar/today.xml';
  const genelparaUrl = 'https://api.genelpara.com/embed/doviz.json';
  const truncgilUrl = 'https://finans.truncgil.com/today.json';
  const denemeler = [
    { ad:'TCMB', url:tcmbUrl, tip:'tcmb-xml' },
    { ad:'TCMB', url:'https://api.allorigins.win/raw?url='+encodeURIComponent(tcmbUrl), tip:'tcmb-xml' },
    { ad:'Truncgil', url:truncgilUrl, tip:'truncgil-json' },
    { ad:'Truncgil', url:'https://api.allorigins.win/raw?url='+encodeURIComponent(truncgilUrl), tip:'truncgil-json' },
    { ad:'GenelPara', url:genelparaUrl, tip:'genelpara-json' },
    { ad:'GenelPara', url:'https://api.allorigins.win/raw?url='+encodeURIComponent(genelparaUrl), tip:'genelpara-json' }
  ];
  for(const d of denemeler){
    try{
      const res = await fetch(d.url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      if(d.tip==='tcmb-xml'){
        const text = await res.text();
        const cift = tcmbKurCiftiOku(text, kod);
        if(!cift) throw new Error(kod+' bulunamadı');
        return {alis:cift.alis, satis:cift.satis, kaynak:d.ad, gercekCift:true};
      }
      if(d.tip==='truncgil-json'){
        const data = await res.json();
        const item = data && data[kod];
        const alis = item ? parseFloat(String(item['Alış']).replace(/\./g,'').replace(',','.')) : NaN;
        const satis = item ? parseFloat(String(item['Satış']).replace(/\./g,'').replace(',','.')) : NaN;
        if(!isFinite(alis) || !isFinite(satis) || !alis || !satis) throw new Error(kod+' bulunamadı');
        return {alis, satis, kaynak:d.ad, gercekCift:true};
      }
      if(d.tip==='genelpara-json'){
        const data = await res.json();
        const item = data && data[kod];
        const alis = item ? parseFloat(String(item.alis).replace(',','.')) : NaN;
        const satis = item ? parseFloat(String(item.satis).replace(',','.')) : NaN;
        if(!isFinite(alis) || !isFinite(satis) || !alis || !satis) throw new Error(kod+' bulunamadı');
        return {alis, satis, kaynak:d.ad, gercekCift:true};
      }
    }catch(e){ /* sıradaki kaynağa geç */ }
  }
  // Hiçbir gerçek alış/satış kaynağına ulaşılamadı — tek bir orta piyasa
  // kuru veren yedeğe düş (bu durumda alış=satış, yaklaşık değerdir).
  const {kur} = await fetchDovizKuruTL(paraBirimi);
  return {alis:kur, satis:kur, kaynak:'yedek kaynak (yaklaşık)', gercekCift:false};
}
// Canlı kur çekerken TEK bir kaynağa bağımlı kalmamak için sırayla birkaç
// kaynağı dener — biri engelliyse/kapalıysa diğeri devreye girer.
// TCMB (Türkiye Cumhuriyet Merkez Bankası) öncelikli kaynaktır; TCMB'nin
// kendi sitesi tarayıcıdan doğrudan erişime (CORS) izin vermediği için önce
// doğrudan, olmazsa bir CORS aktarıcısı üzerinden denenir. Hiçbiri
// çalışmazsa ECB kaynaklı yedek servislere düşer. Başarısız olursa
// fırlatır (çağıran elle girmeye yönlendirir).
async function fetchDovizKuruTL(paraBirimi){
  const kod = String(paraBirimi||'').toUpperCase();
  const tcmbUrl = 'https://www.tcmb.gov.tr/kurlar/today.xml';
  const kaynaklar = [
    { ad:'TCMB', url:tcmbUrl, tip:'tcmb-xml' },
    { ad:'TCMB', url:'https://api.allorigins.win/raw?url='+encodeURIComponent(tcmbUrl), tip:'tcmb-xml' },
    { ad:'Frankfurter', url:'https://api.frankfurter.app/latest?from='+kod+'&to=TRY', tip:'json',
      ayikla: d => d && d.rates && d.rates.TRY, tarih: d => d && d.date },
    { ad:'jsDelivr', url:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/'+kod.toLowerCase()+'.min.json', tip:'json',
      ayikla: d => d && d[kod.toLowerCase()] && d[kod.toLowerCase()].try, tarih: d => d && d.date },
    { ad:'Cloudflare', url:'https://latest.currency-api.pages.dev/v1/currencies/'+kod.toLowerCase()+'.min.json', tip:'json',
      ayikla: d => d && d[kod.toLowerCase()] && d[kod.toLowerCase()].try, tarih: d => d && d.date }
  ];
  let sonHata = null;
  for(const kaynak of kaynaklar){
    try{
      const res = await fetch(kaynak.url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      if(kaynak.tip==='tcmb-xml'){
        const text = await res.text();
        const kur = tcmbKuruOku(text, kod);
        if(!kur) throw new Error(kod+' bulunamadı');
        const tarihM = text.match(/Date="([^"]+)"/);
        return { kur:Number(kur), kaynak:kaynak.ad, tarih: tarihM?tarihM[1]:'' };
      }
      const data = await res.json();
      const kur = kaynak.ayikla(data);
      if(!kur || !isFinite(kur)) throw new Error('kur alanı yok');
      return { kur:Number(kur), kaynak:kaynak.ad, tarih:kaynak.tarih(data)||'' };
    }catch(e){ sonHata = e; }
  }
  throw sonHata || new Error('Hiçbir kaynaktan kur alınamadı');
}
async function fetchCanliKur(){
  const pb = (document.getElementById('gParaBirimi')||{}).value || 'TL';
  if(pb==='TL') return;
  const bilgiEl = document.getElementById('gKurBilgi');
  const butonEl = document.getElementById('gKurButon');
  if(butonEl) butonEl.disabled = true;
  if(bilgiEl) bilgiEl.textContent = 'kur çekiliyor…';
  try{
    const {kur, kaynak, tarih} = await fetchDovizKuruTL(pb);
    const kurEl = document.getElementById('gKur');
    if(kurEl) kurEl.value = Math.round(kur*10000)/10000;
    if(bilgiEl) bilgiEl.textContent = '✓ '+kaynak+(tarih?' · '+tarih:'')+' referans kuru — gişe kurunuzdan farklı olabilir, gerekirse elle düzeltin.';

  }catch(e){
    if(bilgiEl) bilgiEl.textContent = '⚠ Kur çekilemedi ('+(e&&e.message?e.message:'bağlantı hatası')+'). İnternet erişiminizi kontrol edin ya da elle girin.';
  }finally{
    if(butonEl) butonEl.disabled = false;
  }
}

  state.draftItems.forEach((row,i)=>checkFiyatDegisim(i));
}

// Enter tuşu: aynı satırda bir sonraki hücreye, son hücrede ise bir
// sonraki satırın ilk hücresine geçer (gerekirse yeni satır açar).
// Ürün arama popover'ı açıkken (col 0/1) ok tuşları ve Enter önce
// popover'daki seçimi yönetir; Escape popover'ı kapatır.
// Tab tuşu ayrıca müdahale edilmeden TARAYICININ doğal davranışına
// bırakılıyor — satır sonundaki ✕ butonu tabindex="-1" olduğu için
// Tab ile son hücreden direkt bir sonraki satırın ilk hücresine geçilir.
function handleRowKey(event, i, col){
  if(state.searchPopover && state.searchPopover.context==='fatura' && state.searchPopover.rowIndex===i && (col===0||col===1)){
    if(event.key==='ArrowDown'){ event.preventDefault(); moveSearchActive(1); return; }
    if(event.key==='ArrowUp'){ event.preventDefault(); moveSearchActive(-1); return; }
    if(event.key==='Enter'){ event.preventDefault(); chooseActiveSearchResult(); return; }
    if(event.key==='Escape'){ closeUrunSearch(); return; }
  }
  if(event.key !== 'Enter') return;
  event.preventDefault();
  if(col === 0){ lookupUrun(i); } // stok kodu alanında Enter: önce ürünü otomatik doldur
  const lastCol = (col+1 >= DRAFT_COLS.length);
  focusDraftCell(lastCol ? i+1 : i, lastCol ? 0 : col+1);
}
function focusDraftCell(row, col){
  if(row >= state.draftItems.length){ addDraftRow(); } // son satırdaysak yeni satır aç
  setTimeout(function(){
    const el = document.getElementById('di_'+row+'_'+DRAFT_COLS[col]);
    if(el){ el.focus(); if(el.select) el.select(); }
  }, 0);
}

/* ---- Ürün arama popover'ı (datalist yerine — 500+ ürünle de hızlı) ----
   Hem Fatura Girişi (Stok Kodu / Ürün Adı) hem de Talep formunda (Ürün)
   AYNI popover bileşeni kullanılır — context alanı ('fatura'|'talep')
   seçim yapıldığında hangi diziye (state.draftItems / state.talepDraftItems)
   ve hangi otomatik-doldurma fonksiyonuna (lookupUrun / lookupTalepUrunByKod)
   gideceğini belirler. Öğeler; satır içi onclick/onmousedown yerine, tek
   seferlik event delegasyonuyla (wireUrunSearchPopover) yönetilir — bu hem
   daha sağlam (özel karakterli ürün adlarında JS string kaçış sorunu
   olmaz) hem de her tuşta yeniden bağlama gerektirmez.
   Türkçe karakterler (İ/ı vb.) doğru küçük harfe çevrilir. */
function turkishLower(s){
  // Türkçe küçük harfe çevirir (İ→i, I→ı doğru işlenir) VE ayrıca
  // noktalı/noktasız i (i/ı) farkını arama için görmezden gelir —
  // aksi halde klavye/veri girişindeki ufak bir nokta farkı yüzünden
  // aramada eşleşme kaçabilir (örn. "KABI" -> "kabı" ama kullanıcı
  // "kabi" yazarsa eşleşmemesi gibi).
  return String(s==null?'':s).toLocaleLowerCase('tr-TR').replace(/ı/g,'i');
}
function urunSearchInputId(context, i, field){
  if(context==='talep') return 'ti_'+i+'_urunAdi';
  if(context==='iade') return 'oiUrun';
  if(context==='transfer') return 'trUrun';
  if(context==='urunRapor') return 'urunRaporInput';
  if(context==='recete') return 'rmUrun_'+i;
  if(context==='teklif') return 'tkUrun';
  if(context==='sozlesme') return 'szUrun';
  if(context==='baglantiliSiparis') return 'bsUrun';
  if(context==='stokSayimi') return 'ssUrunArama';
  if(context==='sktTakip') return 'sktUrunArama';
  return 'di_'+i+'_'+DRAFT_COLS[field];
}
function showUrunSearch(i, query, field, context){
  context = context || 'fatura';
  const q = turkishLower(String(query||'').trim());
  let matches;
  if(!q){
    matches = state.urunler.slice(0, 20);
  } else {
    matches = state.urunler.filter(u=>{
      const kod = turkishLower(u.StokKodu||u.stokKodu||'');
      const ad = turkishLower(u.Ad||u.ad||'');
      return kod.includes(q) || ad.includes(q);
    });
    // Aynı ürün adına birden fazla firma/markadan (ör. farklı stok
    // kodlarıyla) alım yapılmış olabilir — bu durumda en son alınan
    // firma/marka listenin EN ÜSTÜNDE çıkar, kalanlar da seçilebilir
    // durur (kullanıcı isterse farklı birini seçer).
    matches = matches.map(u=>{
      const son = sonAlimBilgisi(u.StokKodu||u.stokKodu);
      return {u, tarih: son ? son.tarih : ''};
    }).sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||''))).map(x=>x.u).slice(0, 20);
  }
  state.searchPopover = {context:context, rowIndex:i, field:field, items:matches, activeIndex:0};
  const inputEl = document.getElementById(urunSearchInputId(context, i, field));
  if(inputEl) positionSearchPopover(inputEl);
  wireUrunSearchPopover();
  renderSearchPopover();
}
function positionSearchPopover(inputEl){
  const pop = document.getElementById('urunSearchPop');
  if(!pop) return;
  const r = inputEl.getBoundingClientRect();
  pop.style.left = Math.round(r.left) + 'px';
  pop.style.top = Math.round(r.bottom + 4) + 'px';
  pop.style.width = Math.max(r.width, 320) + 'px';
}
// Bir stok kodunun en son ALIŞ yapıldığı tarih+firmayı döndürür — arama
// sonuçlarını "en son alınana göre" sıralamak ve her satırda hangi
// firma/markadan alındığını göstermek için kullanılır.
function sonAlimBilgisi(stokKodu){
  const kod = String(stokKodu||'').toUpperCase();
  const son = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')==='Alış')
    .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||''))).pop();
  return son ? {tarih:son.tarih, firma:son.firma} : null;
}
function renderSearchPopover(){
  const pop = document.getElementById('urunSearchPop');
  const sp = state.searchPopover;
  if(!pop || !sp){ if(pop) pop.style.display='none'; return; }
  if(sp.items.length===0){
    pop.innerHTML = '<div class="search-popover-empty">Eşleşme yok</div>';
  } else {
    pop.innerHTML = sp.items.map((u,idx)=>{
      const kod = u.StokKodu||u.stokKodu||'', ad = u.Ad||u.ad||'';
      const marka = u.Marka||u.marka||'';
      const son = sonAlimBilgisi(kod);
      // Aynı ürün adına birden fazla firma/markadan alım yapılmışsa (ör.
      // aynı "PEYNİR DİLİMLİ" farklı firmalardan farklı marka olarak
      // alınıyorsa), her sonuçta hangi marka + en son hangi firmadan/ne
      // zaman alındığı gösterilir — en son alınan sonuç en üstte çıkar
      // (bkz. showUrunSearch'teki sıralama).
      const altBilgi = [marka, son ? ('Son: '+escapeHtml(son.firma)+' — '+fmtDate(son.tarih)) : ''].filter(Boolean).join(' · ');
      // data-* özniteliklerine yazılır, satır içi JS koduna GÖMÜLMEZ —
      // böylece ürün adında tırnak/özel karakter olsa bile bozulmaz.
      return '<div class="search-popover-item'+(idx===sp.activeIndex?' active':'')+'" data-idx="'+idx+'" data-kod="'+escapeHtml(kod)+'">' +
        '<span class="sp-kod">'+escapeHtml(kod)+'</span><span class="sp-ad">'+escapeHtml(ad)+
        (altBilgi ? '<div class="hint" style="margin:1px 0 0;font-size:11.5px;">'+altBilgi+'</div>' : '') +
        '</span>' +
      '</div>';
    }).join('');
  }
  pop.style.display = 'block';
}
// Popover'ın kendi container'ına (yeniden oluşturulmayan, sabit #urunSearchPop
// öğesine) TEK SEFERLİK olay dinleyicisi bağlar; içindeki satırlar her
// tuşta yeniden çizilse de (innerHTML değişse de) bu dinleyici kalıcıdır.
function wireUrunSearchPopover(){
  const pop = document.getElementById('urunSearchPop');
  if(!pop || pop.dataset.wired) return;
  pop.dataset.wired = '1';
  pop.addEventListener('mousedown', function(e){
    const item = e.target.closest('.search-popover-item');
    if(!item) return;
    e.preventDefault(); // input'un blur olmasını engeller — fare tıklaması güvenilir çalışır
    chooseSearchResult(item.getAttribute('data-kod'));
  });
  pop.addEventListener('mouseover', function(e){
    const item = e.target.closest('.search-popover-item');
    if(!item) return;
    setSearchActiveIndex(Number(item.getAttribute('data-idx')));
  });
}
function setSearchActiveIndex(idx){
  if(!state.searchPopover) return;
  state.searchPopover.activeIndex = idx;
  renderSearchPopover();
}
function moveSearchActive(delta){
  const sp = state.searchPopover;
  if(!sp || !sp.items.length) return;
  const n = sp.items.length;
  sp.activeIndex = (sp.activeIndex + delta + n) % n;
  renderSearchPopover();
}
function chooseActiveSearchResult(){
  const sp = state.searchPopover;
  if(!sp || !sp.items.length) return;
  const u = sp.items[sp.activeIndex];
  chooseSearchResult(u.StokKodu||u.stokKodu);
}
function chooseSearchResult(stokKodu){
  const sp = state.searchPopover;
  if(!sp) return;
  const i = sp.rowIndex;
  if(sp.context==='talep'){
    state.talepDraftItems[i].stokKodu = stokKodu;
    lookupTalepUrunByKod(i); // urunAdi/birim/bilgi paneli otomatik dolar + satırlar yeniden çizilir
    closeUrunSearch();
    setTimeout(()=>{ const el=document.getElementById('ti_'+i+'_miktar'); if(el){ el.focus(); el.select&&el.select(); } }, 0);
  } else if(sp.context==='iade'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    const el = document.getElementById('oiUrun');
    if(el) el.value = u ? (u.Ad||u.ad||'') : '';
    closeUrunSearch();
    lookupIadeUrun();
    const mEl = document.getElementById('oiMiktar'); if(mEl) mEl.focus();
  } else if(sp.context==='transfer'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    const el = document.getElementById('trUrun');
    if(el) el.value = u ? (u.Ad||u.ad||'') : '';
    closeUrunSearch();
    lookupTransferUrun();
    const mEl = document.getElementById('trMiktar'); if(mEl) mEl.focus();
  } else if(sp.context==='urunRapor'){
    const el = document.getElementById('urunRaporInput');
    if(el) el.value = stokKodu;
    closeUrunSearch();
    setUrunRaporQuery(stokKodu);
  } else if(sp.context==='recete'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    recipeUpdateIngredient(i, 'urunId', u ? (u.ID||u.id) : '');
    closeUrunSearch();
    renderContent();
  } else if(sp.context==='teklif'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    const el = document.getElementById('tkUrun');
    if(el) el.value = u ? (u.Ad||u.ad||'') : '';
    const birimEl = document.getElementById('tkBirim');
    if(birimEl && u && !birimEl.value) birimEl.value = u.Birim||u.birim||'';
    const markaEl = document.getElementById('tkMarka');
    if(markaEl && u && !markaEl.value) markaEl.value = u.Marka||u.marka||'';
    closeUrunSearch();
    const fiyatEl = document.getElementById('tkFiyat'); if(fiyatEl) fiyatEl.focus();
  } else if(sp.context==='sozlesme'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    const el = document.getElementById('szUrun');
    if(el) el.value = u ? (u.Ad||u.ad||'') : '';
    const birimEl = document.getElementById('szBirim');
    if(birimEl && u && !birimEl.value) birimEl.value = u.Birim||u.birim||'';
    const markaEl = document.getElementById('szMarka');
    if(markaEl && u && !markaEl.value) markaEl.value = u.Marka||u.marka||'';
    closeUrunSearch();
    const fiyatEl = document.getElementById('szFiyat'); if(fiyatEl) fiyatEl.focus();
  } else if(sp.context==='baglantiliSiparis'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    const el = document.getElementById('bsUrun');
    if(el) el.value = u ? (u.Ad||u.ad||'') : '';
    const birimEl = document.getElementById('bsBirim');
    if(birimEl && u && !birimEl.value) birimEl.value = u.Birim||u.birim||'';
    const markaEl = document.getElementById('bsMarka');
    if(markaEl && u && !markaEl.value) markaEl.value = u.Marka||u.marka||'';
    closeUrunSearch();
    const miktarEl = document.getElementById('bsMiktar'); if(miktarEl) miktarEl.focus();
  } else if(sp.context==='stokSayimi'){
    stokSayimListesineEkle(stokKodu);
    const el = document.getElementById('ssUrunArama'); if(el) el.value='';
    closeUrunSearch();
  } else if(sp.context==='sktTakip'){
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
    const el = document.getElementById('sktUrunArama');
    if(el) el.value = u ? (u.Ad||u.ad||'') : '';
    const birimEl = document.getElementById('sktBirim');
    if(birimEl && u) birimEl.value = u.Birim||u.birim||'';
    window.__sktSeciliStokKodu = stokKodu;
    closeUrunSearch();
    const miktarEl = document.getElementById('sktMiktar'); if(miktarEl) miktarEl.focus();
  } else {
    state.draftItems[i].stokKodu = stokKodu;
    lookupUrun(i); // urunAdi/birim/fiyat/kdv/indirim otomatik dolar + renderDraftRows() çağrılır
    closeUrunSearch();
    focusDraftCell(i, 2); // seçim sonrası doğrudan Miktar hücresine geç — hızlı giriş
  }
}
// İade/Transfer/Reçete gibi TEK sütunlu (satır/kolon navigasyonu olmayan)
// ürün arama kutuları için ortak klavye desteği: yukarı/aşağı ok ile
// gezinme, Enter ile seçim, Escape ile kapatma.
function handleSimpleSearchKey(event, context){
  if(!state.searchPopover || state.searchPopover.context!==context) return;
  if(event.key==='ArrowDown'){ event.preventDefault(); moveSearchActive(1); return; }
  if(event.key==='ArrowUp'){ event.preventDefault(); moveSearchActive(-1); return; }
  if(event.key==='Enter'){ event.preventDefault(); chooseActiveSearchResult(); return; }
  if(event.key==='Escape'){ closeUrunSearch(); return; }
}
function closeUrunSearch(){
  state.searchPopover = null;
  const el = document.getElementById('urunSearchPop');
  if(el){ el.style.display='none'; el.innerHTML=''; }
}
// onblur ile hemen kapatmak yerine küçük bir gecikme kullanılır; popover
// container'ında mousedown'da preventDefault çağrıldığı için zaten bir
// öğeye tıklanınca input blur olmuyor — bu sadece ekstra güvenlik.
function scheduleCloseUrunSearch(){ setTimeout(closeUrunSearch, 150); }

// Ürün sağ-tık (context) menüsü — Fatura Girişi'nde bir kalemde ürün
// seçiliyken stok kodu/ürün adı hücresine sağ tıklayınca açılır.
function showUrunContextMenu(event, i){
  const row = state.draftItems[i];
  const kod = row && row.stokKodu ? row.stokKodu.trim().toUpperCase() : '';
  const u = kod ? state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===kod) : null;
  if(!u) return; // ürün seçilmemişse tarayıcının normal sağ-tık menüsü kalsın
  event.preventDefault();
  closeUrunSearch();
  state.ctxMenuUrunId = u.ID||u.id;
  const menu = document.getElementById('urunCtxMenu');
  if(!menu) return;
  const items = [
    {icon:'📦', label:'Ürün Stok Bilgisi', action:'ctxUrunStokBilgisi'},
    {icon:'📈', label:'Ürün Hareketleri', action:'ctxUrunHareketleri'},
    {icon:'⚖️', label:'Ürün Birim Fiyatları (Karşılaştır)', action:'ctxUrunBirimFiyatlari'},
    null,
    {icon:'✏️', label:'Ürünü Güncelle', action:'ctxUrunuGuncelle'},
    {icon:'⧉', label:'Stok Kodunu Kopyala', action:'ctxKopyalaStokKodu'},
  ];
  menu.innerHTML = '<div class="ctx-menu-title">'+escapeHtml(u.StokKodu||u.stokKodu)+' · '+escapeHtml(u.Ad||u.ad)+'</div>' +
    items.map(it=> it===null ? '<div class="ctx-menu-sep"></div>' :
      '<div class="ctx-menu-item" onmousedown="event.preventDefault();closeUrunContextMenu();'+it.action+'()"><span class="ci-icon">'+it.icon+'</span>'+it.label+'</div>'
    ).join('');
  menu.style.display = 'block';
  const mw = menu.offsetWidth || 240, mh = menu.offsetHeight || 260;
  let left = event.clientX, top = event.clientY;
  if(left + mw > window.innerWidth) left = window.innerWidth - mw - 8;
  if(top + mh > window.innerHeight) top = window.innerHeight - mh - 8;
  menu.style.left = Math.max(8,left)+'px';
  menu.style.top = Math.max(8,top)+'px';
  wireUrunContextMenuClose();
}
function closeUrunContextMenu(){
  const menu = document.getElementById('urunCtxMenu');
  if(menu){ menu.style.display='none'; menu.innerHTML=''; }
}
var ctxMenuCloseWired = false;
function wireUrunContextMenuClose(){
  if(ctxMenuCloseWired) return;
  ctxMenuCloseWired = true;
  document.addEventListener('mousedown', function(e){
    const menu = document.getElementById('urunCtxMenu');
    if(menu && menu.style.display==='block' && !menu.contains(e.target)) closeUrunContextMenu();
  });
  document.addEventListener('scroll', closeUrunContextMenu, true);
  window.addEventListener('resize', closeUrunContextMenu);
}
function ctxUrunStokBilgisi(){
  const u = state.urunler.find(x=>(x.ID||x.id)===state.ctxMenuUrunId);
  if(!u) return;
  const stokKodu = u.StokKodu||u.stokKodu;
  const son = sonAlimBilgisi(stokKodu);
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:440px;">' +
        '<h3>'+escapeHtml(u.Ad||u.ad)+'</h3>' +
        '<div class="kv"><span>Stok kodu</span><span><code class="inline">'+escapeHtml(stokKodu)+'</code></span></div>' +
        '<div class="kv"><span>Güncel stok</span><span>'+num(u.Stok!==undefined?u.Stok:u.stok||0,2)+' '+escapeHtml(u.Birim||u.birim||'')+'</span></div>' +
        '<div class="kv"><span>Fiyat</span><span>'+money(u.Fiyat!==undefined?u.Fiyat:u.fiyat)+'</span></div>' +
        '<div class="kv"><span>KDV</span><span>%'+num(u.KdvOrani!==undefined?u.KdvOrani:u.kdvOrani,0)+'</span></div>' +
        '<div class="kv"><span>İndirim</span><span>%'+num(u.Indirim!==undefined?u.Indirim:u.indirim,0)+'</span></div>' +
        '<div class="kv"><span>Marka</span><span>'+escapeHtml(u.Marka||u.marka||'—')+'</span></div>' +
        '<div class="kv"><span>İçeriği</span><span>'+escapeHtml(u.Icerik||u.icerik||'—')+'</span></div>' +
        '<div class="kv"><span>Satıcısı</span><span>'+escapeHtml(u.Satici||u.satici||'—')+'</span></div>' +
        (son ? '<div class="kv"><span>Son alım</span><span>'+fmtDate(son.tarih)+' — '+escapeHtml(son.firma)+'</span></div>' : '') +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Kapat</button></div>' +
      '</div>' +
    '</div>';
}
function ctxUrunHareketleri(){
  const u = state.urunler.find(x=>(x.ID||x.id)===state.ctxMenuUrunId);
  if(!u) return;

function ctxUrunBirimFiyatlari(){

  state.bfQuery = u.Ad||u.ad||'';
  goTab('birimfiyat');

// setTimeout ile beklemek yerine (yarış durumu riski), sekmeyi ve içeriği
// SENKRON olarak biz çiziyoruz, ardından hemen modalı açıyoruz — hash
// değişikliğinin asenkron 'hashchange' olayı biraz sonra tetiklenip
// aynı sekmeyi tekrar çizecek ama bu, açık modalı etkilemez.
function ctxUrunuGuncelle(){
  const id = state.ctxMenuUrunId;
  if(!id) return;
  if(!canDo('urunler','edit')){ yetkiYokUyar(); return; }
  state.tab = 'urunler';
  ensureNavGroupOpenForTab('urunler');
  location.hash = 'urunler';
  renderApp();
  openEditUrun(id);
}
function ctxKopyalaStokKodu(){
  const u = state.urunler.find(x=>(x.ID||x.id)===state.ctxMenuUrunId);
  if(!u) return;
  const kod = u.StokKodu||u.stokKodu||'';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(kod).then(()=>toast('Stok kodu kopyalandı: '+kod)).catch(()=>toast('Kopyalanamadı.'));
  } else {
    toast('Bu tarayıcıda panoya kopyalama desteklenmiyor.');
  }
}

/* ---- Fiyat değişim analizi: bu ürünün EN SON alım fiyatına göre
   girilen yeni fiyat ne kadar zamlı/indirimli, satırın yanında rozetle
   gösterir. Birim Fiyat HER ZAMAN temel birim (ör. adet) başına girilir
   — birim "AD" olsun ya da "KL 3000 AD" (koli) olsun fark etmez, çünkü
   Toplam zaten Miktar×Paket×BirimFiyat olarak hesaplanır (bkz. saveFatura,
   renderDraftRows). Bu yüzden ham birimFiyat değerleri doğrudan, ek bir
   normalize işlemine gerek kalmadan kıyaslanabilir. ---- */
function getSonAlimFiyat(stokKodu){
  const kod = String(stokKodu||'').trim().toUpperCase();
  if(!kod) return null;
  const tur = faturaTuruFromTab();
  const sonAlim = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')===tur)
    .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')))
    .pop();
  return sonAlim ? Number(sonAlim.birimFiyat)||0 : null;
}
// Satış faturasında kâr marjı hesaplayabilmek için, hangi sekmede
// olduğumuzdan BAĞIMSIZ olarak her zaman en son ALIŞ (maliyet) fiyatını
// bulur — getSonAlimFiyat aktif sekmeye göre değişir, bu değişmez.
function getSonAlisMaliyeti(stokKodu){
  const kod = String(stokKodu||'').trim().toUpperCase();
  if(!kod) return null;
  const sonAlim = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')==='Alış')
    .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')))
    .pop();
  return sonAlim ? Number(sonAlim.birimFiyat)||0 : null;
}
function checkFiyatDegisim(i){
  const row = state.draftItems[i];
  const el = document.getElementById('di_'+i+'_fiyatFark');
  if(!row || !el) return;
  if(faturaTuruFromTab()==='Satış'){ checkKarMarji(i); return; }
  const yeniFiyat = Number(row.birimFiyat)||0;
  const eskiFiyat = getSonAlimFiyat(row.stokKodu);
  if(!eskiFiyat || yeniFiyat<=0 || Math.abs(eskiFiyat-yeniFiyat)<1e-9){ el.innerHTML=''; return; }
  const fark = ((yeniFiyat-eskiFiyat)/eskiFiyat)*100;
  const artis = fark>0;
  const cls = artis ? 'badge-danger' : 'badge-success';
  const ok = artis ? '▲' : '▼';
  el.innerHTML = '<span class="badge '+cls+'" style="font-size:10px;padding:1px 5px;white-space:nowrap;" ' +
    'title="Önceki alım fiyatı: '+money(eskiFiyat)+'">'+ok+' %'+num(Math.abs(fark),1)+'</span>';
}
// Satış fiyatı girilirken canlı kâr marjı geri bildirimi: ürünün Ürün Kâr
// Marjı sekmesinde tanımlı HEDEF marjına göre, girilen fiyatla elde edilen
// GERÇEK marjı karşılaştırıp renkli bir rozet gösterir (yeşil: hedefte/üstünde,
// kırmızı: hedefin altında, gri: maliyet ya da hedef marj bilinmiyor).
function checkKarMarji(i){
  const row = state.draftItems[i];
  const el = document.getElementById('di_'+i+'_fiyatFark');
  if(!row || !el) return;
  const satisFiyati = Number(row.birimFiyat)||0;
  const maliyet = getSonAlisMaliyeti(row.stokKodu);
  if(!maliyet || satisFiyati<=0){ el.innerHTML=''; return; }
  const gercekMarj = ((satisFiyati-maliyet)/maliyet)*100;
  const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(row.stokKodu||'').toUpperCase());
  const hedefMarj = u ? Number(u.KarMarji!==undefined?u.KarMarji:u.karMarji)||0 : 0;
  const altinda = hedefMarj>0 && gercekMarj < hedefMarj-0.05;
  const cls = !hedefMarj ? 'badge-primary' : (altinda ? 'badge-danger' : 'badge-success');
  const baslik = hedefMarj ? ('Hedef kâr marjı: %'+num(hedefMarj,1)+' · Maliyet: '+money(maliyet)) : ('Maliyet: '+money(maliyet)+' (hedef marj tanımlı değil — Ürün Kâr Marjı sekmesinden ekleyin)');
  el.innerHTML = '<span class="badge '+cls+'" style="font-size:10px;padding:1px 5px;white-space:nowrap;" title="'+baslik+'">Kâr %'+num(gercekMarj,1)+'</span>';
}

// Fatura girişinde Ürün Adı kutusundan çıkılınca (blur), yazılan isim
// kayıtlı hiçbir ürünle eşleşmiyorsa ("arama popover'ından SEÇİLMEDEN"
// elle yazılıp geçildiyse) sorar: hemen kaydedilsin mi? 150ms'lik
// gecikme, arama popover'ındaki bir sonucu tıklarken bu kontrolün araya
// girmemesi için — scheduleCloseUrunSearch ile aynı mantık, biraz daha
// uzun tutuldu (o kapanma tamamlandıktan SONRA kontrol etsin diye).
function checkUrunKayitliMi(i){

}
async function checkUrunKayitliMiGercek(i){
  const row = state.draftItems[i];
  if(!row) return;
  const ad = (row.urunAdi||'').trim();
  if(!ad) return;
  if(row.stokKodu && row.stokKodu.trim()) return; // zaten bir ürüne bağlı (popover'dan seçilmiş ya da elle kod girilmiş)
  const eslesenUrun = state.urunler.find(u=>String(u.Ad||u.ad||'').trim().toLocaleUpperCase('tr-TR')===ad.toLocaleUpperCase('tr-TR'));
  if(eslesenUrun) return; // tam eşleşme var, kayıtlı
  const kaydet = await evetHayirSor('"'+ad+'" adında kayıtlı bir ürün bulunamadı!\n\nŞimdi kaydetmek ister misiniz?', 'Ürün Bulunamadı');
  if(!kaydet) return;
  // Onay penceresi açıkken satır silinmiş/değiştirilmiş olabilir — hâlâ aynı durumdaysa devam et.

  if(rowNow && (rowNow.urunAdi||'').trim()===ad && !rowNow.stokKodu) openHizliUrunKayitModal(i, ad);
}
// Faturayı bırakmadan, aynı sayfada açılan hızlı ürün kayıt penceresi —
// satırda o ana kadar girilmiş fiyat/birim/KDV/indirim varsa formu

function openHizliUrunKayitModal(rowIndex, onerilenAd){

        '<div class="section-desc" style="margin-top:-6px;">Bu ürünü Ürünler listesine ekleyip bu faturaya bağlayacağız — stok kodu otomatik verilir.</div>' +
        '<div class="field"><label>Ürün Adı</label><input id="hkAd" type="text" value="'+escapeHtml(onerilenAd)+'"></div>' +
        '<div class="form-row" style="grid-template-columns:1fr 1fr;margin-top:8px;">' +
          '<div class="field"><label>Fiyat</label><input id="hkFiyat" type="number" step="any" value="'+(Number(row.birimFiyat)||'')+'"></div>' +
          '<div class="field"><label>Birim</label><input id="hkBirim" type="text" value="'+escapeHtml(row.birim||'AD')+'"></div>' +
        '</div>' +
        '<div class="form-row" style="grid-template-columns:1fr 1fr;margin-top:8px;">' +
          '<div class="field"><label>KDV %</label><input id="hkKdv" type="number" step="any" value="'+(Number(row.kdvOrani)||0)+'"></div>' +
          '<div class="field"><label>İndirim %</label><input id="hkIndirim" type="number" step="any" value="'+(Number(row.indirim)||0)+'"></div>' +
        '</div>' +
        '<div class="form-row" style="grid-template-columns:1fr 1fr;margin-top:8px;">' +
          '<div class="field"><label>Marka</label><input id="hkMarka" type="text" placeholder="opsiyonel"></div>' +
          '<div class="field"><label>Kategori</label><input id="hkKategori" type="text" list="hkKategoriList" placeholder="opsiyonel"><datalist id="hkKategoriList">'+kategoriler.map(k=>'<option value="'+escapeHtml(k)+'">').join('')+'</datalist></div>' +
        '</div>' +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Vazgeç</button>' +
          '<button class="btn btn-primary" onclick="saveHizliUrunKayit('+rowIndex+')">Kaydet ve Faturaya Ekle</button></div>' +
      '</div>' +
    '</div>';
  setTimeout(function(){ const el=document.getElementById('hkAd'); if(el){ el.focus(); el.select(); } }, 0);
}
async function saveHizliUrunKayit(rowIndex){
  const ad = document.getElementById('hkAd').value.trim();
  const fiyat = Number(document.getElementById('hkFiyat').value)||0;
  const birim = document.getElementById('hkBirim').value.trim()||'AD';
  const kdvOrani = Number(document.getElementById('hkKdv').value)||0;
  const indirim = Number(document.getElementById('hkIndirim').value)||0;
  const marka = document.getElementById('hkMarka').value.trim();
  const kategori = document.getElementById('hkKategori').value.trim();
  if(!ad){ toast('Ürün adı girin.'); return; }
  const rec = {ID:uid('U'), StokKodu:localNextStokKodu_(), Ad:ad, Fiyat:fiyat, Birim:birim, KdvOrani:kdvOrani, Indirim:indirim, Marka:marka, Kategori:kategori, Icerik:'', Satici:''};
  state.urunler.push(rec);
  await persistUrunler();
  closeModal();
  toast('Ürün eklendi: '+rec.StokKodu);
  syncOrQueue({action:'addUrun', data:{ad, fiyat, birim, kdvOrani, indirim, marka, kategori, icerik:'', satici:''}}, {entity:'urun', op:'add', localId:rec.ID});
  const row = state.draftItems[rowIndex];
  if(row){
    row.stokKodu = rec.StokKodu;
    row.urunAdi = ad;
    if(!row.birim) row.birim = birim;
    if(!row.birimFiyat) row.birimFiyat = fiyat;
    if(!row.kdvOrani) row.kdvOrani = kdvOrani;
    if(!row.indirim) row.indirim = indirim;
  }
  renderDraftRows();
}

function updateDraft(i, key, val){
  state.draftItems[i][key] = val;
  updateDraftTotals();
}
function updateDraftTotals(){
  let tutar=0, kdv=0;
  state.draftItems.forEach(row=>{
    const paket = paketMiktariOf(row.birim);
    const t = (Number(row.miktar)||0) * paket * (Number(row.birimFiyat)||0) * (1 - (Number(row.indirim)||0)/100);
    tutar += t;
    kdv += t * ((Number(row.kdvOrani)||0)/100);
  });
  const pb = (document.getElementById('gParaBirimi')||{}).value || 'TL';
  const kur = pb!=='TL' ? (Number((document.getElementById('gKur')||{}).value)||0) : 1;
  const elT = document.getElementById('gSumTutar');
  const elK = document.getElementById('gSumKdv');
  const elG = document.getElementById('gSumToplam');
  const elTL = document.getElementById('gSumToplamTL');
  if(pb==='TL'){
    if(elT) elT.textContent = money(tutar);
    if(elK) elK.textContent = money(kdv);
    if(elG) elG.textContent = money(tutar+kdv);
    if(elTL) elTL.style.display = 'none';
  } else {
    if(elT) elT.textContent = moneyDoviz(tutar, pb);
    if(elK) elK.textContent = moneyDoviz(kdv, pb);
    if(elG) elG.textContent = moneyDoviz(tutar+kdv, pb);
    if(elTL){ elTL.style.display=''; elTL.textContent = 'TL karşılığı: '+money((tutar+kdv)*kur)+' (kur: '+num(kur,4)+')'; }
  }
}
function lookupUrun(i){
  const kod = state.draftItems[i].stokKodu.trim().toUpperCase();
  const u = state.urunler.find(x => String(x.StokKodu||x.stokKodu).toUpperCase() === kod);
  if(u){
    state.draftItems[i].stokKodu = u.StokKodu||u.stokKodu;
    state.draftItems[i].urunAdi = u.Ad||u.ad;
    state.draftItems[i].birim = bfCleanBirim(u.Birim||u.birim);
    // Fiyat/KDV/İskonto kaynağı: bu ürüne ait EN SON alım kaydı varsa o esas
    // alınır (Ürün Birim Fiyatları sekmesindeki mantıkla aynı) — böylece bir
    // önceki faturada girilen (zamlı) fiyat, bir sonraki fatura girişinde
    // otomatik gelir. Hiç alım kaydı yoksa Ürünler kartındaki fiyat kullanılır.
    const sonAlim = state.alimlar
      .filter(a => String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')===faturaTuruFromTab())
      .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')))
      .pop();
    const hedefMarj = Number(u.KarMarji!==undefined?u.KarMarji:u.karMarji)||0;
    const maliyet = getSonAlisMaliyeti(kod);
    if(faturaTuruFromTab()==='Satış' && hedefMarj>0 && maliyet){
      // Kâr marjı sabit kalsın: fiyatı geçmiş satıştan değil, GÜNCEL
      // maliyet × hedef marjdan hesapla.
      state.draftItems[i].birimFiyat = Math.round(maliyet*(1+hedefMarj/100)*100)/100;
      state.draftItems[i].kdvOrani = sonAlim ? sonAlim.kdvOrani : (u.KdvOrani!==undefined?u.KdvOrani:u.kdvOrani);
      state.draftItems[i].indirim = sonAlim ? sonAlim.indirim : (u.Indirim!==undefined?u.Indirim:u.indirim)||0;
    } else if(sonAlim){
      // Birim Fiyat her zaman temel birim (ör. adet) başınadır — birim "AD"
      // ya da "KL 3000 AD" (koli) olsun fark etmez, bu yüzden doğrudan
      // kopyalanabilir; ek bir ölçekleme gerekmez.
      state.draftItems[i].birimFiyat = sonAlim.birimFiyat;
      state.draftItems[i].kdvOrani = sonAlim.kdvOrani;
      state.draftItems[i].indirim = sonAlim.indirim;
    } else {
      state.draftItems[i].kdvOrani = u.KdvOrani!==undefined ? u.KdvOrani : u.kdvOrani;
      const fiyat = u.Fiyat!==undefined ? u.Fiyat : u.fiyat;
      if(fiyat){ state.draftItems[i].birimFiyat = fiyat; }
      const indirim = u.Indirim!==undefined ? u.Indirim : u.indirim;
      state.draftItems[i].indirim = indirim || 0;
    }
    renderDraftRows();
  }
}
function addDraftRow(){ state.draftItems.push(emptyDraftRow()); renderDraftRows(); }
function removeDraftRow(i){
  if(state.draftItems.length===1){ state.draftItems=[emptyDraftRow()]; }
  else state.draftItems.splice(i,1);
  renderDraftRows();
}
function onFirmaSelectChange(){
  const sel = document.getElementById('gFirmaSelect');
  const newInp = document.getElementById('gFirmaNew');
  if(sel.value === '__new__'){
    newInp.style.display = '';
    newInp.focus();
  } else {
    newInp.style.display = 'none';
    newInp.value = '';
  }
  checkFaturaNoDuplicate();
}
function getSelectedFirma(){
  const sel = document.getElementById('gFirmaSelect');
  if(!sel) return '';
  if(sel.value === '__new__') return document.getElementById('gFirmaNew').value.trim();
  return sel.value.trim();
}
function clearDraft(){
  state.draftItems = [emptyDraftRow()];
  state.lastMukerrerPrompted = '';
  document.getElementById('gFaturaNo').value='';
  const vadeEl = document.getElementById('gVadeTarihi');
  if(vadeEl){ vadeEl.value=''; }
  const sel = document.getElementById('gFirmaSelect');
  if(sel){ sel.value=''; }
  const newInp = document.getElementById('gFirmaNew');
  if(newInp){ newInp.value=''; newInp.style.display='none'; }
  const warnEl = document.getElementById('faturaNoWarning');
  if(warnEl){ warnEl.innerHTML=''; }
  const pbEl = document.getElementById('gParaBirimi');
