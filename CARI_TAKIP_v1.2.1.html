<style>
:root{
  --paper:#FBFAF6;
  --surface:#FFFFFF;
  --ink:#1B2420;
  --muted:#6B7570;
  --faint:#8B9490;
  --line:#DFDACC;
  --line-soft:#EAE6D9;
  --primary:#145C54;
  --primary-dark:#0C3D38;
  --primary-text:var(--primary-dark);
  --primary-tint:#E3EEEB;
  --accent:#B4791E;
  --accent-tint:#F5EAD3;
  --accent-text:#7A5312;
  --danger:#A3382A;
  --danger-tint:#F5E3DF;
  --success:#2F7A4F;
  --success-tint:#E3EFE6;
  --input-bg:#FFFFFF;
  --tfoot-bg:#FAF8F2;
  --radius:6px;
  --serif:'Source Serif 4', Georgia, serif;
  --sans:'IBM Plex Sans', Arial, sans-serif;
  --mono:'IBM Plex Mono', 'Courier New', monospace;
}
/* Karanlık mod: aynı değişken adları koyu palet ile yeniden tanımlanır —
   tüm masaüstü arayüz zaten bu değişkenler üzerine kurulu olduğu için
   ayrı bir şablon gerekmez. --primary-text/--accent-text AYRI tutulur:
   --primary-dark/sabit vurgu renkleri kenar çubuğu ve degrade kartlarda
   olduğu gibi KOYU kalmaya devam etmeli (marka rengi), ama aynı renk metin
   olarak koyu bir kart/sayfa üzerinde kullanıldığında (rozetler, linkler,
   başlıklar) karanlık modda okunaksız hale geliyordu — bu ikisi için ayrı,
   açık tonlu bir "okunabilir metin" rengi tanımlanır. */
body.dark-mode{
  --paper:#14181A;
  --surface:#1E2523;
  --ink:#E8E9E4;
  --muted:#9AA6A0;
  --faint:#6E7975;
  --line:#333B37;
  --line-soft:#2A302C;
  --primary:#2E8C7F;
  --primary-dark:#0C3D38;
  --primary-text:#5FC2AE;
  --primary-tint:#193430;
  --accent:#D6973B;
  --accent-tint:#332714;
  --accent-text:#E8B368;
  --danger:#E0574A;
  --danger-tint:#3A211D;
  --success:#4FAE78;
  --success-tint:#17301F;
  --input-bg:#20272A;
  --tfoot-bg:#242B27;
}
body.dark-mode .m-app{ color:var(--ink); }
body.dark-mode .m-card{ background:var(--surface); border-color:var(--line); color:var(--ink); }
body.dark-mode .m-app input, body.dark-mode .m-app select, body.dark-mode .m-app textarea,
body.dark-mode .m-app button, body.dark-mode #m-dock, body.dark-mode #m-camera .m-camera-box{
  background:var(--surface); color:var(--ink); border-color:var(--line);
}
body.dark-mode .m-app button.m-primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
body.dark-mode .m-app .m-pill, body.dark-mode .m-note{ background:var(--primary-tint); color:var(--ink); }
/* Karanlık modda tarayıcının varsayılan (açık gri) kaydırma çubuğu koyu
   arayüzün üzerinde göz yoruyordu — koyu temaya uygun kaydırma çubuğu. */
body.dark-mode{ scrollbar-color: var(--line) var(--paper); scrollbar-width: thin; }
body.dark-mode ::-webkit-scrollbar{ width:12px; height:12px; }
body.dark-mode ::-webkit-scrollbar-track{ background:var(--paper); }
body.dark-mode ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; border:2px solid var(--paper); }
body.dark-mode ::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--sans);}
input,select{font-family:var(--sans);}
::selection{background:var(--primary-tint);}

.shell{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px; flex:0 0 230px;
  background:var(--primary-dark);
  color:#EFEAE0;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:26px 22px 20px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.brand-mark{
  font-family:var(--serif); font-weight:600; font-size:21px; color:#fff; line-height:1.2;
}
.brand-sub{
  font-size:11.5px; color:#B7CFC9; margin-top:4px; letter-spacing:.01em;
}
.nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:5px; cursor:pointer;
  font-size:14px; color:#CFE3DE; border:none; background:transparent; text-align:left; width:100%;
  text-transform:uppercase; letter-spacing:0.3px;
}
.nav-item:hover{ background:rgba(255,255,255,0.07); color:#fff; }
.nav-item.active{ background:#1D6E64; color:#fff; font-weight:500; }
.nav-dot{ width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto; }
.nav-caret{ margin-left:auto; font-size:10px; opacity:.7; flex:0 0 auto; }
.nav-badge{ margin-left:auto; background:var(--danger); color:#fff; border-radius:999px; padding:1px 7px; font-size:11px; font-weight:700; flex:0 0 auto; }
.nav-subgroup{ display:flex; flex-direction:column; gap:2px; margin:2px 0 4px; }
.nav-subitem{ padding-left:30px; font-size:13px; }
.nav-subitem .nav-dot{ width:4px; height:4px; }
.sidebar-foot{
  padding:14px 22px 18px; font-size:11px; color:#8FB1AA; border-top:1px solid rgba(255,255,255,0.1);
}
.conn-pill{ display:inline-flex; align-items:center; gap:6px; }
.conn-dot{ width:7px; height:7px; border-radius:50%; background:#D3D0C3; }
.conn-dot.on{ background:#7FD9A8; }
.conn-dot.off{ background:#E2A98F; }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  height:60px; flex:0 0 60px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 30px; border-bottom:1px solid var(--line);
  background:var(--paper);
}
.topbar h1{
  font-family:var(--serif); font-weight:600; font-size:20px; margin:0; color:var(--ink);
}
.topbar-left{ display:flex; align-items:center; gap:14px; min-width:0; }
.topbar-nav{ display:flex; gap:4px; flex:0 0 auto; }
.topbar-nav .btn{ padding:4px 9px; font-size:13px; line-height:1; }
.topbar-nav .btn:disabled{ opacity:.35; cursor:default; }
.topbar-right{ display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--muted); }

.content{ padding:26px 34px 60px; max-width:1680px; }

/* ---------- Generic components ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:18px 20px;
}
.grid{ display:grid; gap:14px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
@media(max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }

.metric{ display:flex; flex-direction:column; gap:6px; }
.metric-label{ font-size:12.5px; color:var(--muted); }
.metric-value{ font-family:var(--mono); font-size:23px; font-weight:600; color:var(--ink); }
.metric-sub{ font-size:11.5px; color:var(--faint); }

h2.section-title{
  font-family:var(--serif); font-weight:600; font-size:17px; margin:30px 0 12px; color:var(--ink);
}
h2.section-title:first-child{ margin-top:0; }
.section-desc{ font-size:13px; color:var(--muted); margin:-6px 0 14px; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{
  text-align:left; font-weight:500; color:var(--muted); font-size:12px;
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{ padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
.num{ font-family:var(--mono); text-align:right; white-space:nowrap; }
th.num{ text-align:right; }
.tbl-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
.tbl-wrap table{ min-width:640px; }
tfoot td{ font-weight:600; border-top:2px solid var(--line); border-bottom:none; background:var(--tfoot-bg); }

.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 15px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:13px; cursor:pointer;
}
.btn:hover{ border-color:var(--primary); }
.btn-primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); }
.btn-danger{ color:var(--danger); }
.btn-danger-fill{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-danger-fill:hover{ background:#8a2c20; }
#ehEvetBtn:focus, #ehHayirBtn:focus{ outline:none; box-shadow:0 0 0 3px rgba(0,0,0,.15); transform:scale(1.05); }
.btn-info-fill{ background:#2B5F8A; border-color:#2B5F8A; color:#fff; }
.btn-info-fill:hover{ background:#1F476B; }
.btn-warning-fill{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-warning-fill:hover{ background:#8F5C15; }
.tbl-green-head th{ background:var(--primary); color:#fff; text-transform:uppercase; letter-spacing:0.3px; }
.btn-sm{ padding:5px 10px; font-size:12px; }
.btn-ghost{ border-color:transparent; background:transparent; }

label{ font-size:12.5px; color:var(--muted); display:block; margin-bottom:4px; }
input[type=text],input[type=number],input[type=date],select{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  font-size:13.5px; background:var(--input-bg); color:var(--ink);
}
input:focus,select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint); }
.field{ margin-bottom:12px; }

/* Ürün Sorgula — özel açılır arama listesi (native datalist yerine) */
.autocomplete-wrap{ position:relative; }
.autocomplete-list{
  position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:60;
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  max-height:320px; overflow-y:auto; box-shadow:0 14px 34px -14px rgba(20,40,35,.28);
}
.autocomplete-item{ padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft); }
.autocomplete-item:last-child{ border-bottom:none; }
.autocomplete-item:hover{ background:var(--primary-tint); }
.autocomplete-item .ac-name{ font-size:13.5px; color:var(--ink); font-weight:500; }
.autocomplete-item .ac-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
.autocomplete-more{ padding:8px 12px; font-size:12px; color:var(--muted); font-style:italic; }

/* Cari Borç Bakiye — kredi limiti kullanım çubuğu */
.limit-bar-wrap{ min-width:110px; }
.limit-bar-track{ background:var(--line-soft); border-radius:5px; height:7px; overflow:hidden; }
.limit-bar-fill{ height:100%; border-radius:5px; background:var(--primary); transition:width .2s ease; }
.limit-bar-fill.over{ background:var(--danger); }
.limit-bar-fill.warn{ background:var(--accent); }
.limit-bar-label{ font-size:10.5px; color:var(--muted); margin-top:2px; }
.form-row{ display:grid; gap:12px; }

.badge{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:500; }
.badge-primary{ background:var(--primary-tint); color:var(--primary-text); }
.badge-accent{ background:var(--accent-tint); color:var(--accent-text); }
.badge-danger{ background:var(--danger-tint); color:var(--danger); }
.badge-success{ background:var(--success-tint); color:var(--success); }

/* Talep durumu — modern durum kartları (yönetici + depocu, masaüstü) */
.talep-status-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
.talep-status-card{
  position:relative; border-radius:14px; padding:16px 16px 14px; background:var(--surface);
  border:1px solid var(--line-soft); overflow:hidden; cursor:default;
}
.talep-status-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:5px; }
.talep-status-card .ts-label{ font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.talep-status-card .ts-count{ font-family:var(--serif); font-size:30px; font-weight:600; margin:4px 0 2px; line-height:1; }
.talep-status-card.ts-clickable{ cursor:pointer; transition:transform .1s ease, box-shadow .15s ease; }
.talep-status-card.ts-clickable:hover{ transform:translateY(-1px); box-shadow:0 4px 14px rgba(20,40,35,.08); }
.talep-status-card.st-bekliyor::before{ background:var(--accent); }
.talep-status-card.st-bekliyor{ background:var(--accent-tint); }
.talep-status-card.st-onaylandi::before{ background:var(--primary); }
.talep-status-card.st-onaylandi{ background:var(--primary-tint); }
.talep-status-card.st-faturalandi::before{ background:var(--success); }
.talep-status-card.st-faturalandi{ background:var(--success-tint); }
.talep-status-card.st-iptal::before{ background:var(--danger); }
.talep-status-card.st-iptal{ background:var(--danger-tint); }

.banner{
  padding:11px 16px; border-radius:8px; font-size:13px; margin-bottom:18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.banner-warn{ background:var(--accent-tint); color:var(--accent-text); border:1px solid var(--accent); }
.banner-ok{ background:var(--success-tint); color:var(--success); border:1px solid var(--success); }
.banner-err{ background:var(--danger-tint); color:var(--danger); border:1px solid var(--danger); }

.toast-wrap{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast{
  background:var(--ink); color:#fff; padding:10px 16px; border-radius:6px; font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,0.18);
}

.item-row{ display:grid; grid-template-columns:0.85fr 2.3fr 0.55fr 0.5fr 0.75fr 0.55fr 0.6fr 0.85fr 34px; gap:8px; align-items:end; margin-bottom:8px; }
.item-row .ro{ font-size:13px; padding:8px 4px; color:var(--muted); }
@media(max-width:1050px){ .item-row{ grid-template-columns:repeat(2,1fr); } }

.chart-bars{ display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:10px; }
.chart-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.chart-bar{ width:100%; background:var(--primary); border-radius:3px 3px 0 0; min-height:2px; }
.chart-bar-label{ font-size:10.5px; color:var(--muted); text-align:center; }
.hbar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.hbar-label{ width:150px; font-size:12.5px; color:var(--ink); flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbar-track{ flex:1; background:var(--line-soft); border-radius:4px; height:9px; overflow:hidden; }
.hbar-fill{ height:100%; background:var(--accent); border-radius:4px; }

/* Pasta/donut grafik — ek kütüphane gerektirmez, conic-gradient ile çizilir */
.donut-wrap{ display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
.donut-chart{ width:150px; height:150px; border-radius:50%; position:relative; flex:0 0 auto; }
.donut-hole{ position:absolute; inset:20px; background:var(--surface); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.donut-total{ font-family:var(--mono); font-weight:600; font-size:13px; color:var(--ink); }
.donut-total-label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.donut-legend{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:7px; font-size:13px; min-width:180px; }
.donut-legend li{ display:flex; align-items:center; gap:8px; color:var(--ink); }
.donut-legend li b{ margin-left:auto; font-family:var(--mono); font-weight:600; }
.donut-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.hbar-val{ width:100px; font-family:var(--mono); font-size:12px; text-align:right; flex:0 0 auto; }

.empty{ padding:34px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
.empty b{ display:block; color:var(--ink); font-size:14.5px; font-family:var(--serif); margin-bottom:4px; font-weight:600; }

.tabs2{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); }
.tab2{ padding:8px 4px; margin-right:14px; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
.tab2.active{ color:var(--primary-text); border-bottom-color:var(--primary); font-weight:500; }

.hint{ font-size:12px; color:var(--faint); margin-top:4px; }
.kv{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
.kv:last-child{ border-bottom:none; }
code.inline{ background:var(--line-soft); color:var(--ink); padding:2px 6px; border-radius:4px; font-family:var(--mono); font-size:12.5px; }
a{ color:var(--primary-text); }

.modal-backdrop{ position:fixed; inset:0; background:rgba(20,16,5,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal-box{ background:var(--surface); color:var(--ink); border-radius:12px; max-width:640px; width:100%; max-height:88vh; overflow-y:auto; padding:22px; box-shadow:0 30px 80px -30px rgba(0,0,0,0.5); }
.search-popover{
  position:fixed; z-index:90; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 14px 34px -12px rgba(30,24,8,0.35); max-height:280px; overflow-y:auto; font-size:13px;
}
.search-popover-item{ display:flex; gap:10px; align-items:baseline; padding:7px 10px; cursor:pointer; border-bottom:1px solid var(--line-soft); }
.search-popover-item:last-child{ border-bottom:none; }
.search-popover-item.active, .search-popover-item:hover{ background:var(--primary-tint); }
.search-popover-item .sp-kod{ font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; flex:none; }
.search-popover-item .sp-ad{ flex:1; }
.search-popover-empty{ padding:10px 12px; color:var(--muted); font-size:13px; }

/* Ürün sağ-tık menüsü (Fatura Girişi kalemlerinde) */
.ctx-menu{
  position:fixed; z-index:95; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 14px 34px -12px rgba(30,24,8,0.35); min-width:220px; padding:6px; font-size:13.5px;
}
.ctx-menu-title{ padding:6px 10px 8px; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line-soft); margin-bottom:4px; }
.ctx-menu-item{ padding:8px 10px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:9px; color:var(--ink); }
.ctx-menu-item:hover{ background:var(--primary-tint); }
.ctx-menu-item .ci-icon{ flex:0 0 auto; width:18px; text-align:center; }
.ctx-menu-sep{ height:1px; background:var(--line-soft); margin:4px 2px; }
.modal-box h3{ margin:0 0 16px; font-family:var(--serif); font-size:18px; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.th-cell{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.th-cell.num-head{ justify-content:flex-end; }
.th-filter-btn{ background:none; border:none; cursor:pointer; color:var(--muted); font-size:11px; padding:2px 5px; border-radius:4px; line-height:1; }
.th-filter-btn:hover{ background:var(--line-soft); color:var(--ink); }
.th-filter-btn.filter-active{ color:var(--accent); font-weight:700; }
.filter-item{ display:block; padding:4px 4px; font-size:13px; cursor:pointer; border-radius:4px; }
.filter-item:hover{ background:var(--line-soft); }
.filter-search{ width:100%; margin-bottom:10px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
.sync-bulb{ display:inline-flex; flex-direction:column; align-items:flex-start; gap:1px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:5px 12px 6px 9px; font-size:12.5px; color:var(--muted); user-select:none; }
.sync-bulb-row{ display:flex; align-items:center; gap:7px; }
.sync-bulb-time{ font-size:10.5px; color:var(--faint); padding-left:17px; }
.sync-bulb-dot{ width:10px; height:10px; border-radius:50%; background:#C7C7C7; box-shadow:0 0 0 3px rgba(0,0,0,0.04); transition:background .2s ease, box-shadow .2s ease; flex:none; }
.sync-bulb-dot.green{ background:#2E9E5B; box-shadow:0 0 7px 2px rgba(46,158,91,0.55); }
.sync-bulb-dot.red{ background:#D64545; box-shadow:0 0 7px 2px rgba(214,69,69,0.55); }
.sync-bulb-dot.pulse{ animation:syncPulse 1.7s ease; }
@keyframes syncPulse{
  0%{ box-shadow:0 0 0 3px rgba(46,158,91,0.55); }
  30%{ box-shadow:0 0 0 9px rgba(46,158,91,0.28); }
  100%{ box-shadow:0 0 7px 2px rgba(46,158,91,0.55); }
}
.user-pill{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; margin-bottom:8px; background:rgba(255,255,255,0.06); border-radius:6px; font-size:12.5px; color:#EFEAE0; }
.user-pill .who{ display:flex; flex-direction:column; }
.user-pill .who b{ font-size:13px; }
.user-pill .who span{ font-size:11px; color:#B7CFC9; }
.user-pill button{ background:transparent; border:1px solid rgba(255,255,255,0.25); color:#EFEAE0; border-radius:5px; padding:4px 8px; font-size:11px; cursor:pointer; }
.user-pill button:hover{ background:rgba(255,255,255,0.12); }
.login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper); }
.login-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:30px 28px; box-shadow:0 30px 80px -30px rgba(30,24,8,0.25); }
.login-card h1{ font-family:var(--serif); font-size:20px; margin:0 0 4px; color:var(--primary-text); }
.login-card .sub{ font-size:13px; color:var(--muted); margin-bottom:22px; }
.login-card .field{ margin-bottom:14px; }
.login-card label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
.login-card select, .login-card input{ width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
.login-error{ color:var(--danger); font-size:13px; margin:-6px 0 14px; }
.talep-oneri-urun{ margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line-soft); }
.talep-firma-pills{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.talep-firma-pill{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer; text-align:left; font-family:inherit; }
.talep-firma-pill:hover{ background:var(--primary-tint); }
.talep-firma-pill.son{ border-color:var(--success); }
.talep-firma-pill .tfp-detay{ font-size:11.5px; color:var(--muted); white-space:nowrap; }

/* ---------- Profesyonel Reçete Modülü ---------- */
.recipe-toolbar{display:flex;gap:10px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;}
.recipe-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.recipe-kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;}
.recipe-kpi .rk-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.45px;}
.recipe-kpi .rk-value{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:5px;}
.recipe-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.7fr);gap:18px;align-items:start;}
.recipe-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;}
.recipe-panel-title{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 14px;}
.recipe-cost-box{position:sticky;top:78px;}
.recipe-cost-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.recipe-cost-row strong{font-family:var(--mono);font-weight:600;}
.recipe-cost-total{font-size:15px;border-top:2px solid var(--primary);margin-top:5px;padding-top:11px;}
.recipe-cost-total strong{font-size:18px;color:var(--primary-text);}
.recipe-ing-head,.recipe-ing-row{display:grid;grid-template-columns:2.25fr .7fr .65fr .65fr .75fr .75fr .85fr 38px;gap:7px;align-items:center;}
.recipe-ing-head{font-size:11.5px;color:var(--muted);padding:0 2px 6px;}
.recipe-ing-row{margin-bottom:7px;}
.recipe-ing-row input,.recipe-ing-row select{padding:7px 8px;}
.recipe-money{font-family:var(--mono);font-size:12.5px;text-align:right;padding-right:4px;}
.recipe-warning{font-size:11px;color:var(--accent);margin-top:2px;}
.recipe-card-title{font-weight:600;}
.recipe-code{font-family:var(--mono);font-size:11px;color:var(--muted);}
.recipe-status-good{color:var(--success);font-weight:600;}
.recipe-status-warn{color:var(--accent);font-weight:600;}
.recipe-status-bad{color:var(--danger);font-weight:600;}
.recipe-form-grid{display:grid;grid-template-columns:1.4fr .8fr .8fr .7fr;gap:10px;}

function rolKaydiBul(rolAdi){

// Bir sekmeyi görüntüleyebilir mi? (Sol menüde görünür/görünmez olmasını belirler)
function tabAllowedForRole(tabKey, rol){
  if(tabKey==='pano') return true; // pano herkese açık
  if(tabKey==='ayarlar') return true; // herkese açık — ama içeriği role göre kısıtlı (bkz. viewAyarlar)
  if(tabKey==='kullanicilar') return rol==='yonetici'; // hep sadece yönetici
  if(rol==='yonetici') return true;
  const rolKaydi = rolKaydiBul(rol);
  if(!rolKaydi) return false;
  const izinler = parseIzinler(rolKaydi);
  return !!(izinler[tabKey] && izinler[tabKey].view);

function canDo(tabKey, action){
  if(!state.currentUser) return false;
  const rol = state.currentUser.Rol||state.currentUser.rol;
  if(rol==='yonetici') return true;
  if(tabKey==='kullanicilar' || tabKey==='ayarlar') return false;
  const rolKaydi = rolKaydiBul(rol);
  if(!rolKaydi) return false;
  const izinler = parseIzinler(rolKaydi);
  const tabIzin = izinler[tabKey];
  if(!tabIzin || !tabIzin.view) return false;
  if(!action || action==='view') return true;
  return !!tabIzin[action];

/* =========================================================
   FORMAT / DATE HELPERS
========================================================= */
function money(n){
  n = Number(n)||0;
  return n.toLocaleString('tr-TR',{minimumFractionDigits:0, maximumFractionDigits:2}) + ' TL';
}
function num(n, d){
  n = Number(n)||0;
  return n.toLocaleString('tr-TR',{minimumFractionDigits:d===undefined?0:d, maximumFractionDigits:d===undefined?2:d});
}
// ÖNEMLİ: toISOString() UTC kullanır — Kıbrıs/Türkiye saatinde (UTC+3)
// akşam/gece saatlerinde UTC hâlâ BİR ÖNCEKİ günde olduğu için, eski hâliyle
// "Bugün" hesaplamaları o gün girilen faturaları KAÇIRIYORDU. Yerel tarih
// bileşenleri (getFullYear/getMonth/getDate) kullanılarak düzeltildi.
function dateToLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayISO(){ return dateToLocalISO(new Date()); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function startOfWeek(d){
  const dt = new Date(d); const day = (dt.getDay()+6)%7; // Monday=0
  dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt;
}
function isoWeekKey(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThu = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt-firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
  return dt.getUTCFullYear()+'-W'+String(week).padStart(2,'0');
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}
function daysAgoISO(n){
  const d = new Date(); d.setDate(d.getDate()-n); return dateToLocalISO(d);
}

/* =========================================================
   DEPOLAMA KATMANI (yerel — e-tablo/sunucu YOK)
   Öncelik sırası: Claude window.storage > IndexedDB > localStorage

function hasClaudeStorage(){
  return (
    typeof window.storage !== 'undefined' &&
    window.storage &&
    typeof window.storage.set === 'function'
  );
}

var IDB_DB_NAME = 'alim-defteri-db';
var IDB_STORE_NAME = 'kv';
var idbOpenPromise = null;

function openIdb(){
  if(idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise(function(resolve, reject){
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB desteklenmiyor')); return; }
    var req = indexedDB.open(IDB_DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE_NAME)) db.createObjectStore(IDB_STORE_NAME);
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error); };
  });
  return idbOpenPromise;
}
function idbSet(key, value){
  return openIdb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE_NAME, 'readwrite');
      tx.objectStore(IDB_STORE_NAME).put(value, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return openIdb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE_NAME, 'readonly');
      var req = tx.objectStore(IDB_STORE_NAME).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbDelete(key){
  return openIdb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE_NAME, 'readwrite');
      tx.objectStore(IDB_STORE_NAME).delete(key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error); };
    });
  });
}
/* =========================================================
   CİHAZ ŞİFRELEMESİ (isteğe bağlı "ultra güvenlik" katmanı)
   Tarayıcının kendi Web Crypto API'si ile GERÇEK AES-256-GCM şifreleme —
   sahte/kozmetik değil. Etkinleştirildiğinde, bu cihazdaki yerel depoya
   (localStorage/IndexedDB) yazılan TÜM işletme verisi (fatura, cari,
   ürün, kullanıcı/PIN vb.) şifreli olarak saklanır. Bulut adresi/anahtarı
   ve genel ayarlar BİLEREK şifrelenmez — şifreyi unutursanız bile buluta
   yeniden bağlanıp verinizi geri çekebilesiniz diye (aksi halde şifre
   unutulunca hem yerel hem de "nasıl bağlanılır" bilgisi kaybolurdu).
   ŞİFRE UNUTULURSA yerel şifreli veri KURTARILAMAZ — bu, gerçek
   şifrelemenin doğasıdır; arka kapı yoktur.
========================================================= */
var CIHAZ_SIFRE_DUZ_ANAHTARLAR = new Set(['apiUrl','apiKey','companyName','currentUserId','urunAyarlari','tema','syncMode','cihazSifreliMi','cihazSifreSalt','cihazSifreDogrulama','baglantiModu','bulutKayitliUrl','bulutKayitliKey','yerelKayitliUrl','yerelKayitliKey','guncellemeUrl','yerelSunucuAcikMi']);
var CIHAZ_SIFRE_DOGRULAMA_SABITI = 'CIHAZ-SIFRESI-DOGRU-v1';
function b64Encode(bytes){ let s=''; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function b64Decode(str){ const s=atob(str); const bytes=new Uint8Array(s.length); for(let i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i); return bytes; }
async function cihazAnahtariTuret(sifre, saltB64){
  const enc = new TextEncoder();
  const salt = b64Decode(saltB64);
  const temelAnahtar = await crypto.subtle.importKey('raw', enc.encode(sifre), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    temelAnahtar,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}
async function cihazVeriSifrele(anahtar, duzMetin){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const sifreliBuffer = await crypto.subtle.encrypt({name:'AES-GCM', iv}, anahtar, enc.encode(duzMetin));
  return JSON.stringify({iv:b64Encode(iv), veri:b64Encode(new Uint8Array(sifreliBuffer))});
}
async function cihazVeriCoz(anahtar, zarfStr){
  const zarf = JSON.parse(zarfStr);
  const iv = b64Decode(zarf.iv);
  const veriBuf = b64Decode(zarf.veri);
  const duzBuffer = await crypto.subtle.decrypt({name:'AES-GCM', iv}, anahtar, veriBuf);
  return new TextDecoder().decode(duzBuffer);
}
async function storageRemove(key){
  if(hasClaudeStorage()){ try{ await window.storage.delete(key, false); }catch(e){} }
  try{ await idbDelete(key); }catch(e){}
  try{ window.localStorage.removeItem(key); }catch(e){}
}
function anahtarSifrelenmeyecekMi(key){
  for(const adKey in STORAGE_KEYS){ if(STORAGE_KEYS[adKey]===key && CIHAZ_SIFRE_DUZ_ANAHTARLAR.has(adKey)) return true; }
  return false;
}
async function storageSet(key, json){
  let veri = json;
  if(state.__cihazSifreAnahtari && !anahtarSifrelenmeyecekMi(key)){
    try{ veri = await cihazVeriSifrele(state.__cihazSifreAnahtari, json); }
    catch(e){ console.error('Cihaz şifreleme hatası', key, e); return false; }
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, veri, false); return true; }
    catch(e){ console.error('claude storage set failed', key, e); }
  }
  try{ await idbSet(key, veri); return true; }
  catch(e){ console.error('indexedDB set failed', key, e); }
  try{ window.localStorage.setItem(key, veri); return true; }
  catch(e){ console.error('localStorage set failed', key, e); return false; }
}
async function storageGet(key){
  let ham = null;
  if(hasClaudeStorage()){
    try{ var stored = await window.storage.get(key, false); if(stored && stored.value) ham = stored.value; }
    catch(e){}
  }
  if(ham===null){ try{ var idbVal = await idbGet(key); if(idbVal) ham = idbVal; }catch(e){} }
  if(ham===null){ try{ ham = window.localStorage.getItem(key); }catch(e){ ham = null; } }
  if(ham!==null && state.__cihazSifreAnahtari && !anahtarSifrelenmeyecekMi(key)){
    try{ return await cihazVeriCoz(state.__cihazSifreAnahtari, ham); }
    catch(e){ console.error('Cihaz şifre çözme hatası', key, e); return null; }
  }
  return ham;
}

/* =========================================================
   BULUT SENKRONİZASYONU (Google Apps Script — opsiyonel)
   Yerel depolama HER ZAMAN birincil kaynaktır — ekrana yazılan veri
   asla ağ isteği beklemez. Bir bulut adresi bağlıysa, her kayıt
   işleminden SONRA, arka planda ve engellemeden (fire-and-forget)
   Google E-Tablo'ya da yazılır. Sayfa her açıldığında buluttaki veri
   yerel veriyi EZMEZ — bu sadece "Bağlan" / "Şimdi senkronize et"
   butonlarına kasıtlı olarak basıldığında, tek seferlik ve bilerek olur.

   OFFLİNE KUYRUK: internet/bulut yokken yapılan ekleme/güncelleme/
   silme işlemleri state.pendingOps'a ve oradan yerel depoya
   kaydedilir. Bağlantı her yeniden kurulduğunda (otomatik ping
   başarılı olduğunda VEYA "Bağlan"/"Buluttan veri çek" ile), buluttan
   veri ÇEKİLMEDEN ÖNCE bu kuyruk buluta GÖNDERİLİR — böylece offline
   yapılan değişiklikler bir sonraki senkronizasyonda üzerine
   yazılıp kaybolmaz.
========================================================= */
async function apiGet(action){
  if(state.baglantiModu==='ikisiBirden') return await apiGetIkisiBirden(action);
  // cache:'no-store' + zaman damgası: tarayıcı bu isteği ÖNBELLEĞE ALIP
  // eski (güncellenmemiş) veriyi tekrar tekrar döndürmesin diye — özellikle
  // her birkaç saniyede bir aynı adrese gidildiğinde bazı tarayıcılar bunu
  // önbellekten cevaplayabiliyor ve yeni eklenen kayıtlar (ör. ödemeler)
  // bir süre "yokmuş" gibi görünebiliyor.
  const cihaz = state.__cihazKimligi || {};
  const url = state.apiUrl + (state.apiUrl.includes('?') ? '&' : '?') + 'action=' + action + '&key=' + encodeURIComponent(state.apiKey||'') +
    '&deviceId=' + encodeURIComponent(cihaz.deviceId||'') + '&deviceName=' + encodeURIComponent(cihaz.hostname||'') + '&_ts=' + Date.now();
  const res = await fetch(url, {method:'GET', cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const veri = await res.json();
  bulutAnahtariniIsleGerekirse(veri);
  cihazDurumunuIsle(veri);
  return veri;
}
async function apiPost(payload){
  if(state.baglantiModu==='ikisiBirden') return await apiPostIkisiBirden(payload);
  const cihaz = state.__cihazKimligi || {};
  const res = await fetch(state.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({}, payload, {key: state.apiKey||'', deviceId:cihaz.deviceId||'', deviceName:cihaz.hostname||''}))
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const veri = await res.json();
  bulutAnahtariniIsleGerekirse(veri);
  cihazDurumunuIsle(veri);
  return veri;
}
// ---- İKİSİ BİRDEN (gerçek iki yönlü senkron) ----
// Her istek HEM buluta HEM yerel ağa (varsa) paralel olarak gönderilir.
// Her hedef kendi anahtarını bağımsız yönetir (ilk bağlantıda ayrı ayrı
// üretilebilir). Bir hedef o an erişilemezse (kapalı/offline), DİĞERİ
// yine de işlenir — hiçbiri diğerini bekletmez ya da engellemez.
async function ikiliHedefGetir(){
  return [
    {ad:'bulut', url:state.bulutKayitliUrl, key:state.bulutKayitliKey},
    {ad:'yerel', url:state.yerelKayitliUrl, key:state.yerelKayitliKey}
  ].filter(h=>h.url);
}
async function ikiliProfilAnahtariGuncelle(profilAdi, yeniAnahtar){
  if(profilAdi==='bulut'){ state.bulutKayitliKey = yeniAnahtar; await storageSet(STORAGE_KEYS.bulutKayitliKey, yeniAnahtar); }
  else { state.yerelKayitliKey = yeniAnahtar; await storageSet(STORAGE_KEYS.yerelKayitliKey, yeniAnahtar); }
  state.yeniApiAnahtariGosterilecek = true;
  if(!isUserBusyWithForm()) renderContent();
}
async function apiGetIkisiBirden(action){
  const cihaz = state.__cihazKimligi || {};
  const hedefler = await ikiliHedefGetir();
  const sonuclar = await Promise.all(hedefler.map(async h=>{
    try{
      const url = h.url + (h.url.includes('?') ? '&' : '?') + 'action=' + action + '&key=' + encodeURIComponent(h.key||'') +
        '&deviceId=' + encodeURIComponent(cihaz.deviceId||'') + '&deviceName=' + encodeURIComponent(cihaz.hostname||'') + '&_ts=' + Date.now();
      const res = await fetch(url, {method:'GET', cache:'no-store'});
      if(!res.ok) return null;
      const veri = await res.json();
      if(veri && veri.apiKey && veri.apiKey!==h.key) await ikiliProfilAnahtariGuncelle(h.ad, veri.apiKey);
      return {ad:h.ad, veri};
    }catch(e){ return null; }
  }));
  const bulutSonuc = sonuclar.find(s=>s && s.ad==='bulut');
  const yerelSonuc = sonuclar.find(s=>s && s.ad==='yerel');
  const birlesik = ikiKaynagiBirlestir(bulutSonuc?bulutSonuc.veri:null, yerelSonuc?yerelSonuc.veri:null);
  cihazDurumunuIsle(birlesik);
  return birlesik;
}
async function apiPostIkisiBirden(payload){
  const cihaz = state.__cihazKimligi || {};
  const hedefler = await ikiliHedefGetir();
  const sonuclar = await Promise.all(hedefler.map(async h=>{
    try{
      const res = await fetch(h.url, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({}, payload, {key:h.key||'', deviceId:cihaz.deviceId||'', deviceName:cihaz.hostname||''}))
      });
      if(!res.ok) return null;
      const veri = await res.json();
      if(veri && veri.apiKey && veri.apiKey!==h.key) await ikiliProfilAnahtariGuncelle(h.ad, veri.apiKey);
      return {ad:h.ad, veri};
    }catch(e){ return null; }
  }));
  const bulutSonuc = sonuclar.find(s=>s && s.ad==='bulut');
  const yerelSonuc = sonuclar.find(s=>s && s.ad==='yerel');
  if(hedefler.length>0 && !bulutSonuc && !yerelSonuc){
    throw new Error('Hiçbir hedefe ulaşılamadı (bulut ve yerel ağ ikisi de erişilemez durumda).');
  }
  const birlesik = ikiKaynagiBirlestir(bulutSonuc?bulutSonuc.veri:null, yerelSonuc?yerelSonuc.veri:null);
  cihazDurumunuIsle(birlesik);
  return birlesik;
}
// İki kaynağın (bulut + yerel ağ) cevaplarını TEK bir cevaba birleştirir.
// Liste alanları (diziler) ID bazında birleştirilir; ÇAKIŞAN kayıtlarda
// (aynı ID, farklı içerik) YEREL AĞ sürümü esas alınır. Cihaz bilgisi
// (cihazlar/buCihaz) sadece yerel ağ sunucusunda anlamlı olduğu için
// doğrudan ondan alınır.
function ikiKaynagiBirlestir(bulutVeri, yerelVeri){
  if(!bulutVeri && !yerelVeri) return {ok:false, error:'Hiçbir hedefe ulaşılamadı.'};
  if(!bulutVeri) return yerelVeri;
  if(!yerelVeri) return bulutVeri;
  const sonuc = Object.assign({}, bulutVeri);
  for(const anahtar of Object.keys(yerelVeri)){
    if(anahtar==='apiKey') continue; // her hedefin kendi anahtarı ayrı yönetilir, burada karışmasın
    if(Array.isArray(yerelVeri[anahtar])){
      const bulutDizi = Array.isArray(bulutVeri[anahtar]) ? bulutVeri[anahtar] : [];
      sonuc[anahtar] = mergeByIdKeepLocalOnly(bulutDizi, yerelVeri[anahtar]);
    } else if(anahtar==='cihazlar' || anahtar==='buCihaz'){
      sonuc[anahtar] = yerelVeri[anahtar];
    } else if(yerelVeri[anahtar]!==undefined && anahtar!=='ok'){
      sonuc[anahtar] = yerelVeri[anahtar];
    }
  }
  sonuc.ok = !!(bulutVeri.ok || yerelVeri.ok);
  return sonuc;
}
// Yerel ağ sunucusu, HER cevapta "bu cihazın" onay durumunu (bekliyor/
// onaylandı/reddedildi) ve (varsa) tam cihaz listesini geri gönderir.
// Kod.gs (bulut) bu alanları hiç göndermez, bu yüzden bulut modunda bu
// fonksiyon sessizce hiçbir şey yapmaz.
function cihazDurumunuIsle(veri){
  if(!veri) return;
  if(veri.buCihaz !== undefined){ state.buCihazDurumu = veri.buCihaz; storageSet(STORAGE_KEYS.buCihazDurumu, JSON.stringify(veri.buCihaz)); }
  if(Array.isArray(veri.cihazlar)){ state.cihazlar = veri.cihazlar; storageSet(STORAGE_KEYS.cihazlarListesi, JSON.stringify(veri.cihazlar)); }
}
// Sistem geneli ayarları (şu an sadece güncelleme adresi) işler — yönetici
// bunu bir cihazda ayarladığında, TÜM diğer cihazlar bir sonraki
// senkronda bunu otomatik alır; elle girmelerine gerek kalmaz.
function sistemAyarlariniIsle(data){
  if(!data || !Array.isArray(data.sistemAyarlari)) return;
  const guncellemeAyari = data.sistemAyarlari.find(x=>(x.Anahtar||x.anahtar)==='guncellemeUrl');
  if(guncellemeAyari){

async function sendHeartbeatIfDue(){

var DENETIM_VARLIK_ETIKETLERI = {
  alim:'Alım/Satış Faturası', firma:'Cari Hesap', urun:'Ürün', odeme:'Ödeme/Tahsilat', iade:'İade',

// Bir kaydın kısa özetini (ad/firma/ürün adı/fatura no gibi) çıkarır —
// Denetim İzi'nde "ne değişti" sorusuna kabaca cevap versin diye.
function denetimOzetCikar(payload){
  const d = (payload && payload.data) || {};

  for(const a of isimAlanlari) if(d[a]) return String(d[a]);

// Denetim İzi'ne tek bir satır ekler — hem yerelde saklanır hem de (kendi
// kendini loglamadan) buluta gönderilmeye çalışılır.
async function denetimKaydet(varlik, islem, ozet){
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || 'Bilinmiyor';
  const tarih = new Date().toISOString();
  const rec = {ID:uid('DZ'), tarih, kullanici, varlik, islem, ozet};
  if(!state.denetimIzi) state.denetimIzi = [];
  state.denetimIzi.push(rec);
  if(state.denetimIzi.length>3000) state.denetimIzi = state.denetimIzi.slice(-3000); // sınırsız büyümesin
  await persistDenetimIzi();
  syncOrQueue({action:'addDenetim', data:{tarih, kullanici, varlik, islem, ozet}}, {entity:'denetim', op:'add', localId:rec.ID});
}

async function syncOrQueue(payload, meta){
  // DENETİM İZİ: 'denetim' hariç HER add/update/delete burada tek noktadan
  // geçtiği için, kaydı kendisi tetiklemeden (sonsuz döngüye girmeden) otomatik
  // loglanır — ayrıca her modülün kendi save fonksiyonuna dokunmaya gerek kalmaz.
  if(meta && meta.entity && meta.entity!=='denetim' && meta.op){
    const varlikEtiketi = DENETIM_VARLIK_ETIKETLERI[meta.entity] || meta.entity;
    const islemEtiketi = meta.op==='add'?'Ekleme':meta.op==='update'?'Güncelleme':meta.op==='delete'?'Silme':meta.op;
    denetimKaydet(varlikEtiketi, islemEtiketi, denetimOzetCikar(payload));
  }
  // Silinen bir kaydın kimliğini HEMEN (ağ isteği tamamlanmadan) işaretle —
  // arka plan senkronu, sunucudaki silme henüz işlenmeden araya girip eski
  // kaydı geri getirmesin diye (bkz. mergeByIdKeepLocalOnly).
  if(meta && meta.op==='delete' && meta.localId){
    if(!state.silinenIdSeti) state.silinenIdSeti = new Set();
    state.silinenIdSeti.add(meta.localId);
  }
  // MANUEL MOD: kullanıcı "Buluta Yükle" demeden hiçbir otomatik ağ isteği
  // atılmaz — değişiklik sessizce kuyruğa (pendingOps) eklenir, ne hata
  // uyarısı ne de bağlantı denemesi olur. Bu, manuel modda BEKLENEN ve
  // NORMAL davranıştır (hata değildir).
  if(state.syncMode==='manual'){
    queuePendingOp(payload, meta);
    updateSyncBulb();
    return null;
  }
  // ÖNEMLİ: state.connected bayrağına GÜVENİLMEZ — sayfa yeni açıldığında
  // bağlantı kontrolü arka planda (beklenmeden) çalıştığı için, bu bayrak
  // henüz "false" iken bile internet/bulut aslında erişilebilir olabilir.
  // Bu yüzden state.apiUrl varsa HER ZAMAN gerçekten göndermeyi DENERİZ;
  // sadece gerçek bir hata olursa (ağ yok, sunucu hatası vb.) kuyruğa atılır.
  if(!state.apiUrl){
    queuePendingOp(payload, meta);
    toast('⚠️ BULUTA GÖNDERİLEMEDİ (bağlantı adresi girilmemiş) — değişiklik sadece bu cihazda saklandı. Başka bir bilgisayarda göremezsiniz!');
    return null;
  }
  try{
    const r = await apiPost(payload);
    if(r && r.ok===false) throw new Error(r.error||'İşlem başarısız');
    if(meta.op==='add') await applyCloudFields(meta.entity, meta.localId, cloudFieldsFromResponse(meta.entity, r));
    state.connected = true;
    flashSyncSuccess();
    return r;
  }catch(e){
    // İlk deneme başarısız oldu — bu genelde arka plan senkronuyla aynı ana
    // denk gelip Google Sheets'in geçici bir kilit/zaman aşımı vermesinden
    // kaynaklanır. Hemen pes etmeden kısa bir bekleme sonrası BİR KEZ daha dene.
    try{
      await new Promise(res=>setTimeout(res, 1200));
      const r2 = await apiPost(payload);
      if(r2 && r2.ok===false) throw new Error(r2.error||'İşlem başarısız');
      if(meta.op==='add') await applyCloudFields(meta.entity, meta.localId, cloudFieldsFromResponse(meta.entity, r2));
      state.connected = true;
      flashSyncSuccess();
      return r2;
    }catch(e2){
      queuePendingOp(payload, meta);
      toast('⚠️ BULUTA GÖNDERİLEMEDİ — değişiklik sadece bu cihazda saklandı. Başka bir bilgisayarda göremezsiniz! Bağlantı düzelince otomatik gönderilecek, ya da Ayarlar\'dan "Buluttan veri çek" deneyin.');
      return null;
    }
  }
}
// Kuyruktaki bekleyen işlemleri sırayla buluta gönderir. Eklemelerde
// bulut yeni bir ID döndürürse, sonraki kuyruk kayıtlarındaki eski
// yerel ID otomatik olarak yeni ID ile değiştirilir (idRemap).
async function flushPendingOps(){
  const queue = (state.pendingOps||[]).slice();
  if(queue.length===0) return {ok:true, sent:0, remaining:0};
  const remaining = [];
  const idRemap = {};
  let sent = 0;
  let lastError = '';
  for(const item of queue){
    const payload = item.payload;
    const remapKey = item.meta.entity+':'+payload.id;
    if(payload.id && idRemap[remapKey]) payload.id = idRemap[remapKey];
    try{
      const r = await apiPost(payload);
      if(r && r.ok===false) throw new Error(r.error||'İşlem başarısız');
      if(item.meta.op==='add'){
        const fields = cloudFieldsFromResponse(item.meta.entity, r);
        if(fields.ID) idRemap[item.meta.entity+':'+item.meta.localId] = fields.ID;
        await applyCloudFields(item.meta.entity, item.meta.localId, fields);
      }
      sent++;
    }catch(e){
      lastError = String((e && e.message) || e);
      console.error('Bekleyen işlem gönderilemedi ('+payload.action+'):', e);
      remaining.push(item);
    }
  }
  state.pendingOps = remaining;
  state.lastPendingError = remaining.length>0 ? lastError : '';
  await persistPendingOps();
  if(sent>0 && remaining.length===0) flashSyncSuccess(); else updateSyncBulb();
  return {ok: remaining.length===0, sent:sent, remaining:remaining.length};
}
// Sayfa açılışında SESSİZCE çağrılır: bağlantı çalışıyor mu diye bakar
// (ping) ve bekleyen kuyruğu varsa SADECE GÖNDERİR (buluttan veri
// çekmez) — yerel veriyi asla değiştirmez/ezmez.
async function verifyConnection(url){
  try{
    const cihaz = state.__cihazKimligi || {};
    const key = state.baglantiModu==='ikisiBirden' ? (state.bulutKayitliKey||state.yerelKayitliKey||'') : (state.apiKey||'');
    const pingUrl = url + (url.includes('?')?'&':'?') + 'action=ping&key=' + encodeURIComponent(key) +
      '&deviceId=' + encodeURIComponent(cihaz.deviceId||'') + '&deviceName=' + encodeURIComponent(cihaz.hostname||'');
    const res = await fetch(pingUrl, {method:'GET'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!data || data.ok === false) throw new Error((data && data.error) || 'Bilinmeyen hata');
    bulutAnahtariniIsleGerekirse(data);
    cihazDurumunuIsle(data);
    state.connected = true;
    state.lastError = '';
    if(state.pendingOps && state.pendingOps.length>0){
      const r = await flushPendingOps();
      if(r.sent>0) toast(r.sent+' bekleyen değişiklik otomatik olarak buluta gönderildi.');
    }
  }catch(err){
    state.connected = false;
    state.lastError = String(err.message || err);
  }
  renderShellStatus();
  renderContent();
}
// SADECE kullanıcı Ayarlar'dan "Bağlan" veya "Şimdi senkronize et" dediğinde
// çağrılır — kasıtlı bir eylemdir, buluttaki veriyi yerel veriyle

// bekleyen offline işlemler varsa önce onlar gönderilir.
async function connect(url, opts){
  opts = opts || {};
  state.apiUrl = url.trim();
  state.connecting = true;
  state.lastError = '';
  renderShellStatus();
  let flushResult = {ok:true, sent:0, remaining:0};
  try{
    flushResult = await flushPendingOps();
    const data = await apiGet('all');
    if(!data || data.ok === false) throw new Error((data && data.error) || 'Bilinmeyen hata');
    state.firmalar = mergeByIdKeepLocalOnly(state.firmalar, data.firmalar);
    state.urunler = mergeByIdKeepLocalOnly(state.urunler, data.urunler);
    state.alimlar = mergeByIdKeepLocalOnly(state.alimlar, data.alimlar).map(normalizeAlim);
    // Not: Kod.gs (Google Apps Script) henüz ödeme/iade/kullanıcı/talep
    // sekmelerini desteklemiyorsa ilgili alanlar gelmez — bu durumda
    // cihazdaki mevcut kayıtlar KORUNUR, boşaltılmaz. Ayrıca eşleşmeler
    // ID bazında BİRLEŞTİRİLİR (üzerine yazılmaz) — henüz buluta ulaşmamış
    // yerel bir kayıt, bu yüzden kaybolmaz.
    if(data.odemeler !== undefined) state.odemeler = mergeByIdKeepLocalOnly(state.odemeler, data.odemeler);
    if(data.iadeler !== undefined) state.iadeler = mergeByIdKeepLocalOnly(state.iadeler, data.iadeler);
    if(data.kullanicilar !== undefined && data.kullanicilar.length){
      state.kullanicilar = mergeByIdKeepLocalOnly(state.kullanicilar, data.kullanicilar);
      // state.currentUser eski diziden bir referanstı; yeni diziden aynı
      // ID'ye sahip nesneyle güncellenir ki oturum kopmasın.
      if(state.currentUser){
        const stillThere = state.kullanicilar.find(x=>(x.ID||x.id)===(state.currentUser.ID||state.currentUser.id));
        state.currentUser = stillThere || null;
      }
    }
    if(data.talepler !== undefined) state.talepler = mergeByIdKeepLocalOnly(state.talepler, data.talepler);
    if(data.ambarlar !== undefined) state.ambarlar = mergeByIdKeepLocalOnly(state.ambarlar, data.ambarlar);
    if(data.transferler !== undefined) state.transferler = mergeByIdKeepLocalOnly(state.transferler, data.transferler);
    if(data.roller !== undefined) state.roller = mergeByIdKeepLocalOnly(state.roller, data.roller);
    if(data.cekler !== undefined) state.cekler = mergeByIdKeepLocalOnly(state.cekler, data.cekler.map(normalizeCek));
    if(data.kasaHareketleri !== undefined) state.kasaHareketleri = mergeByIdKeepLocalOnly(state.kasaHareketleri, data.kasaHareketleri.map(normalizeKasaHareket));
    if(data.odemeEmirleri !== undefined) state.odemeEmirleri = mergeByIdKeepLocalOnly(state.odemeEmirleri, data.odemeEmirleri.map(normalizeOdemeEmri));
    if(data.teklifler !== undefined) state.teklifler = mergeByIdKeepLocalOnly(state.teklifler, data.teklifler.map(normalizeTeklif));
    if(data.kasaTanimlari !== undefined) state.kasaTanimlari = mergeByIdKeepLocalOnly(state.kasaTanimlari, data.kasaTanimlari.map(normalizeKasaTanimi));
    if(data.sozlesmeler !== undefined) state.sozlesmeler = mergeByIdKeepLocalOnly(state.sozlesmeler, data.sozlesmeler.map(normalizeSozlesme));
    if(data.baglantiliSiparisler !== undefined) state.baglantiliSiparisler = mergeByIdKeepLocalOnly(state.baglantiliSiparisler, data.baglantiliSiparisler.map(normalizeBaglantiliSiparis));
    if(data.giderler !== undefined) state.giderler = mergeByIdKeepLocalOnly(state.giderler, data.giderler.map(normalizeGider));
    if(data.denetimIzi !== undefined) state.denetimIzi = mergeByIdKeepLocalOnly(state.denetimIzi, data.denetimIzi.map(normalizeDenetimKaydi));
    if(data.sktKayitlari !== undefined) state.sktKayitlari = mergeByIdKeepLocalOnly(state.sktKayitlari, data.sktKayitlari.map(normalizeSktKaydi));

// Buluttan gelen bir listeyi, YEREL listeyle ID bazında BİRLEŞTİRİR —
// üzerine yazmaz. Az önce kaydedilmiş ama henüz buluta ulaşmamış (veya

// kayıtlar bulut sürümüyle güncellenir. Bu, "kaydettim, bir anlığına
// göründü, sonra kayboldu" sorununun kök nedeniydi.
function mergeByIdKeepLocalOnly(localArr, cloudArr){
  if(!cloudArr) return localArr||[];
  const idOf = x => x.ID!==undefined ? x.ID : x.id;
  const silinen = state.silinenIdSeti || (state.silinenIdSeti = new Set());

      '&deviceId=' + encodeURIComponent(cihaz.deviceId||'') + '&deviceName=' + encodeURIComponent(cihaz.hostname||'') + '&_ts=' + Date.now();
    const res = await fetch(url, {method:'GET', cache:'no-store', signal:controller ? controller.signal : undefined});

    // kilitlemeyiz. Arka plan senkronizasyonu tekrar denemeye devam eder.

async function syncUserPackageAccess(){
  if(!isUserPackage() || !state.apiUrl) return;

    // Mevcut Apps Script yalnız `all` uç noktasını sağlıyorsa onu kullanıyoruz,
    // fakat kullanıcı dosyasının sonsuza yakın beklememesi için 8 sn sınır koyuyoruz.
    const data = await Promise.race([
      apiGet('all'),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('Yetki sunucusu zaman aşımı')),8000))
    ]);
    if(!data || data.ok===false) throw new Error((data&&data.error)||'Yetki bilgisi alınamadı');
    // ÖNEMLİ: Bu fonksiyon önceden SADECE kullanıcı/rol verisini güncelliyordu.
    // Talepler (ör. yöneticinin onayladığı bir talep) hiç çekilmediği için,
    // depocunun kullanıcı paketi dosyasında talep sürekli "Bekliyor" görünüyordu.
    // Aynı `all` yanıtı zaten talep/ambar/transfer verisini içeriyor — burada da
    // birleştirip (cloud verisini esas alıp, henüz buluta ulaşmamış yerel
    // kayıtları koruyarak) kaydediyoruz.
    if(data.talepler !== undefined) state.talepler = mergeByIdKeepLocalOnly(state.talepler, data.talepler);
    if(data.ambarlar !== undefined) state.ambarlar = mergeByIdKeepLocalOnly(state.ambarlar, data.ambarlar);
    if(data.transferler !== undefined) state.transferler = mergeByIdKeepLocalOnly(state.transferler, data.transferler);
    await Promise.all([persistTalepler(), persistAmbarlar(), persistTransferler()]);

    // Böyle bir durumda paket içindeki kullanıcıyı SİLME; yerel PIN ile girişe izin ver
    // ve bir sonraki senkronizasyon turunda yeniden dene.
    if(data.kullanicilar === undefined || !Array.isArray(data.kullanicilar)){
      state.connected = true;
      renderShellStatus();
      if(!isUserBusyWithForm()) renderContent();
      return;
    }
    const users = data.kullanicilar;
    const targetId = String(USER_PACKAGE_CONFIG.userId||'');
    let remoteUser = users.find(u=>String(u.ID||u.id)===targetId);

    const oldPin = String(oldUser.Pin!==undefined?oldUser.Pin:oldUser.pin||'');
    const newPin = String(remoteUser.Pin!==undefined?remoteUser.Pin:remoteUser.pin||'');

    const remoteRole = (data.roller||[]).find(r=>String(r.Ad||r.ad)===String(roleName));

    state.roller = remoteRole ? [Object.assign({}, remoteRole)] : [];
    USER_PACKAGE_CONFIG.user = Object.assign({}, remoteUser);
    USER_PACKAGE_CONFIG.role = remoteRole ? Object.assign({}, remoteRole) : null;
    USER_PACKAGE_CONFIG.userId = remoteUser.ID||remoteUser.id||USER_PACKAGE_CONFIG.userId;
    state.connected = true;

      state.currentUser = state.kullanicilar[0];

      if(oldPin!==newPin){

        state.loginError = 'PIN yöneticiniz tarafından değiştirildi. Yeni PIN ile tekrar giriş yapın.';
        await persistCurrentUserId();
        renderApp();
        return;
      }
      const rol = state.currentUser.Rol||state.currentUser.rol;
      if(!tabAllowedForRole(state.tab, rol)){
        state.tab = tabAllowedForRole('talepler', rol) ? 'talepler' : 'pano';
        location.hash = state.tab;
      }
      await syncPackageProductCatalog(data);
      // Formu bozmadan yalnız menü/yetki görünümünü anında yenile.
      renderNav();
      renderUserPill();
      renderShellStatus();
      if(!isUserBusyWithForm()) renderContent();
    } else {
      renderApp();
    }
  }catch(e){
    state.connected = false;
    renderShellStatus();
  }
}

function pad2(n){ return n<10 ? '0'+n : String(n); }
function backupFileDateStamp(d){
  return pad2(d.getDate())+'-'+pad2(d.getMonth()+1)+'-'+d.getFullYear()+'_'+pad2(d.getHours())+'-'+pad2(d.getMinutes());
}
function exportBackup(){
  Promise.all(ALL_BACKUP_KEYS.map(k => storageGet(k))).then(values => {
    const data = {};
    ALL_BACKUP_KEYS.forEach((k,i) => { data[k] = values[i] || null; });
    const backup = { type:'alim-defteri-yedek', version:1, exportedAt:new Date().toISOString(), data };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'alim-defteri-yedek-' + backupFileDateStamp(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Yedek indirildi.');
  }).catch(e => { console.error('Backup export failed', e); toast('Yedek alınamadı.'); });
}
function kaseImzaYukle(file){
  if(!file.type.startsWith('image/')){ toast('Lütfen bir görsel dosyası seçin.'); return; }
  if(file.size > 2*1024*1024){ toast('Görsel çok büyük — 2MB altında bir dosya seçin.'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    state.bordroKaseImza = e.target.result;
    await persistBordroKaseImza();
    toast('Kaşe/imza görseli kaydedildi.');
    renderContent();
  };
  reader.readAsDataURL(file);
}
async function kaseImzaKaldir(){
  const onay = await evetHayirSor('Kaşe/imza görseli kaldırılsın mı? Bundan sonra oluşturulan bordrolarda görsel yer almaz.', 'Kaşe/İmza Kaldır');
  if(!onay) return;
  state.bordroKaseImza = '';
  await persistBordroKaseImza();
  renderContent();
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let backup;
    try{ backup = JSON.parse(e.target.result); }
    catch(err){ toast('Geçersiz yedek dosyası.'); return; }
    if(!backup || !backup.data || typeof backup.data !== 'object'){ toast('Geçersiz yedek dosyası.'); return; }
    if(!confirm('Yedek yüklenecek. Mevcut tüm veriler (alımlar, firmalar, ürünler, ödemeler, iadeler, kullanıcılar, talepler) yedekteki verilerle DEĞİŞTİRİLECEK. Devam etmek istiyor musunuz?')) return;
    const tasks = ALL_BACKUP_KEYS.map(k => {
      const val = backup.data[k];
      return (val === undefined || val === null) ? storageRemove(k) : storageSet(k, val);
    });
    Promise.all(tasks).then(() => {
      toast('Yedek yüklendi, sayfa yenileniyor…');
      setTimeout(()=>window.location.reload(), 700);
    }).catch(e => { console.error('Backup import failed', e); toast('Yedek yüklenemedi.'); });
  };
  reader.onerror = () => toast('Dosya okunamadı.');
  reader.readAsText(file, 'utf-8');
}

function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3600);
}

/* =========================================================
   INIT / ROUTING
========================================================= */
async function init(){
  const hashTab = location.hash.replace('#','');
  if(TABS.some(t=>t.key===hashTab)) state.tab = hashTab;
  ensureNavGroupOpenForTab(state.tab);
  state.tabHistory = [state.tab];
  state.tabHistoryPos = 0;

  // Electron kabuğu içinde çalışıyorsak (window.cariTakipMasaustu mevcutsa),
  // bu kuruluma özel kalıcı cihaz kimliğini al — yerel ağ sunucusuna her
  // istekte gönderilir (bkz. apiGet/apiPost).
  if(window.cariTakipMasaustu){
    try{ state.__cihazKimligi = await window.cariTakipMasaustu.cihazKimligi(); }catch(e){ state.__cihazKimligi = null; }

    // Bu bilgisayar daha önce "Sunucu Yap" ile açılmışsa, uygulama her
    // kapanıp açıldığında sunucuyu elle yeniden başlatmaya gerek kalmasın
    // diye burada OTOMATİK olarak yeniden başlatılır — bağlantı denemeleri
    // (aşağıdaki loadAllData/backgroundSync) başlamadan ÖNCE, sunucu hazır olsun diye.
    try{
      const acikMi = await storageGet(STORAGE_KEYS.yerelSunucuAcikMi);
      if(acikMi==='1'){
        const sonuc = await window.cariTakipMasaustu.yerelSunucuBaslat();
        if(sonuc && sonuc.ok){
          state.yerelSunucuCalisiyorMu = true;
          const ag = await window.cariTakipMasaustu.agBilgisi();
          state.yerelSunucuAdresleri = (ag && ag.adresler) || [];
        }
      }
    }catch(e){ /* sessizce geç — Ayarlar'dan elle başlatılabilir */ }
  }

  try{ state.tema = (await storageGet(STORAGE_KEYS.tema)) || 'light'; }catch(e){ state.tema = 'light'; }
  applyTema(state.tema);
  try{ state.syncMode = (await storageGet(STORAGE_KEYS.syncMode)) || 'auto'; }catch(e){ state.syncMode = 'auto'; }

  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('tr-TR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});

  // CİHAZ ŞİFRELEMESİ etkinse, veriyi çözebilmek için önce doğru şifre
  // girilmeli — bu yüzden loadAllData()'dan ÖNCE bir kilit ekranı gösterilir.
  // (cihazSifreliMi her zaman DÜZ metin tutulur, bu kontrolü şifresiz yapabiliriz.)
  let cihazSifreliMi = null;
  try{ cihazSifreliMi = await storageGet(STORAGE_KEYS.cihazSifreliMi); }catch(e){}

  // Kullanıcı dosyası oluşturulurken bu dosyaya özel bir cihaz şifresi
  // belirlenmişse VE bu dosya bu cihazda İLK KEZ açılıyorsa (henüz kendi
  // şifrelemesi kurulmamış), o şifreyi burada OTOMATİK etkinleştiririz —
  // çalışana Ayarlar'dan elle kurdurmaya gerek kalmaz. Kendi ayrı depolama
  // alanı (namespace) sayesinde her kullanıcı dosyasının şifresi bağımsızdır.
  if(!cihazSifreliMi && isUserPackage() && USER_PACKAGE_CONFIG.cihazSifresi){
    await kullaniciPaketiCihazSifresiniOtomatikKur_(USER_PACKAGE_CONFIG.cihazSifresi);
    cihazSifreliMi = '1';
  }

  if(cihazSifreliMi==='1'){
    renderCihazKilidiEkrani();
    return;
  }
  await initDevamEt();
}
async function kullaniciPaketiCihazSifresiniOtomatikKur_(sifre){
  const saltBytes = crypto.getRandomValues(new Uint8Array(16));
  const saltB64 = b64Encode(saltBytes);
  const anahtar = await cihazAnahtariTuret(sifre, saltB64);
  const dogrulamaZarfi = await cihazVeriSifrele(anahtar, CIHAZ_SIFRE_DOGRULAMA_SABITI);
  await storageSet(STORAGE_KEYS.cihazSifreSalt, saltB64);
  await storageSet(STORAGE_KEYS.cihazSifreDogrulama, dogrulamaZarfi);
  await storageSet(STORAGE_KEYS.cihazSifreliMi, '1');
  // state.__cihazSifreAnahtari BİLEREK burada ayarlanmıyor — hemen ardından
  // normal kilit ekranı çıkıp aynı şifrenin girilmesini ister; bu, admin/
  // çalışanın şifreyi doğru aktardığını da baştan doğrulamış olur.
}
async function initDevamEt(){
  // İlk anda henüz kullanıcı/veri yüklenmediği için giriş ekranı gösterilir
  // (state.currentUser null); loadAllData() tamamlanınca (aşağıda) cihazda
  // zaten oturum açıksa otomatik olarak asıl uygulamaya geçilir.
  renderApp();

  window.addEventListener('hashchange', ()=>{
    const t = location.hash.replace('#','');
    if(TABS.some(x=>x.key===t)){
      state.tab = t;
      ensureNavGroupOpenForTab(t);
      // Geri/İleri düğmeleriyle gelinmediyse (sıradan bir menü tıklaması),
      // geçmişin şu andan sonrasını atıp bu sekmeyi en sona ekle — tarayıcı
      // geçmişiyle aynı mantık. navBack/navForward zaten kendi index'ini
      // önceden ayarladığı için burada tekrar eklemeye gerek yok.
      if(!state.navigatingHistory){
        state.tabHistory = state.tabHistory.slice(0, state.tabHistoryPos+1);
        state.tabHistory.push(t);
        state.tabHistoryPos = state.tabHistory.length-1;
      }
      state.navigatingHistory = false;
      renderApp();
    }
  });


  // Bekleyen (henüz buluta ulaşmamış) değişiklik varken sayfa/pencere
  // kapatılmaya çalışılırsa tarayıcı uyarır — "evde girip kapattım, ofiste
  // görünmüyor" sorununun en sık sebebi budur: kayıt cihazda kalır ama
  // hiç fark edilmez.
  window.addEventListener('beforeunload', (e)=>{
    if(state.pendingOps && state.pendingOps.length>0){
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  try{
    await loadAllData();
  }catch(e){
    console.error('Veri yüklenemedi', e);
    toast('Kayıtlı veriler yüklenirken bir sorun oluştu.');
  }
  // Kullanıcı dağıtım dosyasında AÇILIŞI BULUT İSTEĞİNE BAĞLAMA.
  // Paket zaten oluşturulurken kullanıcının son bilinen rol/izinleri içine yazılmıştır;
  // bu yüzden ekran ve menü anında açılır. Bulut bağlantısı + canlı yetki kontrolü
  // hemen arka planda başlatılır ve Google Apps Script'in ağır `all` cevabı
  // kullanıcıyı giriş ekranında bekletmez.
  renderApp();
  startBackgroundSync();
  if(isUserPackage() && state.apiUrl){
    startUserPackageFastConnect();
  }
  if(window.cariTakipMasaustu){
    // İlk kontrol, açılıştan biraz sonra (ekran otursun, senkron adresi
    // gelsin diye) — sonrasında düzenli aralıklarla tekrar dener.
    setTimeout(otomatikGuncellemeKontrolu, 15000);
    setInterval(otomatikGuncellemeKontrolu, 30*60*1000);
  }
}

// ---- OTOMATİK GÜNCELLEME KONTROLÜ ----
// Yönetici Ayarlar'dan güncelleme adresini bir kez girdiğinde, bu adres
// TÜM cihazlara otomatik yayılır (bkz. sistemAyarlariniIsle). Böylece HER
// kullanıcının cihazı (rolü ne olursa olsun) düzenli aralıklarla kontrol
// eder ve yeni bir sürüm bulursa ısrarlı bir pencereyle haber verir.
async function otomatikGuncellemeKontrolu(){
  if(!window.cariTakipMasaustu || !state.guncellemeUrl) return;
  if(state.__guncellemeKontrolSurüyor || state.__guncellemeHatirlatmaErtelendi) return;
  state.__guncellemeKontrolSurüyor = true;
  try{
    // main.js'teki karşılaştırma, uygulamanın SABİT kurulum sürümünü
    // (hiç değişmez) esas alıyor — bu yüzden kendi bildiğimiz "en son
    // uyguladığımız sürüm" ile ÖNCE kendimiz karşılaştırıyoruz. Eşleşiyorsa
    // gereksiz yere tekrar indirip pencere göstermeyi burada durduruyoruz.
    const oncekiUygulanan = (await storageGet(STORAGE_KEYS.uygulanmisSurum)) || '';
    let sunucudakiSurum = null;
    try{
      const kontrolUrl = state.guncellemeUrl + (state.guncellemeUrl.includes('?')?'&':'?') + '_cb=' + Date.now();
      const res = await fetch(kontrolUrl, {cache:'no-store'});
      if(res.ok){ const j = await res.json(); sunucudakiSurum = j && j.version; }
    }catch(e){ /* version.json okunamadıysa aşağıdaki asıl kontrole düş */ }
    if(sunucudakiSurum && String(sunucudakiSurum)===String(oncekiUygulanan)){
      state.__guncellemeKontrolSurüyor = false;
      return;
    }
    const sonuc = await window.cariTakipMasaustu.guncellemeKontrolEt(state.guncellemeUrl);
    if(sonuc && sonuc.ok){
      await storageSet(STORAGE_KEYS.uygulanmisSurum, String(sonuc.yeniSurum||sunucudakiSurum||''));
      guncellemeUyariPenceresiGoster(sonuc.yeniSurum);
    }
    // sonuc.zatenGuncel ya da hata ise: sessizce geç, kullanıcıyı rahatsız etme.
  }catch(e){ /* sessizce geç */ }
  state.__guncellemeKontrolSurüyor = false;
}

function goTab(key){

}
// Tüm sekmeler için ortak Geri/İleri gezinme — tarayıcı geçmişi gibi
// çalışır, ama uygulamanın kendi görünür düğmeleriyle (topbar'da).
function navBack(){
  if(!state.tabHistory || state.tabHistoryPos<=0) return;
  state.tabHistoryPos--;
  state.navigatingHistory = true;
  goTab(state.tabHistory[state.tabHistoryPos]);
}
function navForward(){
  if(!state.tabHistory || state.tabHistoryPos>=state.tabHistory.length-1) return;
  state.tabHistoryPos++;
  state.navigatingHistory = true;
  goTab(state.tabHistory[state.tabHistoryPos]);
}

function renderNavItemBtn(t, extraClass, depth){
  let badge = '';
  if(t.key==='odemeEmirleri'){
    const n = bekleyenOdemeEmriSayisi();
    if(n>0) badge = '<span class="nav-badge">'+n+'</span>';
  }
  return '<button class="nav-item '+(extraClass||'')+'" style="padding-left:'+(12+depth*18)+'px;" onclick="goTab(\'' + t.key + '\')">' +
    '<span class="nav-dot"></span>' + t.label + badge + '</button>';
}
// entry.children TAB ANAHTARI (string) ya da İÇ İÇE bir GRUP nesnesi
// ({group,label,children}) içerebilir — böylece "Ürünler" gibi bir grubun
// altına "Transferler" gibi kendi başına açılıp kapanan bir alt-grup daha
// eklenebilir (iki seviyeli açılır menü).
function navGroupHasAnyAllowed(entry, rol){
  return entry.children.some(child=>{
    if(typeof child==='string') return tabAllowedForRole(child, rol);
    return navGroupHasAnyAllowed(child, rol);
  });
}
function renderNavGroupBlock(entry, rol, depth){
  if(!navGroupHasAnyAllowed(entry, rol)) return '';
  const open = !!state.navGroupOpen[entry.group];
  const childrenHtml = entry.children.map(child=>{
    if(typeof child==='string'){
      const t = TABS.find(x=>x.key===child);
      if(!t || !tabAllowedForRole(child, rol)) return '';
      return renderNavItemBtn(t, 'nav-subitem'+(state.tab===t.key?' active':''), depth);
    }
    return renderNavGroupBlock(child, rol, depth+1);
  }).join('');
  const grupRozeti = (entry.children.includes('odemeEmirleri') && bekleyenOdemeEmriSayisi()>0) ? '<span class="nav-badge">'+bekleyenOdemeEmriSayisi()+'</span>' : '';
  return '<button class="nav-item" style="padding-left:'+(12+(depth-1)*18)+'px;" onclick="toggleNavGroup(\''+entry.group+'\')">' +
      '<span class="nav-dot"></span>' + entry.label + grupRozeti + '<span class="nav-caret">'+(open?'▾':'▸')+'</span>' +
    '</button>' +
    '<div class="nav-subgroup" style="'+(open?'':'display:none;')+'">' + childrenHtml + '</div>';
}
function renderNav(){
  const nav = document.getElementById('nav');
  const rol = state.currentUser ? (state.currentUser.Rol||state.currentUser.rol) : null;
  nav.innerHTML = NAV_GROUPS.map(entry => {
    if(entry.children){
      return renderNavGroupBlock(entry, rol, 1);
    }
    if(!tabAllowedForRole(entry.key, rol)) return '';
    const t = TABS.find(x=>x.key===entry.key);
    return '<button class="nav-item ' + (state.tab===t.key?'active':'') + '" onclick="goTab(\'' + t.key + '\')">' +
      '<span class="nav-dot"></span>' + t.label + '</button>';
  }).join('');
  document.getElementById('pageTitle').textContent = TABS.find(t=>t.key===state.tab).label;
  updateNavButtons();
}
function updateNavButtons(){
  const b = document.getElementById('navBackBtn'), f = document.getElementById('navForwardBtn');
  if(b) b.disabled = !state.tabHistory || state.tabHistoryPos<=0;
  if(f) f.disabled = !state.tabHistory || state.tabHistoryPos>=state.tabHistory.length-1;
}
function toggleNavGroup(key){
  const willOpen = !state.navGroupOpen[key];
  // Akordeon: bir grup başlığına elle tıklanınca (navigasyon olmadan) diğer
  // tüm gruplar kapanır — önceki düzeltme sadece SEKMEYE GİDİLDİĞİNDE
  // (hashchange) çalışıyordu; sadece bir grubu açıp gezinmeden başka bir
  // grubu açma senaryosunu kapsamıyordu.
  Object.keys(state.navGroupOpen).forEach(k=>{ state.navGroupOpen[k] = false; });
  state.navGroupOpen[key] = willOpen;
  renderNav();
}
// Bir sekmeye gidildiğinde (hash değiştiğinde), o sekme bir alt menü
// grubunun içindeyse grup otomatik açılır — kullanıcı nereye geldiğini
// görsün diye. Bu SADECE navigasyon anında çalışır; kullanıcı grubu elle
// kapatırsa (toggleNavGroup) bir sonraki renderNav() bunu tekrar açmaz.
function ensureNavGroupOpenForTab(tabKey){
  // Önce TÜM grupları kapat, sonra sadece hedef sekmeye giden ata
  // grup(lar)ını aç — böylece farklı bir menüye geçildiğinde önceden açık
  // kalmış grup(lar) otomatik kapanır (akordeon davranışı: aynı anda en
  // fazla bir "dal" açık kalır). Kullanıcı bir grubu elle açıp kapatması
  // (toggleNavGroup) bundan etkilenmez — bu fonksiyon SADECE hash/sekme
  // değişince çalışır.
  function closeAll(entries){
    entries.forEach(e=>{
      if(!e.children) return;
      state.navGroupOpen[e.group] = false;
      closeAll(e.children.filter(c=>typeof c!=='string'));
    });
  }
  closeAll(NAV_GROUPS);
  // İç içe gruplarda, hedef sekmeye giden TÜM ata grupları (ör. Ürünler ->
  // Transferler) açılır — sadece en yakın grup değil.
  function acCheck(entries){
    for(const e of entries){
      if(!e.children) continue;
      if(e.children.includes(tabKey)){ state.navGroupOpen[e.group] = true; return true; }
      const nestedGroups = e.children.filter(c=>typeof c!=='string');
      if(acCheck(nestedGroups)){ state.navGroupOpen[e.group] = true; return true; }
    }
    return false;
  }
  acCheck(NAV_GROUPS);
}

async function cihazSifrelemesiEtkinlestir(){
  const s1 = (document.getElementById('csYeniSifre1')||{}).value || '';
  const s2 = (document.getElementById('csYeniSifre2')||{}).value || '';
  if(!s1 || s1.length<6){ toast('Şifre en az 6 karakter olmalı.'); return; }
  if(s1!==s2){ toast('Şifreler eşleşmiyor.'); return; }
  closeModal();
  toast('Veriler şifreleniyor, lütfen bekleyin…');
  const anahtarlar = tumVeriDepolamaAnahtarlari();
  const mevcutDegerler = {};
  for(const k of anahtarlar){ mevcutDegerler[k] = await storageGet(k); }
  const saltBytes = crypto.getRandomValues(new Uint8Array(16));
  const saltB64 = b64Encode(saltBytes);
  const yeniAnahtar = await cihazAnahtariTuret(s1, saltB64);
  state.__cihazSifreAnahtari = yeniAnahtar;
  for(const k of anahtarlar){
    if(mevcutDegerler[k]!==null && mevcutDegerler[k]!==undefined) await storageSet(k, mevcutDegerler[k]);
  }
  const dogrulamaZarfi = await cihazVeriSifrele(yeniAnahtar, CIHAZ_SIFRE_DOGRULAMA_SABITI);
  await storageSet(STORAGE_KEYS.cihazSifreSalt, saltB64);
  await storageSet(STORAGE_KEYS.cihazSifreDogrulama, dogrulamaZarfi);
  await storageSet(STORAGE_KEYS.cihazSifreliMi, '1');
  toast('✅ Cihaz şifrelemesi etkinleştirildi.');
  renderContent();
}

async function cihazSifrelemesiDevreDisiBirakOnayla(){
  const sifre = (document.getElementById('csMevcutSifre')||{}).value || '';
  if(!sifre){ toast('Mevcut şifrenizi girin.'); return; }
  try{
    const salt = await storageGet(STORAGE_KEYS.cihazSifreSalt);
    const adayAnahtar = await cihazAnahtariTuret(sifre, salt);
    const dogrulamaZarfi = await storageGet(STORAGE_KEYS.cihazSifreDogrulama);
    const cozulen = await cihazVeriCoz(adayAnahtar, dogrulamaZarfi);
    if(cozulen !== CIHAZ_SIFRE_DOGRULAMA_SABITI) throw new Error('yanlış');
  }catch(e){ toast('Şifre yanlış.'); return; }
  closeModal();
  toast('Şifreleme kaldırılıyor, lütfen bekleyin…');

  const cozulenDegerler = {};
  for(const k of anahtarlar){ cozulenDegerler[k] = await storageGet(k); }
  state.__cihazSifreAnahtari = null;
  for(const k of anahtarlar){
    if(cozulenDegerler[k]!==null && cozulenDegerler[k]!==undefined) await storageSet(k, cozulenDegerler[k]);
  }
  await storageRemove(STORAGE_KEYS.cihazSifreSalt);
  await storageRemove(STORAGE_KEYS.cihazSifreDogrulama);
  await storageRemove(STORAGE_KEYS.cihazSifreliMi);

function attemptLogin(){
  const sel = document.getElementById('loginUserSelect');
  const pinEl = document.getElementById('loginPinInput');
  const packagedUser = isUserPackage() ? ((state.kullanicilar&&state.kullanicilar[0]) || USER_PACKAGE_CONFIG.user || null) : null;
  const id = isUserPackage() ? (packagedUser ? (packagedUser.ID||packagedUser.id) : '') : (sel ? sel.value : '');
  const pin = pinEl ? pinEl.value : '';
  state.loginSelectedUserId = id;
  const u = isUserPackage() ? packagedUser : state.kullanicilar.find(x=>(x.ID||x.id)===id);
  if(!u || String(u.Pin!==undefined?u.Pin:u.pin||'')!==String(pin)){
    state.loginError = 'Kullanıcı ya da PIN hatalı.';
    renderApp();
    return;
  }
  // YEREL AĞ CİHAZ ROLÜ KISITLAMASI: yöneticinin bu cihaza belirli bir rol
  // atadığı durumlarda (yönetici DEĞİLSE), sadece TAM O ROLE sahip
  // kullanıcılar bu cihazda giriş yapabilir — PIN doğru olsa bile.
  const cihazRolu = ((state.baglantiModu==='yerelAg'||state.baglantiModu==='ikisiBirden') && state.buCihazDurumu) ? state.buCihazDurumu.rolAdi : '';
  if(cihazRolu && cihazRolu!=='yonetici' && (u.Rol||u.rol)!==cihazRolu){
    state.loginError = 'Bu bilgisayar sadece "'+cihazRolu+'" rolüne açık — bu kullanıcıyla buradan giriş yapılamaz.';
    renderApp();
    return;
  }
  state.loginError = '';
  state.currentUser = u;
  persistCurrentUserId();
  lastHeartbeatSentAt = 0; // girişte hemen bir "buradayım" sinyali gönderilsin
  sendHeartbeatIfDue();
  const rol = u.Rol||u.rol;
  // Depocu, kendisine kapalı bir sekmede kalmasın diye erişebileceği ilk
  // sekmeye yönlendirilir.
  if(!tabAllowedForRole(state.tab, rol)){
    state.tab = tabAllowedForRole('talepler', rol) ? 'talepler' : 'pano';
    location.hash = state.tab;
  }
  renderApp();
}

  const shell = document.querySelector('.shell');

  // Yerel ağ modunda, bu cihaz henüz onaylanmamışsa (bekliyor/reddedildi),
