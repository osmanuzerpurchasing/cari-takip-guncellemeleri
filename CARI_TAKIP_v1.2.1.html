}

// Aynı firmadan, AYNI TÜRDE (Alış/Satış) aynı fatura numarası daha önce
// girilmiş mi kontrol eder — hem anlık uyarıda hem de kayıt anındaki son
// güvenlik onayında ORTAK olarak kullanılır.
function findMukerrerFatura(firma, faturaNo, tur){
  if(!firma || !faturaNo) return null;
  return state.alimlar.find(a =>
    String(a.firma||'').trim().toLocaleUpperCase('tr-TR')===String(firma).trim().toLocaleUpperCase('tr-TR') &&
    String(a.faturaNo||'').trim().toLocaleUpperCase('tr-TR')===String(faturaNo).trim().toLocaleUpperCase('tr-TR') &&
    (a.tur||'Alış')===tur
  ) || null;
}
// Fatura no alanından Tab/Enter ile çıkılır çıkılmaz (blur) ANLIK olarak
// tetiklenir — kullanıcı kaydet'e basmayı beklemeden, aynı fatura
// numarasının daha önce girildiğini hemen görür.
function checkFaturaNoDuplicate(){
  const warnEl = document.getElementById('faturaNoWarning');
  if(!warnEl) return;
  const faturaNoEl = document.getElementById('gFaturaNo');
  if(!faturaNoEl){ return; }
  const faturaNo = faturaNoEl.value.trim();
  const firma = getSelectedFirma();
  const tur = faturaTuruFromTab();
  if(!faturaNo || !firma){ warnEl.innerHTML=''; state.lastMukerrerPrompted=''; return; }
  const mukerrer = findMukerrerFatura(firma, faturaNo, tur);
  if(mukerrer){
    warnEl.innerHTML = '<div class="banner banner-warn" style="margin-top:10px;">⚠️ Bu fatura numarası ('+escapeHtml(faturaNo)+') <b>'+escapeHtml(firma)+'</b> firmasından daha önce <b>'+fmtDate(mukerrer.tarih)+'</b> tarihinde girilmiş! Aynı faturayı yanlışlıkla iki kez girmediğinizden emin olun. ' +
      '<button class="btn btn-sm btn-ghost" style="margin-left:8px;" onclick="showMukerrerFaturaIcerigi(\''+escapeHtml(firma)+'\',\''+escapeHtml(faturaNo)+'\',\''+tur+'\')">İçeriği tekrar gör</button></div>';
    // Aynı mükerrer için tekrar tekrar sormamak adına, her tespitte bir kez soruyoruz.
    const anahtar = firma+'||'+faturaNo+'||'+tur;
    if(state.lastMukerrerPrompted !== anahtar){
      state.lastMukerrerPrompted = anahtar;
      const gor = confirm('Bu fatura numarası ('+faturaNo+') "'+firma+'" firmasından daha önce '+fmtDate(mukerrer.tarih)+' tarihinde girilmiş.\n\nDaha önce girilen faturanın içeriğini görmek ister misiniz?');
      if(gor) showMukerrerFaturaIcerigi(firma, faturaNo, tur);
    }
  } else {
    warnEl.innerHTML = '';
    state.lastMukerrerPrompted = '';
  }
}
// Mükerrer olduğu tespit edilen faturanın daha önce girilmiş kalemlerini
// gösterir — "Evet" derseniz checkFaturaNoDuplicate buradan çağırır,
// bandodaki "İçeriği tekrar gör" butonu da aynı fonksiyonu kullanır.
function showMukerrerFaturaIcerigi(firma, faturaNo, tur){
  const rows = state.alimlar.filter(a =>
    String(a.firma||'').trim().toLocaleUpperCase('tr-TR')===String(firma).trim().toLocaleUpperCase('tr-TR') &&
    String(a.faturaNo||'').trim().toLocaleUpperCase('tr-TR')===String(faturaNo).trim().toLocaleUpperCase('tr-TR') &&
    (a.tur||'Alış')===tur
  );
  if(rows.length===0){ toast('Fatura bulunamadı.'); return; }
  const toplam = rows.reduce((s,r)=>s+Number(r.toplam||0),0);
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:760px;">' +
        '<h3>Fatura Detayı — '+escapeHtml(firma)+' · '+escapeHtml(faturaNo)+'</h3>' +
        '<div class="hint" style="margin-bottom:10px;">'+fmtDate(rows[0].tarih)+' tarihinde girilmiş, '+rows.length+' kalem.</div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Ürün</th><th>Stok kodu</th><th class="num">Miktar</th><th>Birim</th><th class="num">Birim fiyat</th><th class="num">KDV %</th><th class="num">İndirim %</th><th class="num">Toplam</th></tr></thead><tbody>' +
          rows.map(r=>'<tr><td>'+escapeHtml(r.urunAdi||'')+'</td><td><code class="inline">'+escapeHtml(r.stokKodu||'')+'</code></td><td class="num">'+num(r.miktar,2)+'</td><td>'+escapeHtml(r.birim||'')+'</td><td class="num">'+money(r.birimFiyat)+'</td><td class="num">%'+num(r.kdvOrani,0)+'</td><td class="num">%'+num(r.indirim,0)+'</td><td class="num">'+money(r.toplam)+'</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="kv" style="border-bottom:0;margin-top:6px;"><span><b>Genel toplam</b></span><span><b>'+money(toplam)+'</b></span></div>' +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Kapat</button></div>' +
      '</div>' +
    '</div>';
}
async function saveFatura(){
  const tur = faturaTuruFromTab();
  if(!canDo(tur==='Satış'?'satisFaturasi':'alisFaturasi','add')){ yetkiYokUyar(); return; }
  const firma = getSelectedFirma();
  const faturaNo = document.getElementById('gFaturaNo').value.trim();
  const tarih = document.getElementById('gTarih').value;
  const vadeTarihiEl = document.getElementById('gVadeTarihi');
  const vadeTarihi = vadeTarihiEl ? vadeTarihiEl.value : '';
  const paraBirimi = (document.getElementById('gParaBirimi')||{}).value || 'TL';
  const kur = paraBirimi!=='TL' ? (Number((document.getElementById('gKur')||{}).value)||0) : 1;
  if(paraBirimi!=='TL' && kur<=0){ toast('Geçerli bir kur girin (0\'dan büyük).'); return; }
  if(!firma){ toast('Firma seçin veya yeni firma adı girin.'); return; }
  if(!tarih){ toast('Tarih seçin.'); return; }
  const rows = state.draftItems.filter(r => r.stokKodu.trim() && Number(r.miktar)>0);
  if(rows.length===0){ toast('En az bir kalem girin.'); return; }

  // Mükerrer fatura no kontrolü: fatura no alanından çıkılır çıkılmaz
  // (Tab/Enter) zaten anlık olarak checkFaturaNoDuplicate() ile
  // kullanıcıya gösterilir; burası son bir güvenlik onayı — bilerek
  // yine de kaydetmek isterse (ör. gerçekten aynı fatura numarası farklı
  // bir sevkiyat için kullanılıyorsa) engellemez, sadece bir kez daha sorar.
  if(faturaNo){
    const mukerrer = findMukerrerFatura(firma, faturaNo, tur);
    if(mukerrer){
      const devam = confirm(
        'Bu fatura numarası ('+faturaNo+') "'+firma+'" firmasından daha önce '+fmtDate(mukerrer.tarih)+' tarihinde girilmiş!\n\n' +
        'Yine de kaydetmek istiyor musunuz?'
      );
      if(!devam) return;
    }
  }

  // Kredi limiti kontrolü: sadece Alış faturalarında anlamlı (borcu artırır).
  // Limit tanımlıysa ve bu fatura sonrası bakiye limiti aşacaksa, engellemeden
  // (bazen zaten aşılmış limitle çalışmak gerekebilir) sadece uyarıp onay ister.
  if(tur!=='Satış'){
    const firmaRec = state.firmalar.find(f=>(f.Ad||f.ad)===firma);
    const limit = firmaRec ? Number(firmaRec.KrediLimiti||firmaRec.krediLimiti)||0 : 0;
    if(limit>0){
      const yeniToplam = rows.reduce((s,row)=>{
        const miktar=Number(row.miktar)||0, paket=paketMiktariOf(row.birim), fiyat=Number(row.birimFiyat)||0;
        const indirim=Number(row.indirim)||0, kdvOrani=Number(row.kdvOrani)||0;
        const tutar=miktar*paket*fiyat*(1-indirim/100);
        return s+(tutar+tutar*(kdvOrani/100))*kur;
      },0);
      const mevcutBakiye = computeFirmaBakiye(firma).bakiye;
      const yeniBakiye = mevcutBakiye + yeniToplam;
      if(yeniBakiye>limit){
        const devam = confirm(
          '"'+firma+'" firmasının kredi limiti '+money(limit)+'.\n'+
          'Bu fatura kaydedilirse bakiyeniz '+money(yeniBakiye)+' olacak — limiti aşıyor.\n\n'+
          'Yine de kaydetmek istiyor musunuz?'
        );
        if(!devam) return;
      }
    }
  }

  // 1) Firma yoksa hemen yerel olarak ekle — buluta yazma arka planda olacak
  let newFirmaRecord = null;
  if(!state.firmalar.some(f => (f.Ad||f.ad)===firma)){
    newFirmaRecord = {ID:uid('F'), Ad:firma, Yetkili:'', Telefon:''};
    state.firmalar.push(newFirmaRecord);
  }

  // 2) Tüm kalemleri ANINDA yerel state'e yaz — ağ isteği asla beklenmez
  const kayitTarihi = todayISO(); // fatura üzerindeki tarih geçmişte olabilir; bu, GERÇEKTEN sisteme girildiği gün
  const newRecords = rows.map(row => {
    const miktar = Number(row.miktar)||0;
    const paket = paketMiktariOf(row.birim); // "KL 3000 AD" gibi bileşik birimlerde 3000; düz birimde 1
    const dovizFiyat = Number(row.birimFiyat)||0; // paraBirimi TL ise zaten TL'dir
    const kdvOrani = Number(row.kdvOrani)||0;
    const indirim = Number(row.indirim)||0;
    const dovizTutar = miktar*paket*dovizFiyat*(1-indirim/100);
    const dovizKdvTutari = dovizTutar*(kdvOrani/100);
    const dovizToplam = dovizTutar+dovizKdvTutari;
    // Cari hesap/rapor/ürün fiyat geçmişi TÜMÜYLE TL varsayar — bu yüzden
    // ana alanlar (birimFiyat/tutar/kdvTutari/toplam) HER ZAMAN TL olarak
    // saklanır; orijinal döviz tutarları ayrı (dovizXxx) alanlarda durur.
    const fiyat = dovizFiyat*kur, tutar = dovizTutar*kur, kdvTutari = dovizKdvTutari*kur, toplam = dovizToplam*kur;
    const dataOut = {
      tarih, firma, faturaNo, tur, vadeTarihi, kayitTarihi,
      stokKodu: row.stokKodu.trim(),
      urunAdi: row.urunAdi.trim() || row.stokKodu.trim(),
      birim: row.birim.trim(),
      miktar, birimFiyat: fiyat, kdvOrani, indirim,
      tutar, kdvTutari, toplam: tutar+kdvTutari,
      paraBirimi, kur, dovizBirimFiyat: dovizFiyat, dovizToplam
    };
    const rec = normalizeAlim(Object.assign({ID:uid('A')}, dataOut));
    state.alimlar.push(rec);
    return rec;
  });

  // 2b) Ürün kartındaki (Ürünler sekmesi) fiyat bilgisi faturadakinden
  // FARKLIYSA, sessizce değiştirmek yerine KULLANICIYA SORULUR — çünkü bu
  // fark, Ürün Tanımla'da yanlışlıkla girilmiş bir fiyattan kaynaklanıyor
  // olabilir ve fatura girişi bunu fark etmenin doğal anı. KDV/İndirim/Birim
  // farkı (fiyat aynıyken) hâlâ sessizce güncellenir — bunlarda yanlışlık
  // riski daha düşük ve her faturada sorulması gereksiz yorar.
  const updatedUrunler = [];
  for(const rec of newRecords){
    const u = state.urunler.find(x => String(x.StokKodu||x.stokKodu).toUpperCase()===String(rec.stokKodu).toUpperCase());
    if(!u) continue;
    const eskiFiyat = Number(u.Fiyat!==undefined?u.Fiyat:u.fiyat)||0;
    const eskiKdv = Number(u.KdvOrani!==undefined?u.KdvOrani:u.kdvOrani)||0;
    const eskiIndirim = Number(u.Indirim!==undefined?u.Indirim:u.indirim)||0;
    const eskiBirim = String(u.Birim||u.birim||'');
    const fiyatFarkli = Math.abs(eskiFiyat-rec.birimFiyat)>0.0001;
    const digerFarkli = eskiKdv!==rec.kdvOrani || eskiIndirim!==rec.indirim || (rec.birim && eskiBirim!==rec.birim);
    let fiyatOnaylandi = true;
    if(fiyatFarkli && eskiFiyat>0){
      fiyatOnaylandi = await evetHayirSor(
        '"'+(u.Ad||u.ad)+'" ürününün tanımlı fiyatı '+money(eskiFiyat)+' — bu faturada '+money(rec.birimFiyat)+' girdiniz.\n\n' +
        'Tanımlı fiyattan farklı fiyat girdiniz. Ürün kartındaki fiyat bununla güncellensin mi?',
        'Fiyat Farkı — '+(u.Ad||u.ad)
      );
    }
    if((fiyatFarkli && fiyatOnaylandi) || digerFarkli){
      if(fiyatFarkli && fiyatOnaylandi) u.Fiyat = rec.birimFiyat;
      u.KdvOrani = rec.kdvOrani; u.Indirim = rec.indirim;
      if(rec.birim) u.Birim = rec.birim;
      if(!updatedUrunler.some(x=>(x.ID||x.id)===(u.ID||u.id))) updatedUrunler.push(u);
    }
  }

  await persistAlimlar();
  if(newFirmaRecord) await persistFirmalar();
  if(updatedUrunler.length) await persistUrunler();

  // Bu fatura bir Talep'ten "Faturaya Aktar" ile geldiyse, ilgili talebi
  // "Faturalandı" durumuna çeker — depocu ve yönetici artık bu talebin
  // tamamlandığını görür.
  let completedTalepId = '';
  if(state.activeTalepId){
    const tIdx = state.talepler.findIndex(x=>x.ID===state.activeTalepId);
    if(tIdx!==-1){
      state.talepler[tIdx].Durum = 'Faturalandı';
      await persistTalepler();
      completedTalepId = state.activeTalepId;
    }
    state.activeTalepId = '';
  }

  toast('Fatura kaydedildi (' + rows.length + ' kalem).' + (updatedUrunler.length ? ' ' + updatedUrunler.length + ' ürünün fiyatı güncellendi.' : ''));
  clearDraft();

  // 3) Buluta yazma — bağlıysa arka planda hemen, değilse kuyruğa
  syncNewFaturaToCloud(newFirmaRecord, newRecords, updatedUrunler);
  if(completedTalepId) syncOrQueue({action:'updateTalep', id:completedTalepId, data:{durum:'Faturalandı'}}, {entity:'talep', op:'update', localId:completedTalepId});

  offerStogaAktarForFatura(newRecords, completedTalepId);
}

// Alış faturası kaydedildikten sonra, bu ürünler stoğa aktarılsın mı diye
// sorar. Fatura bir Talep'ten "Faturaya Aktar" ile geldiyse ve o talep
// depo tarafından ZATEN "Stoğa Aktar" ile işlenmişse, mükerrer stok
// sayımını önlemek için önce güçlü bir uyarı gösterir.
// Native confirm() düğme yazıları tarayıcıya göre değişir (Tamam/İptal gibi)
// ve özelleştirilemez — "Evet"/"Hayır" gibi net yazılar için bu özel
// onay penceresini kullanıyoruz. await ile kullanılır, true/false döner.
function evetHayirSor(mesaj, baslik, evetLabel, hayirLabel){
  return new Promise(resolve=>{
    window.__evetHayirResolve = resolve;
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-box" style="max-width:460px;">' +
          (baslik?'<h3>'+escapeHtml(baslik)+'</h3>':'') +
          '<div style="white-space:pre-line;font-size:14px;line-height:1.5;">'+escapeHtml(mesaj)+'</div>' +
          '<div class="modal-actions"><button id="ehHayirBtn" class="btn btn-danger-fill" onclick="evetHayirYanitla(false)" onkeydown="evetHayirOkTusu(event)">'+escapeHtml(hayirLabel||'Hayır')+'</button>' +
            '<button id="ehEvetBtn" class="btn btn-primary" onclick="evetHayirYanitla(true)" onkeydown="evetHayirOkTusu(event)">'+escapeHtml(evetLabel||'Evet')+'</button></div>' +
        '</div>' +
      '</div>';
    const evetBtn = document.getElementById('ehEvetBtn');
    if(evetBtn) evetBtn.focus();
  });
}
// Evet/Hayır onay penceresinde ← / → ile iki buton arasında geçiş yapar
// (Enter/Boşluk zaten odaklı butonu tetikler — tarayıcının kendi davranışı).
function evetHayirOkTusu(event){
  if(event.key!=='ArrowLeft' && event.key!=='ArrowRight') return;
  event.preventDefault();
  const hedefId = event.target.id==='ehEvetBtn' ? 'ehHayirBtn' : 'ehEvetBtn';
  const hedef = document.getElementById(hedefId);
  if(hedef) hedef.focus();
}
function evetHayirYanitla(sonuc){
  closeModal();
  if(window.__evetHayirResolve){ const r=window.__evetHayirResolve; window.__evetHayirResolve=null; r(sonuc); }
}
async function offerStogaAktarForFatura(newRecords, completedTalepId){
  if(!newRecords || newRecords.length===0) return;
  if((newRecords[0].tur||'Alış')!=='Alış') return; // sadece Alış faturaları stoğu artırır
  const faturaNo = String(newRecords[0].faturaNo||'').trim().toLocaleUpperCase('tr-TR');
  const firma = String(newRecords[0].firma||'').trim().toLocaleUpperCase('tr-TR');
  // 1) Bu faturanın "Faturaya Aktar" ile geldiği talep zaten stoğa aktarılmış mı?
  let eslesenTalep = completedTalepId ? state.talepler.find(x=>x.ID===completedTalepId) : null;
  if(eslesenTalep && (eslesenTalep.StogaAktarildi||eslesenTalep.stogaAktarildi)!=='1') eslesenTalep = null;
  // 2) Bulunamadıysa: depo tarafında girilen fatura no'ya göre TÜM talepler
  // arasında eşleşme ara — fatura "Faturaya Aktar" ile değil, tamamen
  // bağımsız girilmiş olsa bile ıskalanmaz.
  if(!eslesenTalep && faturaNo){
    eslesenTalep = state.talepler.find(t=>{
      if((t.StogaAktarildi||t.stogaAktarildi)!=='1') return false;
      const tFaturaNo = String(t.StogaAktarilanFaturaNo||t.stogaAktarilanFaturaNo||'').trim().toLocaleUpperCase('tr-TR');
      if(!tFaturaNo || tFaturaNo!==faturaNo) return false;
      // Firma bilgisi varsa (talebin onaylandığı firma), ek doğrulama için karşılaştır.
      const tFirma = String(t.Firma||t.firma||'').trim().toLocaleUpperCase('tr-TR');
      return !tFirma || !firma || tFirma===firma;
    });
  }
  if(eslesenTalep){
    const devam = await evetHayirSor(
      '⚠️ UYARI: Bu fatura numarasına ("'+(newRecords[0].faturaNo||'')+'") ait ürünler, "'+(eslesenTalep.Baslik||eslesenTalep.baslik||'')+'" talebi üzerinden depo tarafından ZATEN stoğa aktarılmış görünüyor.\n\n' +
      'Bu faturayı da stoğa aktarırsanız, aynı ürünler İKİNCİ KEZ stoğa eklenmiş olur (stok mükerrer sayılır).\n\n' +
      'Yine de stoğa aktarmak istediğinizden emin misiniz?',
      'Mükerrer Stok Uyarısı'
    );
    if(!devam) return;
  }
  const aktar = await evetHayirSor('Bu alım faturasındaki '+newRecords.length+' kalem stoğa aktarılsın mı?', 'Stoğa Aktar');
  if(!aktar) return;
  openStogaAktarForFaturaModal(newRecords);
}
function openStogaAktarForFaturaModal(records){
  window.__pendingStogaAktarRecords = records;
  const rowsHtml = records.map((r,i)=>{
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(r.stokKodu||'').toUpperCase());
    const mevcutStok = u ? Number(u.Stok!==undefined?u.Stok:u.stok)||0 : 0;
    return '<div class="form-row" style="grid-template-columns:2fr 1fr 0.8fr;align-items:end;margin-bottom:10px;">' +
      '<div><b>'+escapeHtml(r.urunAdi)+'</b><div class="hint" style="margin:2px 0 0;">Mevcut stok (Ana Ambar): '+num(mevcutStok,2)+' '+escapeHtml(r.birim||'')+'</div></div>' +
      '<div class="field" style="margin:0;"><label>Gelen miktar</label><input id="fsa_'+i+'" type="number" step="any" value="'+(Number(r.miktar)||0)+'"></div>' +
      '<div class="field" style="margin:0;"><label>Birim</label><div class="ro">'+escapeHtml(r.birim||'')+'</div></div>' +
    '</div>';
  }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:560px;">' +
        '<h3>Stoğa Aktar</h3>' +
        '<div class="section-desc" style="margin-top:-6px;">Faturadaki miktarları kontrol edin/düzeltin, hangi ambara ekleneceğini seçin, sonra aktarın.</div>' +
        '<div class="field" style="margin-bottom:12px;"><label>Ambar</label><select id="fsaAmbar">' +
          '<option value="">Ana Ambar</option>' +
          state.ambarlar.map(a=>'<option value="'+escapeHtml(a.Ad||a.ad)+'">'+escapeHtml(a.Ad||a.ad)+'</option>').join('') +
        '</select><div class="hint" style="margin-top:4px;">"Ana Ambar" dışında bir ambar seçerseniz, ürün doğrudan o ambara aktarılır (Ana Ambar stoğu değişmez, o ambarın Çıkış raporuna işlenir).</div></div>' +
        rowsHtml +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Vazgeç</button>' +
          '<button class="btn btn-primary" onclick="confirmStogaAktarForFatura()">Stoğa Aktar</button></div>' +
      '</div>' +
    '</div>';
}
async function confirmStogaAktarForFatura(){
  const records = window.__pendingStogaAktarRecords||[];
  const ambarSecili = (document.getElementById('fsaAmbar').value||'').trim();
  const updatedUrunler = [];
  const yeniTransferler = [];
  const tarih = todayISO();
  records.forEach((r,i)=>{
    const el = document.getElementById('fsa_'+i);
    const miktar = el ? Number(el.value)||0 : Number(r.miktar)||0;
    if(miktar<=0) return;
    const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(r.stokKodu||'').toUpperCase());
    if(!u) return;
    if(!ambarSecili){
      const eski = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
      u.Stok = eski + miktar;
      if(!updatedUrunler.some(x=>(x.ID||x.id)===(u.ID||u.id))) updatedUrunler.push(u);
    } else {
      const birimFiyat = Number(r.birimFiyat)||getSonAlisFiyati(u.StokKodu||u.stokKodu);
      const rec = {
        ID:uid('TR'), tarih, yon:'Çıkış', ambar:ambarSecili,
        stokKodu:u.StokKodu||u.stokKodu, urunAdi:u.Ad||u.ad, birim:r.birim||u.Birim||u.birim||'',
        miktar, birimFiyat, tutar:miktar*birimFiyat,
        aciklama:'Alım Faturasından Stoğa Aktar'
      };
      state.transferler.push(rec);
      yeniTransferler.push(rec);
    }
  });
  if(updatedUrunler.length) await persistUrunler();
  if(yeniTransferler.length) await persistTransferler();
  closeModal();
  toast(ambarSecili ? ('"'+ambarSecili+'" ambarına aktarıldı.') : 'Ana Ambar stoğuna aktarıldı.');
  renderContent();
  updatedUrunler.forEach(u=>{
    syncOrQueue({action:'updateUrun', id:(u.ID||u.id), data:{stok:u.Stok}}, {entity:'urun', op:'update', localId:(u.ID||u.id)});
  });
  yeniTransferler.forEach(rec=>{
    syncOrQueue({action:'addTransfer', data:{tarih:rec.tarih, yon:rec.yon, ambar:rec.ambar, stokKodu:rec.stokKodu, urunAdi:rec.urunAdi, birim:rec.birim, miktar:rec.miktar, birimFiyat:rec.birimFiyat, tutar:rec.tutar, aciklama:rec.aciklama}}, {entity:'transfer', op:'add', localId:rec.ID});
  });
  window.__pendingStogaAktarRecords = null;
}
// Bir faturanın TÜM kalemlerini TEK bir istekte (addAlimBatch) buluta
// gönderir — N ayrı ardışık istek yerine. Başarısız olursa (bir kez daha
// deneyip) her kalemi TEK TEK, normal kuyruğa-düşebilen yolla göndermeye
// geri döner; hiçbir kayıt kaybolmaz, sadece daha yavaş işlenir.
async function syncAlimBatchToCloud(newRecords){
  if(!newRecords || newRecords.length===0) return;
  const alanlariCikar = rec => ({
    tarih:rec.tarih, firma:rec.firma, faturaNo:rec.faturaNo, stokKodu:rec.stokKodu,
    urunAdi:rec.urunAdi, birim:rec.birim, miktar:rec.miktar, birimFiyat:rec.birimFiyat,
    kdvOrani:rec.kdvOrani, indirim:rec.indirim, tutar:rec.tutar, kdvTutari:rec.kdvTutari, toplam:rec.toplam, tur:rec.tur, vadeTarihi:rec.vadeTarihi||'', kayitTarihi:rec.kayitTarihi||'', paraBirimi:rec.paraBirimi||'TL', kur:rec.kur||1, dovizBirimFiyat:rec.dovizBirimFiyat||0, dovizToplam:rec.dovizToplam||0
  });
  if(!state.apiUrl || state.syncMode==='manual'){
    // Bulut bağlantısı yok/manuel mod — doğrudan kuyruğa at (mevcut davranış).
    for(const rec of newRecords){
      queuePendingOp({action:'addAlim', data:alanlariCikar(rec)}, {entity:'alim', op:'add', localId:rec.ID});
    }
    return;
  }
  const payload = {action:'addAlimBatch', data:{items:newRecords.map(alanlariCikar)}};
  let r = null, basarili = false;
  try{
    r = await apiPost(payload);
    if(r && r.ok===false) throw new Error(r.error||'İşlem başarısız');
    basarili = true;
  }catch(e){
    try{
      await new Promise(res=>setTimeout(res, 1200));
      r = await apiPost(payload);
      if(r && r.ok===false) throw new Error(r.error||'İşlem başarısız');
      basarili = true;
    }catch(e2){ basarili = false; }
  }
  if(!basarili){
    // Toplu istek iki denemede de başarısız oldu — her kalemi ayrı ayrı,
    // normal (kuyruğa düşebilen) yoldan göndermeye devam et.
    for(const rec of newRecords){
      await syncOrQueue({action:'addAlim', data:alanlariCikar(rec)}, {entity:'alim', op:'add', localId:rec.ID});
    }
    return;
  }
  state.connected = true;
  flashSyncSuccess();
  const ids = (r && r.ids) || [];
  let idDegisti = false;
  for(let i=0;i<newRecords.length;i++){
    if(ids[i] && ids[i]!==newRecords[i].ID){
      const eskiId = newRecords[i].ID;
      const idx = state.alimlar.findIndex(a=>a.ID===eskiId);
      if(idx!==-1){ state.alimlar[idx].ID = ids[i]; idDegisti = true; }
      newRecords[i].ID = ids[i];
    }
  }
  if(idDegisti) await persistAlimlar();
}
async function syncNewFaturaToCloud(newFirmaRecord, newRecords, updatedUrunler){
  // Bu işlem birden fazla ARDIŞIK bulut isteği atıyor (firma + her kalem +
  // fiyatı değişen ürünler) — arada arka plan senkronu (backgroundSync)
  // devreye girip AYNI ANDA tabloya yazmaya/okumaya çalışırsa, Google
  // Sheets bazen kilit/zaman aşımı hatası verebiliyor ("buluta
  // gönderilemedi"). Bu sayaç, işlem bitene kadar arka plan turlarını
  // duraklatır.
  state.aktifApiIslemSayisi = (state.aktifApiIslemSayisi||0) + 1;
  try{
  if(newFirmaRecord){
    await syncOrQueue(
      {action:'addFirma', data:{ad:newFirmaRecord.Ad, yetkili:newFirmaRecord.Yetkili, telefon:newFirmaRecord.Telefon}},
      {entity:'firma', op:'add', localId:newFirmaRecord.ID}
    );
  }
  await syncAlimBatchToCloud(newRecords);
  for(const u of (updatedUrunler||[])){
    const id = u.ID||u.id;
    const data = {
      ad:u.Ad||u.ad, fiyat:u.Fiyat!==undefined?u.Fiyat:u.fiyat, birim:u.Birim||u.birim,
      kdvOrani:u.KdvOrani!==undefined?u.KdvOrani:u.kdvOrani, indirim:u.Indirim!==undefined?u.Indirim:u.indirim,
      marka:u.Marka||u.marka||'', icerik:u.Icerik||u.icerik||'', satici:u.Satici||u.satici||''
    };
    await syncOrQueue({action:'updateUrun', id, data}, {entity:'urun', op:'update', localId:id});
  }
  renderContent();
  } finally {
    state.aktifApiIslemSayisi = Math.max(0, (state.aktifApiIslemSayisi||0) - 1);
  }
}

// Kod.gs'ten (Google E-Tablo) gelen bir kaydın, farklı harf/isim
// biçimlerinde olabilecek alanlarını dener (Firma/Ürün kayıtlarında
// zaten kullanılan Ad/ad tarzı büyük-küçük harf toleransının aynısı,
// Alım kayıtları için de burada uygulanıyor). Bu, "buluttan çekince
// tüm alanlar boş/0 görünüyor" sorununun kök nedeniydi.
function pickField(rec, names){
  for(let i=0;i<names.length;i++){
    const v = rec[names[i]];
    if(v !== undefined && v !== null && v !== '') return v;
  }
  return undefined;
}
function normalizeAlim(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id','Id']),
    tarih: pickField(rec,['tarih','Tarih']) || '',
    firma: pickField(rec,['firma','Firma']) || '',
    faturaNo: pickField(rec,['faturaNo','FaturaNo','Fatura No','fatura_no']) || '',
    stokKodu: pickField(rec,['stokKodu','StokKodu','Stok Kodu']) || '',
    urunAdi: pickField(rec,['urunAdi','UrunAdi','Ürün Adı','Urun Adi']) || '',
    birim: pickField(rec,['birim','Birim']) || '',
    miktar: Number(pickField(rec,['miktar','Miktar']))||0,
    birimFiyat: Number(pickField(rec,['birimFiyat','BirimFiyat','Birim Fiyat']))||0,
    kdvOrani: Number(pickField(rec,['kdvOrani','KdvOrani','KDV Oranı','KDV']))||0,
    indirim: Number(pickField(rec,['indirim','Indirim','İndirim']))||0,
    tutar: Number(pickField(rec,['tutar','Tutar']))||0,
    kdvTutari: Number(pickField(rec,['kdvTutari','KdvTutari','KDV Tutarı']))||0,
    toplam: Number(pickField(rec,['toplam','Toplam']))||0,
    tur: pickField(rec,['tur','Tur']) || 'Alış',
    vadeTarihi: pickField(rec,['vadeTarihi','VadeTarihi','Vade Tarihi']) || '',
    // Faturanın ÜZERİNDEKİ tarih (tarih alanı) ile bu kaydın SİSTEME
    // girildiği tarih farklı olabilir — tedarikçi siparişi aldığı gün
    // faturayı kesip 1-2 gün sonra mal gelince fatura üzerindeki (geçmiş)
    // tarihi giriyorsanız, Pano'daki "Bugün/Bu hafta" gibi metrikler
    // faturanın SİSTEME girildiği güne göre hesaplanır — kayitTarihi bu
    // yüzden ayrı tutulur ve kullanıcı tarafından değiştirilemez.
    kayitTarihi: pickField(rec,['kayitTarihi','KayitTarihi','Kayıt Tarihi']) || '',
    // Fatura hangi para biriminde girildi (TL/USD/EUR/GBP), o girişteki kur,
    // ve orijinal döviz tutarları — ana alanlar (tutar/toplam vb.) her
    // zaman TL'dir, bunlar sadece bilgi/gösterim amaçlıdır.
    paraBirimi: pickField(rec,['paraBirimi','ParaBirimi']) || 'TL',
    kur: Number(pickField(rec,['kur','Kur']))||1,
    dovizBirimFiyat: Number(pickField(rec,['dovizBirimFiyat','DovizBirimFiyat']))||0,
    dovizToplam: Number(pickField(rec,['dovizToplam','DovizToplam']))||0
  };
}

// toplamlarına geriye dönük olarak da dahil olur.
async function markInvoiceGroupAsToday(gi){
  const g = (window.__invoiceGroups||[])[gi];
  if(!g || !g.items || !g.items.length) return;
  if(!canDo('alimlar','edit')){ yetkiYokUyar(); return; }
  if(!confirm('Bu faturayı BUGÜN ('+fmtDate(todayISO())+') sisteme girmiş olarak işaretleyelim mi?\n\nBu, Pano\'daki "Bugün / Bu hafta / Bu ay" toplamlarına dahil olmasını sağlar.')) return;
  const kayitTarihi = new Date().toISOString();
  g.items.forEach(item=>{
    const idx = state.alimlar.findIndex(x=>x.ID===item.ID);
    if(idx!==-1) state.alimlar[idx].kayitTarihi = kayitTarihi;
  });
  await persistAlimlar();
  toast('İşaretlendi — Pano güncellendi.');
  renderContent();
  g.items.forEach(item=>{
    syncOrQueue({action:'updateAlim', id:item.ID, data:{kayitTarihi}}, {entity:'alim', op:'update', localId:item.ID});
  });
}

function invoiceGroups(rows){
  const map = {};
  const order = [];
  rows.forEach(a=>{
    const key = a.firma+'||'+(a.faturaNo||'')+'||'+a.tarih;
    if(!map[key]){ map[key] = {firma:a.firma, faturaNo:a.faturaNo, tarih:a.tarih, vadeTarihi:a.vadeTarihi||'', kayitTarihi:a.kayitTarihi||'', paraBirimi:a.paraBirimi||'TL', kur:a.kur||1, items:[], toplam:0}; order.push(key); }
    map[key].items.push(a);
    map[key].toplam += Number(a.toplam||0);
  });
  return order.map(k=>map[k]).sort((a,b)=> String(b.kayitTarihi||b.tarih||'').localeCompare(String(a.kayitTarihi||a.tarih||'')));
}

/* ---------- Excel tarzı sütun filtreleri ---------- */
function alimColValue(a, col){ if(col==='islemTarihi') return (a.kayitTarihi ? String(a.kayitTarihi).slice(0,10) : a.tarih); return a[col]; }

function columnFilterBaseRows(excludeCol){
  const f = state.filters;
  return state.alimlar.filter(a => {
    if(f.firma && a.firma!==f.firma) return false;
    if(f.urun && a.stokKodu!==f.urun) return false;
    const islemTarihi = a.kayitTarihi ? String(a.kayitTarihi).slice(0,10) : a.tarih;
    if(f.from && islemTarihi < f.from) return false;
    if(f.to && islemTarihi > f.to) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (a.faturaNo+' '+a.urunAdi+' '+a.stokKodu+' '+a.firma).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    for(const col in state.colFilters){
      if(col===excludeCol) continue;
      const set = state.colFilters[col];
      if(set && !set.has(String(alimColValue(a,col)))) return false;
    }
    return true;
  });
}

function openColumnFilter(colKey){
  const col = ALIM_COLUMNS.find(c=>c.key===colKey);
  const rows = columnFilterBaseRows(colKey);
  const uniqVals = Array.from(new Set(rows.map(a=>alimColValue(a,colKey)))).sort((a,b)=>{
    if(typeof a === 'number' && typeof b === 'number') return a-b;
    return String(a).localeCompare(String(b),'tr');
  });
  window.__colFilterValues = uniqVals;
  const activeSet = state.colFilters[colKey];
  const itemsHtml = uniqVals.map((v,idx) => {
    const label = col.fmt ? col.fmt(v) : String(v);
    const checked = !activeSet || activeSet.has(String(v));
    return '<label class="filter-item"><input type="checkbox" value="'+idx+'" '+(checked?'checked':'')+'> '+escapeHtml(label===''?'(boş)':label)+'</label>';
  }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:380px;">' +
        '<h3>'+col.label+' — Filtrele</h3>' +
        '<input type="text" class="filter-search" placeholder="Ara…" oninput="filterColSearch(this.value)">' +
        '<div style="display:flex;gap:10px;margin-bottom:8px;">' +
          '<button class="btn btn-sm btn-ghost" onclick="toggleAllColFilter(true)">Tümünü seç</button>' +
          '<button class="btn btn-sm btn-ghost" onclick="toggleAllColFilter(false)">Tümünü kaldır</button>' +
        '</div>' +
        '<div id="colFilterList" style="max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;">'+itemsHtml+'</div>' +
        '<div class="modal-actions">' +
          '<button class="btn" onclick="closeModal()">Vazgeç</button>' +
          '<button class="btn btn-primary" onclick="applyColumnFilter(\''+colKey+'\')">Uygula</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}
function filterColSearch(q){
  q = q.toLowerCase();
  document.querySelectorAll('#colFilterList .filter-item').forEach(el=>{
    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
function toggleAllColFilter(checked){
  document.querySelectorAll('#colFilterList .filter-item').forEach(el=>{
    if(el.style.display !== 'none') el.querySelector('input').checked = checked;
  });
}
function applyColumnFilter(colKey){
  const checkboxes = document.querySelectorAll('#colFilterList input[type=checkbox]');
  const allVals = window.__colFilterValues || [];
  const checkedVals = [];
  checkboxes.forEach(cb=>{ if(cb.checked) checkedVals.push(String(allVals[Number(cb.value)])); });
  if(checkedVals.length === allVals.length || checkedVals.length === 0){
    delete state.colFilters[colKey];
  } else {
    state.colFilters[colKey] = new Set(checkedVals);
  }
  closeModal();
  renderContent();
}

// Her tuş vuruşunda tüm sekme içeriği yeniden çizildiği için canlı arama
// kutuları odağı kaybediyordu (bir harf yazıp fareyle tekrar tıklamak
// gerekiyordu) — render'dan önce odaklı elemanın id'sini ve imleç
// konumunu kaydedip, render'dan sonra aynı id'li elemana geri
// odaklanıyoruz. TÜM canlı arama/filtre kutuları bunu kullanmalı; kutunun
// bir "id" özniteliği olması şart, aksi halde odak geri gelmez.
function renderContentKeepFocus(){
  const el = document.activeElement;
  const focusId = el && el.id ? el.id : null;
  const selStart = el ? el.selectionStart : null;
  const selEnd = el ? el.selectionEnd : null;
  renderContent();
  if(focusId){
    const el2 = document.getElementById(focusId);
    if(el2){
      el2.focus();
      if(selStart!=null && el2.setSelectionRange){ try{ el2.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function setFilter(key, val){
  state.filters[key]=val;

async function saveEditAlim(id){
  if(!canDo('alimlar','edit')){ yetkiYokUyar(); return; }
  const idx = state.alimlar.findIndex(x=>x.ID===id);
  if(idx===-1){ closeModal(); return; }
  const tarih = document.getElementById('eaTarih').value;
  const firma = document.getElementById('eaFirma').value.trim();
  const faturaNo = document.getElementById('eaFaturaNo').value.trim();
  const vadeTarihi = document.getElementById('eaVadeTarihi').value;
  const stokKodu = document.getElementById('eaStokKodu').value.trim();
  const urunAdi = document.getElementById('eaUrunAdi').value.trim();
  const birim = document.getElementById('eaBirim').value;
  const miktar = Number(document.getElementById('eaMiktar').value)||0;
  const birimFiyat = Number(document.getElementById('eaBirimFiyat').value)||0;
  const kdvOrani = Number(document.getElementById('eaKdv').value)||0;
  const indirim = Number(document.getElementById('eaIndirim').value)||0;
  if(!tarih){ toast('Tarih seçin.'); return; }
  if(!firma){ toast('Firma girin.'); return; }
  if(!stokKodu){ toast('Stok kodu girin.'); return; }
  if(miktar<=0){ toast('Miktar 0\'dan büyük olmalı.'); return; }
  const tutar = miktar*birimFiyat*(1-indirim/100);
  const kdvTutari = tutar*(kdvOrani/100);
  const dataOut = {
    tarih, firma, faturaNo, vadeTarihi, stokKodu, urunAdi: urunAdi || stokKodu, birim,
    miktar, birimFiyat, kdvOrani, indirim,
    tutar, kdvTutari, toplam: tutar+kdvTutari,
    kayitTarihi: state.alimlar[idx].kayitTarihi || '' // düzenleme, ilk giriş tarihini değiştirmesin
  };
  state.alimlar[idx] = normalizeAlim(Object.assign({ID:id}, dataOut));
  await persistAlimlar();
  closeModal();
  toast('Kayıt güncellendi.');
  renderContent();
  syncOrQueue({action:'updateAlim', id, data:dataOut}, {entity:'alim', op:'update', localId:id});
}

var XL_TEAL = 'FF145C54';
var XL_TEAL_DARK = 'FF0C3D38';
var XL_STRIPE = 'FFF7F5EE';
var XL_BORDER = 'FFEAE6D9';
var XL_ACCENT_TINT = 'FFF5EAD3';

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();

function styleHeaderRow(row){
  row.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL_TEAL} };
    cell.alignment = { vertical:'middle', horizontal:'left' };
    cell.border = { bottom:{style:'medium', color:{argb:XL_TEAL_DARK}} };
  });
  row.height = 20;
}
function styleGroupLabelRow(row){
  row.eachCell(cell=>{
    cell.font = { bold:true, size:11, color:{argb:XL_TEAL_DARK} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL_ACCENT_TINT} };
  });
  row.height = 18;
}
function styleDataRow(row, striped, numericCols, currencyCols){
  row.eachCell((cell, colNum)=>{
    cell.border = { bottom:{style:'hair', color:{argb:XL_BORDER}} };
    if(striped) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL_STRIPE} };
    if(currencyCols && currencyCols.includes(colNum)){ cell.numFmt = '#,##0.00" TL"'; cell.alignment = {horizontal:'right'}; }
    else if(numericCols && numericCols.includes(colNum)){ cell.alignment = {horizontal:'right'}; }
  });
}
function styleTotalRow(row, numericCols, currencyCols){
  row.eachCell((cell, colNum)=>{
    cell.font = { bold:true, size:11, color:{argb:XL_TEAL_DARK} };
    cell.border = { top:{style:'medium', color:{argb:XL_TEAL}} };
    if(currencyCols && currencyCols.includes(colNum)){ cell.numFmt = '#,##0.00" TL"'; cell.alignment={horizontal:'right'}; }
    else if(numericCols && numericCols.includes(colNum)){ cell.alignment={horizontal:'right'}; }
  });
  row.height = 20;
}

async function exportAlimlarExcel(groupBy){
  closeModal();
  if(typeof ExcelJS === 'undefined'){ toast('Excel kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin.'); return; }
  const rows = filteredAlimlar();
  if(rows.length===0){ toast('Aktarılacak kayıt yok.'); return; }
  toast('Excel hazırlanıyor…');

  const groupKeyFn = groupBy==='tarih' ? (a=>a.tarih) : groupBy==='firma' ? (a=>a.firma) : groupBy==='urun' ? (a=>a.urunAdi) : null;
  const groupLabel = {tarih:'Tarih', firma:'Firma', urun:'Ürün'}[groupBy] || '';
  const headers = ['Tarih','Firma','Fatura No','Stok Kodu','Ürün','Birim','Miktar','Birim Fiyat','KDV %','İndirim %','Toplam','Fatura Durumu'];
  const colWidths = [12,22,13,12,34,8,9,12,8,9,13,16];
  const numericCols = [7,9,10];
  const currencyCols = [8,11];
  // Aynı fatura için computeFaturaOdemeDurumu'yu (firma bazında FIFO
  // hesap) her satırda tekrar tekrar çağırmamak için firma başına önbelleğe alınır.
  const durumCache = {};
  const durumOf = a=>{
    if(!durumCache[a.firma]) durumCache[a.firma] = computeFaturaOdemeDurumu(a.firma);
    const tur = a.tur||'Alış';
    if(tur!=='Alış') return '—';
    const od = durumCache[a.firma][(a.tarih||'')+'|'+(a.faturaNo||'')];
    return od ? faturaDurumMetni(od) : '—';
  };

  let sorted = rows.slice();
  if(groupKeyFn) sorted.sort((a,b)=> String(groupKeyFn(a)).localeCompare(String(groupKeyFn(b)),'tr') || String(b.tarih||'').localeCompare(String(a.tarih||'')));
  else sorted.sort((a,b)=> String(b.tarih||'').localeCompare(String(a.tarih||'')));

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Cari Hesaplar';
  const ws = wb.addWorksheet('Alımlar');
  ws.columns = colWidths.map(w=>({width:w}));

  let grandTotal = 0;
  if(groupKeyFn){
    let lastGroupVal, stripeToggle=false;
    sorted.forEach(a=>{
      const gv = groupKeyFn(a);
      if(gv !== lastGroupVal){
        const gRow = ws.addRow([groupLabel+': '+(groupBy==='tarih'?fmtDate(gv):gv)]);
        ws.mergeCells(gRow.number,1,gRow.number,headers.length);
        styleGroupLabelRow(gRow);
        const hRow = ws.addRow(headers);
        styleHeaderRow(hRow);
        lastGroupVal = gv; stripeToggle=false;
      }
      const r = ws.addRow([fmtDate(a.tarih), a.firma, a.faturaNo, a.stokKodu, a.urunAdi, a.birim, a.miktar, a.birimFiyat, a.kdvOrani, a.indirim||0, a.toplam, durumOf(a)]);
      styleDataRow(r, stripeToggle, numericCols, currencyCols);
      stripeToggle = !stripeToggle;
      grandTotal += Number(a.toplam||0);
    });
  } else {
    const hRow = ws.addRow(headers);
    styleHeaderRow(hRow);
    ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:headers.length} };
    ws.views = [{ state:'frozen', ySplit:1 }];
    sorted.forEach((a,i)=>{
      const r = ws.addRow([fmtDate(a.tarih), a.firma, a.faturaNo, a.stokKodu, a.urunAdi, a.birim, a.miktar, a.birimFiyat, a.kdvOrani, a.indirim||0, a.toplam, durumOf(a)]);
      styleDataRow(r, i%2===1, numericCols, currencyCols);
      grandTotal += Number(a.toplam||0);
    });
  }
  const totalRow = ws.addRow(['','','','','','','','','','Genel Toplam', grandTotal, '']);
  styleTotalRow(totalRow, numericCols, currencyCols);

  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'alimlar-'+todayISO()+'.xlsx');
  toast('Excel dosyası indirildi.');
}

function exportCsv(){
  const rows = filteredAlimlar();
  const headers = ['Tarih','Firma','FaturaNo','StokKodu','Urun','Birim','Miktar','BirimFiyat','KdvOrani','Indirim','Tutar','KdvTutari','Toplam','FaturaDurumu'];
  const lines = [headers.join(';')];
  const durumCache = {};
  rows.forEach(a=>{
    if(!durumCache[a.firma]) durumCache[a.firma] = computeFaturaOdemeDurumu(a.firma);
    const tur = a.tur||'Alış';
    const od = tur==='Alış' ? durumCache[a.firma][(a.tarih||'')+'|'+(a.faturaNo||'')] : null;
    lines.push([a.tarih,a.firma,a.faturaNo,a.stokKodu,a.urunAdi,a.birim,a.miktar,a.birimFiyat,a.kdvOrani,a.indirim||0,a.tutar,a.kdvTutari,a.toplam,faturaDurumMetni(od)]
      .map(v=>String(v==null?'':v).replace(/;/g,',')).join(';'));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'alimlar_' + todayISO() + '.csv';
  a.click();
}

async function confirmWhatsAppShare(){

async function buildShareExcelBlob(groups, detail){
  if(typeof ExcelJS === 'undefined'){ toast('Excel kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin.'); return null; }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Cari Hesaplar';
  const ws = wb.addWorksheet('Rapor');
  let grandTotal = 0;
  if(detail === 'summary'){
    ws.columns = [{width:22},{width:14},{width:12},{width:10},{width:14},{width:16}];
    const hRow = ws.addRow(['Firma','Fatura No','Tarih','Kalem Sayısı','Toplam','Fatura Durumu']);
    styleHeaderRow(hRow);
    ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:6} };
    ws.views = [{ state:'frozen', ySplit:1 }];
    groups.forEach((g,i)=>{
      const tur = (g.items[0] && g.items[0].tur) || 'Alış';
      const od = faturaDurumuFor(g.firma, g.tarih, g.faturaNo, tur);
      const r = ws.addRow([g.firma, g.faturaNo||'', fmtDate(g.tarih), g.items.length, g.toplam, faturaDurumMetni(od)]);
      styleDataRow(r, i%2===1, [4], [5]);
      grandTotal += Number(g.toplam||0);
    });
    const totalRow = ws.addRow(['','','','Genel Toplam', grandTotal, '']);
    styleTotalRow(totalRow, [4], [5]);
  } else {
    ws.columns = [{width:12},{width:20},{width:13},{width:12},{width:32},{width:8},{width:9},{width:12},{width:8},{width:9},{width:13},{width:16}];
    const hRow = ws.addRow(['Tarih','Firma','Fatura No','Stok Kodu','Ürün','Birim','Miktar','Birim Fiyat','KDV %','İndirim %','Toplam','Fatura Durumu']);
    styleHeaderRow(hRow);
    ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:12} };
    ws.views = [{ state:'frozen', ySplit:1 }];
    const durumCache = {};
    let i=0;
    groups.forEach(g => g.items.forEach(a => {
      if(!durumCache[a.firma]) durumCache[a.firma] = computeFaturaOdemeDurumu(a.firma);
      const tur = a.tur||'Alış';
      const od = tur==='Alış' ? durumCache[a.firma][(a.tarih||'')+'|'+(a.faturaNo||'')] : null;
      const r = ws.addRow([fmtDate(a.tarih), a.firma, a.faturaNo, a.stokKodu, a.urunAdi, a.birim, a.miktar, a.birimFiyat, a.kdvOrani, a.indirim||0, a.toplam, faturaDurumMetni(od)]);
      styleDataRow(r, i%2===1, [7,9,10], [8,11]);
      grandTotal += Number(a.toplam||0);
      i++;
    }));
    const totalRow = ws.addRow(['','','','','','','','','','Genel Toplam', grandTotal, '']);
    styleTotalRow(totalRow, [7,9,10], [8,11]);
  }
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// PDF, ekran dışında değil, geçici olarak gerçek bir sayfa konumunda (görünür bir
// katmanda) oluşturuluyor ve yakalanmadan önce tarayıcının onu tam olarak
// "boyaması" bekleniyor — boş/beyaz PDF çıkma sorununun kök nedeni buydu.
async function renderHtmlToPdfBlob(innerHtml){
  if(typeof html2pdf === 'undefined'){ toast('PDF kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin.'); return null; }
  ensurePdfShareStyles();
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:#fff; z-index:99999; overflow:auto; padding:16px; display:flex; justify-content:center;';
  const container = document.createElement('div');
  container.innerHTML = innerHtml;
  overlay.appendChild(container);
  document.body.appendChild(overlay);
  await new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    return await html2pdf().set({
      margin: [12,10,12,10],
      filename: 'export.pdf',
      html2canvas: { scale:2, backgroundColor:'#ffffff', useCORS:true },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['css','avoid-all'] }
    }).from(container).outputPdf('blob');
  } finally {
    document.body.removeChild(overlay);
  }
}
async function buildSharePdfBlob(groups, detail){
  return renderHtmlToPdfBlob(buildPdfHtmlFragment(groups, detail));
}
async function shareFileViaWhatsApp(blob, filename, text, phone){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text, title:filename});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // kullanıcı paylaşımı iptal etti
  }
  // Masaüstü / desteklenmeyen tarayıcı: dosyayı indir + WhatsApp sohbetini metinle aç
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  const waUrl = (phone ? 'https://wa.me/'+phone : 'https://wa.me/') + '?text=' + encodeURIComponent(text);
  setTimeout(()=>{
    window.open(waUrl, '_blank');
    toast('Dosya indirildi. Açılan WhatsApp sohbetinde 📎 ile dosyayı ekleyin.');
  }, 400);
}

function viewRaporlar(tur){
  tur = tur || 'Alış';
  const baslikKelime = tur==='Satış' ? 'satış' : 'alış';
  const r = state.report;
  const kaynakRows = state.alimlar.filter(a => (a.tur||'Alış')===tur);
  if(kaynakRows.length===0) return emptyState('Rapor için veri yok', (tur==='Satış'?'Satış':'Alış')+' faturası ekledikçe burada dönemsel raporlar oluşur.');

  const from = r.from || '';
  const to = r.to || '';
  const rangeRows = kaynakRows.filter(a => (!from || a.tarih>=from) && (!to || a.tarih<=to));

  const groups = groupPeriods(rangeRows, r.granularity);
  const keys = Object.keys(groups).sort();
  const maxTutar = Math.max(1, ...keys.map(k=>groups[k].tutar));

  const byDim = {};
  rangeRows.forEach(a=>{
    const dimKey = r.groupBy==='urun' ? (a.stokKodu+' — '+a.urunAdi) : a.firma;
    if(!byDim[dimKey]) byDim[dimKey] = {miktar:0, tutar:0};
    byDim[dimKey].miktar += Number(a.miktar||0);
    byDim[dimKey].tutar += Number(a.toplam||0);
  });
  const dimRows = Object.entries(byDim).sort((a,b)=>b[1].tutar-a[1].tutar);

  // Firma Toplamları — sadece firma adı + toplam tutar (aynı tarih aralığı geçerli)
  const byFirmaTotal = {};
  rangeRows.forEach(a=>{ byFirmaTotal[a.firma] = (byFirmaTotal[a.firma]||0) + Number(a.toplam||0); });
  const firmaTotalRows = Object.entries(byFirmaTotal).sort((a,b)=>b[1]-a[1]);
  window.__firmaToplamData = { rows: firmaTotalRows, period: { from, to } };

  window.__reportData = { keys, groups, dimRows, r: Object.assign({}, r) };

  return (
    '<div class="card" style="margin-bottom:18px;">' +
      '<div class="form-row" style="grid-template-columns:1fr 1fr 1fr 1fr;">' +
        '<div class="field"><label>Başlangıç</label><input type="date" value="'+from+'" onchange="setReport(\'from\',this.value)"></div>' +
        '<div class="field"><label>Bitiş</label><input type="date" value="'+to+'" onchange="setReport(\'to\',this.value)"></div>' +
        '<div class="field"><label>Dönem</label><select onchange="setReport(\'granularity\',this.value)">' +
          ['daily:Günlük','weekly:Haftalık','monthly:Aylık','yearly:Yıllık'].map(o=>{
            const [v,l]=o.split(':'); return '<option value="'+v+'" '+(r.granularity===v?'selected':'')+'>'+l+'</option>';
          }).join('') +
        '</select></div>' +
        '<div class="field"><label>Kırılım</label><select onchange="setReport(\'groupBy\',this.value)">' +
          '<option value="urun" '+(r.groupBy==='urun'?'selected':'')+'>Ürüne göre</option>' +
          '<option value="firma" '+(r.groupBy==='firma'?'selected':'')+'>Firmaya göre</option>' +
        '</select></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">' +
        '<button class="btn btn-sm btn-ghost" onclick="setReport(\'from\',\'\');setReport(\'to\',\'\')">Tarihi temizle</button>' +
        '<button class="btn btn-sm" onclick="printReport()">Yazdır (A4)</button>' +
        '<button class="btn btn-sm" onclick="exportReportExcel()">Excel\'e aktar</button>' +
      '</div>' +
    '</div>' +

    '<h2 class="section-title">' + periodLabel(r.granularity) + ' toplam ' + baslikKelime + '</h2>' +
    '<div class="card">' +
      (keys.length ?
        '<div class="chart-bars">' +
          keys.slice(-16).map(k => (
            '<div class="chart-bar-col">' +
              '<div class="chart-bar" style="height:' + Math.max(2, Math.round(groups[k].tutar/maxTutar*120)) + 'px" title="'+money(groups[k].tutar)+'"></div>' +
              '<div class="chart-bar-label">' + periodKeyLabel(k, r.granularity) + '</div>' +
            '</div>'
          )).join('') +
        '</div>' : emptyMini()) +
    '</div>' +

    '<h2 class="section-title">' + periodLabel(r.granularity) + ' detay tablosu</h2>' +
    '<div class="tbl-wrap"><table>' +
      '<thead><tr><th>Dönem</th><th class="num">Kalem sayısı</th><th class="num">Toplam miktar</th><th class="num">Toplam tutar</th></tr></thead>' +
      '<tbody>' + keys.slice().reverse().map(k => (
        '<tr><td>'+periodKeyLabel(k, r.granularity)+'</td><td class="num">'+groups[k].adet+'</td><td class="num">'+num(groups[k].miktar,2)+'</td><td class="num">'+money(groups[k].tutar)+'</td></tr>'

function periodLabel(g){ return {daily:'Günlük', weekly:'Haftalık', monthly:'Aylık', yearly:'Yıllık'}[g]; }
function periodKeyOf(dateStr, g){
  if(g==='daily') return dateStr;
  if(g==='weekly') return isoWeekKey(new Date(dateStr+'T00:00:00'));
  if(g==='monthly') return dateStr.slice(0,7);
  return dateStr.slice(0,4);
}
function periodKeyLabel(k, g){
  if(g==='monthly') return monthShortLabel(k);
  if(g==='daily') return fmtDate(k);
  return k;
}
// İade Fatura Çıkış/Giriş Raporu — Alış/Satış raporlarıyla aynı desende
// (dönem grafiği + detay tablosu + ürün/firma kırılımı), ama iade
// kayıtları (state.iadeler) üzerinden, seçilen yöne (Çıkış/Giriş) göre.
function viewIadeRaporu(yon){
  const r = state.report;
  const label = yon==='Giriş' ? 'İade Faturası Giriş Raporu' : 'İade Faturası Çıkış Raporu';
  const kaynakRows = state.iadeler.filter(i => (i.yon||'Çıkış')===yon)
    .map(i => ({tarih:i.tarih, miktar:Number(i.miktar)||0, toplam:Number(i.tutar)||0, firma:i.firma, urunAdi:i.urunAdi, stokKodu:i.stokKodu}));
  if(kaynakRows.length===0) return emptyState('Rapor için veri yok', label+' için henüz kayıt yok.');

  const from = r.from || '';
  const to = r.to || '';
  const rangeRows = kaynakRows.filter(a => (!from || a.tarih>=from) && (!to || a.tarih<=to));

  const groups = groupPeriods(rangeRows, r.granularity);
  const keys = Object.keys(groups).sort();
  const maxTutar = Math.max(1, ...keys.map(k=>groups[k].tutar));

  const byDim = {};
  rangeRows.forEach(a=>{
    const dimKey = r.groupBy==='urun' ? (a.stokKodu+' — '+a.urunAdi) : a.firma;
    if(!byDim[dimKey]) byDim[dimKey] = {miktar:0, tutar:0};
    byDim[dimKey].miktar += Number(a.miktar||0);
    byDim[dimKey].tutar += Number(a.toplam||0);
  });
  const dimRows = Object.entries(byDim).sort((a,b)=>b[1].tutar-a[1].tutar);

  return (
    '<div class="card" style="margin-bottom:18px;">' +
      '<div class="form-row" style="grid-template-columns:1fr 1fr 1fr 1fr;">' +
        '<div class="field"><label>Başlangıç</label><input type="date" value="'+from+'" onchange="setReport(\'from\',this.value)"></div>' +
        '<div class="field"><label>Bitiş</label><input type="date" value="'+to+'" onchange="setReport(\'to\',this.value)"></div>' +
        '<div class="field"><label>Dönem</label><select onchange="setReport(\'granularity\',this.value)">' +
          ['daily:Günlük','weekly:Haftalık','monthly:Aylık','yearly:Yıllık'].map(o=>{
            const [v,l]=o.split(':'); return '<option value="'+v+'" '+(r.granularity===v?'selected':'')+'>'+l+'</option>';
          }).join('') +
        '</select></div>' +
        '<div class="field"><label>Kırılım</label><select onchange="setReport(\'groupBy\',this.value)">' +
          '<option value="urun" '+(r.groupBy==='urun'?'selected':'')+'>Ürüne göre</option>' +
          '<option value="firma" '+(r.groupBy==='firma'?'selected':'')+'>Firmaya göre</option>' +
        '</select></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">' +
        '<button class="btn btn-sm btn-ghost" onclick="setReport(\'from\',\'\');setReport(\'to\',\'\')">Tarihi temizle</button>' +
      '</div>' +
    '</div>' +

    '<h2 class="section-title">' + periodLabel(r.granularity) + ' toplam iade</h2>' +
    '<div class="card">' +
      (keys.length ?
        '<div class="chart-bars">' +
          keys.slice(-16).map(k => (
            '<div class="chart-bar-col">' +
              '<div class="chart-bar" style="height:' + Math.max(2, Math.round(groups[k].tutar/maxTutar*120)) + 'px" title="'+money(groups[k].tutar)+'"></div>' +
              '<div class="chart-bar-label">' + periodKeyLabel(k, r.granularity) + '</div>' +
            '</div>'
          )).join('') +
        '</div>' : emptyMini()) +
    '</div>' +

    '<h2 class="section-title">' + periodLabel(r.granularity) + ' detay tablosu</h2>' +
    '<div class="tbl-wrap"><table>' +
      '<thead><tr><th>Dönem</th><th class="num">Kalem sayısı</th><th class="num">Toplam miktar</th><th class="num">Toplam tutar</th></tr></thead>' +
      '<tbody>' + keys.slice().reverse().map(k => (
        '<tr><td>'+periodKeyLabel(k, r.granularity)+'</td><td class="num">'+groups[k].adet+'</td><td class="num">'+num(groups[k].miktar,2)+'</td><td class="num">'+money(groups[k].tutar)+'</td></tr>'
      )).join('') + '</tbody>' +
    '</table></div>' +

    '<h2 class="section-title">' + (r.groupBy==='urun'?'Ürüne göre':'Firmaya göre') + ' toplam (seçili aralık)</h2>' +
    '<div class="tbl-wrap"><table>' +
      '<thead><tr><th>' + (r.groupBy==='urun'?'Ürün':'Firma') + '</th><th class="num">Toplam miktar</th><th class="num">Toplam tutar</th></tr></thead>' +
      '<tbody>' + dimRows.map(([k,v]) => (
        '<tr><td>'+escapeHtml(k)+'</td><td class="num">'+num(v.miktar,2)+'</td><td class="num">'+money(v.tutar)+'</td></tr>'
      )).join('') + '</tbody>' +
    '</table></div>'
  );
}
function groupPeriods(rows, g){
  const out = {};
  rows.forEach(a=>{
    if(!a.tarih) return;
    const k = periodKeyOf(a.tarih, g);
    if(!out[k]) out[k]={miktar:0,tutar:0,adet:0};
    out[k].miktar += Number(a.miktar||0);
    out[k].tutar += Number(a.toplam||0);
    out[k].adet += 1;
  });
  return out;
}

        const cls = b.bakiye>0.5 ? 'badge-danger' : (b.bakiye<-0.5 ? 'badge-success' : 'badge-primary');
        const limit = Number(f.KrediLimiti||f.krediLimiti)||0;
        const limitHtml = limit>0 ? '<div class="hint" style="margin-top:3px;'+(b.bakiye>limit?'color:var(--danger);font-weight:600;':'')+'">'+(b.bakiye>limit?'⚠ Limit aşıldı — ':'')+'Limit: '+money(limit)+'</div>' : '';
        return '<tr><td>'+escapeHtml(ad)+'</td><td>'+escapeHtml(f.Yetkili||f.yetkili||'—')+'</td><td>'+escapeHtml(f.Telefon||f.telefon||'—')+'</td>' +
          '<td>'+escapeHtml(f.Email||f.email||'—')+'</td>' +
          '<td class="num">'+s.adet+'</td><td class="num">'+money(s.tutar)+'</td>' +
          '<td class="num"><span class="badge '+cls+'" style="font-weight:600;">'+money(b.bakiye)+'</span>'+limitHtml+'</td>' +
          '<td style="white-space:nowrap;">' +
            '<button class="btn btn-ghost btn-sm" onclick="goToCariFirma(\''+escapeHtml(ad)+'\')">Cari Hareketler</button> ' +
            '<button class="btn btn-ghost btn-sm" onclick="openEditFirma(\''+(f.ID||f.id)+'\')">Düzenle</button> ' +
            '<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteFirma(\''+(f.ID||f.id)+'\')">Sil</button>' +
          '</td></tr>';
      }).join('') + '</tbody>' +
    '</table></div>')
  );
}

/* =========================================================
   ÖDEME / TAHSİLAT / İADE (Cari Hesap Hareketleri)
   Bakiye mantığı: Bakiye = Toplam Alım - Toplam Ödeme + Toplam
   Tahsilat - Toplam İade. Yani firmaya ödeme yapınca ya da firmaya
   ürün iade edince bakiye düşer; firmadan tahsilat yapınca ise
   bakiye YÜKSELİR (siz borçlanmış, firma alacaklı duruma geçmiş
   olursunuz — örn. firma size nakit avans/kredi verdi).
   NOT: Bu modülün buluta (Google E-Tablo) tam senkronize olması
   için Kod.gs (Apps Script) tarafında addOdeme/deleteOdeme/addIade/
   deleteIade action'larının ve "Odemeler"/"Iadeler" sekmelerinin
   eklenmesi gerekir. O güncelleme yapılana kadar bu kayıtlar bu
   cihazda (yerel depoda) güvenle saklanır; bağlantı kurulduğunda
   gönderim denenir, backend desteklemiyorsa kuyrukta bekler.
========================================================= */
function computeFirmaBakiye(ad){
  const adNorm = String(ad||'').trim();
  let toplamAlis=0, toplamSatis=0, toplamOdeme=0, toplamTahsilat=0, toplamIadeCikis=0, toplamIadeGiris=0;
  state.alimlar.forEach(a=>{
    if(String(a.firma||'').trim()!==adNorm) return;
    if((a.tur||'Alış')==='Satış') toplamSatis += Number(a.toplam)||0;
    else toplamAlis += Number(a.toplam)||0;
  });
  state.odemeler.forEach(o=>{
    if(String(o.firma||'').trim()!==adNorm) return;
    const t = Number(o.tutar)||0;
    if(String(o.tur||'').toUpperCase().includes('TAHSİLAT')) toplamTahsilat += t;
    else toplamOdeme += t;
  });
  state.iadeler.forEach(i=>{
    if(String(i.firma||'').trim()!==adNorm) return;
    if((i.yon||'Çıkış')==='Giriş') toplamIadeGiris += Number(i.tutar)||0;
    else toplamIadeCikis += Number(i.tutar)||0;
  });
  // Alış ve İade Girişi borcumu artırır (+); Satış, Ödeme ve İade Çıkışı
  // azaltır (-); Tahsilat artırır (+, firmadan aldığım için borçlanırım).
  const bakiye = toplamAlis - toplamSatis - toplamOdeme + toplamTahsilat - toplamIadeCikis + toplamIadeGiris;
  const toplamAlim = toplamAlis; // geriye dönük uyumluluk: eski kodda "toplamAlim" adıyla okunuyordu
  const toplamIade = toplamIadeCikis; // geriye dönük uyumluluk
  return {toplamAlis, toplamSatis, toplamOdeme, toplamTahsilat, toplamIadeCikis, toplamIadeGiris, bakiye, toplamAlim, toplamIade};
}

// Bir firmayla ilgili en son hangi tarihte hareket (alış/satış/ödeme/
// tahsilat/iade) olduğunu bulur — "Son işlem" sütunu için.
function sonIslemTarihiFirma(ad){
  const adNorm = String(ad||'').trim();
  let son = '';
  state.alimlar.forEach(a=>{ if(String(a.firma||'').trim()===adNorm && a.tarih>son) son=a.tarih; });
  state.odemeler.forEach(o=>{ if(String(o.firma||'').trim()===adNorm && o.tarih>son) son=o.tarih; });
  state.iadeler.forEach(i=>{ if(String(i.firma||'').trim()===adNorm && i.tarih>son) son=i.tarih; });
  return son;
}

/* =========================================================
   CARİ DEVİR AKTAR
   Bir firma isim/unvan değiştirdiğinde (ör. "KARDEŞLER FIRIN" ->
   "MİLDA İŞLETMELERİ LTD (KARDEŞLER FIRIN)"), o firmaya ait TÜM geçmişi
   (alım/satış faturaları, ödemeler, iadeler, çek/senet, ödeme emirleri,
   teklifler) ve güncel bakiyeyi yeni isme aktarır. Yeni isim zaten kayıtlı
   BAŞKA bir firmaysa, eski firmanın geçmişi o firmayla BİRLEŞTİRİLİR (eski
   firma kartı silinir); değilse firma kartı yeniden adlandırılır.
   Kullanıcı önce önizleme görür, sonra elle onaylar — otomatik çalışmaz.
========================================================= */
function cariDevirOzet(eskiAd){
  return {
    alim: state.alimlar.filter(a=>a.firma===eskiAd).length,
    odeme: state.odemeler.filter(o=>o.firma===eskiAd).length,
    iade: state.iadeler.filter(i=>i.firma===eskiAd).length,
    cek: state.cekler.filter(c=>c.firma===eskiAd).length,
    odemeEmri: state.odemeEmirleri.filter(o=>o.firma===eskiAd).length,
    teklif: state.teklifler.filter(t=>t.firma===eskiAd).length,
    bakiye: computeFirmaBakiye(eskiAd).bakiye
  };
}
function viewCariDevirAktar(){
  const firmaOpts = state.firmalar.slice().sort((a,b)=>String(a.Ad||a.ad).localeCompare(String(b.Ad||b.ad),'tr'))
    .map(f=>'<option value="'+escapeHtml(f.Ad||f.ad)+'">'+escapeHtml(f.Ad||f.ad)+'</option>').join('');
  const firmaDatalist = state.firmalar.slice().sort((a,b)=>String(a.Ad||a.ad).localeCompare(String(b.Ad||b.ad),'tr'))
    .map(f=>'<option value="'+escapeHtml(f.Ad||f.ad)+'">').join('');
  let html = '<div class="section-desc" style="margin-bottom:14px;">Bir firma isim/unvan değiştirdiğinde, o firmaya ait tüm fatura, ödeme, iade, çek/senet, ödeme emri, teklif kayıtlarını ve güncel bakiyeyi yeni isme aktarın. Hiçbir şey otomatik olmaz — önce önizleme görür, sonra siz onaylarsınız.</div>';
  html += '<div class="card" style="max-width:640px;">' +
    '<div class="field"><label>Eski firma (mevcut kayıtlı)</label><select id="cdaEski" onchange="refreshCariDevirOnizleme()">' +
      '<option value="">— Firma seçin —</option>' + firmaOpts +
    '</select></div>' +
    '<div class="field" style="margin-top:10px;"><label>Yeni isim</label><input id="cdaYeni" list="cdaYeniList" type="text" placeholder="ör. MİLDA İŞLETMELERİ LTD (KARDEŞLER FIRIN)" oninput="refreshCariDevirOnizleme()"><datalist id="cdaYeniList">'+firmaDatalist+'</datalist>' +
      '<div class="hint" style="margin-top:4px;">Yeni bir isim yazarsanız firma yeniden adlandırılır. Listeden zaten kayıtlı BAŞKA bir firma seçerseniz, eski firmanın tüm geçmişi o firmayla birleştirilir.</div>' +
    '</div>' +
    '<div id="cdaOnizleme"></div>' +
    '<button class="btn btn-primary" style="margin-top:14px;" id="cdaDevretBtn" onclick="executeCariDevir()" disabled '+(canDo('cariDevirAktar','edit')?'':'title="Bu işlem için yetkiniz yok"')+'>Devret</button>' +
  '</div>';
  return html;
}
function refreshCariDevirOnizleme(){
  const eskiAd = (document.getElementById('cdaEski')||{}).value || '';
  const yeniAd = (document.getElementById('cdaYeni')||{}).value.trim() || '';
  const panel = document.getElementById('cdaOnizleme');
  const btn = document.getElementById('cdaDevretBtn');
  if(!panel) return;
  if(!eskiAd){ panel.innerHTML=''; if(btn) btn.disabled=true; return; }
  const oz = cariDevirOzet(eskiAd);
  const toplam = oz.alim+oz.odeme+oz.iade+oz.cek+oz.odemeEmri+oz.teklif;
  let html = '<div class="card" style="margin-top:12px;background:var(--paper);">' +
    '<div style="font-weight:600;font-size:13px;margin-bottom:6px;">"'+escapeHtml(eskiAd)+'" firmasında bulunanlar</div>' +
    '<div class="kv"><span>Alım/Satış faturası kalemi</span><span class="num">'+oz.alim+'</span></div>' +
    '<div class="kv"><span>Ödeme/Tahsilat</span><span class="num">'+oz.odeme+'</span></div>' +
    '<div class="kv"><span>İade kalemi</span><span class="num">'+oz.iade+'</span></div>' +
    '<div class="kv"><span>Çek/Senet</span><span class="num">'+oz.cek+'</span></div>' +
    '<div class="kv"><span>Ödeme Emri</span><span class="num">'+oz.odemeEmri+'</span></div>' +
    '<div class="kv"><span>Teklif</span><span class="num">'+oz.teklif+'</span></div>' +
    '<div class="kv" style="border-bottom:0;"><span><b>Güncel bakiye</b></span><span class="num"><b>'+money(oz.bakiye)+'</b></span></div>' +
  '</div>';
  let hazir = false;
  if(yeniAd && yeniAd!==eskiAd){
    const mevcutMu = state.firmalar.some(f=>(f.Ad||f.ad)===yeniAd && (f.Ad||f.ad)!==eskiAd);
    html += '<div class="hint" style="margin-top:8px;">' +
      (mevcutMu ?
        '⚠ "'+escapeHtml(yeniAd)+'" zaten kayıtlı bir firma — bu işlem "'+escapeHtml(eskiAd)+'"nin tüm geçmişini bu firmayla BİRLEŞTİRECEK, eski firma kartı silinecek.' :
        '"'+escapeHtml(eskiAd)+'" firma kartı "'+escapeHtml(yeniAd)+'" olarak yeniden adlandırılacak.') +
    '</div>';
    hazir = true;
  }
  panel.innerHTML = html;
  if(btn) btn.disabled = !hazir;
}
async function executeCariDevir(){
  if(!canDo('cariDevirAktar','edit')){ yetkiYokUyar(); return; }
  const eskiAd = (document.getElementById('cdaEski')||{}).value || '';
  const yeniAd = (document.getElementById('cdaYeni')||{}).value.trim() || '';
  if(!eskiAd || !yeniAd || eskiAd===yeniAd){ toast('Eski firma ve farklı bir yeni isim girin.'); return; }
  const oz = cariDevirOzet(eskiAd);
  const toplam = oz.alim+oz.odeme+oz.iade+oz.cek+oz.odemeEmri+oz.teklif;
  const mevcutMu = state.firmalar.some(f=>(f.Ad||f.ad)===yeniAd && (f.Ad||f.ad)!==eskiAd);
  const onay = await evetHayirSor(
    '"'+eskiAd+'" firmasına ait TÜM kayıtlar "'+yeniAd+'" olarak güncellenecek:\n\n' +
    '• '+oz.alim+' alım/satış faturası kalemi\n' +
    '• '+oz.odeme+' ödeme/tahsilat\n' +
    '• '+oz.iade+' iade kalemi\n' +
    '• '+oz.cek+' çek/senet\n' +
    '• '+oz.odemeEmri+' ödeme emri\n' +
    '• '+oz.teklif+' teklif\n' +
    (mevcutMu ? '\n"'+yeniAd+'" zaten kayıtlı — eski firma kartı SİLİNECEK, geçmişi bu firmaya birleştirilecek.' : '\nFirma kartı "'+yeniAd+'" olarak yeniden adlandırılacak.') +
    '\n\nGüncel bakiye ('+money(oz.bakiye)+') de yeni isimle devam edecek. Bu işlem GERİ ALINAMAZ.\n\nDevam edilsin mi?',
    'Cari Devir/Aktar Onayı'
  );
  if(!onay) return;

  const degisenler = { alim:[], odeme:[], iade:[], cek:[], odemeEmri:[], teklif:[] };
  state.alimlar.forEach(a=>{ if(a.firma===eskiAd){ a.firma=yeniAd; degisenler.alim.push(a.ID||a.id); } });
  state.odemeler.forEach(o=>{ if(o.firma===eskiAd){ o.firma=yeniAd; degisenler.odeme.push(o.ID||o.id); } });
  state.iadeler.forEach(i=>{ if(i.firma===eskiAd){ i.firma=yeniAd; degisenler.iade.push(i.ID||i.id); } });
  state.cekler.forEach(c=>{ if(c.firma===eskiAd){ c.firma=yeniAd; degisenler.cek.push(c.ID||c.id); } });
  state.odemeEmirleri.forEach(o=>{ if(o.firma===eskiAd){ o.firma=yeniAd; degisenler.odemeEmri.push(o.ID||o.id); } });
  state.teklifler.forEach(t=>{ if(t.firma===eskiAd){ t.firma=yeniAd; degisenler.teklif.push(t.ID||t.id); } });

  if(mevcutMu){
    const idx = state.firmalar.findIndex(f=>(f.Ad||f.ad)===eskiAd);
    if(idx!==-1){
      const eskiId = state.firmalar[idx].ID||state.firmalar[idx].id;
      state.firmalar.splice(idx,1);
      await persistFirmalar();
      syncOrQueue({action:'deleteFirma', id:eskiId}, {entity:'firma', op:'delete', localId:eskiId});
    }
  } else {
    const idx = state.firmalar.findIndex(f=>(f.Ad||f.ad)===eskiAd);
    if(idx!==-1){
      state.firmalar[idx].Ad = yeniAd;
      const id = state.firmalar[idx].ID||state.firmalar[idx].id;
      await persistFirmalar();
      syncOrQueue({action:'updateFirma', id, data:{ad:yeniAd}}, {entity:'firma', op:'update', localId:id});
    }
  }

  await Promise.all([persistAlimlar(), persistOdemeler(), persistIadeler(), persistCekler(), persistOdemeEmirleri(), persistTeklifler()]);

  degisenler.alim.forEach(id=>syncOrQueue({action:'updateAlim', id, data:{firma:yeniAd}}, {entity:'alim', op:'update', localId:id}));
  degisenler.odeme.forEach(id=>syncOrQueue({action:'updateOdeme', id, data:{firma:yeniAd}}, {entity:'odeme', op:'update', localId:id}));
  degisenler.iade.forEach(id=>syncOrQueue({action:'updateIade', id, data:{firma:yeniAd}}, {entity:'iade', op:'update', localId:id}));
  degisenler.cek.forEach(id=>syncOrQueue({action:'updateCek', id, data:{firma:yeniAd}}, {entity:'cek', op:'update', localId:id}));
  degisenler.odemeEmri.forEach(id=>syncOrQueue({action:'updateOdemeEmri', id, data:{firma:yeniAd}}, {entity:'odemeEmri', op:'update', localId:id}));
  degisenler.teklif.forEach(id=>syncOrQueue({action:'updateTeklif', id, data:{firma:yeniAd}}, {entity:'teklif', op:'update', localId:id}));

  toast('"'+eskiAd+'" → "'+yeniAd+'" devri tamamlandı ('+toplam+' kayıt güncellendi).');
  const eskiSel = document.getElementById('cdaEski'); if(eskiSel) eskiSel.value='';
  const yeniInp = document.getElementById('cdaYeni'); if(yeniInp) yeniInp.value='';
  renderContent();
}

/* =========================================================
   CARİ HESAPLAR
   Firma arayarak o firmaya ait TÜM detaylı bilgileri (bakiye, alım/satış,
   ödeme/tahsilat, iade, çek/senet, ödeme emri, teklif) tek ekranda
   gösterir. Ayrıca aynı isimde birden fazla firma kartı (mükerrer) varsa
   bunları tespit edip her birinin işlem görüp görmediğini gösterir —
   işlem görmemiş bir mükerrer kart güvenle silinebilir, görmüşse
   dikkatli olunmalı (bkz. Cari Devir Aktar ile birleştirme).
========================================================= */
function normalizeFirmaAdiForDup(ad){
  return String(ad||'').trim().toLocaleUpperCase('tr-TR').replace(/\s+/g,' ');
}
function mukerrerFirmaGruplari(){
  const gruplar = {};
  state.firmalar.forEach(f=>{
    const key = normalizeFirmaAdiForDup(f.Ad||f.ad);
    if(!key) return;
    if(!gruplar[key]) gruplar[key] = [];
    gruplar[key].push(f);
  });
  return Object.values(gruplar).filter(g=>g.length>1);
}
// Bir firma kartının hangi modüllerde kaç kez geçtiğini sayar — toplamı 0
// ise bu kart hiç kullanılmamış demektir (güvenle silinebilir).
function cariIslemOzeti(ad){
  const alim = state.alimlar.filter(a=>a.firma===ad && (a.tur||'Alış')==='Alış').length;
  const satis = state.alimlar.filter(a=>a.firma===ad && (a.tur||'Alış')==='Satış').length;
  const odeme = state.odemeler.filter(o=>o.firma===ad && !String(o.tur||'').toLocaleUpperCase('tr-TR').includes('TAHSİLAT')).length;
  const tahsilat = state.odemeler.filter(o=>o.firma===ad && String(o.tur||'').toLocaleUpperCase('tr-TR').includes('TAHSİLAT')).length;
  const iade = state.iadeler.filter(i=>i.firma===ad).length;
  const cek = state.cekler.filter(c=>c.firma===ad).length;
  const odemeEmri = state.odemeEmirleri.filter(o=>o.firma===ad).length;
  const teklif = state.teklifler.filter(t=>t.firma===ad).length;
  return {alim,satis,odeme,tahsilat,iade,cek,odemeEmri,teklif, toplam: alim+satis+odeme+tahsilat+iade+cek+odemeEmri+teklif};
}

        sonuclar.map(f=>{

  }

  if(state.cariHesaplarSecili){

    if(f) html += cariHesaplarDetayHtml(f);

  return html;
}

async function deleteCariHesaplarKarti(id){
  if(!canDo('cariHesaplar','delete')){ yetkiYokUyar(); return; }
  const f = state.firmalar.find(x=>(x.ID||x.id)===id);
  if(!f) return;
  const ad = f.Ad||f.ad;
  const oz = cariIslemOzeti(ad);
  const mesaj = oz.toplam===0
    ? '"'+ad+'" silinsin mi? Bu karta ait hiçbir işlem bulunmuyor, güvenle silinebilir.'
    : '⚠ "'+ad+'" kartında '+oz.toplam+' işlem var (alım/satış/ödeme/tahsilat/iade/çek/ödeme emri/teklif). Bu kartı silmek geçmiş hareketleri SİLMEZ, ama artık bu kart üzerinden yönetemezsiniz.\n\nİsim değişikliğiyse silmek yerine "Cari Devir Aktar"ı kullanmanız önerilir.\n\nYine de silinsin mi?';
  const onay = await evetHayirSor(mesaj, 'Cari Kartı Sil');
  if(!onay) return;
  state.firmalar = state.firmalar.filter(x=>(x.ID||x.id)!==id);
  await persistFirmalar();
  if(state.cariHesaplarSecili===id) state.cariHesaplarSecili = '';
  toast('Cari kart silindi.');
  renderContent();
  syncOrQueue({action:'deleteFirma', id}, {entity:'firma', op:'delete', localId:id});
}

        '<div id="odDovizKasaSecim" style="display:none;margin-top:6px;"><select id="odDovizKasaAdi"></select></div>' +
      '</div>'
    ) : '') +

}
function odDovizKasaSecenekGuncelle(){
  const kullan = (document.getElementById('odDovizKasaKullan')||{}).checked;
  const secimDiv = document.getElementById('odDovizKasaSecim');
  if(secimDiv) secimDiv.style.display = kullan ? '' : 'none';
  if(!kullan) return;
  const pb = (document.getElementById('odDovizPB')||{}).value;
  const sel = document.getElementById('odDovizKasaAdi');
  if(!sel) return;
  const uygunKasalar = state.kasaTanimlari.filter(k=>k.tip==='Doviz' && k.paraBirimi===pb);
  sel.innerHTML = uygunKasalar.length
    ? uygunKasalar.map(k=>'<option value="'+escapeHtml(k.ad)+'">'+escapeHtml(k.ad)+' (Bakiye: '+moneyDoviz(kasaBakiye('Doviz',null,k.ad),pb)+')</option>').join('')
    : '<option value="">Bu para biriminde tanımlı döviz kasası yok</option>';
}
function odDovizTipDegisti(){
  const tip = (document.getElementById('odDovizTip')||{}).value || 'orijinal';
  const kurAlani = document.getElementById('odDovizKurAlani');
  const kurButon = document.getElementById('odDovizKurButon');
  if(kurAlani) kurAlani.style.display = tip==='orijinal' ? 'none' : '';
  if(kurButon) kurButon.style.display = tip==='canli' ? '' : 'none';
  if(tip==='canli') odDovizCanliKurCek(); else odDovizHesapla();
}
async function odDovizCanliKurCek(){
  const pb = (document.getElementById('odDovizPB')||{}).value;
  if(!pb) return;
  const sonucEl = document.getElementById('odDovizSonuc');
  try{
    const {kur} = await fetchDovizKuruTL(pb);
    const kurEl = document.getElementById('odDovizKur');
    if(kurEl) kurEl.value = Math.round(kur*10000)/10000;
  }catch(e){
    if(sonucEl) sonucEl.textContent = '⚠ Canlı kur çekilemedi ('+(e&&e.message?e.message:'bağlantı hatası')+'). Elle girin.';
  }
  odDovizHesapla();
}
function odDovizHesapla(){
  const ad = state.odemeSelectedFirma;
  const pb = (document.getElementById('odDovizPB')||{}).value;
  const tip = (document.getElementById('odDovizTip')||{}).value || 'orijinal';
  const dovizTutar = Number((document.getElementById('odDovizTutar')||{}).value)||0;
  const sonucEl = document.getElementById('odDovizSonuc');
  if(!ad || !pb || dovizTutar<=0){ if(sonucEl) sonucEl.textContent=''; return; }
  let kur, kurAciklama;
  if(tip==='orijinal'){
    // Bu para biriminde açık olan faturaların AĞIRLIKLI ortalama kuru
    // (faturaların kendi giriş kurları — yeni bir kur sorulmaz).
    const acikFaturalar = (window.__odAcikFaturalar||[]).filter(f=>f.paraBirimi===pb);
    const toplamTL = acikFaturalar.reduce((s,f)=>s+f.kalan,0);
    const toplamDoviz = acikFaturalar.reduce((s,f)=>s+f.dovizKalan,0);
    kur = toplamDoviz>0 ? toplamTL/toplamDoviz : 0;
    kurAciklama = 'faturadaki (ağırlıklı ortalama) kur: '+num(kur,4);
  } else {
    kur = Number((document.getElementById('odDovizKur')||{}).value)||0;
    kurAciklama = (tip==='canli'?'canlı kur: ':'manuel kur: ')+num(kur,4);
  }
  if(kur<=0){ if(sonucEl) sonucEl.textContent='Kur belirlenemedi.'; return; }
  const tlTutar = dovizTutar*kur;
  const tutarEl = document.getElementById('odTutar');
  if(tutarEl){ tutarEl.value = Math.round(tlTutar*100)/100; odTutarDegisti(); }
  if(sonucEl) sonucEl.innerHTML = moneyDoviz(dovizTutar,pb)+' × '+kurAciklama+' = <b>'+money(tlTutar)+'</b> — Tutar kutusuna yazıldı.';
}
// gösterir: bu ödemeden sonra kalan genel borç + hangi açık faturaların
// tam/kısmi kapanacağı (kısmi kalanlarda fatura toplamı da görünür).
function odTutarDegisti(){
  const ad = state.odemeSelectedFirma;
  if(!ad) return;
  document.querySelectorAll('[id^="odFat_"]').forEach(cb=>{ cb.checked=false; });
  const tutar = Number((document.getElementById('odTutar')||{}).value)||0;
  const onizleme = document.getElementById('odKapsamOnizleme');
  if(!onizleme) return;
  if(tutar<=0){ onizleme.innerHTML=''; return; }
  const bakiye = computeFirmaBakiye(ad).bakiye;
  const acikFaturalar = window.__odAcikFaturalar||oeAcikFaturalar(ad);
  const {kapsam, fazlaKalan} = simulateOdemeKapsami(acikFaturalar, tutar);
  onizleme.innerHTML = oeKapsamOnizlemeHtml(kapsam, fazlaKalan, bakiye, tutar);
}
// Ödeme sekmesinde açık faturalardan tik ile seçim yapıldığında: tutarı
// seçilenlerin TOPLAM kalanına eşitler ve önizlemeyi günceller.
function odFaturaSecildi(){
  const ad = state.odemeSelectedFirma;
  if(!ad) return;
  const acikFaturalar = window.__odAcikFaturalar||[];
  const secilenler = [];
  acikFaturalar.forEach((f,i)=>{
    const cb = document.getElementById('odFat_'+i);
    if(cb && cb.checked) secilenler.push(f);
  });
  const toplam = secilenler.reduce((s,f)=>s+f.kalan,0);
  const tutarEl = document.getElementById('odTutar');
  if(tutarEl) tutarEl.value = toplam ? (Math.round(toplam*100)/100) : '';
  const onizleme = document.getElementById('odKapsamOnizleme');
  if(!onizleme) return;
  if(secilenler.length===0){ onizleme.innerHTML=''; return; }
  const bakiye = computeFirmaBakiye(ad).bakiye;
  onizleme.innerHTML = oeKapsamOnizlemeHtml(secilenler.map(f=>({tarih:f.tarih, faturaNo:f.faturaNo, tutar:f.kalan, tamMi:true, faturaToplam:f.toplam, yeniKalan:0})), 0, bakiye, toplam);
}
