// Rol tanımlama formunun (yeni ekleme + düzenleme modalı) ORTAK izin
// ızgarası — grup başlığı altında her sekme için Görüntüle + o sekmeye
// özel Ekle/Düzenle/Sil kutucukları.
const IZIN_GRUP_ETIKETLERI = {
  kasa:'Kasa', muhasebe:'Muhasebe', cariIslemler:'Cari İşlemler', faturaIslemleri:'Fatura İşlemleri', raporlar:'Raporlar',
  urunler:'Ürünler', transferler:'Transferler', talepler:'Talepler', teklifler:'Teklifler', sozlesmeler:'Sözleşmeli Ürünler', baglantiliSiparis:'Bağlantılı Sipariş', personel:'Personel İşlemler'
};
function izinGruplariHtml(prefix, mevcutIzinler){
  const gruplar = {};
  Object.keys(TAB_KATEGORI).forEach(tabKey=>{
    const kat = TAB_KATEGORI[tabKey];
    if(!gruplar[kat]) gruplar[kat] = [];
    gruplar[kat].push(tabKey);
  });
  const gruplarHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2px 28px;">' +
    Object.keys(IZIN_GRUP_ETIKETLERI).map(kat=>{
      const tabKeys = gruplar[kat]||[];
      const satirlar = tabKeys.map(tabKey=>{
        const t = TABS.find(x=>x.key===tabKey);
        const label = t ? t.label : tabKey;
        const izin = mevcutIzinler[tabKey] || {};
        const actions = TAB_ACTIONS[tabKey]||[];
        let row = '<div style="display:flex;align-items:center;gap:16px;padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;">' +
          '<label style="display:flex;align-items:center;gap:6px;min-width:200px;font-size:13.5px;cursor:pointer;">' +
            '<input type="checkbox" id="'+prefix+'_'+tabKey+'_view"'+(izin.view?' checked':'')+'> <b>'+escapeHtml(label)+'</b>' +
          '</label>';
        if(actions.length===0){
          row += '<span class="hint" style="margin:0;">(sadece görüntüleme)</span>';
        } else {
          actions.forEach(a=>{
            row += '<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer;">' +
              '<input type="checkbox" id="'+prefix+'_'+tabKey+'_'+a+'"'+(izin[a]?' checked':'')+'> '+ISLEM_ETIKET[a] +
            '</label>';
          });
        }
        row += '</div>';
        return row;
      }).join('');
      return '<div style="margin-bottom:14px;"><div style="font-weight:700;font-size:12.5px;color:var(--primary-text);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;">'+IZIN_GRUP_ETIKETLERI[kat]+'</div>'+satirlar+'</div>';
    }).join('') +
  '</div>';
  return '<div style="display:flex;gap:8px;margin-bottom:10px;">' +
      '<button type="button" class="btn btn-sm btn-primary" onclick="izinToplu(\''+prefix+'\',true)">✓ Tüm Yetkileri Aç</button>' +
      '<button type="button" class="btn btn-sm btn-ghost" onclick="izinToplu(\''+prefix+'\',false)">✕ Tüm Yetkileri Kaldır</button>' +
    '</div>' +
    '<div style="border:1px solid var(--border);border-radius:8px;padding:12px 16px;max-height:560px;overflow-y:auto;">' +
      gruplarHtml +
    '</div>';
}
// "Tüm Yetkileri Aç/Kaldır": bir izin ızgarasındaki (prefix ile eşleşen)
// TÜM görüntüleme + alt işlem kutucuklarını tek tıkla işaretler/kaldırır.
// Henüz kaydedilmez — normal "Kaydet/Ekle" butonuna kadar sadece formdadır.
function izinToplu(prefix, ac){
  Object.keys(TAB_KATEGORI).forEach(tabKey=>{
    const viewEl = document.getElementById(prefix+'_'+tabKey+'_view');
    if(viewEl) viewEl.checked = ac;
    (TAB_ACTIONS[tabKey]||[]).forEach(a=>{
      const el = document.getElementById(prefix+'_'+tabKey+'_'+a);
      if(el) el.checked = ac;
    });
  });
  toast(ac ? 'Tüm yetkiler işaretlendi — kaydetmeyi unutmayın.' : 'Tüm yetkiler kaldırıldı — kaydetmeyi unutmayın.');
}
function izinGruplariOku(prefix){
  const izinler = {};
  Object.keys(TAB_KATEGORI).forEach(tabKey=>{
    const viewEl = document.getElementById(prefix+'_'+tabKey+'_view');
    const view = !!(viewEl && viewEl.checked);
    const obj = {view};
    (TAB_ACTIONS[tabKey]||[]).forEach(a=>{
      const el = document.getElementById(prefix+'_'+tabKey+'_'+a);
      // Görüntüleme kapalıysa alt izinler otomatik kapalı sayılır — bir
      // sekmeyi görmeyen biri o sekmede işlem de yapamaz.
      obj[a] = view && !!(el && el.checked);
    });
    izinler[tabKey] = obj;
  });
  return izinler;
}

async function saveEditRol(id){
  const idx = state.roller.findIndex(x=>(x.ID||x.id)===id);
  if(idx===-1){ closeModal(); return; }
  const ad = document.getElementById('erolAd').value.trim();
  if(!ad){ toast('Rol adı girin.'); return; }
  const eskiAd = state.roller[idx].Ad||state.roller[idx].ad;
  const izinler = izinGruplariOku('erolYeni');
  const izinlerJSON = JSON.stringify(izinler);
  state.roller[idx] = Object.assign({}, state.roller[idx], {Ad:ad, IzinlerJSON:izinlerJSON});
  // Rol adı değiştiyse, o rolü kullanan kullanıcıların Rol alanını da güncelle
  if(eskiAd!==ad){
    state.kullanicilar.forEach(u=>{ if((u.Rol||u.rol)===eskiAd) u.Rol = ad; });
    await persistKullanicilar();
  }
  await persistRoller();
  closeModal();
  toast('Rol güncellendi.');
  renderContent();
  await syncOrQueue({action:'updateRol', id, data:{ad, izinlerJSON}}, {entity:'rol', op:'update', localId:id});
}

async function createUserPackage(id){
  const cihazSifresiEl = document.getElementById('upkgCihazSifresi');
  const cihazSifresi = cihazSifresiEl ? cihazSifresiEl.value.trim() : '';
  closeModal();
  if(!state.apiUrl){
    toast('Kullanıcı dosyası için önce Ayarlar bölümünden bulut bağlantısını kurun. Canlı yetki güncellemesi bulut adresi olmadan çalışmaz.');
    return;
  }
  const u = state.kullanicilar.find(x=>(x.ID||x.id)===id);
  if(!u){ toast('Kullanıcı bulunamadı.'); return; }
  const rolAdi = u.Rol||u.rol;

  try{
    // HIZLI PAKET ÜRETİMİ:
    // Dosyayı oluşturmadan önce tüm bulutu indirmeyi BEKLEME. Yereldeki güncel
    // kullanıcı + rol bilgisi pakete yazılır; canlı doğrulama kullanıcı dosyası
    // açılır açılmaz buluttan yapılır. Bekleyen işlemler varsa arka planda gönder.
    if(state.pendingOps && state.pendingOps.length){
      flushPendingOps().catch(()=>{});
    }

    const role = rolAdi==='yonetici' ? null : (state.roller||[]).find(r=>String(r.Ad||r.ad)===String(rolAdi));
    if(rolAdi!=='yonetici' && !role){
      throw new Error('Kullanıcının rol kaydı bulunamadı. Önce rol tanımını kontrol edin.');
    }

    const cfg = {
      enabled:true,
      version:2,
      userId:u.ID||u.id,
      user:{ID:u.ID||u.id, Ad:u.Ad||u.ad, Rol:u.Rol||u.rol, Pin:(u.Pin!==undefined?u.Pin:u.pin||'')},
      role:role ? {ID:role.ID||role.id, Ad:role.Ad||role.ad, IzinlerJSON:role.IzinlerJSON||role.izinlerJSON||'{}'} : null,
      apiUrl:state.apiUrl,
      companyName:state.companyName||'PROSMART İNVESTMENT LTD',
      cihazSifresi:cihazSifresi||'',
      createdAt:new Date().toISOString()
    };

    // Çalışan DOM'u değil, uygulamanın kodunu taşıyan temiz bir klon üret.
    // Ekrandaki cari/ürün/kullanıcı kayıtları HTML içine yazılmaz.
    const clone = document.documentElement.cloneNode(true);
    ['loginRoot','nav','content','userPill','toastWrap','modalRoot','m-dock'].forEach(domId=>{
      const el=clone.querySelector('#'+domId); if(el) el.innerHTML='';
    });
    clone.querySelectorAll('#m-camera,#m-launch').forEach(x=>x.remove());
    clone.querySelector('body').classList.remove('m-mode');
    const shell=clone.querySelector('.shell'); if(shell) shell.removeAttribute('style');
    clone.querySelectorAll('script[data-user-package-bootstrap]').forEach(x=>x.remove());
    const boot = document.createElement('script');
    boot.setAttribute('data-user-package-bootstrap','1');
    boot.textContent = 'window.__USER_PACKAGE__ = ' + JSON.stringify(cfg).replace(/<\/script/gi,'<\\/script') + ';';
    const firstScript = clone.querySelector('script');
    if(firstScript && firstScript.parentNode) firstScript.parentNode.insertBefore(boot, firstScript);
    else clone.querySelector('head').appendChild(boot);

    const html='<!DOCTYPE html>\n'+clone.outerHTML;
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const safeName=String(u.Ad||u.ad||'KULLANICI').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_');
    a.href=url;
    a.download='CARİ_TAKİP_'+safeName+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1200);
    toast('Kullanıcı dosyası hızlı şekilde oluşturuldu: '+(u.Ad||u.ad)+'. Canlı yetki doğrulaması dosya açıldığında yapılacak.');
  }catch(e){
    toast('Dosya oluşturulamadı: '+String((e&&e.message)||e));
  }
}

var URUN_TABLE_HEAD = '<th>Stok kodu</th><th>Ürün adı</th><th class="num">Fiyat</th><th>Birim</th><th class="num">KDV %</th><th class="num">İndirim %</th><th class="num">Stok</th><th>Marka</th><th>İçeriği</th><th>Satıcısı</th><th></th>';
function viewUrunlerListesi(kategoriler){
  const filtre = state.urunKategoriFiltre||'';
  let list = state.urunler;
  if(filtre==='__yok__') list = list.filter(u=>!(u.Kategori||u.kategori||'').trim());
  else if(filtre) list = list.filter(u=>(u.Kategori||u.kategori||'').trim()===filtre);

  let html = '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">' +
    '<div class="field" style="margin:0;max-width:260px;"><label>Kategori</label><select onchange="setUrunKategoriFiltre(this.value)">' +
      '<option value=""'+(!filtre?' selected':'')+'>Tüm kategoriler ('+state.urunler.length+')</option>' +
      kategoriler.map(k=>{
        const adet = state.urunler.filter(u=>(u.Kategori||u.kategori||'').trim()===k).length;
        return '<option value="'+escapeHtml(k)+'"'+(filtre===k?' selected':'')+'>'+escapeHtml(k)+' ('+adet+')</option>';
      }).join('') +
      '<option value="__yok__"'+(filtre==='__yok__'?' selected':'')+'>Kategorisiz ('+state.urunler.filter(u=>!(u.Kategori||u.kategori||'').trim()).length+')</option>' +
    '</select></div>' +
    '<button class="btn btn-sm '+(state.urunGrupla?'btn-primary':'btn-ghost')+'" style="margin-top:20px;" onclick="toggleUrunGrupla()">'+(state.urunGrupla?'✓ ':'')+'Kategoriye göre grupla</button>' +
  '</div>';

  if(list.length===0){
    return html + emptyState('Bu kategoride ürün yok', 'Farklı bir kategori seçin ya da filtreyi temizleyin.');
  }

  if(!state.urunGrupla){
    html += '<div class="tbl-wrap"><table><thead><tr><th>Kategori</th>'+URUN_TABLE_HEAD+'</tr></thead><tbody>' +
      list.map(u=>{
        const kat = (u.Kategori||u.kategori||'').trim();
        const katCell = '<td>'+(kat?'<span class="badge badge-primary">'+escapeHtml(kat)+'</span>':'<span class="hint" style="margin:0;">—</span>')+'</td>';
        return '<tr>'+katCell+urunSatirHtml(u).slice(4); // urunSatirHtml '<tr>' ile başlıyor, onu atıp kendi <tr>'mizi kullanıyoruz
      }).join('') +
    '</tbody></table></div>';
    return html;
  }

  // Gruplu (kategoriye göre bölümlenmiş, açılır/kapanır) görünüm
  const gruplar = {};
  list.forEach(u=>{
    const kat = (u.Kategori||u.kategori||'').trim() || 'Kategorisiz';
    if(!gruplar[kat]) gruplar[kat] = [];
    gruplar[kat].push(u);
  });
  const katAdlari = Object.keys(gruplar).sort((a,b)=> a==='Kategorisiz'?1: b==='Kategorisiz'?-1 : a.localeCompare(b,'tr'));
  html += katAdlari.map(kat=>{
    const acikMi = state.urunKategoriAcik && state.urunKategoriAcik[kat]!==false; // varsayılan açık
    const urunler = gruplar[kat];
    const toplamStokDegeri = urunler.reduce((s,u)=>s+(Number(u.Fiyat!==undefined?u.Fiyat:u.fiyat)||0)*(Number(u.Stok!==undefined?u.Stok:u.stok)||0),0);
    return '<div class="card" style="margin-bottom:12px;padding:0;overflow:hidden;">' +
      '<button type="button" onclick="toggleUrunKategoriAcik(\''+escapeHtml(kat).replace(/'/g,"\\'")+'\')" style="width:100%;text-align:left;background:var(--primary-tint);border:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font:inherit;">' +
        '<span style="font-weight:600;color:var(--primary-text);">'+(acikMi?'▾':'▸')+' '+escapeHtml(kat)+' <span class="hint" style="margin-left:6px;">('+urunler.length+' ürün)</span></span>' +
        '<span class="hint" style="margin:0;">Stok değeri: '+money(toplamStokDegeri)+'</span>' +
      '</button>' +
      (acikMi ? '<div class="tbl-wrap" style="border:0;"><table><thead><tr>'+URUN_TABLE_HEAD+'</tr></thead><tbody>' + urunler.map(urunSatirHtml).join('') + '</tbody></table></div>' : '') +
    '</div>';
  }).join('');
  return html;
}
function localNextStokKodu_(){
  let maxNum = 0;
  state.urunler.forEach(u=>{
    const kod = String(u.StokKodu||u.stokKodu||'');
    const m = kod.match(/^STK(\d+)$/);
    if(m){ const n = parseInt(m[1],10); if(n>maxNum) maxNum = n; }
  });
  return 'STK' + String(maxNum+1).padStart(4,'0');
}
// Yeni ürün adı yazılırken, aynı veya çok benzer isimli bir ürün kartı
// zaten var mı diye anlık kontrol eder — mükerrer fatura no uyarısıyla
// aynı desen (küçük, hedefe özel bir alanı güncelleme; tüm sayfayı değil).
function checkUrunAdDuplicate(){
  const warnEl = document.getElementById('urunAdWarning');
  const adEl = document.getElementById('uAd');
  if(!warnEl || !adEl) return;
  const ad = adEl.value.trim();
  if(ad.length<3){ warnEl.innerHTML=''; return; }
  const adLower = turkishLower(ad);
  const tamAyni = state.urunler.filter(u=>turkishLower(u.Ad||u.ad||'')===adLower);
  const benzer = tamAyni.length ? [] : state.urunler.filter(u=>{
    const uAd = turkishLower(u.Ad||u.ad||'');
    return uAd.includes(adLower) || adLower.includes(uAd);
  }).slice(0,5);
  if(tamAyni.length){
    const u = tamAyni[0];
    warnEl.innerHTML = '<div class="banner banner-warn" style="margin-top:10px;">⚠️ <b>'+escapeHtml(u.Ad||u.ad)+'</b> ('+escapeHtml(u.StokKodu||u.stokKodu)+', '+escapeHtml(u.Satici||u.satici||'satıcı yok')+') adında bir ürün kartı zaten var — büyük ihtimalle aynı ürün. ' +
      '<button class="btn btn-sm btn-primary" style="margin-left:6px;" onclick="openEditUrun(\''+(u.ID||u.id)+'\')">Mevcut kartı düzenle</button></div>';
  } else if(benzer.length){
    warnEl.innerHTML = '<div class="banner" style="margin-top:10px;background:var(--accent-tint);">Benzer isimli ürünler bulundu — aynı ürün olabilir, kontrol edin:<br>' +
      benzer.map(u=>'<button class="btn btn-sm btn-ghost" style="margin:4px 6px 0 0;" onclick="openEditUrun(\''+(u.ID||u.id)+'\')">'+escapeHtml(u.StokKodu||u.stokKodu)+' · '+escapeHtml(u.Ad||u.ad)+'</button>').join('') +
    '</div>';
  } else {
    warnEl.innerHTML = '';
  }
}
async function addUrun(){
  if(!canDo('urunler','add')){ yetkiYokUyar(); return; }
  const ad = document.getElementById('uAd').value.trim();
  if(!ad){ toast('Ürün adı girin.'); return; }
  const adLower = turkishLower(ad);
  const tamAyni = state.urunler.find(u=>turkishLower(u.Ad||u.ad||'')===adLower);
  if(tamAyni){
    const devam = confirm('"'+ad+'" adında bir ürün kartı zaten var ('+(tamAyni.StokKodu||tamAyni.stokKodu)+'). Yine de yeni bir kart olarak eklemek istiyor musunuz?');
    if(!devam) return;
  }
  const fiyat = Number(document.getElementById('uFiyat').value)||0;
  const birim = document.getElementById('uBirim').value.trim();
  const kdvOrani = Number(document.getElementById('uKdv').value)||0;
  const indirim = Number(document.getElementById('uIndirim').value)||0;
  const marka = document.getElementById('uMarka').value.trim();
  const kategori = document.getElementById('uKategori').value.trim();
  const icerik = document.getElementById('uIcerik').value.trim();
  const satici = document.getElementById('uSatici').value.trim();
  const rec = {ID:uid('U'), StokKodu:localNextStokKodu_(), Ad:ad, Fiyat:fiyat, Birim:birim, KdvOrani:kdvOrani, Indirim:indirim, Marka:marka, Kategori:kategori, Icerik:icerik, Satici:satici};
  state.urunler.push(rec);
  await persistUrunler();
  toast('Ürün eklendi: '+rec.StokKodu);
  renderContent();
  syncOrQueue({action:'addUrun', data:{ad, fiyat, birim, kdvOrani, indirim, marka, kategori, icerik, satici}}, {entity:'urun', op:'add', localId:rec.ID});
}
async function deleteUrun(id){
  if(!canDo('urunler','delete')){ yetkiYokUyar(); return; }

  state.urunler = state.urunler.filter(u=>(u.ID||u.id)!==id);

  syncOrQueue({action:'deleteUrun', id}, {entity:'urun', op:'delete', localId:id});
}

async function saveEditUrun(id){
  if(!canDo('urunler','edit')){ yetkiYokUyar(); return; }
  const idx = state.urunler.findIndex(x => (x.ID||x.id)===id);
  if(idx===-1){ closeModal(); return; }
  const ad = document.getElementById('euAd').value.trim();
  if(!ad){ toast('Ürün adı girin.'); return; }
  const data = {
    ad,
    fiyat: Number(document.getElementById('euFiyat').value)||0,
    birim: document.getElementById('euBirim').value.trim(),
    kdvOrani: Number(document.getElementById('euKdv').value)||0,
    indirim: Number(document.getElementById('euIndirim').value)||0,
    marka: document.getElementById('euMarka').value.trim(),
    kategori: document.getElementById('euKategori').value.trim(),
    icerik: document.getElementById('euIcerik').value.trim(),
    satici: document.getElementById('euSatici').value.trim()
  };
  const cur = state.urunler[idx];
  state.urunler[idx] = Object.assign({}, cur, {
    Ad:data.ad, Fiyat:data.fiyat, Birim:data.birim, KdvOrani:data.kdvOrani,
    Indirim:data.indirim, Marka:data.marka, Kategori:data.kategori, Icerik:data.icerik, Satici:data.satici
  });
  await persistUrunler();
  closeModal();
  toast('Ürün güncellendi.');
  renderContent();
  syncOrQueue({action:'updateUrun', id, data}, {entity:'urun', op:'update', localId:id});
}

========================================================= */
function setUrunStokQuery(v){ state.urunStokQuery = v; renderContentKeepFocus(); }
function viewUrunStokDurumu(){
  const q = (state.urunStokQuery||'').toLowerCase();
  const list = state.urunler.filter(u=>{
    if(!q) return true;
    const hay = ((u.Ad||u.ad||'')+' '+(u.StokKodu||u.stokKodu||'')).toLowerCase();
    return hay.includes(q);
  }).slice().sort((a,b)=>(Number(a.Stok!==undefined?a.Stok:a.stok)||0)-(Number(b.Stok!==undefined?b.Stok:b.stok)||0));

  let html = '<div class="section-desc" style="margin-bottom:14px;">Ürünlerin şu anki stok miktarları. Stok, "Teslim Alındı → Stoğa Aktar" akışıyla otomatik artar; gerekirse burada manuel de düzeltebilirsiniz.</div>';

/* =========================================================
   ÜRÜN RAPORLA — bir ürüne (ya da tümüne) göre dönemsel rapor
========================================================= */
function setUrunRaporQuery(v){ state.urunRaporQuery = v; renderContentKeepFocus(); }
function viewUrunRaporla(){
  const r = state.report;
  const q = (state.urunRaporQuery||'').trim();
  if(state.alimlar.length===0) return emptyState('Rapor için veri yok', 'Alış/Satış kaydı ekledikçe burada raporlar oluşur.');
  const kaynakRows = state.alimlar.filter(a=>{
    if(!q) return true;
    return String(a.stokKodu||'').toUpperCase()===q.toUpperCase();
  });

  const from = r.from || '';
  const to = r.to || '';
  const rangeRows = kaynakRows.filter(a => (!from || a.tarih>=from) && (!to || a.tarih<=to));

  const groups = groupPeriods(rangeRows, r.granularity);
  const keys = Object.keys(groups).sort();
  const maxTutar = Math.max(1, ...keys.map(k=>groups[k].tutar));

  const byUrun = {};
  rangeRows.forEach(a=>{
    const key = (a.stokKodu||'')+' — '+(a.urunAdi||'');
    if(!byUrun[key]) byUrun[key] = {miktar:0, tutar:0};
    byUrun[key].miktar += Number(a.miktar||0);
    byUrun[key].tutar += Number(a.toplam||0);
  });
  const urunRows = Object.entries(byUrun).sort((a,b)=>b[1].tutar-a[1].tutar);

  let html = '<div class="card" style="margin-bottom:18px;">' +
    '<div class="form-row" style="grid-template-columns:1.4fr 1fr 1fr 1fr;">' +
      '<div class="field" style="position:relative;"><label>Ürün (boş = tüm ürünler)</label><input type="text" autocomplete="off" id="urunRaporInput" value="'+escapeHtml(q)+'" placeholder="Stok kodu veya ürün adı yazın…" ' +
        'oninput="showUrunSearch(0,this.value,0,\'urunRapor\')" onfocus="showUrunSearch(0,this.value,0,\'urunRapor\')" onblur="scheduleCloseUrunSearch()" onkeydown="handleSimpleSearchKey(event,\'urunRapor\')" onchange="setUrunRaporQuery(this.value)">' +
        '<div id="urunSearchPop" class="search-popover" style="display:none;" onmousedown="event.preventDefault()"></div>' +
      '</div>' +
      '<div class="field"><label>Başlangıç</label><input type="date" value="'+from+'" onchange="setReport(\'from\',this.value)"></div>' +
      '<div class="field"><label>Bitiş</label><input type="date" value="'+to+'" onchange="setReport(\'to\',this.value)"></div>' +
      '<div class="field"><label>Dönem</label><select onchange="setReport(\'granularity\',this.value)">' +
        ['daily:Günlük','weekly:Haftalık','monthly:Aylık','yearly:Yıllık'].map(o=>{
          const [v,l]=o.split(':'); return '<option value="'+v+'" '+(r.granularity===v?'selected':'')+'>'+l+'</option>';
        }).join('') +
      '</select></div>' +
    '</div>' +
  '</div>';

  html += '<h2 class="section-title">' + periodLabel(r.granularity) + ' toplam</h2>' +
    '<div class="card">' +
      (keys.length ?
        '<div class="chart-bars">' +
          keys.slice(-16).map(k => (
            '<div class="chart-bar-col">' +
              '<div class="chart-bar" style="height:' + Math.max(2, Math.round(groups[k].tutar/maxTutar*120)) + 'px" title="'+money(groups[k].tutar)+'"></div>' +
              '<div class="chart-bar-label">' + periodKeyLabel(k, r.granularity) + '</div>' +
            '</div>'
          )).join('') +
        '</div>' : emptyMini()) +
    '</div>';

  html += '<h2 class="section-title">Ürüne göre toplam (seçili aralık)</h2>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Ürün</th><th class="num">Toplam miktar</th><th class="num">Toplam tutar</th></tr></thead><tbody>' +
      (urunRows.length ? urunRows.map(([k,v]) => (
        '<tr><td>'+escapeHtml(k)+'</td><td class="num">'+num(v.miktar,2)+'</td><td class="num">'+money(v.tutar)+'</td></tr>'
      )).join('') : '<tr><td colspan="3" style="text-align:center;color:var(--muted);">Kayıt yok</td></tr>') +
    '</tbody></table></div>';

  return html;
}

/* =========================================================
   TRANSFERLER (Ürünler altında iç içe alt menü)
   Ambar Tanımla / Ambar Çıkış / Ambar Giriş / Ambar Rapor / Transfer Raporları
   Mantık: ANA AMBAR = state.urunler[].Stok alanı. Bir Ambara "Çıkış"
   yapıldığında ana ambar stoğundan düşer, ürünün GÜNCEL (en son Alış
   faturasındaki) fiyatından fiyatlandırılır. Aynı ambardan "Giriş"
   yapıldığında (ürün geri döndüğünde) ana ambar stoğuna geri eklenir.
========================================================= */
function getSonAlisFiyati(stokKodu){
  const kod = String(stokKodu||'').trim().toUpperCase();
  if(!kod) return 0;
  const son = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')==='Alış')
    .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||''))).pop();
  return son ? Number(son.birimFiyat)||0 : 0;
}

function lookupTransferUrun(){
  const el = document.getElementById('trUrun');
  if(!el) return;
  const val = el.value.trim().toLowerCase();
  const u = state.urunler.find(x => String(x.Ad||x.ad||'').toLowerCase()===val);
  const birimEl = document.getElementById('trBirim');
  const fiyatEl = document.getElementById('trBirimFiyat');
  const stokHint = document.getElementById('trStokHint');
  if(u){
    if(birimEl) birimEl.value = bfCleanBirim(u.Birim||u.birim||'');
    const fiyat = getSonAlisFiyati(u.StokKodu||u.stokKodu);
    if(fiyatEl) fiyatEl.value = fiyat;
    if(stokHint){
      const mevcutStok = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
      stokHint.textContent = 'Ana ambar mevcut stok: '+num(mevcutStok,2)+' '+(u.Birim||u.birim||'');
    }
    updateTransferTutar();
  } else {
    if(birimEl) birimEl.value='';
    if(fiyatEl) fiyatEl.value='';
    if(stokHint) stokHint.textContent='';
  }
}
function updateTransferTutar(){
  const mEl = document.getElementById('trMiktar'), fEl = document.getElementById('trBirimFiyat'), tEl = document.getElementById('trTutar');
  if(!mEl || !fEl || !tEl) return;
  const miktar = Number(mEl.value)||0;
  const fiyat = Number(fEl.value)||0;
  tEl.value = money(miktar*fiyat);
}
async function saveTransfer(yon){
  if(!canDo(yon==='Giriş'?'ambarGiris':'ambarCikis','add')){ yetkiYokUyar(); return; }
  const ambarAdi = state.transferSelectedAmbar[yon];
  if(!ambarAdi) return;
  const tarih = document.getElementById('trTarih').value;
  const urunAdi = document.getElementById('trUrun').value.trim();
  const miktar = Number(document.getElementById('trMiktar').value)||0;
  const birim = document.getElementById('trBirim').value.trim();
  const birimFiyat = Number(document.getElementById('trBirimFiyat').value)||0;
  const aciklama = document.getElementById('trAciklama').value.trim();
  if(!tarih){ toast('Tarih seçin.'); return; }
  if(!urunAdi){ toast('Ürün adı girin.'); return; }
  if(miktar<=0){ toast('Miktar girin.'); return; }
  const u = state.urunler.find(x => String(x.Ad||x.ad||'').toLowerCase()===urunAdi.toLowerCase());
  if(!u){ toast('Bu ürün adı Ürün Tanımla\'da bulunamadı — önce ürün kartını oluşturun.'); return; }
  const stokKodu = u.StokKodu||u.stokKodu;
  const mevcutStok = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
  if(yon==='Çıkış' && miktar>mevcutStok){
    const devam = confirm('DİKKAT: Ana ambar stoğunda ('+num(mevcutStok,2)+' '+birim+') bu çıkıştan ('+num(miktar,2)+' '+birim+') daha az var. Yine de devam edilsin mi (stok eksiye düşecek)?');
    if(!devam) return;
  }
  const tutar = miktar*birimFiyat;
  const rec = {ID:uid('TR'), tarih, yon, ambar:ambarAdi, stokKodu, urunAdi, birim, miktar, birimFiyat, tutar, aciklama};
  state.transferler.push(rec);

  // Ana ambar stoğunu güncelle: Çıkış -> düşer, Giriş -> geri eklenir
  const uIdx = state.urunler.findIndex(x=>(x.ID||x.id)===(u.ID||u.id));
  if(uIdx!==-1){
    const eski = Number(state.urunler[uIdx].Stok!==undefined?state.urunler[uIdx].Stok:state.urunler[uIdx].stok)||0;
    state.urunler[uIdx].Stok = yon==='Çıkış' ? eski - miktar : eski + miktar;
  }

  await Promise.all([persistTransferler(), persistUrunler()]);
  toast((yon==='Giriş'?'Giriş':'Çıkış')+' kaydedildi. Ana ambar stoğu güncellendi.');
  ['trUrun','trMiktar','trBirim','trBirimFiyat','trAciklama'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  const tEl = document.getElementById('trTutar'); if(tEl) tEl.value = money(0);
  const stokHint = document.getElementById('trStokHint'); if(stokHint) stokHint.textContent='';
  renderContent();
  await syncOrQueue({action:'addTransfer', data:{tarih, yon, ambar:ambarAdi, stokKodu, urunAdi, birim, miktar, birimFiyat, tutar, aciklama}}, {entity:'transfer', op:'add', localId:rec.ID});
  if(uIdx!==-1){
    syncOrQueue({action:'updateUrun', id:(u.ID||u.id), data:{stok:state.urunler[uIdx].Stok}}, {entity:'urun', op:'update', localId:(u.ID||u.id)});
  }
}
async function deleteTransferKaydi(id){
  const rec = state.transferler.find(t=>t.ID===id);
  const yon = rec ? rec.yon : 'Çıkış';
  if(!canDo(yon==='Giriş'?'ambarGiris':'ambarCikis','delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu transfer kaydı silinsin mi? NOT: Ana ambar stoğu bu silme işlemiyle otomatik geri alınmaz, gerekiyorsa Ürün Stok Durumu\'ndan elle düzeltin.')) return;
  state.transferler = state.transferler.filter(t=>t.ID!==id);
  await persistTransferler();
  renderContent();
  syncOrQueue({action:'deleteTransfer', id}, {entity:'transfer', op:'delete', localId:id});
}

/* ---- Ambar Rapor: ana ambarın şu anki toplam stok değeri ---- */
// Bir özel ambarın (Ana Ambar dışındaki) şu anki net stoğunu hesaplar:
// o ambara yapılan Çıkış transferleri (Ana Ambar'dan gönderilen) EKSİ
// Giriş transferleri (bu ambardan Ana Ambar'a geri dönen) — bkz. Ambar
// Çıkış/Giriş ekranlarındaki yön açıklaması.
function ambarNetStok(ambarAdi){
  const map = {};
  state.transferler.filter(t=>t.ambar===ambarAdi).forEach(t=>{
    const kod = String(t.stokKodu||'').toUpperCase();
    if(!map[kod]) map[kod] = {stokKodu:t.stokKodu, urunAdi:t.urunAdi, birim:t.birim, miktar:0};
    map[kod].miktar += (t.yon==='Çıkış' ? 1 : -1) * (Number(t.miktar)||0);
  });
  return Object.values(map).filter(r=>Math.abs(r.miktar)>0.0001);
}

      if(!item.ozel){

          const fiyat = getSonAlisFiyati(u.StokKodu||u.stokKodu) || Number(u.Fiyat!==undefined?u.Fiyat:u.fiyat)||0;
          return {miktar:stok, deger:stok*fiyat};
        }).filter(r=>Math.abs(r.miktar)>0.0001);
      } else {
        rows = ambarNetStok(item.ad).map(r=>{
          const fiyat = getSonAlisFiyati(r.stokKodu)||0;
          return {miktar:r.miktar, deger:r.miktar*fiyat};
        });
      }
      return {ad:item.ad, urunCesidi:rows.length, toplamDeger:rows.reduce((s,r)=>s+r.deger,0)};
    }).sort((a,b)=>b.toplamDeger-a.toplamDeger);

    html += '<div class="section-desc" style="margin-bottom:14px;">İşletmenizdeki tüm ambarların (Ana Ambar dahil) şu anki stok değeri karşılaştırması.</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;">' +
      uaMiniMetric('Toplam ambar sayısı', ambarOzet.length) +
      uaMiniMetric('Genel toplam stok değeri', money(genelToplamTum)) +
    '</div>';

    if(donutData.length){
      html += '<h2 class="section-title">Ambarlara göre stok değeri dağılımı</h2><div class="card" style="margin-bottom:18px;">' + donutChartHtml(donutData, {centerLabel:'Toplam Değer'}) + '</div>';
    }

    html += '<h2 class="section-title">Ambar bazında özet</h2>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">' +
      ambarOzet.map(a=>{
        const pct = genelToplamTum>0.0001 ? Math.round(a.toplamDeger/genelToplamTum*100) : 0;
        const hedefDeger = a.ad==='Ana Ambar' ? '' : escapeHtml(a.ad).replace(/'/g,"\\'");
        return '<div class="card" style="cursor:pointer;" onclick="setAmbarRaporSecili(\''+hedefDeger+'\')">' +
          '<div style="font-weight:600;font-size:14px;">'+escapeHtml(a.ad)+'</div>' +
          '<div style="font-family:var(--serif);font-size:22px;font-weight:600;margin:6px 0 4px;">'+money(a.toplamDeger)+'</div>' +
          '<div class="limit-bar-track"><div class="limit-bar-fill" style="width:'+pct+'%;"></div></div>' +
          '<div class="hint" style="margin-top:6px;">'+a.urunCesidi+' ürün çeşidi · toplamın %'+pct+'\'i</div>' +
        '</div>';
      }).join('') +
    '</div>';
    return html;
  }

  if(secili){
    const netler = ambarNetStok(secili);
    const rows = netler.map(r=>{
      const fiyat = getSonAlisFiyati(r.stokKodu)||0;
      return Object.assign({}, r, {fiyat, deger:r.miktar*fiyat});
    }).sort((a,b)=>b.deger-a.deger);
    const genelToplam2 = rows.reduce((s,r)=>s+r.deger,0);
    html += '<div class="section-desc" style="margin-bottom:14px;">"'+escapeHtml(secili)+'" ambarının şu anki net stoğu — Ambar Çıkış ile gönderilenler eksi Ambar Giriş ile geri dönenler.</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;">' +
      uaMiniMetric('Toplam ürün çeşidi', rows.length) +
      uaMiniMetric('Toplam stok değeri', money(genelToplam2)) +
    '</div>';
    if(rows.length===0){
      html += emptyState('Bu ambarda stok yok', '"Ambar Çıkış"tan bu ambara transfer yapın — Alış Faturası\'ndaki "Stoğa Aktar" ile bu ambarı seçtiğinizde de otomatik burada görünür.');
      return html;
    }
    html += '<div class="tbl-wrap"><table><thead><tr><th>Stok kodu</th><th>Ürün adı</th><th class="num">Mevcut Miktar</th><th class="num">Güncel Birim Fiyat</th><th class="num">Toplam Değer</th></tr></thead><tbody>' +
      rows.map(r=>(
        '<tr><td><code class="inline">'+escapeHtml(r.stokKodu)+'</code></td>' +
        '<td>'+escapeHtml(r.urunAdi)+'</td>' +
        '<td class="num">'+num(r.miktar,2)+' '+escapeHtml(r.birim||'')+'</td>' +
        '<td class="num">'+money(r.fiyat)+'</td>' +
        '<td class="num">'+money(r.deger)+'</td></tr>'
      )).join('') +
      '<tr style="font-weight:700;"><td colspan="4" style="text-align:right;">Genel Toplam</td><td class="num">'+money(genelToplam2)+'</td></tr>' +
    '</tbody></table></div>';
    return html;
  }

  const rows = state.urunler.map(u=>{
    const stok = Number(u.Stok!==undefined?u.Stok:u.stok)||0;
    const fiyat = getSonAlisFiyati(u.StokKodu||u.stokKodu) || Number(u.Fiyat!==undefined?u.Fiyat:u.fiyat)||0;
    return {u, stok, fiyat, deger: stok*fiyat};
  }).filter(r=>r.stok!==0).sort((a,b)=>b.deger-a.deger);

  const genelToplam = rows.reduce((s,r)=>s+r.deger,0);

  html += '<div class="section-desc" style="margin-bottom:14px;">Ana ambarın şu anki elindeki tüm ürün miktarları ve güncel (son alış) fiyatına göre toplam değeri.</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;">' +
    uaMiniMetric('Toplam ürün çeşidi', rows.length) +
    uaMiniMetric('Toplam stok değeri', money(genelToplam)) +
  '</div>';
  if(rows.length===0){
    html += emptyState('Stokta ürün yok', 'Alış faturası girip / Ürün Stok Durumu\'ndan stok ekleyin.');
    return html;
  }
  html += '<div class="tbl-wrap"><table><thead><tr><th>Stok kodu</th><th>Ürün adı</th><th class="num">Mevcut Miktar</th><th class="num">Güncel Birim Fiyat</th><th class="num">Toplam Değer</th></tr></thead><tbody>' +
    rows.map(r=>(

      '<td class="num">'+money(r.fiyat)+'</td>' +
      '<td class="num">'+money(r.deger)+'</td></tr>'
    )).join('') +
    '<tr style="font-weight:700;"><td colspan="4" style="text-align:right;">Genel Toplam</td><td class="num">'+money(genelToplam)+'</td></tr>' +
  '</tbody></table></div>';
  return html;

function setUrunKarMarjiQuery(v){ state.urunKarMarjiQuery = v; renderContentKeepFocus(); }
async function saveKarMarji(id, val){
  if(!canDo('urunKarMarji','edit')){ yetkiYokUyar(); return; }
  const marj = Number(val);
  const idx = state.urunler.findIndex(u=>(u.ID||u.id)===id);
  if(idx===-1) return;
  state.urunler[idx].KarMarji = isNaN(marj) ? 0 : marj;
  await persistUrunler();
  const el = document.getElementById('km_sug_'+id);
  if(el){
    const u = state.urunler[idx];
    const maliyet = getSonAlisMaliyeti(u.StokKodu||u.stokKodu);
    el.textContent = (maliyet && marj) ? money(Math.round(maliyet*(1+marj/100)*100)/100) : '—';
  }
  toast('Kâr marjı kaydedildi.');
  syncOrQueue({action:'updateUrun', id, data:{karMarji: state.urunler[idx].KarMarji}}, {entity:'urun', op:'update', localId:id});
}

    const onerilenFiyat = (maliyet && hedefMarj) ? Math.round(maliyet*(1+hedefMarj/100)*100)/100 : null;
    const sonSatis = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase() && (a.tur||'Alış')==='Satış')

    const gerceklesenMarj = (sonSatis && maliyet) ? ((Number(sonSatis.birimFiyat)-maliyet)/maliyet*100) : null;
    return {id, stokKodu, ad, satici:u.Satici||u.satici||'', maliyet, hedefMarj, onerilenFiyat, gerceklesenMarj};

    '<div class="card metric"><div class="metric-label">Marj tanımsız</div><div class="metric-value">'+(rows.length-tanimliSayisi)+'</div><div class="metric-sub">ürün</div></div>' +
  '</div>';

  html += '<div class="field" style="max-width:360px;margin:0 0 14px;"><label>Ürün ara</label><input id="urunKarMarjiQueryInput" type="text" value="'+escapeHtml(state.urunKarMarjiQuery||'')+'" placeholder="Ürün adı veya stok kodu…" oninput="setUrunKarMarjiQuery(this.value)"></div>';

/* =========================================================
   ÜRÜNLERİM
   Ürün arayarak o ürüne ait TÜM detaylı bilgileri (fiyat, stok, alım/satış
   geçmişi, transfer, talep, teklif, reçete kullanımı) tek ekranda gösterir.
   Ayrıca aynı isimde birden fazla ürün kartı (mükerrer) varsa bunları
   tespit edip her birinin işlem görüp görmediğini gösterir — işlem
   görmemiş bir mükerrer kart güvenle silinebilir, görmüşse dikkatli
   olunmalı.
========================================================= */
function normalizeUrunAdiForDup(ad){
  return String(ad||'').trim().toLocaleUpperCase('tr-TR').replace(/\s+/g,' ');
}
function mukerrerUrunGruplari(){
  const gruplar = {};
  state.urunler.forEach(u=>{
    const key = normalizeUrunAdiForDup(u.Ad||u.ad);
    if(!key) return;
    if(!gruplar[key]) gruplar[key] = [];
    gruplar[key].push(u);
  });
  return Object.values(gruplar).filter(g=>g.length>1);
}
// Bir ürün kartının hangi modüllerde kaç kez geçtiğini sayar — toplamı 0
// ise bu kart hiç kullanılmamış demektir (güvenle silinebilir).
function urunIslemOzeti(u){
  const kod = String(u.StokKodu||u.stokKodu||'').toUpperCase();
  const id = u.ID||u.id;
  const alim = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')==='Alış').length;
  const satis = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')==='Satış').length;
  const iade = state.iadeler.filter(i=>String(i.stokKodu||'').toUpperCase()===kod).length;
  const transfer = state.transferler.filter(t=>String(t.stokKodu||'').toUpperCase()===kod).length;
  const talep = state.talepler.filter(t=>talepKalemleri(t).some(k=>String(k.stokKodu||'').toUpperCase()===kod)).length;
  const teklif = state.teklifler.filter(t=>String(t.stokKodu||'').toUpperCase()===kod).length;
  const recete = (state.receteler||[]).filter(r=>(r.malzemeler||[]).some(m=>m.urunId===id)).length;
  return {alim,satis,iade,transfer,talep,teklif,recete, toplam: alim+satis+iade+transfer+talep+teklif+recete};
}

async function deleteUrunlerimKarti(id){
  if(!canDo('urunlerim','delete')){ yetkiYokUyar(); return; }
  const u = state.urunler.find(x=>(x.ID||x.id)===id);
  if(!u) return;
  const oz = urunIslemOzeti(u);
  const mesaj = oz.toplam===0
    ? '"'+(u.Ad||u.ad)+'" ('+(u.StokKodu||u.stokKodu)+') silinsin mi? Bu karta ait hiçbir işlem bulunmuyor, güvenle silinebilir.'
    : '⚠ "'+(u.Ad||u.ad)+'" ('+(u.StokKodu||u.stokKodu)+') kartında '+oz.toplam+' işlem var (alım/satış/iade/transfer/talep/teklif/reçete). Bu kartı silmek geçmiş hareketleri SİLMEZ, ama artık bu kart üzerinden yönetemezsiniz.\n\nYine de silinsin mi?';
  const onay = await evetHayirSor(mesaj, 'Ürün Kartını Sil');
  if(!onay) return;
  state.urunler = state.urunler.filter(x=>(x.ID||x.id)!==id);
  await persistUrunler();
  if(state.urunlerimSecili===id) state.urunlerimSecili = '';

/* =========================================================
   SKT TAKİP
   Ürünlerin son kullanma tarihini (belirli miktarlar/parti bazında)
   kaydeder — süresi geçmiş ya da yaklaşan ürünleri otomatik uyarır.
========================================================= */
function sktDurumHesapla(sktTarihi){
  if(!sktTarihi) return 'Bilinmiyor';
  const bugun = todayISO();
  if(sktTarihi < bugun) return 'Süresi Geçmiş';
  const kalanGun = Math.round((new Date(sktTarihi+'T00:00:00') - new Date(bugun+'T00:00:00'))/86400000);
  if(kalanGun<=30) return 'Yaklaşıyor';
  return 'Normal';
}
function sktDurumBadge(durum){
  const cls = durum==='Süresi Geçmiş' ? 'badge-danger' : durum==='Yaklaşıyor' ? 'badge-accent' : 'badge-success';
  return '<span class="badge '+cls+'" style="font-weight:600;">'+durum+'</span>';
}

  html += '<div class="card" style="margin-bottom:18px;overflow:visible;">' +
    '<div class="form-row" style="grid-template-columns:1.6fr 1fr 1fr 1fr;">' +
      '<div class="field" style="position:relative;"><label>Ürün</label>' +
        '<input id="sktUrunArama" type="text" autocomplete="off" placeholder="Ürün adı yazın…" ' +

        '<div id="urunSearchPop" class="search-popover" style="display:none;" onmousedown="event.preventDefault()"></div>' +

    '</div>' +

  '</div>';

  if(state.sktKayitlari.length===0){
    html += emptyState('Henüz SKT kaydı yok', 'Yukarıdan ilk kaydı ekleyin.');
    return html;
  }

  const hepsi = state.sktKayitlari.map(s=>Object.assign({}, s, {durum: sktDurumHesapla(s.sktTarihi)}));
  const gecmis = hepsi.filter(s=>s.durum==='Süresi Geçmiş').length;

    '<div class="card metric"><div class="metric-label">Süresi Geçmiş</div><div class="metric-value" style="color:'+(gecmis>0?'var(--danger)':'var(--ink)')+';">'+gecmis+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Yaklaşan (30 gün)</div><div class="metric-value" style="color:'+(yaklasan>0?'var(--accent)':'var(--ink)')+';">'+yaklasan+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam Takip</div><div class="metric-value">'+hepsi.length+'</div></div>' +

  const durumSira = {'Süresi Geçmiş':0,'Yaklaşıyor':1,'Normal':2,'Bilinmiyor':3};
  hepsi.sort((a,b)=>(durumSira[a.durum]-durumSira[b.durum]) || String(a.sktTarihi||'').localeCompare(String(b.sktTarihi||'')));

  html += '<div class="tbl-wrap"><table><thead><tr><th>Durum</th><th>Ürün</th><th class="num">Miktar</th><th>SKT</th><th>Not</th><th></th></tr></thead><tbody>' +
    hepsi.map(s=>{
      const id = s.ID||s.id;
      const kalanGun = s.sktTarihi ? Math.round((new Date(s.sktTarihi+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000) : null;
      return '<tr><td>'+sktDurumBadge(s.durum)+(s.durum==='Yaklaşıyor'&&kalanGun!==null?'<div class="hint" style="margin:2px 0 0;">'+kalanGun+' gün kaldı</div>':'')+'</td>' +
        '<td>'+escapeHtml(s.urunAdi)+'<div class="hint" style="margin:0;">'+escapeHtml(s.stokKodu)+'</div></td>' +
        '<td class="num">'+num(s.miktar,2)+' '+escapeHtml(s.birim||'')+'</td>' +
        '<td>'+fmtDate(s.sktTarihi)+'</td>' +
        '<td>'+escapeHtml(s.not||'—')+'</td>' +
        '<td>'+(canDo('sktTakip','delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteSktKaydi(\''+id+'\')">Sil</button>':'')+'</td></tr>';
    }).join('') +
  '</tbody></table></div>';
  return html;
}

/* =========================================================
   PERSONEL İŞLEMLER — PERSONEL KARTLARI
   İşletme çalışanlarının temel bilgilerini (kimlik, iletişim, pozisyon,
   maaş, acil durum kişisi) tutar. İzin/Devamsızlık/Bordro modülleri bu
   kartlardaki personelId'yi referans alır.
========================================================= */
function setPersonelQuery(v){ state.personelQuery = v; renderContentKeepFocus(); }
function personelYasHesapla(dogumTarihi){
  if(!dogumTarihi) return null;
  const dogum = new Date(dogumTarihi+'T00:00:00');
  const bugun = new Date();
  let yas = bugun.getFullYear() - dogum.getFullYear();
  const ayFarki = bugun.getMonth() - dogum.getMonth();
  if(ayFarki<0 || (ayFarki===0 && bugun.getDate()<dogum.getDate())) yas--;
  return yas>=0 ? yas : null;
}
function personelKidemHesapla(iseGirisTarihi, ayrilmaTarihi){
  if(!iseGirisTarihi) return null;
  const giris = new Date(iseGirisTarihi+'T00:00:00');
  const bitis = ayrilmaTarihi ? new Date(ayrilmaTarihi+'T00:00:00') : new Date();
  const gun = Math.round((bitis-giris)/86400000);
  if(gun<0) return null;
  const yil = Math.floor(gun/365);
  const kalanGun = gun%365;
  const ay = Math.floor(kalanGun/30);
  if(yil>0) return yil+' yıl'+(ay>0?' '+ay+' ay':'');
  if(ay>0) return ay+' ay';
  return gun+' gün';
}
// Brüt maaşın USD/EUR/GBP karşılığını (ALIŞ kuruyla — TL'yi dövize çevirme

    if(!alis) return null;
    return moneyDoviz(maasBrut/alis, kod);
  }).filter(Boolean);
  if(parcalar.length===0) return '';
  return '<div class="kv" style="border-bottom:0;"><span>Brüt Maaş (Döviz Karşılığı)</span><span>'+parcalar.join(' · ')+'</span></div>';
}

function viewPersonelDetayAc(id){
  const p = state.personel.find(x=>(x.ID||x.id)===id);
  if(!p) return;
  const yas = personelYasHesapla(p.dogumTarihi);
  const kidem = personelKidemHesapla(p.iseGirisTarihi, p.ayrilmaTarihi);
  const bordroKayitlari = state.bordro.filter(b=>b.personelId===id).slice().sort((a,b)=>String(a.donem||'').localeCompare(String(b.donem||'')));
  const toplamOdenenNet = bordroKayitlari.reduce((s,b)=>s+b.netMaas,0);
  const sonIki = bordroKayitlari.slice(-2);
  let farkHtml = '<span class="hint" style="margin:0;">Karşılaştırma için en az 2 bordro kaydı gerekli.</span>';
  if(sonIki.length===2){
    const fark = sonIki[1].brutMaas - sonIki[0].brutMaas;
    const yuzde = sonIki[0].brutMaas>0 ? (fark/sonIki[0].brutMaas*100) : 0;
    farkHtml = escapeHtml(sonIki[0].donem)+': '+money(sonIki[0].brutMaas)+' → '+escapeHtml(sonIki[1].donem)+': '+money(sonIki[1].brutMaas) +
      ' <span style="font-weight:700;color:'+(fark>=0?'var(--success)':'var(--danger)')+';">('+(fark>=0?'+':'')+money(fark)+' · %'+num(yuzde,1)+')</span>';
  }
  const maxBrut = Math.max(1, ...bordroKayitlari.map(b=>b.brutMaas));

  const izinSayisi = state.izinler.filter(i=>i.personelId===id && i.durum==='Onaylandı').reduce((s,i)=>s+i.gunSayisi,0);
  const devamsizlikSayisi = state.devamsizliklar.filter(d=>d.personelId===id && d.tur==='Devamsızlık').length;

  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box" style="max-width:640px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:start;">' +
          '<div><h3 style="margin:0;">'+escapeHtml(p.ad)+'</h3><div class="hint" style="margin:2px 0 0;">'+escapeHtml(p.pozisyon||'—')+' · '+escapeHtml(p.departman||'—')+'</div></div>' +
          (p.durum==='Ayrıldı'?'<span class="badge badge-primary">Ayrıldı</span>':'<span class="badge badge-success">Aktif</span>') +
        '</div>' +
        '<div class="grid grid-4" style="margin-top:14px;">' +
          '<div class="card metric"><div class="metric-label">Yaş</div><div class="metric-value">'+(yas!==null?yas:'—')+'</div></div>' +
          '<div class="card metric"><div class="metric-label">Kıdem</div><div class="metric-value" style="font-size:15px;">'+(kidem||'—')+'</div></div>' +
          '<div class="card metric"><div class="metric-label">Toplam Ödenen Net</div><div class="metric-value" style="font-size:15px;">'+money(toplamOdenenNet)+'</div></div>' +
          '<div class="card metric"><div class="metric-label">Bordro Kaydı</div><div class="metric-value">'+bordroKayitlari.length+'</div></div>' +
        '</div>' +
        '<div class="kv" style="margin-top:10px;"><span>Telefon</span><span>'+escapeHtml(p.telefon||'—')+'</span></div>' +
        '<div class="kv"><span>IBAN</span><span>'+escapeHtml(p.iban||'—')+'</span></div>' +
        '<div class="kv"><span>Acil Durum</span><span>'+escapeHtml(p.acilDurumKisi||'—')+(p.acilDurumTelefon?' · '+escapeHtml(p.acilDurumTelefon):'')+'</span></div>' +
        '<div class="kv"><span>Bu Yıl Onaylı İzin / Devamsızlık</span><span>'+izinSayisi+' gün · '+devamsizlikSayisi+' devamsızlık</span></div>' +
        (personelMaasDovizKarsiligiHtml(p.maasBrut)) +

        (bordroKayitlari.length>0 ? (
          '<h2 class="section-title" style="margin-top:14px;">Maaş Trendi (Brüt)</h2>' +
          '<div class="card"><div class="chart-bars" style="height:110px;">' +
            bordroKayitlari.map(b=>(
              '<div class="chart-bar-col"><div class="chart-bar" style="background:var(--primary);height:'+Math.max(2,Math.round(b.brutMaas/maxBrut*90))+'px;" title="'+escapeHtml(b.donem)+': '+money(b.brutMaas)+'"></div><div class="chart-bar-label">'+escapeHtml(b.donem)+'</div></div>'
            )).join('') +
          '</div></div>' +
          '<div class="hint" style="margin-top:8px;"><b>Son değişiklik:</b> '+farkHtml+'</div>' +
          '<h2 class="section-title" style="margin-top:14px;">Maaş Geçmişi</h2>' +
          '<div class="tbl-wrap"><table><thead><tr><th>Dönem</th><th class="num">Brüt</th><th class="num">Net</th></tr></thead><tbody>' +
            bordroKayitlari.slice().reverse().map(b=>'<tr><td>'+escapeHtml(b.donem)+'</td><td class="num">'+money(b.brutMaas)+'</td><td class="num">'+money(b.netMaas)+'</td></tr>').join('') +
          '</tbody></table></div>'
        ) : '<div class="hint" style="margin-top:14px;">Henüz bordro kaydı yok.</div>') +

        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Kapat</button>' +
          (canDo('personelKartlari','edit')?'<button class="btn btn-primary" onclick="closeModal(); openEditPersonel(\''+id+'\')">Düzenle</button>':'') +
        '</div>' +
      '</div>' +
    '</div>';
}
/* =========================================================

var IZIN_TURLERI = ['Yıllık İzin','Hastalık İzni','Mazeret İzni','Ücretsiz İzin','Doğum İzni','Evlilik İzni'];
function setIzinFiltre(v){ state.izinFiltre = v; renderContent(); }
function izinGunSayisiHesapla(){
  const b = document.getElementById('izBaslangic').value;
  const bt = document.getElementById('izBitis').value;
  const gunEl = document.getElementById('izGunSayisi');
  if(!b || !bt || !gunEl) return;
  const gun = Math.round((new Date(bt+'T00:00:00')-new Date(b+'T00:00:00'))/86400000)+1;
  gunEl.textContent = gun>0 ? gun+' gün' : '—';
}
function viewIzinYonetimi(){
  const aktifPersonel = state.personel.filter(p=>p.durum!=='Ayrıldı');
  let html = '<div class="section-desc" style="margin-bottom:14px;">Personelin izin taleplerini kaydedin, onaylayın/reddedin. Gün sayısı tarih aralığından otomatik hesaplanır.</div>';

      '<div class="field"><label>Personel</label><select id="izPersonelId">' +

  const bekleyen = state.izinler.filter(i=>i.durum==='Bekliyor').length;

  const buYilToplamGun = buYilOnayli.reduce((s,i)=>s+i.gunSayisi,0);
  html += '<div class="grid grid-4" style="margin-bottom:14px;">' +
    '<div class="card metric"><div class="metric-label">Bekleyen Talep</div><div class="metric-value" style="color:'+(bekleyen>0?'var(--accent)':'var(--ink)')+';">'+bekleyen+'</div></div>' +

    '<div class="card metric"><div class="metric-label">Toplam Kayıt</div><div class="metric-value">'+state.izinler.length+'</div></div>' +
  '</div>';

  html += '<div class="field" style="max-width:280px;margin-bottom:14px;"><label>Personel Filtrele</label><select onchange="setIzinFiltre(this.value)">' +
    '<option value="">Tüm Personel</option>' +
    state.personel.map(p=>'<option value="'+(p.ID||p.id)+'"'+(state.izinFiltre===(p.ID||p.id)?' selected':'')+'>'+escapeHtml(p.ad)+'</option>').join('') +
  '</select></div>';

  let list = state.izinler.slice();
  if(state.izinFiltre) list = list.filter(i=>i.personelId===state.izinFiltre);
  const durumSira = {'Bekliyor':0,'Onaylandı':1,'Reddedildi':2};
  list.sort((a,b)=>(durumSira[a.durum]-durumSira[b.durum]) || String(b.baslangicTarihi||'').localeCompare(String(a.baslangicTarihi||'')));

    list.map(i=>{
      const id = i.ID||i.id;
      const durumCls = i.durum==='Onaylandı'?'badge-success':i.durum==='Reddedildi'?'badge-danger':'badge-accent';
      return '<tr><td>'+escapeHtml(i.personelAdi)+'</td><td>'+escapeHtml(i.izinTuru)+'</td>' +
        '<td>'+fmtDate(i.baslangicTarihi)+'</td><td>'+fmtDate(i.bitisTarihi)+'</td><td class="num">'+i.gunSayisi+'</td>' +
        '<td><span class="badge '+durumCls+'" style="font-weight:600;">'+escapeHtml(i.durum)+'</span></td>' +

          (canDo('izinYonetimi','delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteIzin(\''+id+'\')">Sil</button>':'') +
        '</td></tr>';
    }).join('') +
  '</tbody></table></div>';
  return html;

async function addIzin(){
  if(!canDo('izinYonetimi','add')){ yetkiYokUyar(); return; }
  const personelId = document.getElementById('izPersonelId').value;
  const p = state.personel.find(x=>(x.ID||x.id)===personelId);
  if(!p){ toast('Personel seçin.'); return; }
  const izinTuru = document.getElementById('izTuru').value;
  const baslangicTarihi = document.getElementById('izBaslangic').value;
  const bitisTarihi = document.getElementById('izBitis').value;
  if(!baslangicTarihi || !bitisTarihi || bitisTarihi<baslangicTarihi){ toast('Geçerli bir tarih aralığı girin.'); return; }
  const gunSayisi = Math.round((new Date(bitisTarihi+'T00:00:00')-new Date(baslangicTarihi+'T00:00:00'))/86400000)+1;
  const not = document.getElementById('izNot').value.trim();
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const rec = {ID:uid('IZ'), tarih:todayISO(), personelId, personelAdi:p.ad, izinTuru, baslangicTarihi, bitisTarihi, gunSayisi, durum:'Bekliyor', not, olusturanKullanici:kullanici};
  state.izinler.push(rec);
  await persistIzinler();
  toast('İzin talebi eklendi.');
  document.getElementById('izNot').value = '';
  renderContent();
  syncOrQueue({action:'addIzin', data:{tarih:rec.tarih, personelId, personelAdi:p.ad, izinTuru, baslangicTarihi, bitisTarihi, gunSayisi, durum:'Bekliyor', not, olusturanKullanici:kullanici}}, {entity:'izin', op:'add', localId:rec.ID});
}
async function izinDurumGuncelle(id, yeniDurum){
  if(!canDo('izinYonetimi','edit')){ yetkiYokUyar(); return; }
  const idx = state.izinler.findIndex(x=>(x.ID||x.id)===id);
  if(idx===-1) return;
  state.izinler[idx].durum = yeniDurum;
  await persistIzinler();
  toast('İzin talebi '+(yeniDurum==='Onaylandı'?'onaylandı':'reddedildi')+'.');
  renderContent();
  syncOrQueue({action:'updateIzin', id, data:{durum:yeniDurum}}, {entity:'izin', op:'update', localId:id});
}
async function deleteIzin(id){
  if(!canDo('izinYonetimi','delete')){ yetkiYokUyar(); return; }
  state.izinler = state.izinler.filter(i=>(i.ID||i.id)!==id);
  await persistIzinler();
  renderContent();
  syncOrQueue({action:'deleteIzin', id}, {entity:'izin', op:'delete', localId:id});
}

/* =========================================================

function bordroNetHesapla(){
  const brut = Number((document.getElementById('brdBrutMaas')||{}).value)||0;
  const prim = Number((document.getElementById('brdPrimler')||{}).value)||0;
  const kesinti = Number((document.getElementById('brdKesintiler')||{}).value)||0;
  const netEl = document.getElementById('brdNetGoster');
  if(netEl) netEl.textContent = money(brut+prim-kesinti);
}
function bordroPersonelSecildi(){
  const personelId = document.getElementById('brdPersonelId').value;
  const p = state.personel.find(x=>(x.ID||x.id)===personelId);
  const brutEl = document.getElementById('brdBrutMaas');
  if(p && brutEl) brutEl.value = p.maasBrut||0;
  bordroNetHesapla();
}
function bordroKasaAlanGuncelle(){
  const sekil = document.getElementById('brdOdemeSekli').value;

}

  }

  const buDonem = todayISO().slice(0,7);

    '<div class="form-row" style="grid-template-columns:1.3fr 1fr;">' +

async function addBordro(){
  if(!canDo('bordro','add')){ yetkiYokUyar(); return; }
  const personelId = document.getElementById('brdPersonelId').value;
  const p = state.personel.find(x=>(x.ID||x.id)===personelId);
  if(!p){ toast('Personel seçin.'); return; }
  const donem = document.getElementById('brdDonem').value || todayISO().slice(0,7);
  const brutMaas = Number(document.getElementById('brdBrutMaas').value)||0;
  const primler = Number(document.getElementById('brdPrimler').value)||0;
  const kesintiler = Number(document.getElementById('brdKesintiler').value)||0;
  const netMaas = brutMaas+primler-kesintiler;
  const odemeTarihi = document.getElementById('brdOdemeTarihi').value || todayISO();
  const odemeSekli = document.getElementById('brdOdemeSekli').value;
  const kasaAdiEl = document.getElementById('brdKasaAdi');
  const kasaAdi = (odemeSekli!=='Kaydedilmedi' && kasaAdiEl) ? kasaAdiEl.value : '';
  const not = document.getElementById('brdNot').value.trim();
  if(netMaas<=0){ toast('Net maaş 0\'dan büyük olmalı.'); return; }
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const rec = {ID:uid('BRD'), personelId, personelAdi:p.ad, donem, brutMaas, primler, kesintiler, netMaas, odemeTarihi, odemeSekli, kasaAdi, durum:'Ödendi', not};
  state.bordro.push(rec);
  await persistBordro();
  syncOrQueue({action:'addBordro', data:{personelId, personelAdi:p.ad, donem, brutMaas, primler, kesintiler, netMaas, odemeTarihi, odemeSekli, kasaAdi, durum:'Ödendi', not}}, {entity:'bordroKaydi', op:'add', localId:rec.ID});

  if(odemeSekli==='Nakit' || odemeSekli==='Banka'){
    const ksRec = {ID:uid('KS'), tarih:odemeTarihi, tur:'Çıkış', hesapTuru:odemeSekli, kasaAdi:kasaAdi||'', paraBirimi:'TL', kategori:'Maaş Ödemesi', tutar:netMaas, aciklama:'Maaş: '+p.ad+' — '+donem, kullanici};
    state.kasaHareketleri.push(ksRec);
    await persistKasaHareketleri();
    syncOrQueue({action:'addKasaHareket', data:{tarih:odemeTarihi, tur:'Çıkış', hesapTuru:odemeSekli, kasaAdi:ksRec.kasaAdi, paraBirimi:'TL', kategori:ksRec.kategori, tutar:netMaas, aciklama:ksRec.aciklama, kullanici}}, {entity:'kasaHareket', op:'add', localId:ksRec.ID});
    toast('Bordro kaydedildi ve '+odemeSekli+' kasasından düşüldü.');
  } else {
    toast('Bordro kaydedildi.');
  }
  document.getElementById('brdNot').value = '';
  renderContent();
}
async function deleteBordro(id){
  if(!canDo('bordro','delete')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu bordro kaydı silinsin mi? (Kasadan otomatik düşülen tutar varsa, o kasa hareketi ETKİLENMEZ — ayrıca silmeniz gerekir.)', 'Bordro Kaydını Sil');
  if(!onay) return;
  state.bordro = state.bordro.filter(b=>(b.ID||b.id)!==id);
  await persistBordro();
  renderContent();
  syncOrQueue({action:'deleteBordro', id}, {entity:'bordroKaydi', op:'delete', localId:id});
}
// Maaş bordrosu PDF'i — kaşe/imza görseli (varsa) altına otomatik eklenir.

  const p = state.personel.find(x=>(x.ID||x.id)===b.personelId);
  toast('Bordro PDF oluşturuluyor…');
  ensurePdfShareStyles();

  const fragment =
    '<div class="pdf-wrap">' +
      '<div class="pdf-head"><div><h1>MAAŞ BORDROSU</h1><div class="sub">'+escapeHtml(firmam)+'</div></div><div class="sub">Dönem: '+escapeHtml(b.donem)+'</div></div>' +
      '<table><colgroup><col style="width:32%"><col style="width:68%"></colgroup><tbody>' +
        '<tr><td><b>Ad Soyad</b></td><td>'+escapeHtml(b.personelAdi)+'</td></tr>' +

        '<tr><td><b>Ödeme Tarihi</b></td><td>'+fmtDate(b.odemeTarihi)+'</td></tr>' +
        '<tr><td><b>Ödeme Şekli</b></td><td>'+escapeHtml(b.odemeSekli)+(b.kasaAdi?' ('+escapeHtml(b.kasaAdi)+')':'')+'</td></tr>' +
      '</tbody></table>' +
      '<table style="margin-top:14px;"><thead><tr><th>Kalem</th><th style="text-align:right;">Tutar</th></tr></thead><tbody>' +
        '<tr><td>Brüt Maaş</td><td style="text-align:right;">'+money(b.brutMaas)+'</td></tr>' +
        '<tr><td>Primler (+)</td><td style="text-align:right;">'+money(b.primler)+'</td></tr>' +
        '<tr><td>Kesintiler (−)</td><td style="text-align:right;">'+money(b.kesintiler)+'</td></tr>' +
        '<tr style="font-weight:700;"><td>Net Ödenen</td><td style="text-align:right;">'+money(b.netMaas)+'</td></tr>' +
      '</tbody></table>' +
      (b.not ? '<p style="font-size:11px;margin-top:10px;">Not: '+escapeHtml(b.not)+'</p>' : '') +
      (state.bordroKaseImza ? '<div style="margin-top:40px;text-align:right;"><img src="'+state.bordroKaseImza+'" style="max-height:80px;max-width:220px;"><div style="font-size:11px;color:#666;margin-top:4px;">Kaşe / İmza</div></div>' : '') +
    '</div>';
  const blob = await renderHtmlToPdfBlob(fragment);
  if(!blob) return null;
  const safeName = String(b.personelAdi+'-'+b.donem).replace(/[^\w.\-ğüşıöçĞÜŞİÖÇ]+/g,'_');
  downloadBlob(blob, 'bordro-'+safeName+'.pdf');
  toast('Bordro PDF indirildi.');
  return blob;
}
// Telefon numarasını wa.me'nin beklediği (ülke kodlu, sade rakam) formata çevirir.
function telefonWhatsappFormatla(telefon){
  let t = String(telefon||'').replace(/[^\d+]/g,'').replace(/^\+/, '');
  if(t.startsWith('0')) t = '90'+t.slice(1);
  if(!t.startsWith('90') && t.length===10) t = '90'+t;
  return t;
}
// PDF'i indirir ve WhatsApp'ı personelin kayıtlı numarasıyla, hazır bir
// mesajla açar. Taraycılar güvenlik nedeniyle bir dosyayı başka bir siteye/
// uygulamaya OTOMATİK ekleyemez — bu yüzden indirilen PDF'in WhatsApp'a
// sürüklenip gönderilmesi (tek adım) kullanıcıda kalır.
async function bordroWhatsappGonder(id){
  const b = state.bordro.find(x=>(x.ID||x.id)===id);
  if(!b) return;
  const p = state.personel.find(x=>(x.ID||x.id)===b.personelId);
  if(!p || !p.telefon){ toast('Bu personelin kayıtlı telefon numarası yok.'); return; }
  const telefon = telefonWhatsappFormatla(p.telefon);
  if(telefon.length<10){ toast('Kayıtlı telefon numarası geçerli görünmüyor.'); return; }
  const blob = await bordroPdfOlustur(id);
  if(!blob) return;
  const mesaj = 'Merhaba '+b.personelAdi+', '+b.donem+' dönemine ait maaş bordronuz PDF olarak az önce indirildi. Bu mesajın devamına lütfen o dosyayı ekleyip gönderin. İyi çalışmalar.';
  const url = 'https://wa.me/'+telefon+'?text='+encodeURIComponent(mesaj);
  window.open(url, '_blank');
  toast('WhatsApp açıldı — indirdiğiniz PDF\'i sohbete sürükleyip gönderin.');
}

/* =========================================================
   FİZİKSEL STOK SAYIMI
   Ürün arayarak "sayım listesi"ne ekler, elle sayılan miktarı girip
   sistem miktarıyla farkını canlı gösterir. "Farkları Uygula" ile TÜM
   listedeki ürünlerin stok miktarı tek seferde gerçek (sayılan) miktara
   çekilir — Kasa Sayımı ile aynı mantık, ürünler için.
========================================================= */
function stokSayimListesineEkle(stokKodu){
  if(!state.stokSayimListesi) state.stokSayimListesi = [];
  if(state.stokSayimListesi.some(r=>r.stokKodu===stokKodu)){ toast('Bu ürün zaten listede.'); renderContent(); return; }
  const u = state.urunler.find(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===String(stokKodu).toUpperCase());
  if(!u) return;
  state.stokSayimListesi.push({stokKodu, urunAdi:u.Ad||u.ad, birim:u.Birim||u.birim||'', sistemMiktar:Number(u.Stok!==undefined?u.Stok:u.stok)||0, sayilanMiktar:''});
  renderContent();
}
function stokSayimSatirSil(stokKodu){
  state.stokSayimListesi = (state.stokSayimListesi||[]).filter(r=>r.stokKodu!==stokKodu);
  renderContent();
}
function stokSayimMiktarGuncelle(stokKodu, val){
  const row = (state.stokSayimListesi||[]).find(r=>r.stokKodu===stokKodu);
  if(!row) return;
  row.sayilanMiktar = val;
  const farkEl = document.getElementById('ssFark_'+stokKodu.replace(/[^\w]/g,'_'));
  if(farkEl){
    const sayilan = Number(val);
    if(val==='' || isNaN(sayilan)){ farkEl.innerHTML=''; return; }
    const fark = sayilan - row.sistemMiktar;
    farkEl.innerHTML = Math.abs(fark)<0.0001 ? '<span style="color:var(--success);">✓ Fark yok</span>' : '<span style="color:'+(fark>0?'var(--success)':'var(--danger)')+';font-weight:600;">'+(fark>0?'+':'')+num(fark,2)+'</span>';
  }
}

        '<td class="num"><input type="number" step="any" style="width:100px;text-align:right;" value="'+escapeHtml(r.sayilanMiktar)+'" oninput="stokSayimMiktarGuncelle(\''+r.stokKodu.replace(/'/g,"\\'")+'\',this.value)"></td>' +
        '<td class="num" id="ssFark_'+safeId+'"></td>' +
        '<td><button class="btn btn-ghost btn-sm btn-danger" onclick="stokSayimSatirSil(\''+r.stokKodu.replace(/'/g,"\\'")+'\')">Çıkar</button></td></tr>';
    }).join('') +

  html += '<button class="btn btn-primary" onclick="stokSayimUygula()" '+(canDo('stokSayimi','edit')?'':'disabled title="Bu işlem için yetkiniz yok"')+'>Farkları Uygula</button>';
  return html;
}
async function stokSayimUygula(){
  if(!canDo('stokSayimi','edit')){ yetkiYokUyar(); return; }
  const list = (state.stokSayimListesi||[]).filter(r=>r.sayilanMiktar!=='' && !isNaN(Number(r.sayilanMiktar)));
  if(list.length===0){ toast('En az bir ürüne sayılan miktar girin.'); return; }
  const degisenler = list.filter(r=>Math.abs(Number(r.sayilanMiktar)-r.sistemMiktar)>0.0001);
  if(degisenler.length===0){ toast('Hiçbir üründe fark yok.'); state.stokSayimListesi=[]; renderContent(); return; }
  const onay = await evetHayirSor(degisenler.length+' üründe fark bulundu. Stok miktarları sayılan değerlere güncellensin mi?', 'Stok Sayımı Uygula');
  if(!onay) return;
  for(const r of degisenler){
    const idx = state.urunler.findIndex(x=>String(x.StokKodu||x.stokKodu||'').toUpperCase()===r.stokKodu.toUpperCase());
    if(idx===-1) continue;
    const u = state.urunler[idx];
    const yeniMiktar = Number(r.sayilanMiktar);
    u.Stok = yeniMiktar;
    syncOrQueue({action:'updateUrun', id:(u.ID||u.id), data:{stok:yeniMiktar}}, {entity:'urun', op:'update', localId:(u.ID||u.id)});
  }
  await persistUrunler();
  state.stokSayimListesi = [];
  toast(degisenler.length+' üründe stok güncellendi.');
  renderContent();
}

/* =========================================================
   ÜRÜN BİRİM FİYATLARI
   Mantık: Ürün, ambalaj (koli/kova/paket vb.) üzerinden satın
   alınır ama karşılaştırma "temel birim" (kg, adet, lt...)
   üzerinden yapılmak istenir. Her ürüne bir kez "1 ambalajda
   kaç temel birim var" (PaketMiktari) ve o birimin adı
   (TemelBirim) tanımlanır. Fiyat kaynağı olarak o ürünün en
   son alım kaydı (varsa) kullanılır, yoksa ürün kartındaki
   fiyat/KDV/iskonto kullanılır — böylece yeni bir alım
   girildiğinde birim fiyatı otomatik güncellenir.
========================================================= */
// Her temel birimin "profesyonel maliyet" raporlama ölçeği (otel/F&B cost
// sistemlerindeki (Materials Control vb.) standart maliyet birimleri):
//   GR  -> KG başına     (1000 gr = 1 kg)
//   ML  -> 1000 ML başına (=1 LT; şurup/sos gibi genel sıvılar litre üzerinden maliyetlenir)
//   CL  -> 100 CL başına  (=1 LT; içki/alkol maliyetlemesinde standart "100cl" konvansiyonu)
//   CC  -> 100 CC başına
//   CM  -> 100 CM başına
// KG/LT/AD/MT/PKT zaten kendi doğal birimi üzerinden anlamlı olduğu için 1 birim olarak kalır.
const BF_DISPLAY_SCALE = {
  KG:{factor:1, label:'KG'}, GR:{factor:1000, label:'KG'},
  LT:{factor:1, label:'LT'}, ML:{factor:1000, label:'1000 ML'},
  CL:{factor:100, label:'100 CL'}, CC:{factor:100, label:'100 CC'}, CM:{factor:100, label:'100 CM'},
  MT:{factor:1, label:'MT'}, AD:{factor:1, label:'AD'}, PKT:{factor:1, label:'PKT'}
};
function bfUnitPriceDisplay(kdvDahil, paketMiktari, temelBirim){
  if(!(paketMiktari>0)) return {value:null, label:''};
  const raw = kdvDahil/paketMiktari;
  const scale = BF_DISPLAY_SCALE[String(temelBirim||'').toUpperCase()] || {factor:1, label:temelBirim||'?'};
  return {value: raw*scale.factor, label: scale.label};
}
function bfCompute(u){
  const stokKodu = String(u.StokKodu||u.stokKodu||'');
  const alims = state.alimlar.filter(a=>String(a.stokKodu||'').toUpperCase()===stokKodu.toUpperCase() && (a.tur||'Alış')==='Alış');
  let kaynak, fiyat, kdv, indirim, birim;
  if(alims.length){
    alims.sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')));
    const son = alims[alims.length-1];
    kaynak = 'Son alım — ' + fmtDate(son.tarih);
    fiyat = Number(son.birimFiyat)||0;
    kdv = Number(son.kdvOrani)||0;
    indirim = Number(son.indirim)||0;
    birim = bfCleanBirim(son.birim || (u.Birim||u.birim||''));
  } else {
    kaynak = 'Ürün kartı';
    fiyat = Number(u.Fiyat!==undefined?u.Fiyat:u.fiyat)||0;
    kdv = Number(u.KdvOrani!==undefined?u.KdvOrani:u.kdvOrani)||0;
    indirim = Number(u.Indirim!==undefined?u.Indirim:u.indirim)||0;
    birim = bfCleanBirim(u.Birim||u.birim||'');
  }
  const netFiyat = fiyat*(1-indirim/100);
  const kdvDahil = netFiyat*(1+kdv/100);
  const paketMiktari = Number(u.PaketMiktari!==undefined?u.PaketMiktari:u.paketMiktari)||0;
  const temelBirim = u.TemelBirim||u.temelBirim||'';
  const disp = bfUnitPriceDisplay(kdvDahil, paketMiktari, temelBirim);
  return {stokKodu, kaynak, fiyat, kdv, indirim, birim, netFiyat, kdvDahil, paketMiktari, temelBirim, birimFiyati:disp.value, birimFiyatiLabel:disp.label};
}
function setBfFilter(v){ state.bfQuery = v; renderContentKeepFocus(); }
function bfCalcMiktar(id){
  const a1el = document.getElementById('bfAra1_'+id), a2el = document.getElementById('bfAra2_'+id);
  const a1 = Number(a1el?a1el.value:0)||0, a2 = Number(a2el?a2el.value:0)||0;
  if(a1>0 && a2>0){ document.getElementById('bfMiktar_'+id).value = a1*a2; }
}
/* ---------- Ürün adından otomatik ambalaj algılama ----------
   Desteklenen kalıplar:
   1) Zincirleme ambalaj:  "PK/100AD KL/10 PK"  -> 1 KL = 10 PK = 1000 AD
      "KOVA/10 KG"                              -> 1 KOVA = 10 KG
      Herhangi sayıda halka zincirlenebilir; hangi satın alma biriminin
      kullanılacağı, o ürünün gerçek alım/ürün kartı biriminden okunur.
   2) Düz miktar:  "YOĞURT NORMAL 3 KG", "... 100 CC" -> ambalaj = 3 KG / 100 CC
      (isimde geçen son sayı+birim ifadesi esas alınır)
*/
const BF_KNOWN_UNITS = ['KG','GR','LT','ML','CC','CM','AD','MT','PKT'];
function trUpper(s){ return String(s).replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase(); }
// Boşluksuz yazılan "10CM" gibi ifadeleri "10" ve "CM" olarak ikiye ayırır.
function bfSplitNumUnit(tok){
  const m = tok.match(/^(\d+(?:[.,]\d+)?)([A-ZÇĞİÖŞÜ]+)$/);
  return m ? [m[1], m[2]] : [tok];
}
/* ---------- Ürün kartındaki "Birim" alanından otomatik ambalaj algılama ----------
   En güvenilir yöntem: stok kartı açılırken Birim alanına ürünün size nasıl
   geldiğini yazmak — "ADET 3 KG", "ADET 500 GR", "ADET 18 LT", "PKT 100 LÜ",
   "ADET 10CM" (boşluksuz da yazılabilir).
   Kalıp: <SATIN ALMA BİRİMİ> <SAYI> <TEMEL BİRİM ya da "100 LÜ" tipi adet ifadesi>
   Böyle yazılırsa, ambalaj içeriği elle girilmeden doğrudan buradan okunur —
   ürün adını ayrıca parse etmeye gerek kalmaz.
*/
function bfParseBirimField(birimStr){
  if(!birimStr) return null;
  const s = trUpper(String(birimStr).trim());
  const rough = s.replace(/'/g,' ').split(/\s+/).filter(Boolean);
  const tokens = [];
  rough.forEach(t=>{ bfSplitNumUnit(t).forEach(x=>tokens.push(x)); });
  if(tokens.length < 3) return null;
  const satinAlmaBirimi = tokens[0];
  const qty = Number(tokens[1].replace(',','.'));
  if(!qty || qty<=0) return null;
  const unitTok = tokens[2];
  let temelBirim = null;
  if(BF_KNOWN_UNITS.includes(unitTok)) temelBirim = unitTok;
  else if(/^L[İIÜU]K?$/.test(unitTok)) temelBirim = 'AD'; // "100 LÜ" / "100'LÜK" -> 100 adet
  if(!temelBirim) return null;
  return {satinAlmaBirimi, temelBirim, paketMiktari: qty, detail: '"'+birimStr.trim()+'" biriminden'};
}
// Birim alanı bileşikse (örn. "ADET 3 KG") sadece satın alma birimini döndürür
// (fatura/rapor satırlarında temiz görünsün diye); değilse alanı olduğu gibi bırakır.
function bfCleanBirim(birimStr){
  const parsed = bfParseBirimField(birimStr);
  return parsed ? parsed.satinAlmaBirimi : (birimStr||'');
}
// Bir birim alanı bileşik ambalaj bilgisi içeriyorsa (örn. "KL 3000 AD" —
// 1 KOLİ = 3000 ADET) o ambalajın kaç temel birime karşılık geldiğini
// döndürür; düz bir birimse (örn. sadece "AD" ya da "KL") 1 döner.
// Fatura Girişi'nde Toplam hesabına ve fiyat karşılaştırmalarına
// (zam analizi, Ürün Analiz'deki firma ortalaması) bu çarpan uygulanır —
// böylece bir seferinde koli (KL 3000 AD), başka seferinde adet (AD)
// bazında girilen alımlar adet bazında adil karşılaştırılabilir.
function paketMiktariOf(birimStr){
  const parsed = bfParseBirimField(birimStr);
  return parsed ? parsed.paketMiktari : 1;
}
/* ---------- Profesyonel cost mantığıyla otomatik algılama ----------
   Otellerde kullanılan maliyet sistemlerindeki (Materials Control vb.)
   mantık: bir üründe birden fazla ölçü ifadesi geçebilir (ör. hem hacim
   hem adet), ama maliyetin hangi birim üzerinden hesaplanacağı bellidir:
     1) ADET/parça sayısı varsa (ör. "100 AD", "24 LÜ", "PKT 100 LÜ") her
        zaman ADET esas alınır — üzerindeki hacim/ağırlık bilgisi (ör.
        "330ML", "100 CC") sadece açıklama amaçlıdır, hesaba katılmaz.
        (örn. "COCA COLA 330ML KOLİ 24 LÜ" -> 1 ADET fiyatı, 330ML yok sayılır)
     2) Adet yoksa ağırlık (KG/GR) esas alınır.
     3) O da yoksa hacim (LT/ML/CL/CC) esas alınır.
     4) O da yoksa uzunluk (CM/MT) esas alınır.
     5) Sayı olmadan tek başına birim adı geçiyorsa (ör. "DANA KIYMA KG")
        1 birim = 1 satın alma birimi kabul edilir (çarpansız, olduğu gibi).
   Önce ürün adında aranır; adda bulunamazsa Birim alanında aranır.
*/
function bfExtractFromText(text, invoiceBirim){
  if(!text) return null;
  const s = trUpper(String(text));

  // 1) Zincirleme ambalaj (eski format desteği): UNIT/SAYI UNIT
  const pairRe = /([A-ZÇĞİÖŞÜ]{1,6})\s*\/\s*(\d+(?:[.,]\d+)?)\s*([A-ZÇĞİÖŞÜ]{1,6})/g;
  const pairs = [];
  let pm;
  while((pm = pairRe.exec(s))){ pairs.push({from:pm[1], qty:Number(pm[2].replace(',','.')), to:pm[3]}); }
  let chainResult = null;
  if(pairs.length){
    const froms = new Set(pairs.map(p=>p.from));
    const tos = new Set(pairs.map(p=>p.to));
    const terminal = pairs.map(p=>p.to).find(u=>!froms.has(u));
    if(terminal){
      const valueMap = {}; valueMap[terminal] = 1;
      let changed = true, guard = 0;
      while(changed && guard<20){
        changed = false; guard++;
        pairs.forEach(p=>{
          if(valueMap[p.to]!==undefined && valueMap[p.from]===undefined){ valueMap[p.from]=p.qty*valueMap[p.to]; changed=true; }
        });
      }
      const ib = String(invoiceBirim||'').toUpperCase();
      const purchaseUnit = (ib && valueMap[ib]!==undefined) ? ib : (pairs.map(p=>p.from).find(u=>!tos.has(u)) || pairs[pairs.length-1].from);
      if(purchaseUnit && valueMap[purchaseUnit]!==undefined){
        chainResult = { temelBirim:terminal, paketMiktari:valueMap[purchaseUnit],
          detail: pairs.map(p=>p.from+'/'+p.qty+p.to).join(' ')+' → 1 '+purchaseUnit+' = '+num(valueMap[purchaseUnit],2)+' '+terminal };
      }
    }
  }

  function collect(re){
    const out = []; let m;
    while((m = re.exec(s))){ out.push({qty:Number(m[1].replace(',','.')), unit:m[2]}); }
    return out;
  }
  const adExplicit = collect(/(\d+(?:[.,]\d+)?)\s*'?\s*(AD|ADET)\b/g);
  const adSuffix    = collect(/(\d+(?:[.,]\d+)?)\s*'?\s*(L[İIÜU]K?)(?![A-ZÇĞİÖŞÜ0-9])/g);
  const weightM     = collect(/(\d+(?:[.,]\d+)?)\s*(KG|GR)\b/g);
  const volumeM     = collect(/(\d+(?:[.,]\d+)?)\s*(LT|ML|CL|CC)\b/g);
  const lengthM     = collect(/(\d+(?:[.,]\d+)?)\s*(CM|MT)\b/g);

  // Öncelik: Adet > Ağırlık > Hacim > Uzunluk
  if(chainResult) return chainResult;
  if(adExplicit.length){ const x=adExplicit[0]; return {temelBirim:'AD', paketMiktari:x.qty, detail:'"'+x.qty+' '+x.unit+'" ifadesinden'}; }
  if(adSuffix.length){ const x=adSuffix[0]; return {temelBirim:'AD', paketMiktari:x.qty, detail:'"'+x.qty+' '+x.unit+'" ifadesinden (adet)'}; }
  if(weightM.length){ const x=weightM[0]; return {temelBirim:x.unit, paketMiktari:x.qty, detail:'"'+x.qty+' '+x.unit+'" ifadesinden'}; }
  if(volumeM.length){ const x=volumeM[0]; return {temelBirim:x.unit, paketMiktari:x.qty, detail:'"'+x.qty+' '+x.unit+'" ifadesinden'}; }
  if(lengthM.length){ const x=lengthM[0]; return {temelBirim:x.unit, paketMiktari:x.qty, detail:'"'+x.qty+' '+x.unit+'" ifadesinden'}; }

  // Sayısız, tek başına birim adıyla biten ürün (ör. "DANA KIYMA KG")
  const tokens = s.replace(/'/g,' ').split(/\s+/).filter(Boolean);
  const last = tokens[tokens.length-1];
  const bareMap = {AD:'AD', ADET:'AD', KG:'KG', GR:'GR', LT:'LT', ML:'ML', CL:'CL', CC:'CC', CM:'CM', MT:'MT', PKT:'PKT'};
  if(last && bareMap[last]){
    return {temelBirim: bareMap[last], paketMiktari: 1, detail: '"'+last+'" biriminden (çarpansız, birebir)'};
  }
  return null;
}
// Önce ürün adında arar (profesyonel cost mantığı — asıl kaynak budur);
// bulunamazsa Birim alanında arar (eski ürünler için yedek yöntem).
function bfGuess(u, invoiceBirim){
  return bfExtractFromText(u.Ad||u.ad||'', invoiceBirim) || bfExtractFromText(u.Birim||u.birim||'', invoiceBirim);
}
async function bfAutoDetectAll(){
  const changed = [];
  state.urunler.forEach(u=>{
    const cur = Number(u.PaketMiktari!==undefined?u.PaketMiktari:u.paketMiktari)||0;
    if(cur>0) return;
    const d = bfCompute(u);
    const guess = bfGuess(u, d.birim);
    if(guess){
      Object.assign(u, {TemelBirim:guess.temelBirim, PaketMiktari:guess.paketMiktari});
      changed.push(u);
    }
  });
  if(changed.length===0){ toast('Otomatik algılanacak yeni ürün bulunamadı — kalanlar için ürün adında tanınan bir ambalaj ifadesi yok, elle girin.'); return; }
  await persistUrunler();
  renderContent();
  toast(changed.length+' üründe ambalaj içeriği otomatik algılandı ve kaydedildi.');
  changed.forEach(u=>{
    const id = u.ID||u.id;
    syncOrQueue({action:'updateUrun', id, data:{temelBirim:u.TemelBirim, paketMiktari:u.PaketMiktari}}, {entity:'urun', op:'update', localId:id});
  });
}
async function saveBfPaket(id){
  const idx = state.urunler.findIndex(x=>(x.ID||x.id)===id);
  if(idx===-1) return;
  const temelBirim = document.getElementById('bfTemel_'+id).value;
  const paketMiktari = Number(document.getElementById('bfMiktar_'+id).value)||0;
  if(paketMiktari<=0){ toast('Ambalajın içindeki miktarı girin (0\'dan büyük).'); return; }
  state.urunler[idx] = Object.assign({}, state.urunler[idx], {TemelBirim:temelBirim, PaketMiktari:paketMiktari});
  await persistUrunler();
  toast('Birim fiyat ayarı kaydedildi.');

  syncOrQueue({action:'updateUrun', id, data:{temelBirim, paketMiktari}}, {entity:'urun', op:'update', localId:id});
}
