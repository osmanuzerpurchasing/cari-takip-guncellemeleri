// Bir stok koduna ait TÜM alım kayıtlarını firma bazında gruplar;
// her firma için ağırlıklı ortalama (KDV dahil, iskonto düşülmüş) birim
// fiyatı, en düşük/en yüksek fiyatı ve genel ortalamaya / en ucuz firmaya
// göre yüzdelik farkını hesaplar. "toplam" alanı zaten miktar*birimFiyat
// *(1-iskonto%)*(1+KDV%) olarak kayıt anında hesaplanıp saklandığı için
// (bkz. saveFatura), tutarlı bir birim fiyat karşılaştırması sağlar.
function uaCompute(stokKodu){
  const kod = String(stokKodu||'').toUpperCase();
  // Sadece ALIŞ kayıtları — satış faturaları burada fiyat karşılaştırmasını
  // bozmasın diye (satışta "en ucuz firma" kavramı anlamsız).
  const rows = state.alimlar.filter(a => String(a.stokKodu||'').toUpperCase()===kod && (a.tur||'Alış')==='Alış');
  const byFirma = {};
  let totalMiktar = 0, totalToplam = 0;
  rows.forEach(a=>{
    // Miktar, TEMEL BİRİME (ör. adet) normalize edilir — bir alım "KL 3000 AD"
    // (koli), başka bir alım "AD" (tekil adet) bazında girilmiş olsa bile
    // firma ortalamaları adet başına adil kıyaslanır.
    const paket = paketMiktariOf(a.birim);
    const miktar = (Number(a.miktar)||0) * paket;
    const toplam = Number(a.toplam)||0;
    const birimFiyatKdvDahil = miktar>0 ? toplam/miktar : 0;
    totalMiktar += miktar; totalToplam += toplam;
    const f = a.firma || '(firma belirtilmemiş)';
    if(!byFirma[f]) byFirma[f] = {firma:f, adet:0, miktar:0, toplam:0, minFiyat:Infinity, maxFiyat:-Infinity, sonTarih:''};
    const b = byFirma[f];
    b.adet += 1; b.miktar += miktar; b.toplam += toplam;
    if(birimFiyatKdvDahil>0){
      if(birimFiyatKdvDahil<b.minFiyat) b.minFiyat = birimFiyatKdvDahil;
      if(birimFiyatKdvDahil>b.maxFiyat) b.maxFiyat = birimFiyatKdvDahil;
    }
    if(!b.sonTarih || String(a.tarih||'')>b.sonTarih) b.sonTarih = a.tarih||'';
  });
  const firmaStats = Object.values(byFirma).map(b => ({
    firma:b.firma, adet:b.adet, miktar:b.miktar, toplam:b.toplam,
    ortFiyat: b.miktar>0 ? b.toplam/b.miktar : 0,
    minFiyat: isFinite(b.minFiyat) ? b.minFiyat : 0,
    maxFiyat: isFinite(b.maxFiyat) ? b.maxFiyat : 0,
    sonTarih: b.sonTarih
  })).sort((x,y)=>x.ortFiyat-y.ortFiyat);
  const genelOrt = totalMiktar>0 ? totalToplam/totalMiktar : 0;
  const enUcuzOrt = firmaStats.length ? firmaStats[0].ortFiyat : 0;
  firmaStats.forEach(f=>{
    f.farkGenel = genelOrt>0 ? (f.ortFiyat-genelOrt)/genelOrt*100 : 0;
    f.farkEnUcuz = enUcuzOrt>0 ? (f.ortFiyat-enUcuzOrt)/enUcuzOrt*100 : 0;
  });
  return {
    rows: rows.slice().sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||''))),
    firmaStats, genelOrt, totalMiktar, totalToplam,
    firmaSayisi: firmaStats.length, alimSayisi: rows.length
  };
}

function uaFarkBadge(pct){
  if(!isFinite(pct)) pct = 0;
  const rounded = Math.round(pct*10)/10;
  const sign = rounded>0 ? '+' : '';
  const cls = rounded>0.5 ? 'badge-danger' : (rounded<-0.5 ? 'badge-success' : 'badge-primary');
  return '<span class="badge '+cls+'">'+sign+num(rounded,1)+'%</span>';
}

          '<td class="num">'+money(f.minFiyat)+'</td>' +
          '<td class="num">'+money(f.maxFiyat)+'</td>' +
          '<td>'+fmtDate(f.sonTarih)+'</td>' +
          '<td class="num">'+uaFarkBadge(f.farkGenel)+'</td>' +
          '<td class="num">'+uaFarkBadge(f.farkEnUcuz)+'</td>' +
        '</tr>';
      }).join('') +
    '</tbody></table></div>';

  html += '<h2 class="section-title" style="margin-top:22px;">Tüm alım geçmişi (her kayıt ayrı ayrı)</h2>' +
    '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>Tarih</th><th>Firma</th><th>Fatura no</th><th class="num">Miktar</th><th class="num">Birim fiyat</th>' +
      '<th class="num">İskonto %</th><th class="num">KDV %</th><th class="num">KDV dahil birim fiyat</th><th class="num">Toplam</th>' +
    '</tr></thead><tbody>' +
      d.rows.map(a=>{
        const miktar = Number(a.miktar)||0;
        const toplam = Number(a.toplam)||0;
        const birimKdvDahil = miktar>0 ? toplam/miktar : 0;
        return '<tr>' +
          '<td>'+fmtDate(a.tarih)+'</td>' +
          '<td>'+escapeHtml(a.firma||'')+'</td>' +
          '<td>'+escapeHtml(a.faturaNo||'(boş)')+'</td>' +
          '<td class="num">'+num(miktar,2)+' '+escapeHtml(a.birim||'')+'</td>' +
          '<td class="num">'+money(a.birimFiyat)+'</td>' +
          '<td class="num">%'+num(a.indirim,0)+'</td>' +
          '<td class="num">%'+num(a.kdvOrani,0)+'</td>' +
          '<td class="num">'+money(birimKdvDahil)+'</td>' +
          '<td class="num">'+money(toplam)+'</td>' +
        '</tr>';
      }).join('') +
    '</tbody></table></div>';

  return html;
}

async function saveCompanyName(v){

}
// ---- Masaüstü uygulaması (Setup.exe) güncelleme mekanizması ----
// window.cariTakipMasaustu SADECE Electron kabuğu içinde var olur
// (preload.js tarafından enjekte edilir) — normal tarayıcıda bu bölüm
// hiç görünmez. Buluta yeni bir CARİ_TAKİP.html sürümü ("UygulamaKodu"
// Apps Script dosyası) yüklendiğinde, bu buton onu indirip yerel
// kopyanın üzerine yazar ve pencereyi anında o sürümle yeniden yükler —
// hangi sekme/modül eklenmiş olursa olsun (ör. gelecekteki Reçete
// modülü), TÜM dosya yenilendiği için ayrıca bir şey yapmaya gerek yok.
async function masaustuSurumBilgisiGoster(){
  const el = document.getElementById('guncellemeDurum');
  if(!el || !window.cariTakipMasaustu) return;
  try{
    const bilgi = await window.cariTakipMasaustu.surumBilgisi();
    if(bilgi && bilgi.boyut){
      const tarih = new Date(bilgi.tarih);
      el.textContent = 'Bu cihazdaki program dosyası: '+Math.round(bilgi.boyut/1024)+' KB — son güncelleme: '+tarih.toLocaleString('tr-TR');
    } else {
      el.textContent = 'Sürüm bilgisi alınamadı.';
    }
  }catch(e){
    el.textContent = '';
  }
}
async function masaustuGuncellemeKontrolEt(){
  if(!window.cariTakipMasaustu) return;
  if(!state.guncellemeUrl){ toast('Önce bir güncelleme adresi (version.json) girin.'); return; }
  const el = document.getElementById('guncellemeDurum');
  if(el) el.textContent = 'Güncelleme kontrol ediliyor…';
  try{
    const sonuc = await window.cariTakipMasaustu.guncellemeKontrolEt(state.guncellemeUrl);
    if(sonuc && sonuc.ok){
      await storageSet(STORAGE_KEYS.uygulanmisSurum, String(sonuc.yeniSurum||''));
      if(el) el.textContent = 'Güncelleme indirildi ('+Math.round(sonuc.boyut/1024)+' KB, sürüm '+(sonuc.yeniSurum||'')+') — uygulanıyor…';
      toast('Güncelleme indirildi, uygulama yeniden başlatılıyor…');
      await window.cariTakipMasaustu.uygulamayiYenidenYukle();
    } else if(sonuc && sonuc.zatenGuncel){
      if(el) el.textContent = sonuc.hata;
      toast(sonuc.hata);
    } else {
      const hata = (sonuc && sonuc.hata) || 'Bilinmeyen hata';
      if(el) el.textContent = 'Güncelleme başarısız: '+hata;
      toast('Güncelleme başarısız: '+hata);
    }
  }catch(e){
    if(el) el.textContent = 'Güncelleme sırasında bir hata oluştu.';
    toast('Güncelleme sırasında bir hata oluştu.');
  }
}
function guncellemeUrlKaydet(v){
  state.guncellemeUrl = v.trim();
  storageSet(STORAGE_KEYS.guncellemeUrl, state.guncellemeUrl);
  syncOrQueue({action:'setSistemAyari', data:{anahtar:'guncellemeUrl', deger:state.guncellemeUrl}}, {entity:'sistemAyari', op:'update', localId:'guncellemeUrl'});
  toast('Güncelleme adresi tüm cihazlara otomatik yayılacak.');
}

function connectFromInput(){
  const val = document.getElementById('apiUrlInput').value.trim();
  if(!val){ toast('Adresi girin.'); return; }
  const keyEl = document.getElementById('apiKeyInput');
  if(keyEl){ state.apiKey = keyEl.value.trim(); storageSet(STORAGE_KEYS.apiKey, state.apiKey); }
  // Bu profili (bulut/yerel ağ) ayrı olarak da kaydet — mod değiştirilip
  // geri dönüldüğünde bu adres/anahtar hatırlansın.
  if(state.baglantiModu==='bulut'){
    state.bulutKayitliUrl = val; state.bulutKayitliKey = state.apiKey;
    storageSet(STORAGE_KEYS.bulutKayitliUrl, val); storageSet(STORAGE_KEYS.bulutKayitliKey, state.apiKey);
  } else {
    state.yerelKayitliUrl = val; state.yerelKayitliKey = state.apiKey;
    storageSet(STORAGE_KEYS.yerelKayitliUrl, val); storageSet(STORAGE_KEYS.yerelKayitliKey, state.apiKey);
  }
  connect(val);
}
// ---- BAĞLANTI MODU (Bulut / Yerel Ağ) ----
async function baglantiModuDegistir(yeniMod){
  if(yeniMod===state.baglantiModu){ renderContent(); return; }
  // Şu anki modun aktif url/key'ini kendi profiline kaydet (kaybolmasın).
  if(state.baglantiModu==='bulut'){ state.bulutKayitliUrl=state.apiUrl; state.bulutKayitliKey=state.apiKey; }
  else if(state.baglantiModu==='yerelAg'){ state.yerelKayitliUrl=state.apiUrl; state.yerelKayitliKey=state.apiKey; }
  await Promise.all([
    storageSet(STORAGE_KEYS.bulutKayitliUrl, state.bulutKayitliUrl),
    storageSet(STORAGE_KEYS.bulutKayitliKey, state.bulutKayitliKey),
    storageSet(STORAGE_KEYS.yerelKayitliUrl, state.yerelKayitliUrl),
    storageSet(STORAGE_KEYS.yerelKayitliKey, state.yerelKayitliKey)
  ]);

  state.baglantiModu = yeniMod;
  await storageSet(STORAGE_KEYS.baglantiModu, yeniMod);

  if(yeniMod==='ikisiBirden'){
    // state.apiUrl SADECE "en az bir hedef var mı" doğruluk kontrolleri
    // için (kodun geri kalanında onlarca yerde kullanılıyor) — gerçek
    // çift-hedef mantığı apiGet/apiPost içinde bulutKayitliUrl/yerelKayitliUrl
    // ile ayrı ayrı çalışır.
    state.apiUrl = state.bulutKayitliUrl || state.yerelKayitliUrl || '';
    state.apiKey = '';
    await storageSet(STORAGE_KEYS.apiUrl, state.apiUrl);
    state.buCihazDurumu = null;
    renderContent();
    if(state.bulutKayitliUrl || state.yerelKayitliUrl){ toast('İkisi Birden moduna geçildi, veri çekiliyor…'); syncNow(); }
    else { toast('İkisi Birden moduna geçildi. Her iki hedefin adresini girip bağlanın.'); renderApp(); }
    return;
  }

  // Yeni modun kayıtlı profilini aktif hale getir.
  state.apiUrl = yeniMod==='bulut' ? state.bulutKayitliUrl : state.yerelKayitliUrl;
  state.apiKey = yeniMod==='bulut' ? state.bulutKayitliKey : state.yerelKayitliKey;
  await Promise.all([storageSet(STORAGE_KEYS.apiUrl, state.apiUrl), storageSet(STORAGE_KEYS.apiKey, state.apiKey)]);
  state.buCihazDurumu = null;
  renderContent();
  if(state.apiUrl){ toast((yeniMod==='bulut'?'Bulut':'Yerel ağ')+' moduna geçildi, veri çekiliyor…'); syncNow(); }
  else { toast((yeniMod==='bulut'?'Bulut':'Yerel ağ')+' moduna geçildi. Adres girip Bağlan\'a basın.'); renderApp(); }
}
async function ikisiBirdenBaglan(){
  const bulutUrl = document.getElementById('ikiliBulutUrlInput').value.trim();
  const bulutKey = document.getElementById('ikiliBulutKeyInput').value.trim();
  const yerelUrl = document.getElementById('ikiliYerelUrlInput').value.trim();
  const yerelKey = document.getElementById('ikiliYerelKeyInput').value.trim();
  if(!bulutUrl && !yerelUrl){ toast('En az bir hedefin (bulut ya da yerel ağ) adresini girin.'); return; }
  state.bulutKayitliUrl = bulutUrl; state.bulutKayitliKey = bulutKey;
  state.yerelKayitliUrl = yerelUrl; state.yerelKayitliKey = yerelKey;
  await Promise.all([
    storageSet(STORAGE_KEYS.bulutKayitliUrl, bulutUrl), storageSet(STORAGE_KEYS.bulutKayitliKey, bulutKey),
    storageSet(STORAGE_KEYS.yerelKayitliUrl, yerelUrl), storageSet(STORAGE_KEYS.yerelKayitliKey, yerelKey)
  ]);
  state.apiUrl = bulutUrl || yerelUrl;
  await storageSet(STORAGE_KEYS.apiUrl, state.apiUrl);
  toast('Bağlanılıyor…');
  await syncNow();
}

async function yerelSunucuAc(){
  if(!window.cariTakipMasaustu) return;
  try{
    const sonuc = await window.cariTakipMasaustu.yerelSunucuBaslat();
    if(sonuc && sonuc.ok){
      state.yerelSunucuCalisiyorMu = true;
      await storageSet(STORAGE_KEYS.yerelSunucuAcikMi, '1');
      const ag = await window.cariTakipMasaustu.agBilgisi();
      state.yerelSunucuAdresleri = (ag && ag.adresler) || [];
      toast('Yerel ağ sunucusu başlatıldı.');
    } else {
      toast('Sunucu başlatılamadı: '+((sonuc&&sonuc.error)||'bilinmeyen hata'));
    }
  }catch(e){ toast('Sunucu başlatılamadı.'); }
  renderContent();
}
async function yerelSunucuKapat(){
  if(!window.cariTakipMasaustu) return;
  try{ await window.cariTakipMasaustu.yerelSunucuDurdur(); }catch(e){}
  state.yerelSunucuCalisiyorMu = false;
  state.yerelSunucuAdresleri = [];
  await storageSet(STORAGE_KEYS.yerelSunucuAcikMi, '0');
  toast('Yerel ağ sunucusu durduruldu.');
  renderContent();
}

    }finally{URL.revokeObjectURL(url);}
  }

  async function scan(){

    const b=event.target.closest('[data-ma]');if(!b)return;const id=b.dataset.id,action=b.dataset.ma;
    if(action==='camera-close'){stopCamera();return;}if(M.busy)return;
    try{switch(action){case 'page':go(id);break;case 'clear':M.query='';renderContent();break;case 'legacy':M.page='legacy';state.tab=id;goTab(id);renderApp();break;case 'line-add':{guard(allowed('talepler','add'));const f=$('m-request'),u=state.urunler.find(u=>code(u)===f.elements.product.value),qty=Number(f.elements.qty.value);if(!u||!Number.isFinite(qty)||qty<=0)throw Error('Ürün ve pozitif miktar seçin.');const old=M.lines.find(k=>k.stokKodu===code(u));if(old)old.miktar+=qty;else M.lines.push({stokKodu:code(u),urunAdi:name(u),birim:unit(u),miktar:qty});$('m-lines').innerHTML=lineHtml();f.elements.qty.value='';break;}case 'line-remove':M.lines.splice(Number(id),1);$('m-lines').innerHTML=lineHtml();break;case 'critical-add':{guard(allowed('talepler','add'));const u=state.urunler.find(u=>code(u)===id);if(!u)throw Error('Ürün bulunamadı.');const eksik=Math.max(1,Math.round((threshold(u)-stock(u))*100)/100);const old=M.lines.find(k=>k.stokKodu===code(u));if(old)old.miktar+=eksik;else M.lines.push({stokKodu:code(u),urunAdi:name(u),birim:unit(u),miktar:eksik});toast(name(u)+' talebe eklendi ('+num(eksik,2)+' '+unit(u)+').');go('requests');break;}case 'reject':if(confirm('Talep reddedilsin mi?'))run(()=>decide(id,'',true));break;case 'receipt-open':guard(receiptAllowed());M.receipt=id;renderContent();window.scrollTo(0,0);break;case 'scan':scan().catch(e=>toast(e.message));break;case 'photo-delete':run(async()=>{const p=M.extra.photos.find(p=>p.id===id),a=invoices().find(a=>invKey(a)===p?.invoice);guard(a&&invoiceEdit(a));if(confirm('Fotoğraf bu cihazdan silinsin mi?'))await persistExtra({...M.extra,photos:M.extra.photos.filter(p=>p.id!==id)});});break;case 'photo-download':{const p=M.extra.photos.find(p=>p.id===id);guard(p&&invoices().some(a=>invKey(a)===p.invoice));const a=document.createElement('a');a.href=p.data;a.download='fatura-'+id+'.jpg';a.click();break;}case 'backup':guard(admin());exportBackup();break;case 'logout':stopCamera();M.lines=[];M.receipt='';M.page='home';logoutUser();break;}}catch(e){toast(e.message);}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')stopCamera();if(e.key==='Tab'&&$('m-camera')){const els=Array.from($('m-camera').querySelectorAll('button,input'));const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera();});window.addEventListener('pagehide',stopCamera);
  const oldLoad=loadAllData;loadAllData=async function(){
    const raw=await storageGet(journalKey);if(raw){const j=JSON.parse(raw);for(const [k,v]of Object.entries(j.changes)){if(!['urunler','transferler','talepler','pendingOps'].includes(k)||!Array.isArray(v))throw Error('Geçersiz mobil işlem günlüğü.');if(!await storageSet(k==='pendingOps'?STORAGE_KEYS.pending:STORAGE_KEYS[k],JSON.stringify(v)))throw Error('Mobil işlem kurtarılamadı.');}if(!await storageSet(key,JSON.stringify(j.extra)))throw Error('Mobil işlem kurtarılamadı.');await storageRemove(journalKey);}
    const extra=await storageGet(key);if(extra){const x=JSON.parse(extra);if(x.version!==1||!x.products||!Array.isArray(x.photos))throw Error('Mobil veri biçimi geçersiz.');M.extra=x;}
    await oldLoad();
    M.ready=true;if(M.extra.localStock){state.apiUrl='';state.connected=false;}
  };
  ALL_BACKUP_KEYS=Array.from(new Set([...ALL_BACKUP_KEYS,STORAGE_KEYS.ambarlar,STORAGE_KEYS.transferler,STORAGE_KEYS.roller,STORAGE_KEYS.urunAyarlari,STORAGE_KEYS.pending,key,journalKey]));
  const oldContent=renderContent;renderContent=function(){if(!render())oldContent();};
  const oldApp=renderApp;renderApp=function(){if(!state.currentUser){stopCamera();document.body.classList.remove('m-mode');if($('m-dock'))$('m-dock').innerHTML='';}oldApp();};
  const oldBusy=isUserBusyWithForm;isUserBusyWithForm=function(){return M.busy||!!$('m-camera')||(M.enabled&&!!document.querySelector('.m-app form[data-mf]'))||oldBusy();};
  const oldConnect=connect;connect=async function(...args){if(M.extra.localStock){toast('Bu cihazda yerel stok hareketleri var. Bulut bağlantısı için önce yedeği alın ve sunucuda atomik stok/senkronizasyon desteği sağlayın.');return;}return oldConnect(...args);};
  const oldVerify=verifyConnection;verifyConnection=async function(...args){if(M.extra.localStock)return;return oldVerify(...args);};
  const oldSync=syncNow;syncNow=async function(...args){if(M.extra.localStock){toast('Yerel stok hareketleri korunuyor; bulut senkronizasyonu kapalı.');return;}return oldSync(...args);};
  const oldBackground=backgroundSync;backgroundSync=async function(...args){if(M.extra.localStock||M.busy)return;return oldBackground(...args);};
  const oldClear=clearLocalDataToEmpty;clearLocalDataToEmpty=async function(...args){await oldClear(...args);await storageRemove(journalKey);await persistExtra({version:1,products:{},photos:[],localStock:false});};
  // Eski masaüstü onay/mal-kabul işlevlerinde de işlem anında izin ve durum kontrolü.
  for(const fn of ['openApproveTalep','confirmApproveTalep','rejectTalep']){const original=window[fn];window[fn]=function(id,...args){const t=state.talepler.find(t=>ID(t)===String(id));if(!admin()||!t||status(t)!=='Bekliyor')return yetkiYokUyar();return original(id,...args);};}
  const legacyReceive=confirmStogaAktar;confirmStogaAktar=async function(id){if(!receiptAllowed())return yetkiYokUyar();const t=state.talepler.find(t=>ID(t)===id);if(!t||delivered(t))return toast('Bu talep zaten stoğa alınmış.');return legacyReceive(id);};
  const oldMark=markTeslimAlindi;markTeslimAlindi=async function(id){if(!receiptAllowed())return yetkiYokUyar();return oldMark(id);};
  return Object.assign(M,{go,render,stock,critical,saveRequest,decide,saveTransfer,saveReceipt,commit,allowed,invoiceAllowed,invoiceEdit,invKey,stopCamera});
})();

// Kullanıcı paketinde talep ve Ürün Fiyatları aynı ürün kataloğunu kullanır.
async function syncPackageProductCatalog(data){
  if(!isUserPackage())return;
  const canRead=state.currentUser&&(canDo('talepler','view')||canDo('birimfiyat','view')||canDo('urunler','view')||canDo('urunStokDurumu','view'));
  if(!canRead){state.urunler=[];await persistUrunler();return;}
  if(!Array.isArray(data.urunler))return;
  const prices=canDo('birimfiyat','view'),stocks=canDo('urunStokDurumu','view');
  const pick=(u,k)=>u[k]??u[k[0].toLowerCase()+k.slice(1)];
  const catalog=data.urunler.map(u=>{
    const out={ID:u.ID??u.id,StokKodu:pick(u,'StokKodu')||'',Ad:pick(u,'Ad')||'',Birim:pick(u,'Birim')||''};
    if(prices)for(const k of ['Fiyat','KdvOrani','Indirim','PaketMiktari','TemelBirim','Marka','Icerik'])if(pick(u,k)!==undefined)out[k]=pick(u,k);
    if(stocks)out.Stok=pick(u,'Stok')||0;
    return out;
  });
  if(JSON.stringify(catalog)!==JSON.stringify(state.urunler)){
    state.urunler=catalog;await persistUrunler();
    // Açık talebin başlığını, notunu ve kalemlerini değiştirmeden seçenekleri yenile.
    const select=document.querySelector('#m-request select[name="product"]');
    if(select){const selected=select.value;select.replaceChildren(new Option('Ürün seçin',''),...catalog.map(u=>new Option(u.StokKodu+' · '+u.Ad+' ('+u.Birim+')',u.StokKodu)));select.value=selected;}
    else if(!isUserBusyWithForm())renderContent();
  }
  // Paketlerin arka plan döngüsü yalnız yetki kontrolü yaptığı için talep kuyruğunu da gönder.
  if(canDo('talepler','add')&&state.pendingOps?.length&&state.pendingOps.every(x=>x.payload?.action==='addTalep'))await flushPendingOps();
}

// F10: Alış/Satış Faturası ekranındayken faturayı kaydeder (fare ile
// "Kaydet"e gitmeye gerek kalmadan). Bir modal (onay penceresi vb.)
// açıksa hiçbir şey yapmaz — kazara çift kayıt/onaylamayı önlemek için.
document.addEventListener('keydown', function(e){
  if(e.key==='F10'){
    e.preventDefault();
    if(state.tab!=='alisFaturasi' && state.tab!=='satisFaturasi') return;
    const modalRoot = document.getElementById('modalRoot');
    if(modalRoot && modalRoot.innerHTML.trim()!=='') return;
    saveFatura();
  }
});

init();
