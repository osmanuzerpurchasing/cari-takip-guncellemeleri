// Bir firmanın kronolojik (eskiden yeniye) cari hesap ekstresini —
// alım/ödeme/tahsilat/iade karışık, anlık bakiye alanı hesaplanmış olarak —
// döndürür. viewOdeme() ekranı ve yazdırma/PDF/Excel dışa aktarma
// fonksiyonları AYNI bu fonksiyonu kullanır, ki rakamlar hep tutarlı olsun.
// Bir firmaya yapılan ödemeler (sadece ÖDEME türü — Tahsilat hariç, çünkü
// tahsilat borcu KAPATMAZ, tam tersi arttırır), faturalara EN ESKİDEN EN
// YENİYE doğru (FIFO) sırayla dağıtılır. Bir faturanın tutarı tamamen
// karşılanınca "Kapandı", kısmen karşılanınca "Kısmi Ödeme" (ne kadarının
// ödendiği/kaldığı ile birlikte), hiç karşılanmadıysa "Açık" döner.
// Bir fatura grubunun (firma+tarih+faturaNo, sadece Alış) ödeme durumunu
// döndürür — Alımlar sayfasındaki Fatura Görünümü, Yazdır/PDF, Excel/CSV
// dışa aktarma ve WhatsApp mesajı HEPSİ bu tek fonksiyonu kullanır ki
// rakamlar her yerde tutarlı olsun.
function faturaDurumuFor(firma, tarih, faturaNo, tur){
  if((tur||'Alış')!=='Alış') return null; // sadece alış faturalarında "kapandı/kısmi" anlamlı
  const map = computeFaturaOdemeDurumu(firma);
  const key = (tarih||'')+'|'+(faturaNo||'');
  return map[key] || null;
}
function faturaDurumMetni(od){
  if(!od) return '—';
  return od.durum==='Kapandı' ? 'FATURA KAPANDI' : od.durum==='Kısmi Ödeme' ? 'KISMİ ÖDEME' : 'AÇIK';
}
function faturaDurumBadgeHtml(od){
  if(!od) return '';
  const cls = od.durum==='Kapandı' ? 'badge-success' : od.durum==='Kısmi Ödeme' ? 'badge-accent' : 'badge-primary';
  let html = '<span class="badge '+cls+'" style="font-weight:600;">'+faturaDurumMetni(od)+'</span>';
  if(od.durum==='Kısmi Ödeme'){
    html += '<div class="hint" style="margin:2px 0 0;">'+money(od.odenen)+' ödendi, '+money(od.kalan)+' kaldı</div>';
  }
  return html;
}
// Vade tarihi rozeti: fatura kapanmışsa gösterilmez; geçmişse kaç gün
// geciktiğini, yaklaşıyorsa kaç gün kaldığını gösterir.
function vadeBadgeHtml(vadeTarihi, od){
  if(!vadeTarihi) return '';
  if(od && od.durum==='Kapandı') return '';
  const gun = Math.round((new Date(vadeTarihi+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  if(gun<0) return '<span class="badge badge-danger" style="font-weight:600;">⚠ Vadesi '+Math.abs(gun)+' gün geçti</span>';
  if(gun<=3) return '<span class="badge badge-accent" style="font-weight:600;">Vade '+gun+' gün sonra ('+fmtDate(vadeTarihi)+')</span>';
  return '<span class="badge badge-primary">Vade: '+fmtDate(vadeTarihi)+'</span>';
}
// Açık (kapanmamış) alış faturaları + beklemedeki çek/senetleri tek bir
// vade takvimi altında birleştirir — Pano'daki "Vade Takibi" ve nakit
// akışı öngörüsü bu listeden beslenir. "yon": 'cikis' (ödeyeceğimiz —
// alış faturası kalanı + verdiğimiz çek) veya 'giris' (tahsil edeceğimiz
// — aldığımız çek).
function vadeliKalemler(){
  const items = [];
  const acikFaturalar = state.alimlar.filter(a=>(a.tur||'Alış')==='Alış' && a.vadeTarihi);
  invoiceGroups(acikFaturalar).forEach(g=>{
    const od = faturaDurumuFor(g.firma, g.tarih, g.faturaNo, 'Alış');
    if(od && od.durum==='Kapandı') return;
    const kalan = od ? od.kalan : g.toplam;
    if(kalan<=0.5) return;
    items.push({tip:'Fatura', yon:'cikis', firma:g.firma, aciklama:'Fatura no: '+(g.faturaNo||'—'), tutar:kalan, vadeTarihi:g.vadeTarihi});
  });
  state.cekler.filter(c=>c.durum==='Beklemede' && c.vadeTarihi).forEach(c=>{
    items.push({tip:c.tur==='Verilen'?'Verilen Çek':'Alınan Çek', yon:c.tur==='Verilen'?'cikis':'giris', firma:c.firma, aciklama:(c.banka?c.banka+' · ':'')+(c.no||'Çek/Senet'), tutar:Number(c.tutar)||0, vadeTarihi:c.vadeTarihi});
  });
  return items.sort((a,b)=>String(a.vadeTarihi).localeCompare(String(b.vadeTarihi)));
}
// Muhasebe > Genel Bakış'taki "Döviz Bakiyeleri" için: TÜM firmalara olan
// AÇIK (ödenmemiş/kısmi ödenmiş) Alış Faturası borcunu, faturanın girildiği
// para birimine göre toplar. TL faturalarda kalan (TL) tutar, döviz
// faturalarda dövizKalan (orijinal döviz cinsinden kalan) kullanılır.
function tumAcikBorclarParaBirimineGore(){
  const sonuc = {TL:0, USD:0, EUR:0, GBP:0};
  state.firmalar.forEach(f=>{
    const ad = f.Ad||f.ad;
    const durumMap = computeFaturaOdemeDurumu(ad);
    Object.values(durumMap).forEach(od=>{
      if(od.durum==='Kapandı') return;
      const pb = od.paraBirimi||'TL';
      if(pb==='TL'){ sonuc.TL += od.kalan; }
      else { sonuc[pb] = (sonuc[pb]||0) + (od.dovizKalan||0); }
    });
  });
  return sonuc;
}
function computeFaturaOdemeDurumu(ad){
  const invoiceGroups = {};
  const order = [];
  // Sadece ALIŞ faturaları — Ödeme ile kapanma mantığı satış faturaları
  // için geçerli değil (satışta karşı taraf Tahsilat ile öder).
  state.alimlar.filter(a=>a.firma===ad && (a.tur||'Alış')==='Alış').forEach(a=>{
    const key = (a.tarih||'')+'|'+(a.faturaNo||'');
    if(!invoiceGroups[key]){ invoiceGroups[key] = {tarih:a.tarih, faturaNo:a.faturaNo, tutar:0, paraBirimi:a.paraBirimi||'TL', kur:a.kur||1, dovizToplam:0}; order.push(key); }
    invoiceGroups[key].tutar += Number(a.toplam)||0;
    invoiceGroups[key].dovizToplam += Number(a.dovizToplam||a.toplam)||0;
  });
  const invoices = order.map(k=>Object.assign({key:k}, invoiceGroups[k]))
    .sort((x,y)=>String(x.tarih||'').localeCompare(String(y.tarih||'')));

  let pool = 0;
  state.odemeler.forEach(o=>{
    if(o.firma!==ad) return;
    if(String(o.tur||'').toUpperCase().includes('TAHSİLAT')) return; // sadece ödeme, tahsilat hariç
    pool += Number(o.tutar)||0;
  });

  const sonuc = {};
  invoices.forEach(inv=>{
    // dövizKalan: kalan TL tutarının, faturanın kendi kuruyla döviz cinsine
    // orantılı çevrimi (faturanın kendisi zaten dövizden TL'ye o kurla
    // çevrilmişti; kısmi ödemede de aynı oranı koruyoruz).
    const dovizOran = inv.tutar>0 ? inv.dovizToplam/inv.tutar : 0;
    if(pool<=1e-9){
      sonuc[inv.key] = {durum:'Açık', odenen:0, kalan:inv.tutar, paraBirimi:inv.paraBirimi, kur:inv.kur, dovizToplam:inv.dovizToplam, dovizKalan:inv.dovizToplam};
    } else if(pool>=inv.tutar-1e-9){
      sonuc[inv.key] = {durum:'Kapandı', odenen:inv.tutar, kalan:0, paraBirimi:inv.paraBirimi, kur:inv.kur, dovizToplam:inv.dovizToplam, dovizKalan:0};
      pool -= inv.tutar;
    } else {
      const kalan = inv.tutar-pool;
      sonuc[inv.key] = {durum:'Kısmi Ödeme', odenen:pool, kalan, paraBirimi:inv.paraBirimi, kur:inv.kur, dovizToplam:inv.dovizToplam, dovizKalan:kalan*dovizOran};
      pool = 0;
    }
  });
  return sonuc;
}
function buildEkstreRows(ad){
  const odemeRows = state.odemeler.filter(o=>o.firma===ad).map(o=>{
    const isTahsilat = String(o.tur||'').toUpperCase().includes('TAHSİLAT');
    return {
      tip:'odeme', tarih:o.tarih, tur:o.tur, tutar:Number(o.tutar)||0,
      detay:(o.cekNo?('Çek No: '+o.cekNo+(o.aciklama?' — ':'')):'')+(o.aciklama||''), id:o.ID, artiEtki:isTahsilat
    };
  });
  // İade: Çıkış (ben firmaya iade ediyorum, borcum azalır: -) ya da
  // Giriş (firma bana iade ediyor, borcum artar: +).
  const iadeRows = state.iadeler.filter(i=>i.firma===ad).map(i=>{
    const yon = i.yon||'Çıkış';
    return {
      tip:'iade', tarih:i.tarih, tur:'İade Faturası '+yon, tutar:Number(i.tutar)||0,
      detay:(i.urunAdi||'')+' ('+num(i.miktar,2)+' '+(i.birim||'')+')'+(i.aciklama?' — '+i.aciklama:''),
      id:i.ID, artiEtki: yon==='Giriş'
    };
  });
  // Alımlar aynı fatura (tarih+faturaNo+tür) bazında tek satıra toplanır —
  // ekstrede her kalem değil, her fatura bir hareket olarak görünür. Alış
  // faturaları borcu artırır (+), satış faturaları azaltır (-).
  const alimGroups = {};
  state.alimlar.filter(a=>a.firma===ad).forEach(a=>{
    const tur = a.tur||'Alış';
    const key = tur+'|'+(a.tarih||'')+'|'+(a.faturaNo||'');
    if(!alimGroups[key]) alimGroups[key] = {tarih:a.tarih, faturaNo:a.faturaNo, tutar:0, kalem:0, tur};
    alimGroups[key].tutar += Number(a.toplam)||0;
    alimGroups[key].kalem += 1;
  });
  const odemeDurumMap = computeFaturaOdemeDurumu(ad);
  const alimRows = Object.keys(alimGroups).map(key=>{
    const g = alimGroups[key];
    const isAlis = g.tur==='Alış';
    const od = isAlis ? (odemeDurumMap[(g.tarih||'')+'|'+(g.faturaNo||'')] || {durum:'Açık', odenen:0, kalan:g.tutar}) : null;
    return {
      tip:'alim', tarih:g.tarih, tur:(isAlis?'Alış Faturası':'Satış Faturası'), tutar:g.tutar,
      detay:(g.faturaNo?('Fatura no: '+g.faturaNo+' — '):'')+g.kalem+' kalem', id:null, artiEtki:isAlis,
      odemeDurumu: od ? od.durum : '—', odemeDetay: od, faturaNo: g.faturaNo
    };
  });

  // Ekstre: en eskiden en yeniye sıralanır ki anlık bakiye satır satır
  // birikerek ilerlesin; en alttaki satır bugünkü bakiyeyle eşleşir.
  const ekstre = alimRows.concat(odemeRows, iadeRows)
    .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')));
  let running = 0;
  ekstre.forEach(h=>{ running += h.artiEtki ? h.tutar : -h.tutar; h.bakiye = running; });
  return ekstre;
}

function lookupIadeUrun(){
  const el = document.getElementById('oiUrun');
  if(!el) return;
  const val = el.value.trim().toLowerCase();
  const u = state.urunler.find(x => String(x.Ad||x.ad||'').toLowerCase()===val);
  if(u){
    const stokKodu = u.StokKodu||u.stokKodu;
    const birimEl = document.getElementById('oiBirim');
    if(birimEl) birimEl.value = bfCleanBirim(u.Birim||u.birim||'');
    const sonAlim = state.alimlar
      .filter(a => String(a.stokKodu||'').toUpperCase()===String(stokKodu||'').toUpperCase())
      .sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')))
      .pop();
    const fiyat = sonAlim ? sonAlim.birimFiyat : (u.Fiyat!==undefined?u.Fiyat:u.fiyat);
    const fiyatEl = document.getElementById('oiBirimFiyat');
    if(fiyatEl) fiyatEl.value = fiyat||0;
    updateIadeTutar();
  }
}
function updateIadeTutar(){
  const mEl = document.getElementById('oiMiktar'), fEl = document.getElementById('oiBirimFiyat'), tEl = document.getElementById('oiTutar');
  if(!mEl || !fEl || !tEl) return;
  const miktar = Number(mEl.value)||0;

function toggleCekAlani(){

async function saveOdeme(kategori){
  if(!canDo('odeme','add')){ yetkiYokUyar(); return; }
  const ad = state.odemeSelectedFirma;
  if(!ad) return;
  const altTur = document.getElementById('odAltTur').value;
  const tarih = document.getElementById('odTarih').value;
  const tutar = Number(document.getElementById('odTutar').value)||0;
  const aciklama = document.getElementById('odAciklama').value.trim();
  const isCek = altTur.toUpperCase().includes('ÇEK');
  const cekNo = isCek ? document.getElementById('odCekNo').value.trim() : '';
  if(!tarih){ toast('Tarih seçin.'); return; }
  if(tutar<=0){ toast('Tutar girin.'); return; }
  if(isCek && !cekNo){ toast('Çek numarası girin.'); return; }
  // NAKİT/EFT/ÇEK seçiminden "NAKİT Ödeme" gibi bir etiket oluşturulur;
  // tahsilat seçeneklerinde (NAKİT TAHSİLAT vb.) etiket zaten tam.
  const tur = kategori==='tahsilat' ? altTur : (altTur+' Ödeme');
  const rec = {ID:uid('O'), tarih, firma:ad, tur, tutar, aciklama, cekNo};
  state.odemeler.push(rec);
  const persistedOk = await persistOdemeler();
  if(!persistedOk){
    toast('DİKKAT: Ödeme cihaz hafızasına kaydedilemedi! Lütfen ekran görüntüsü alıp bildirin.');
    console.error('persistOdemeler başarısız oldu — kayıt sadece bellekte, kalıcı değil.');
  } else {
    toast((kategori==='tahsilat'?'Tahsilat':'Ödeme')+' kaydedildi. Bakiye güncellendi.');
  }
  document.getElementById('odTutar').value=''; document.getElementById('odAciklama').value='';
  const cekEl = document.getElementById('odCekNo'); if(cekEl) cekEl.value='';
  renderContent();
  await syncOrQueue({action:'addOdeme', data:{tarih, firma:ad, tur, tutar, aciklama, cekNo}}, {entity:'odeme', op:'add', localId:rec.ID});

  // Döviz kasasından düşülsün seçiliyse: ilgili döviz kasasından NATİVE
  // (orijinal döviz) tutarı bir Çıkış olarak düş — normal Nakit/Banka
  // akışına hiç girmeden. Aksi halde her zamanki gibi otomatik Nakit/Banka
  // kasa hareketi oluşturulur.
  const dovizKasaKullanEl = document.getElementById('odDovizKasaKullan');
  const dovizKasaKullan = dovizKasaKullanEl && dovizKasaKullanEl.checked;
  if(dovizKasaKullan){
    const dovizKasaAdi = (document.getElementById('odDovizKasaAdi')||{}).value;
    const dovizPB = (document.getElementById('odDovizPB')||{}).value;
    const dovizTutarNative = Number((document.getElementById('odDovizTutar')||{}).value)||0;
    if(dovizKasaAdi && dovizPB && dovizTutarNative>0){
      const ksKullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
      const ksRec = {ID:uid('KS'), tarih, tur:'Çıkış', hesapTuru:'Doviz', kasaAdi:dovizKasaAdi, paraBirimi:dovizPB, kategori:'Cari Ödeme', tutar:dovizTutarNative, aciklama:'Ödeme: '+ad+(aciklama?' — '+aciklama:''), kullanici:ksKullanici};
      state.kasaHareketleri.push(ksRec);
      await persistKasaHareketleri();
      renderContent();
      syncOrQueue({action:'addKasaHareket', data:{tarih, tur:'Çıkış', hesapTuru:'Doviz', kasaAdi:dovizKasaAdi, paraBirimi:dovizPB, kategori:'Cari Ödeme', tutar:dovizTutarNative, aciklama:ksRec.aciklama, kullanici:ksKullanici}}, {entity:'kasaHareket', op:'add', localId:ksRec.ID});
      toast(dovizKasaAdi+' döviz kasasından '+moneyDoviz(dovizTutarNative,dovizPB)+' düşüldü.');
      return;
    }
  }
  const hesapTuru = await autoKasaHareketFromOdeme(kategori, altTur, tarih, tutar, ad, aciklama);
  toast((hesapTuru==='Nakit'?'Nakit':'Banka')+' Kasa\'ya '+(kategori==='tahsilat'?'giriş':'çıkış')+' olarak da işlendi.');
}
async function saveIade(yon){
  if(!canDo(yon==='Giriş'?'iadeGiris':'iadeCikis','add')){ yetkiYokUyar(); return; }
  const ad = state.iadeSelectedFirma[yon];
  if(!ad) return;
  const tarih = document.getElementById('oiTarih').value;
  const urunAdi = document.getElementById('oiUrun').value.trim();
  const miktar = Number(document.getElementById('oiMiktar').value)||0;
  const birim = document.getElementById('oiBirim').value.trim();
  const birimFiyat = Number(document.getElementById('oiBirimFiyat').value)||0;
  const aciklama = document.getElementById('oiAciklama').value.trim();
  if(!tarih){ toast('Tarih seçin.'); return; }
  if(!urunAdi){ toast('Ürün adı girin.'); return; }
  if(miktar<=0){ toast('Miktar girin.'); return; }
  const tutar = miktar*birimFiyat;
  const u = state.urunler.find(x => String(x.Ad||x.ad||'').toLowerCase()===urunAdi.toLowerCase());
  const stokKodu = u ? (u.StokKodu||u.stokKodu) : '';
  const rec = {ID:uid('IA'), tarih, firma:ad, stokKodu, urunAdi, birim, miktar, birimFiyat, tutar, aciklama, yon:yon||'Çıkış'};
  state.iadeler.push(rec);
  await persistIadeler();
  toast('İade kaydedildi. Bakiye güncellendi.');
  ['oiUrun','oiMiktar','oiBirim','oiBirimFiyat','oiAciklama'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  const tEl = document.getElementById('oiTutar'); if(tEl) tEl.value = money(0);
  renderContent();
  await syncOrQueue({action:'addIade', data:{tarih, firma:ad, stokKodu, urunAdi, birim, miktar, birimFiyat, tutar, aciklama, yon:rec.yon}}, {entity:'iade', op:'add', localId:rec.ID});
}
async function deleteOdemeKaydi(id){
  if(!canDo('cariHareketler','delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu ödeme/tahsilat kaydı silinsin mi? Bakiye buna göre yeniden hesaplanacak.')) return;
  state.odemeler = state.odemeler.filter(o=>o.ID!==id);
  await persistOdemeler();
  renderContent();
  syncOrQueue({action:'deleteOdeme', id}, {entity:'odeme', op:'delete', localId:id});
}
async function deleteIadeKaydi(id){
  const rec = state.iadeler.find(i=>i.ID===id);
  const yon = rec ? (rec.yon||'Çıkış') : 'Çıkış';
  if(!canDo(yon==='Giriş'?'iadeGiris':'iadeCikis','delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu iade kaydı silinsin mi? Bakiye buna göre yeniden hesaplanacak.')) return;
  state.iadeler = state.iadeler.filter(i=>i.ID!==id);
  await persistIadeler();
  renderContent();
  syncOrQueue({action:'deleteIade', id}, {entity:'iade', op:'delete', localId:id});
}

        if(h.tip==='odeme'){
          aksiyon = (canDo('cariHareketler','edit')?'<button class="btn btn-ghost btn-sm" onclick="openEditOdeme(\''+h.id+'\')">Düzenle</button> ':'') +
            (canDo('cariHareketler','delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteOdemeKaydi(\''+h.id+'\')">Sil</button>':'');
        } else if(h.tip==='iade'){
          const iadeYonKey = h.tur.includes('Giriş') ? 'iadeGiris' : 'iadeCikis';
          aksiyon = (canDo('cariHareketler','edit')?'<button class="btn btn-ghost btn-sm" onclick="openEditIade(\''+h.id+'\')">Düzenle</button> ':'') +
            (canDo(iadeYonKey,'delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteIadeKaydi(\''+h.id+'\')">Sil</button>':'');
        } else {
          aksiyon = '<button class="btn btn-ghost btn-sm" onclick="goToFaturaGorunumu(\''+escapeHtml(ad)+'\',\''+escapeHtml(h.faturaNo||'')+'\')">Faturayı Gör</button>';
        }
        return '<tr><td>'+fmtDate(h.tarih)+'</td><td>'+escapeHtml(h.tur)+'</td><td>'+escapeHtml(h.detay||'—')+'</td>' +
          '<td class="num"><span class="badge '+cls+'" style="font-weight:600;">'+sign+money(h.tutar)+'</span></td>' +
          '<td class="num"><span class="badge '+bCls+'" style="font-weight:600;">'+money(h.bakiye)+'</span></td>' +
          '<td>'+odemeHucre+'</td>' +
          '<td style="white-space:nowrap;">'+aksiyon+'</td></tr>';
      }).join('') +
    '</tbody></table></div>';
  }
  return html;
}
// İade Çıkış/Giriş ekranındaki firma seçimini uzaktan (Cari Hareketler'den)
// ayarlayıp o ekrana yönlendirir — böylece "seçili firma bağımsız olsun"
// kuralı bozulmadan, hızlı bir kısayol sağlanır.
function goToIadeFirma(yon, ad){
  state.iadeSelectedFirma[yon] = ad;
  state.iadeQuery[yon] = '';
  goTab(yon==='Giriş' ? 'iadeGiris' : 'iadeCikis');
}
// Cari Hareketler'deki bir fatura satırından, Alımlar sekmesinin Fatura
// Görünümü'ne (o firmaya filtrelenmiş olarak) atlar — kalem bazında
// düzenleme/silme zaten orada mevcut.
function goToFaturaGorunumu(ad, faturaNo){
  state.filters.firma = ad;
  state.filters.q = faturaNo || '';
  state.alimView = 'fatura';
  goTab('alimlar');
}

/* ---- Ödeme/Tahsilat kaydını düzenleme ---- */
function openEditOdeme(id){

  if(!o) return;

  const altOptions = isTahsilat
    ? ['NAKİT TAHSİLAT','EFT TAHSİLAT','ÇEK TAHSİLAT']
    : ['NAKİT Ödeme','EFT Ödeme','ÇEK Ödeme'];
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal-box">' +
        '<h3>'+(isTahsilat?'Tahsilatı':'Ödemeyi')+' düzenle</h3>' +
        '<div class="form-row" style="grid-template-columns:1fr 1fr 1fr;align-items:end;">' +
          '<div class="field"><label>Tür</label><select id="eoTur">' +
            altOptions.map(t=>'<option value="'+t+'"'+(t===o.tur?' selected':'')+'>'+t+'</option>').join('') +
          '</select></div>' +
          '<div class="field"><label>Tarih</label><input id="eoTarih" type="date" value="'+escapeHtml(o.tarih)+'"></div>' +
          '<div class="field"><label>Tutar</label><input id="eoTutar" type="number" step="any" value="'+(Number(o.tutar)||0)+'"></div>' +
        '</div>' +
        '<div class="field" style="margin-top:8px;"><label>Açıklama</label><input id="eoAciklama" type="text" value="'+escapeHtml(o.aciklama||'')+'"></div>' +
        '<div class="field" style="margin-top:8px;"><label>Çek Numarası (sadece çek ise)</label><input id="eoCekNo" type="text" value="'+escapeHtml(o.cekNo||'')+'"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn" onclick="closeModal()">Vazgeç</button>' +
          '<button class="btn btn-primary" onclick="saveEditOdeme(\''+id+'\')">Kaydet</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}
async function saveEditOdeme(id){
  if(!canDo('cariHareketler','edit')){ yetkiYokUyar(); return; }
  const idx = state.odemeler.findIndex(x=>x.ID===id);
  if(idx===-1){ closeModal(); return; }
  const tur = document.getElementById('eoTur').value;
  const tarih = document.getElementById('eoTarih').value;
  const tutar = Number(document.getElementById('eoTutar').value)||0;
  const aciklama = document.getElementById('eoAciklama').value.trim();
  const cekNo = document.getElementById('eoCekNo').value.trim();
  if(!tarih){ toast('Tarih seçin.'); return; }
  if(tutar<=0){ toast('Tutar 0\'dan büyük olmalı.'); return; }
  state.odemeler[idx] = Object.assign({}, state.odemeler[idx], {tur, tarih, tutar, aciklama, cekNo});
  await persistOdemeler();
  closeModal();
  toast('Kayıt güncellendi. Bakiye yeniden hesaplandı.');
  renderContent();
  await syncOrQueue({action:'updateOdeme', id, data:{tur, tarih, tutar, aciklama, cekNo}}, {entity:'odeme', op:'update', localId:id});
}

/* =========================================================
   CARİ KART TANIMLA
   Yeni bir firma (cari) kartı — Firma İsmi, İletişim, Mail, Banka İsmi,
   IBAN No — tanımlar. Aynı veriler Firmalar/Cari Hareketler ile paylaşılır.
========================================================= */
function viewCariKartTanimla(){
  const q = (state.cariKartQuery||'').toLowerCase();
  let html = '<div class="section-desc" style="margin-bottom:14px;">Yeni bir cari kartı tanımlayın — sadece Firma İsmi zorunludur. Firmalar sekmesi kaldırıldığı için cari (firma) yönetimi artık tamamen burada yapılır.</div>';
  html += '<div class="card" style="max-width:640px;margin-bottom:24px;">' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr;">' +
      '<div class="field"><label>Firma İsmi</label><input id="ckAd" type="text" placeholder="ör. PACKSEL LTD."></div>' +
      '<div class="field"><label>Yetkili</label><input id="ckYetkili" type="text" placeholder="ör. Ahmet Yılmaz"></div>' +
    '</div>' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr;margin-top:8px;">' +
      '<div class="field"><label>İletişim</label><input id="ckIletisim" type="text" placeholder="telefon"></div>' +
      '<div class="field"><label>Mail</label><input id="ckMail" type="email" placeholder="ornek@firma.com"></div>' +
    '</div>' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr;margin-top:8px;">' +
      '<div class="field"><label>Banka İsmi</label><input id="ckBanka" type="text" placeholder="ör. İş Bankası"></div>' +
      '<div class="field"><label>IBAN No</label><input id="ckIban" type="text" placeholder="TR.."></div>' +
    '</div>' +
    '<button class="btn btn-primary" style="margin-top:12px;" onclick="saveCariKart()" '+(canDo('cariKartTanimla','add')?'':'disabled title="Bu işlem için yetkiniz yok"')+'>Cari Kartı Kaydet</button>' +
  '</div>';

  const eksikSayisi = state.firmalar.filter(f=>!cariKartTamMi(f)).length;
  html += '<h2 class="section-title">Tanımlı Cariler</h2>';
  if(eksikSayisi>0){
    html += '<div class="banner banner-warn" style="margin-bottom:12px;">'+eksikSayisi+' cari kartı EKSİK — sadece isim kayıtlı (muhtemelen fatura girerken hızlıca "+ Yeni firma ekle" ile oluşturuldu). Yetkili/İletişim/Mail/Banka bilgilerini tamamlamak için "Düzenle"ye basın.</div>';
  }
  html += '<div class="form-row" style="grid-template-columns:1fr auto;align-items:end;margin-bottom:12px;max-width:520px;">' +
    '<div class="field" style="margin:0;"><label>Ara</label><input id="cariKartQueryInput" type="text" value="'+escapeHtml(state.cariKartQuery||'')+'" placeholder="Firma adı, yetkili…" oninput="setCariKartQuery(this.value)"></div>' +
    '<button class="btn btn-sm '+(state.cariKartSadeceEksik?'btn-primary':'btn-ghost')+'" onclick="toggleCariKartSadeceEksik()">Sadece eksik olanları göster</button>' +
  '</div>';
  const list = state.firmalar.filter(f=>{
    if(state.cariKartSadeceEksik && cariKartTamMi(f)) return false;
    if(!q) return true;
    const hay = ((f.Ad||f.ad||'')+' '+(f.Yetkili||f.yetkili||'')).toLowerCase();
    return hay.includes(q);
  });
  if(list.length===0){
    html += emptyState(state.firmalar.length===0?'Henüz cari tanımlanmamış':'Sonuç bulunamadı', 'Yukarıdan ilk cari kartını ekleyin.');
  } else {
    html += '<div class="tbl-wrap"><table><thead><tr><th>Durum</th><th>Firma İsmi</th><th>Yetkili</th><th>İletişim</th><th>Mail</th><th>Banka İsmi</th><th>IBAN No</th><th></th></tr></thead><tbody>' +
      list.map(f=>{
        const id = f.ID||f.id;
        const tam = cariKartTamMi(f);
        return '<tr><td>'+(tam ? '<span class="badge badge-success" style="font-weight:600;">✓ Tanımlı</span>' : '<span class="badge badge-danger" style="font-weight:600;">⚠ Sadece İsim</span>')+'</td>' +
          '<td>'+escapeHtml(f.Ad||f.ad)+'</td>' +
          '<td>'+escapeHtml(f.Yetkili||f.yetkili||'—')+'</td>' +
          '<td>'+escapeHtml(f.Telefon||f.telefon||'—')+'</td>' +
          '<td>'+escapeHtml(f.Email||f.email||'—')+'</td>' +
          '<td>'+escapeHtml(f.BankaAdi||f.bankaAdi||'—')+'</td>' +
          '<td>'+escapeHtml(f.Iban||f.iban||'—')+'</td>' +
          '<td>'+(canDo('cariKartTanimla','edit')?'<button class="btn btn-ghost btn-sm" onclick="openEditFirma(\''+id+'\')">Düzenle</button> ':'')+
            (canDo('cariKartTanimla','delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteFirma(\''+id+'\')">Sil</button>':'')+'</td></tr>';
      }).join('') +
    '</tbody></table></div>';
  }
  return html;
}
function cariKartTamMi(f){
  return !!(f.Yetkili||f.yetkili||f.Telefon||f.telefon||f.Email||f.email||f.BankaAdi||f.bankaAdi||f.Iban||f.iban);
}
function toggleCariKartSadeceEksik(){ state.cariKartSadeceEksik = !state.cariKartSadeceEksik; renderContent(); }
function setCariKartQuery(v){ state.cariKartQuery = v; renderContentKeepFocus(); }
async function saveCariKart(){
  if(!canDo('cariKartTanimla','add')){ yetkiYokUyar(); return; }
  const ad = document.getElementById('ckAd').value.trim();
  if(!ad){ toast('Firma ismi girin.'); return; }
  if(state.firmalar.some(f=>String(f.Ad||f.ad||'').trim().toLocaleUpperCase('tr-TR')===ad.toLocaleUpperCase('tr-TR'))){
    toast('Bu isimde bir cari zaten var.'); return;
  }
  const yetkili = document.getElementById('ckYetkili').value.trim();
  const telefon = document.getElementById('ckIletisim').value.trim();
  const email = document.getElementById('ckMail').value.trim();
  const bankaAdi = document.getElementById('ckBanka').value.trim();
  const iban = document.getElementById('ckIban').value.trim();
  const rec = {ID:uid('F'), Ad:ad, Yetkili:yetkili, Telefon:telefon, Email:email, BankaAdi:bankaAdi, Iban:iban};
  state.firmalar.push(rec);
  await persistFirmalar();
  toast('Cari kart oluşturuldu.');
  ['ckAd','ckIletisim','ckMail','ckBanka','ckIban'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  renderContent();
  await syncOrQueue({action:'addFirma', data:{ad, yetkili, telefon, email, bankaAdi, iban}}, {entity:'firma', op:'add', localId:rec.ID});
}

/* =========================================================
   CARİ RAPOR ÇEK
   Tüm carilerin (firmaların) konsolide bakiye özeti — Yazdır/Excel.
========================================================= */
function cariRaporRows(){
  return state.firmalar.map(f=>{
    const ad = f.Ad||f.ad;
    return {ad, b: computeFirmaBakiye(ad)};
  }).sort((x,y)=>y.b.bakiye-x.b.bakiye);
}
function viewCariRaporCek(){
  const rows = cariRaporRows();
  let html = '<div class="section-desc" style="margin-bottom:14px;">Tüm carilerin (firmaların) güncel bakiye özet raporu.</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:14px;">' +
    '<button class="btn btn-sm btn-primary" onclick="printCariRapor()">🖨️ Yazdır</button>' +
    '<button class="btn btn-sm btn-primary" onclick="exportCariRaporExcel()">Excel olarak kaydet</button>' +
  '</div>';
  if(rows.length===0){
    html += emptyState('Firma yok', '"Cari Kart Tanımla"dan ilk cariyi ekleyin.');
    return html;
  }
  html += '<div class="tbl-wrap"><table><thead><tr><th>Firma</th><th class="num">Alış</th><th class="num">Satış</th><th class="num">Ödeme</th><th class="num">Tahsilat</th><th class="num">İade Çıkış</th><th class="num">İade Giriş</th><th class="num">Bakiye</th></tr></thead><tbody>' +
    rows.map(r=>{
      const cls = r.b.bakiye>0.5 ? 'badge-danger' : (r.b.bakiye<-0.5 ? 'badge-success' : 'badge-primary');
      return '<tr><td>'+escapeHtml(r.ad)+'</td>' +
        '<td class="num">'+money(r.b.toplamAlis)+'</td>' +
        '<td class="num">'+money(r.b.toplamSatis)+'</td>' +
        '<td class="num">'+money(r.b.toplamOdeme)+'</td>' +
        '<td class="num">'+money(r.b.toplamTahsilat)+'</td>' +
        '<td class="num">'+money(r.b.toplamIadeCikis)+'</td>' +
        '<td class="num">'+money(r.b.toplamIadeGiris)+'</td>' +
        '<td class="num"><span class="badge '+cls+'" style="font-weight:600;">'+money(r.b.bakiye)+'</span></td></tr>';
    }).join('') +
  '</tbody></table></div>';
  return html;
}
function printCariRapor(){
  const rows = cariRaporRows();
  const rowsHtml = rows.map(r=>(
    '<tr><td>'+escapeHtml(r.ad)+'</td><td class="num">'+money(r.b.toplamAlis)+'</td><td class="num">'+money(r.b.toplamSatis)+'</td>'+
    '<td class="num">'+money(r.b.toplamOdeme)+'</td><td class="num">'+money(r.b.toplamTahsilat)+'</td>'+
    '<td class="num">'+money(r.b.toplamIadeCikis)+'</td><td class="num">'+money(r.b.toplamIadeGiris)+'</td>'+
    '<td class="num">'+money(r.b.bakiye)+'</td></tr>'
  )).join('');
  const html = '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Cari Rapor</title><style>'+
    '@page{ size:A4 landscape; margin:14mm; } *{box-sizing:border-box;} body{font-family:"Segoe UI",Arial,sans-serif;color:#1B2420;margin:0;}'+
    '.sheet{max-width:1100px;margin:0 auto;padding:10px;} h1{color:#145C54;font-size:20px;} table{width:100%;border-collapse:collapse;font-size:12px;}'+
    'th{background:#145C54;color:#fff;text-align:left;padding:7px 9px;} td{padding:6px 9px;border-bottom:1px solid #EAE6D9;} tr:nth-child(even) td{background:#F7F5EE;}'+
    '.num{text-align:right;} @media print{.no-print{display:none;}} .no-print{text-align:center;margin:16px;} .no-print button{background:#145C54;color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer;}'+
  '</style></head><body>'+
  '<div class="no-print"><button onclick="window.print()">Yazdır</button></div>'+
  '<div class="sheet"><h1>CARİ RAPOR — '+fmtDate(todayISO())+'</h1>'+
  '<table><thead><tr><th>Firma</th><th class="num">Alış</th><th class="num">Satış</th><th class="num">Ödeme</th><th class="num">Tahsilat</th><th class="num">İade Çıkış</th><th class="num">İade Giriş</th><th class="num">Bakiye</th></tr></thead>'+
  '<tbody>'+(rowsHtml||'<tr><td colspan="8" style="text-align:center;">Kayıt yok</td></tr>')+'</tbody></table></div></body></html>';
  const w = window.open('', '_blank');
  if(!w){ toast('Pencere açılamadı — açılır pencere engelleyicisini kontrol edin.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
async function exportCariRaporExcel(){
  if(typeof ExcelJS === 'undefined'){ toast('Excel kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin.'); return; }
  const rows = cariRaporRows();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Cari Rapor');
  ws.columns = [{width:24},{width:14},{width:14},{width:14},{width:14},{width:14},{width:14},{width:14}];
  const hRow = ws.addRow(['Firma','Alış','Satış','Ödeme','Tahsilat','İade Çıkış','İade Giriş','Bakiye']);
  styleHeaderRow(hRow);
  ws.views = [{ state:'frozen', ySplit:1 }];
  rows.forEach((r,i)=>{
    const row = ws.addRow([r.ad, r.b.toplamAlis, r.b.toplamSatis, r.b.toplamOdeme, r.b.toplamTahsilat, r.b.toplamIadeCikis, r.b.toplamIadeGiris, r.b.bakiye]);
    styleDataRow(row, i%2===1, [], [2,3,4,5,6,7,8]);
  });
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'cari-rapor-'+todayISO()+'.xlsx');
  toast('Excel dosyası indirildi.');
}

/* =========================================================
   KASA
   Fiziksel nakit takibi — cari hesaptan (firmalarla borç/alacak) AYRI bir
   defter. Her hareket Giriş ya da Çıkış'tır; güncel bakiye tüm hareketlerin
   toplamıdır. "Kasa Sayımı" ile elinizdeki gerçek nakti sisteme girip
   farkı (varsa) tek tıkla bir "Sayım Farkı" hareketi olarak kaydedebilirsiniz.
========================================================= */
function normalizeKasaHareket(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id']) || '',
    tarih: pickField(rec,['tarih','Tarih']) || '',

// Kasası"), birden fazla banka hesabı (ör. "Ziraat TL", "İş Bankası USD")
// ve birden fazla döviz kasası (ör. "Kasa Dolar", "Kasa Euro") olabilir —
// her biri burada ayrı bir kayıt. Tip: 'Nakit' / 'Banka' / 'Doviz'.
// paraBirimi sadece Doviz tipinde anlamlıdır (USD/EUR/GBP).
function normalizeKasaTanimi(rec){
  rec = rec || {};
  return {
    ID: pickField(rec,['ID','id']) || '',
    ad: pickField(rec,['ad','Ad']) || '',
    tip: pickField(rec,['tip','Tip']) || 'Nakit',
    paraBirimi: pickField(rec,['paraBirimi','ParaBirimi']) || ''
  };

var KASA_KATEGORILER = ['Satış Tahsilatı','Cari Tahsilat','Cari Ödeme','Masraf','Elden Ekleme','Elden Çekme','Banka Yatırma','Banka Çekme','Sayım Farkı','Diğer'];
function kasaBakiye(hesapTuru, uptoDate, kasaAdi){
  let bakiye = 0;
  state.kasaHareketleri.forEach(h=>{
    if((h.hesapTuru||'Nakit')!==hesapTuru) return;
    if(kasaAdi && (h.kasaAdi||'')!==kasaAdi) return;
    if(uptoDate && String(h.tarih||'')>uptoDate) return;
    bakiye += (h.tur==='Giriş'?1:-1)*(Number(h.tutar)||0);
  });
  return bakiye;
}

  if(!ad){ toast('Kasa adı girin.'); return; }
  if(state.kasaTanimlari.some(k=>k.tip===tip && k.ad.toLocaleLowerCase('tr-TR')===ad.toLocaleLowerCase('tr-TR'))){ toast('Bu isimde bir kasa zaten var.'); return; }

}
async function deleteKasaTanimi(id){

  if(kullanimda && !confirm('"'+k.ad+'" kasasına ait geçmiş hareketler var. Kasa tanımını silmek bu hareketleri ETKİLEMEZ (hareketlerde kasa adı olarak kalır), sadece yeni işlemler için seçilemez hale gelir. Devam edilsin mi?')) return;

  renderContent();
  syncOrQueue({action:'deleteKasaTanimi', id}, {entity:'kasaTanimi', op:'delete', localId:id});
}

async function dovizKasalariToplamHesapla(){
  const kasalar = state.kasaTanimlari.filter(k=>k.tip==='Doviz');
  const sonucEl = document.getElementById('dovizKasaToplamSonuc');
  if(!sonucEl) return;
  sonucEl.textContent = 'kurlar çekiliyor…';
  let toplamTL = 0;
  const satirlar = [];
  for(const k of kasalar){
    const bakiye = kasaBakiye('Doviz', null, k.ad);
    if(Math.abs(bakiye)<0.005) continue;
    try{
      const {kur} = await fetchDovizKuruTL(k.paraBirimi);
      toplamTL += bakiye*kur;
      satirlar.push(escapeHtml(k.ad)+': '+moneyDoviz(bakiye,k.paraBirimi)+' × '+num(kur,4)+' = '+money(bakiye*kur));
    }catch(e){
      satirlar.push(escapeHtml(k.ad)+': kur alınamadı');
    }
  }
  sonucEl.innerHTML = (satirlar.length ? satirlar.join('<br>')+'<br>' : '') + '<b>Toplam TL karşılığı (tahmini): '+money(toplamTL)+'</b>';
}
/* =========================================================
   KASA RAPORLAR
   Tüm kasaları (Nakit + Banka + Döviz) TEK ekranda, grafiklerle özetler —
   hangi kasada ne kadar var, dağılımı nasıl, son dönemdeki giriş/çıkış
   trendi. Döviz kasaları, Muhasebe > Genel Bakış'taki aynı önbelleğe
   alınmış kurla (state.muhasebeKurlar) TL karşılığına çevrilir.
========================================================= */
function kasaRaporlariniHesapla(){
  const kurlar = state.muhasebeKurlar || {};
  const detay = [];
  let toplamNakit = 0, toplamBanka = 0, toplamDovizTL = 0;

  const nakitKasalar = state.kasaTanimlari.filter(k=>k.tip==='Nakit');
  if(nakitKasalar.length===0){
    const b = kasaBakiye('Nakit');
    detay.push({ad:'Nakit Kasa', tip:'Nakit', paraBirimi:'TL', bakiye:b, tlKarsiligi:b});
    toplamNakit += b;
  } else {
    nakitKasalar.forEach(k=>{
      const b = kasaBakiye('Nakit', null, k.ad);
      detay.push({ad:k.ad, tip:'Nakit', paraBirimi:'TL', bakiye:b, tlKarsiligi:b});
      toplamNakit += b;
    });
  }
  const bankaKasalar = state.kasaTanimlari.filter(k=>k.tip==='Banka');
  if(bankaKasalar.length===0){
    const b = kasaBakiye('Banka');
    detay.push({ad:'Banka Kasa', tip:'Banka', paraBirimi:'TL', bakiye:b, tlKarsiligi:b});
    toplamBanka += b;
  } else {
    bankaKasalar.forEach(k=>{
      const b = kasaBakiye('Banka', null, k.ad);
      detay.push({ad:k.ad, tip:'Banka', paraBirimi:'TL', bakiye:b, tlKarsiligi:b});
      toplamBanka += b;
    });
  }
  state.kasaTanimlari.filter(k=>k.tip==='Doviz').forEach(k=>{
    const b = kasaBakiye('Doviz', null, k.ad);
    const kur = Number((kurlar[k.paraBirimi]||{}).satis)||0;
    const tlk = b*kur;
    detay.push({ad:k.ad, tip:'Doviz', paraBirimi:k.paraBirimi, bakiye:b, tlKarsiligi:tlk});
    toplamDovizTL += tlk;
  });

  return {detay, toplamNakit, toplamBanka, toplamDovizTL, genelToplam: toplamNakit+toplamBanka+toplamDovizTL};
}

    syncOrQueue({action:'addKasaHareket', data:{tarih, tur:'Çıkış', hesapTuru:odemeSekli, kasaAdi:ksRec.kasaAdi, paraBirimi:'TL', kategori:ksRec.kategori, tutar, aciklama:ksRec.aciklama, kullanici}}, {entity:'kasaHareket', op:'add', localId:ksRec.ID});
    toast('Gider kaydedildi ve '+odemeSekli+' kasasından düşüldü.');
  } else {
    toast('Gider kaydedildi.');
  }
  renderContent();
}
async function deleteGider(id){
  if(!canDo('giderler','delete')){ yetkiYokUyar(); return; }
  const onay = await evetHayirSor('Bu gider kaydı silinsin mi? (Kasadan otomatik düşülen tutar varsa, o kasa hareketi ETKİLENMEZ — ayrıca silmeniz gerekir.)', 'Gideri Sil');
  if(!onay) return;
  state.giderler = state.giderler.filter(g=>(g.ID||g.id)!==id);

  renderContent();

}

        '<td>'+escapeHtml(h.kullanici||'—')+'</td>' +
        '<td>'+(canDo(hesapTuru==='Nakit'?'kasaNakit':'kasaBanka','delete')?'<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteKasaHareket(\''+(h.ID||h.id)+'\')">Sil</button>':'')+'</td>' +
      '</tr>';
    }).join('') +
  '</tbody></table></div>';
  return html;

async function saveKasaHareket(tur){
  const hesapTuru = (document.getElementById('khHesapTuru')||{}).value || 'Nakit';
  const kasaAdiEl = document.getElementById('khKasaAdi');
  const kasaAdi = kasaAdiEl ? kasaAdiEl.value : '';
  const tarih = document.getElementById('khTarih').value || todayISO();
  const kategori = document.getElementById('khKategori').value.trim();
  const tutar = Number(document.getElementById('khTutar').value)||0;
  const aciklama = document.getElementById('khAciklama').value.trim();
  if(tutar<=0){ toast('Tutar 0\'dan büyük olmalı.'); return; }

  const paraBirimi = hesapTuru==='Doviz' ? (kasaTanimi?kasaTanimi.paraBirimi:'USD') : 'TL';
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const rec = {ID:uid('KS'), tarih, tur, hesapTuru, kasaAdi, paraBirimi, kategori: kategori||'Diğer', tutar, aciklama, kullanici};
  state.kasaHareketleri.push(rec);

  renderContent();
  syncOrQueue({action:'addKasaHareket', data:{tarih, tur, hesapTuru, kasaAdi, paraBirimi, kategori:rec.kategori, tutar, aciklama, kullanici}}, {entity:'kasaHareket', op:'add', localId:rec.ID});
}
async function deleteKasaHareket(id){
  const h = state.kasaHareketleri.find(x=>(x.ID||x.id)===id);
  const hesapTuru = h ? (h.hesapTuru||'Nakit') : 'Nakit';
  const tabKey = hesapTuru==='Nakit'?'kasaNakit':hesapTuru==='Banka'?'kasaBanka':'kasaDoviz';
  if(!canDo(tabKey,'delete')){ yetkiYokUyar(); return; }
  if(!confirm('Bu kasa hareketi silinsin mi?')) return;
  state.kasaHareketleri = state.kasaHareketleri.filter(h=>(h.ID||h.id)!==id);
  await persistKasaHareketleri();
  renderContent();
  syncOrQueue({action:'deleteKasaHareket', id}, {entity:'kasaHareket', op:'delete', localId:id});
}
function openKasaSayimModal(hesapTuru, zorunluKasaAdi){
  if(!canDo(hesapTuru==='Nakit'?'kasaNakit':hesapTuru==='Banka'?'kasaBanka':'kasaDoviz','add')){ yetkiYokUyar(); return; }

  if(hesapTuru==='Doviz' && !kasaAdi){ toast('Önce bir döviz kasası seçin.'); return; }

  const pb = hesapTuru==='Doviz' ? (kasaTanimi?kasaTanimi.paraBirimi:'USD') : 'TL';
  const sistemBakiye = kasaBakiye(hesapTuru, null, kasaAdi||null);
  const fmt = v => hesapTuru==='Doviz' ? moneyDoviz(v, pb) : money(v);
  const baslik = (hesapTuru==='Nakit' ? 'Kasa Sayımı' : hesapTuru==='Banka' ? 'Banka Ekstresi Mutabakatı' : 'Döviz Kasası Sayımı') + (kasaAdi?' — '+kasaAdi:'');

      '<div class="modal-box" style="max-width:460px;">' +

        '<input type="hidden" id="ksHesapTuru" value="'+hesapTuru+'">' +
        (!kasaAdi && hesapTuru!=='Doviz' && state.kasaTanimlari.some(k=>k.tip===hesapTuru) ? '<div class="hint" style="margin-top:-6px;">"Tüm Kasalar" seçiliyken sayım TOPLAM bakiye üzerinden yapılır. Belirli bir kasayı saymak isterseniz önce yukarıdan o kasayı seçin.</div>' : '') +
        '<div class="kv"><span>Sistemdeki bakiye</span><span><b>'+fmt(sistemBakiye)+'</b></span></div>' +
        '<div class="field" style="margin-top:12px;"><label>'+(hesapTuru==='Nakit'?'Elinizdeki (sayılan) nakit':hesapTuru==='Banka'?'Banka ekstresindeki bakiye':'Elinizdeki (sayılan) '+pb)+'</label><input id="ksSayilan" type="number" step="any" min="0" placeholder="0,00" oninput="kasaSayimFarkGuncelle('+sistemBakiye+')"></div>' +
        '<div id="ksFarkGosterge" class="hint" style="margin-top:6px;"></div>' +
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Vazgeç</button>' +
          '<button class="btn btn-primary" onclick="confirmKasaSayimi('+sistemBakiye+',\''+hesapTuru+'\',\''+escapeHtml(kasaAdi).replace(/'/g,"\\'")+'\')">Farkı Kaydet</button></div>' +
      '</div>' +
    '</div>';
}
function kasaSayimFarkGuncelle(sistemBakiye){
  const hesapTuru = (document.getElementById('ksHesapTuru')||{}).value || 'Nakit';
  const el = document.getElementById('ksFarkGosterge');
  const sayilan = Number(document.getElementById('ksSayilan').value)||0;
  const fark = sayilan - sistemBakiye;
  if(!el) return;
  const fmt = v => hesapTuru==='Doviz' ? num(v,2) : money(v);
  if(Math.abs(fark)<0.005){ el.innerHTML = '<span style="color:var(--success);font-weight:600;">✓ Tutuyor, fark yok.</span>'; return; }
  const cls = fark>0 ? 'var(--success)' : 'var(--danger)';
  el.innerHTML = '<span style="color:'+cls+';font-weight:600;">'+(fark>0?'Fazla: +':'Eksik: ')+fmt(Math.abs(fark))+'</span> — kaydedilirse "Sayım Farkı" olarak '+(fark>0?'giriş':'çıkış')+' eklenecek.';
}
async function confirmKasaSayimi(sistemBakiye, hesapTuru, kasaAdi){
  const sayilan = Number(document.getElementById('ksSayilan').value)||0;
  const fark = sayilan - sistemBakiye;
  if(Math.abs(fark)<0.005){ toast('Fark yok — zaten tutuyor.'); closeModal(); return; }
  const tur = fark>0 ? 'Giriş' : 'Çıkış';
  const tutar = Math.abs(fark);
  const kasaTanimi = state.kasaTanimlari.find(k=>k.ad===kasaAdi && k.tip===hesapTuru);
  const paraBirimi = hesapTuru==='Doviz' ? (kasaTanimi?kasaTanimi.paraBirimi:'USD') : 'TL';
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const fmt = v => hesapTuru==='Doviz' ? moneyDoviz(v, paraBirimi) : money(v);
  const rec = {ID:uid('KS'), tarih:todayISO(), tur, hesapTuru, kasaAdi:kasaAdi||'', paraBirimi, kategori:'Sayım Farkı', tutar, aciklama:'Sayım/mutabakat: sistem '+fmt(sistemBakiye)+', gerçek '+fmt(sayilan), kullanici};
  state.kasaHareketleri.push(rec);
  await persistKasaHareketleri();
  closeModal();
  toast('Fark kaydedildi: '+(fark>0?'+':'−')+fmt(tutar));
  renderContent();
  syncOrQueue({action:'addKasaHareket', data:{tarih:rec.tarih, tur, hesapTuru, kasaAdi:rec.kasaAdi, paraBirimi, kategori:rec.kategori, tutar, aciklama:rec.aciklama, kullanici}}, {entity:'kasaHareket', op:'add', localId:rec.ID});
}
// Ödeme/Tahsilat sekmesinde NAKİT/EFT/ÇEK seçimine göre otomatik kasa
// hareketi oluşturur — Ödeme = ilgili kasadan ÇIKIŞ, Tahsilat = ilgili
// kasaya GİRİŞ. EFT ve ÇEK, banka üzerinden geçtiği için Banka Kasa'ya
// yazılır; NAKİT, Nakit Kasa'ya. O türde BİRDEN FAZLA kasa/hesap
// tanımlıysa, hangisi olduğu bir açılır pencereyle sorulur.
async function autoKasaHareketFromOdeme(kategori, altTur, tarih, tutar, firma, aciklama){
  const hesapTuru = String(altTur||'').toUpperCase().includes('NAKİT') ? 'Nakit' : 'Banka';
  const tur = kategori==='tahsilat' ? 'Giriş' : 'Çıkış';
  const kasaKategori = kategori==='tahsilat' ? 'Cari Tahsilat' : 'Cari Ödeme';
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const kasalar = state.kasaTanimlari.filter(k=>k.tip===hesapTuru);
  let kasaAdi = '';
  if(kasalar.length===1) kasaAdi = kasalar[0].ad;
  else if(kasalar.length>1) kasaAdi = await odemeKasaSecimiSor(hesapTuru, kasalar);
  const rec = {ID:uid('KS'), tarih, tur, hesapTuru, kasaAdi, kategori:kasaKategori, tutar, aciklama:(aciklama?aciklama+' — ':'')+firma, kullanici};
  state.kasaHareketleri.push(rec);
  await persistKasaHareketleri();
  syncOrQueue({action:'addKasaHareket', data:{tarih, tur, hesapTuru, kasaAdi, kategori:kasaKategori, tutar, aciklama:rec.aciklama, kullanici}}, {entity:'kasaHareket', op:'add', localId:rec.ID});
  return hesapTuru;
}
// Birden fazla kasa/hesap tanımlıyken hangisinin kullanılacağını sorup,
// seçilen kasa adıyla resolve olan bir Promise döndürür.
function odemeKasaSecimiSor(hesapTuru, kasalar){
  return new Promise(resolve=>{
    window.__odemeKasaSecimiResolve = resolve;
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-box" style="max-width:420px;">' +
          '<h3>Hangi '+(hesapTuru==='Nakit'?'kasa':'banka hesabı')+'?</h3>' +
          '<div class="section-desc" style="margin-top:-6px;">Bu işlem birden fazla tanımlı '+(hesapTuru==='Nakit'?'nakit kasadan':'banka hesabından')+' hangisine işlensin?</div>' +
          '<div class="field"><label>'+(hesapTuru==='Nakit'?'Kasa':'Hesap')+'</label><select id="odKasaSecim">' +
            kasalar.map(k=>'<option value="'+escapeHtml(k.ad)+'">'+escapeHtml(k.ad)+'</option>').join('') +
          '</select></div>' +
          '<div class="modal-actions"><button class="btn btn-primary" onclick="odemeKasaSecildi()">Devam</button></div>' +
        '</div>' +
      '</div>';
  });
}
function odemeKasaSecildi(){
  const val = (document.getElementById('odKasaSecim')||{}).value || '';
  closeModal();
  if(window.__odemeKasaSecimiResolve){ window.__odemeKasaSecimiResolve(val); window.__odemeKasaSecimiResolve = null; }
}

/* =========================================================
   MUHASEBE
   Muhasebenin ihtiyaç duyacağı özet bilgileri tek ekranda toplar: KDV
   durumu, kasa (nakit+banka), cari borç/alacak, çek/senet ve bekleyen
   ödeme emirleri. Kendi verisini üretmez — zaten var olan modüllerden
   (Kasa, Cari, Çek/Senet, Ödeme Emirleri, Alım/Satım) özetler, her kart
   ilgili ekrana tek tıkla götürür.
========================================================= */
function setMuhasebeKasaFiltre(v){ state.muhasebeKasaFiltre = v; renderContent(); }
function muhasebeKasaTutari(filtre){
  if(!filtre) return kasaBakiye('Nakit') + kasaBakiye('Banka');
  if(filtre==='Nakit') return kasaBakiye('Nakit');
  if(filtre==='Banka') return kasaBakiye('Banka');
  const parts = filtre.split('||'); const tip = parts[0], ad = parts[1];
  return kasaBakiye(tip, null, ad);
}
// Döviz Bakiyeleri özetindeki USD/EUR/GBP kurlarını (TCMB öncelikli,
// bkz. fetchDovizKuruTL) tek seferde çeker ve önbelleğe alır.
async function muhasebeKurGuncelle(){
  const btn = document.getElementById('muhasebeKurBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Kur çekiliyor…'; }
  const yeni = JSON.parse(JSON.stringify(state.muhasebeKurlar||{}));
  let hepsiGercekCift = true;
  for(const kod of ['USD','EUR','GBP']){
    try{
      const {alis, satis, gercekCift} = await fetchDovizKuruCifti(kod);
      if(!yeni[kod]) yeni[kod] = {alis:null, satis:null};
      yeni[kod].alis = alis;
      yeni[kod].satis = satis;
      if(!gercekCift) hepsiGercekCift = false;
    }catch(e){ hepsiGercekCift = false; /* mevcut değer korunur */ }
  }
  state.muhasebeKurlar = yeni;
  toast(hepsiGercekCift ? 'Kurlar TCMB\'nin gerçek alış/satış değerleriyle güncellendi.' : 'Kurlar güncellendi (bazıları için TCMB\'ye ulaşılamadı, yaklaşık tek kur kullanıldı — Döviz Kurları sekmesinden elle düzeltebilirsiniz).');
  renderContent();
}
/* =========================================================
   DÖVİZ KURLARI
   Sistemdeki TEK merkezi kur kaynağı — burada belirlenen alış/satış
   kurları Muhasebe Genel Bakış, Kasa Raporları, Döviz Al/Sat ve personel
   maaşlarının döviz karşılığı gösterimini ETKİLER. Otomatik (TCMB
   öncelikli) çekilebilir ya da elle girilebilir.
========================================================= */
function viewDovizKurlari(){
  const kurlar = state.muhasebeKurlar || {};
  let html = '<div class="section-desc" style="margin-bottom:14px;">Buradaki alış/satış kurları sistemdeki TÜM döviz işlemlerini (Muhasebe Genel Bakış, Kasa Raporları, Döviz Al/Sat, personel maaşlarının döviz karşılığı) etkiler. Otomatik çekebilir ya da elle girebilirsiniz.</div>';

  html += '<div style="margin-bottom:16px;"><button class="btn btn-primary" id="muhasebeKurBtn" onclick="muhasebeKurGuncelle()">🔄 Otomatik Kur Çek (TCMB öncelikli)</button></div>';

  html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;">' +
    [{kod:'USD',sembol:'$',renk:'#B4791E'},{kod:'EUR',sembol:'€',renk:'#2B5F8A'},{kod:'GBP',sembol:'£',renk:'#6B5B95'}].map(pb=>{
      const k = kurlar[pb.kod]||{alis:null,satis:null};
      return '<div class="card">' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
          '<div style="width:30px;height:30px;border-radius:50%;background:'+pb.renk+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">'+pb.sembol+'</div>' +
          '<div style="font-weight:700;font-size:16px;">'+pb.kod+'</div>' +
        '</div>' +
        '<div class="field"><label>Alış Kuru</label><input type="number" step="any" min="0" value="'+(k.alis||'')+'" placeholder="0,0000" onchange="dovizKuruManuelGuncelle(\''+pb.kod+'\',\'alis\',this.value)"></div>' +
        '<div class="field" style="margin-top:8px;"><label>Satış Kuru</label><input type="number" step="any" min="0" value="'+(k.satis||'')+'" placeholder="0,0000" onchange="dovizKuruManuelGuncelle(\''+pb.kod+'\',\'satis\',this.value)"></div>' +
      '</div>';
    }).join('') +
  '</div>' +
  '<div class="hint" style="margin-top:14px;">Muhasebe Genel Bakış\'ta: döviz borcu → TL çevrimi SATIŞ kuruyla, TL alacağınız → döviz çevrimi ALIŞ kuruyla yapılır.</div>';
  return html;
}
function dovizKuruManuelGuncelle(kod, tip, val){
  const kur = Number(val)||0;
  if(!state.muhasebeKurlar[kod]) state.muhasebeKurlar[kod] = {alis:null,satis:null};
  state.muhasebeKurlar[kod][tip] = kur>0 ? kur : null;
  toast(kod+' '+(tip==='alis'?'alış':'satış')+' kuru güncellendi.');
  renderContentKeepFocus();
}
/* =========================================================
   DÖVİZ AL/SAT
   TL kasasındaki parayı dövize, ya da döviz kasasındaki parayı TL'ye
   çevirir — İKİ kasanın bakiyesini birden günceller (kaynaktan düş,
   hedefe ekle). Kur, işlem anında Manuel mi Otomatik mi seçilerek belirlenir.
========================================================= */
function dovizAlSatYonGuncelle(){
  const yon = document.getElementById('dasYon').value;
  const kaynakEl = document.getElementById('dasKaynakAlan');
  const hedefEl = document.getElementById('dasHedefAlan');
  const dovizKasalari = state.kasaTanimlari.filter(k=>k.tip==='Doviz');
  const tlKasalari = state.kasaTanimlari.filter(k=>k.tip==='Nakit'||k.tip==='Banka');
  if(yon==='tl-doviz'){
    kaynakEl.innerHTML = tlKasalari.length ? tlKasalari.map(k=>'<option value="'+k.tip+'||'+escapeHtml(k.ad)+'">'+escapeHtml(k.ad)+' ('+k.tip+')</option>').join('') : '<option value="">Tanımlı TL kasası yok</option>';
    hedefEl.innerHTML = dovizKasalari.length ? dovizKasalari.map(k=>'<option value="'+escapeHtml(k.ad)+'" data-pb="'+k.paraBirimi+'">'+escapeHtml(k.ad)+' ('+k.paraBirimi+')</option>').join('') : '<option value="">Tanımlı döviz kasası yok</option>';
  } else {
    kaynakEl.innerHTML = dovizKasalari.length ? dovizKasalari.map(k=>'<option value="'+escapeHtml(k.ad)+'" data-pb="'+k.paraBirimi+'">'+escapeHtml(k.ad)+' ('+k.paraBirimi+')</option>').join('') : '<option value="">Tanımlı döviz kasası yok</option>';
    hedefEl.innerHTML = tlKasalari.length ? tlKasalari.map(k=>'<option value="'+k.tip+'||'+escapeHtml(k.ad)+'">'+escapeHtml(k.ad)+' ('+k.tip+')</option>').join('') : '<option value="">Tanımlı TL kasası yok</option>';
  }
  dovizAlSatKurAlaniGuncelle();
}
function dovizAlSatKurAlaniGuncelle(){
  const yon = document.getElementById('dasYon').value;
  const dovizSelect = yon==='tl-doviz' ? document.getElementById('dasHedefAlan') : document.getElementById('dasKaynakAlan');
  const opt = dovizSelect && dovizSelect.options[dovizSelect.selectedIndex];
  const pb = opt ? opt.getAttribute('data-pb') : null;
  const pbEtiket = document.getElementById('dasParaBirimiEtiket');
  if(pbEtiket) pbEtiket.textContent = pb || '—';
  dovizAlSatTutarHesapla();
}
function dovizAlSatKurTipiGuncelle(){
  const tip = document.getElementById('dasKurTipi').value;
  const manuelAlan = document.getElementById('dasManuelKurAlan');
  if(manuelAlan) manuelAlan.style.display = tip==='manuel' ? '' : 'none';
  dovizAlSatTutarHesapla();
}
function dovizAlSatGecerliKur(){
  const yon = document.getElementById('dasYon').value;
  const dovizSelect = yon==='tl-doviz' ? document.getElementById('dasHedefAlan') : document.getElementById('dasKaynakAlan');
  const opt = dovizSelect && dovizSelect.options[dovizSelect.selectedIndex];
  const pb = opt ? opt.getAttribute('data-pb') : null;
  if(!pb) return {pb:null, kur:0};
  const kurTipi = document.getElementById('dasKurTipi').value;
  if(kurTipi==='manuel'){
    return {pb, kur: Number((document.getElementById('dasManuelKur')||{}).value)||0};
  }
  const kurlar = state.muhasebeKurlar||{};
  const k = kurlar[pb]||{};
  // TL -> Döviz: dövizi ALIYORUZ (biz TL verip döviz alıyoruz) -> ALIŞ kuru.
  // Döviz -> TL: dövizi SATIYORUZ (biz döviz verip TL alıyoruz) -> SATIŞ kuru.
  return {pb, kur: Number(yon==='tl-doviz' ? k.alis : k.satis)||0};
}
function dovizAlSatTutarHesapla(){
  const kaynakTutar = Number((document.getElementById('dasKaynakTutar')||{}).value)||0;
  const {pb, kur} = dovizAlSatGecerliKur();
  const yon = document.getElementById('dasYon').value;
  const hedefEl = document.getElementById('dasHedefTutarGoster');
  if(!hedefEl) return;
  if(!kur){ hedefEl.textContent = 'Kur girilmedi'; return; }
  const hedefTutar = yon==='tl-doviz' ? (kaynakTutar/kur) : (kaynakTutar*kur);
  hedefEl.textContent = yon==='tl-doviz' ? moneyDoviz(hedefTutar, pb) : money(hedefTutar);
}

    '</div>' +
    '<div class="form-row" style="grid-template-columns:1fr 1fr;margin-top:8px;">' +

async function dovizAlSatOnayla(){
  if(!canDo('dovizAlSat','add')){ yetkiYokUyar(); return; }
  const yon = document.getElementById('dasYon').value;
  const kaynakVal = document.getElementById('dasKaynakAlan').value;
  const hedefVal = document.getElementById('dasHedefAlan').value;
  const kaynakTutar = Number(document.getElementById('dasKaynakTutar').value)||0;
  const aciklama = document.getElementById('dasAciklama').value.trim();
  if(!kaynakVal || !hedefVal){ toast('Kaynak ve hedef kasa seçin.'); return; }
  if(kaynakTutar<=0){ toast('Kaynak tutar 0\'dan büyük olmalı.'); return; }
  const {pb, kur} = dovizAlSatGecerliKur();
  if(!kur){ toast('Geçerli bir kur bulunamadı — Manuel kur girin ya da Döviz Kurları sekmesinden kur tanımlayın.'); return; }
  const hedefTutar = yon==='tl-doviz' ? (kaynakTutar/kur) : (kaynakTutar*kur);
  const kullanici = (state.currentUser && (state.currentUser.Ad||state.currentUser.ad)) || '';
  const bugun = todayISO();

  let kaynakHesapTuru, kaynakKasaAdi, kaynakPB, hedefHesapTuru, hedefKasaAdi, hedefPB;
  if(yon==='tl-doviz'){
    const parts = kaynakVal.split('||'); kaynakHesapTuru = parts[0]; kaynakKasaAdi = parts[1]; kaynakPB = 'TL';
    hedefHesapTuru = 'Doviz'; hedefKasaAdi = hedefVal; hedefPB = pb;
  } else {
    kaynakHesapTuru = 'Doviz'; kaynakKasaAdi = kaynakVal; kaynakPB = pb;
    const parts = hedefVal.split('||'); hedefHesapTuru = parts[0]; hedefKasaAdi = parts[1]; hedefPB = 'TL';
  }
  const kurTipiEtiket = document.getElementById('dasKurTipi').value==='manuel' ? 'manuel kur' : 'otomatik kur';
  const aciklamaTam = (aciklama||('Döviz '+(yon==='tl-doviz'?'Alış':'Satış')))+' ('+num(kur,4)+' '+kurTipiEtiket+')';

  const onay = await evetHayirSor(
    (yon==='tl-doviz'?'"'+kaynakKasaAdi+'" kasasından '+money(kaynakTutar)+' düşülüp, "'+hedefKasaAdi+'" döviz kasasına '+moneyDoviz(hedefTutar,pb)+' eklenecek.':
      '"'+kaynakKasaAdi+'" döviz kasasından '+moneyDoviz(kaynakTutar,pb)+' düşülüp, "'+hedefKasaAdi+'" kasasına '+money(hedefTutar)+' eklenecek.') +
    '\n\nKullanılan kur: '+num(kur,4)+' ('+kurTipiEtiket+')\n\nOnaylıyor musunuz?',
    'Döviz '+(yon==='tl-doviz'?'Alış':'Satış')+' İşlemini Onayla'
  );
  if(!onay) return;

  const cikisRec = {ID:uid('KS'), tarih:bugun, tur:'Çıkış', hesapTuru:kaynakHesapTuru, kasaAdi:kaynakKasaAdi, paraBirimi:kaynakPB, kategori:'Döviz '+(yon==='tl-doviz'?'Alış':'Satış'), tutar:kaynakTutar, aciklama:aciklamaTam, kullanici};
  const girisRec = {ID:uid('KS'), tarih:bugun, tur:'Giriş', hesapTuru:hedefHesapTuru, kasaAdi:hedefKasaAdi, paraBirimi:hedefPB, kategori:'Döviz '+(yon==='tl-doviz'?'Alış':'Satış'), tutar:hedefTutar, aciklama:aciklamaTam, kullanici};
  state.kasaHareketleri.push(cikisRec, girisRec);
  await persistKasaHareketleri();
  toast('Döviz '+(yon==='tl-doviz'?'alış':'satış')+' işlemi tamamlandı.');
  renderContent();
  syncOrQueue({action:'addKasaHareket', data:{tarih:bugun, tur:'Çıkış', hesapTuru:kaynakHesapTuru, kasaAdi:kaynakKasaAdi, paraBirimi:kaynakPB, kategori:cikisRec.kategori, tutar:kaynakTutar, aciklama:aciklamaTam, kullanici}}, {entity:'kasaHareket', op:'add', localId:cikisRec.ID});
  syncOrQueue({action:'addKasaHareket', data:{tarih:bugun, tur:'Giriş', hesapTuru:hedefHesapTuru, kasaAdi:hedefKasaAdi, paraBirimi:hedefPB, kategori:girisRec.kategori, tutar:hedefTutar, aciklama:aciklamaTam, kullanici}}, {entity:'kasaHareket', op:'add', localId:girisRec.ID});
}

/* =========================================================
   MUHASEBE — CARİ BORÇ BAKİYE
   Cari İşlemler'deki temel Cari Borç Bakiye ekranından farklı olarak:
   döviz karşılığı (ALIŞ kuruyla — TL alacağı/borcu dövize çevirme
   kuralıyla tutarlı), kredi limiti kullanım çubuğu, borç dağılım grafiği
   ve tıklanınca Cari Hesaplar'daki AYNI kapsamlı detay kartını (işlem
   özeti, son alım/ödemeler) açan modern bir görünüm.
========================================================= */
function setMuhasebeCariBakiyeQuery(v){ state.muhasebeCariBakiyeQuery = v; renderContentKeepFocus(); }
function selectMuhasebeCariBakiyeFirma(id){ state.muhasebeCariBakiyeSecili = id; renderContent(); }
function viewCariBorcBakiyeMuhasebe(){
  const q = (state.muhasebeCariBakiyeQuery||'').toLocaleLowerCase('tr-TR');
  const vadeli = vadeliKalemler();
  const kurlar = state.muhasebeKurlar||{};
  const usdAlis = Number((kurlar.USD||{}).alis)||0;
  const eurAlis = Number((kurlar.EUR||{}).alis)||0;
  const gbpAlis = Number((kurlar.GBP||{}).alis)||0;

  let rows = state.firmalar.map(f=>{
    const ad = f.Ad||f.ad||'';
    const b = computeFirmaBakiye(ad);
    const limit = Number(f.KrediLimiti||f.krediLimiti)||0;
    const gecikmis = vadeli.filter(v=>v.firma===ad && v.yon==='cikis' && v.vadeTarihi<todayISO()).reduce((s,v)=>s+v.tutar,0);
    const sonIslem = sonIslemTarihiFirma(ad);
    return {f, ad, b, limit, gecikmis, sonIslem};
  });
  if(q) rows = rows.filter(r=>r.ad.toLocaleLowerCase('tr-TR').includes(q));
  rows.sort((a,b)=>b.b.bakiye-a.b.bakiye);

  const toplamBorc = rows.reduce((s,r)=>s+Math.max(0,r.b.bakiye),0);
  const toplamAlacak = rows.reduce((s,r)=>s+Math.max(0,-r.b.bakiye),0);
  const netBakiye = toplamBorc-toplamAlacak;
  const borcluSayisi = rows.filter(r=>r.b.bakiye>0.5).length;

  let html = '<div class="section-desc" style="margin-bottom:14px;">Tüm firmalarla olan cari hesap durumunuz — döviz karşılıklı, kredi limiti kullanım göstergeli, tıklanınca tam detay açan modern görünüm. Döviz karşılıkları <a href="javascript:void(0)" onclick="goTab(\'dovizKurlari\')">Döviz Kurları</a>\'ndaki ALIŞ kuruyla hesaplanır.</div>';

  html += '<div class="grid grid-4" style="margin-bottom:10px;">' +
    '<div class="card metric"><div class="metric-label">Toplam Borcumuz</div><div class="metric-value" style="color:var(--danger);">'+money(toplamBorc)+'</div><div class="metric-sub">'+borcluSayisi+' firmaya</div></div>' +
    '<div class="card metric"><div class="metric-label">Toplam Alacağımız</div><div class="metric-value" style="color:var(--success);">'+money(toplamAlacak)+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Net Bakiye</div><div class="metric-value">'+money(netBakiye)+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Firma Sayısı</div><div class="metric-value">'+rows.length+'</div></div>' +
  '</div>';

  html += '<div class="grid grid-3" style="margin-bottom:18px;">' +
    '<div class="card metric"><div class="metric-label">Net Bakiye — USD Karşılığı</div><div class="metric-value" style="font-size:17px;">'+(usdAlis?moneyDoviz(netBakiye/usdAlis,'USD'):'—')+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Net Bakiye — EUR Karşılığı</div><div class="metric-value" style="font-size:17px;">'+(eurAlis?moneyDoviz(netBakiye/eurAlis,'EUR'):'—')+'</div></div>' +
    '<div class="card metric"><div class="metric-label">Net Bakiye — GBP Karşılığı</div><div class="metric-value" style="font-size:17px;">'+(gbpAlis?moneyDoviz(netBakiye/gbpAlis,'GBP'):'—')+'</div></div>' +
  '</div>';

  const donutData = rows.filter(r=>r.b.bakiye>0.5).map(r=>({label:r.ad, value:r.b.bakiye}));
  if(donutData.length){
    html += '<h2 class="section-title">Borç Dağılımı</h2><div class="card" style="margin-bottom:18px;">' + donutChartHtml(donutData, {centerLabel:'Toplam Borç'}) + '</div>';
  }

  html += '<div class="field" style="max-width:360px;margin:0 0 14px;"><input id="muhasebeCariBakiyeQueryInput" type="text" value="'+escapeHtml(state.muhasebeCariBakiyeQuery||'')+'" placeholder="Firma ara…" oninput="setMuhasebeCariBakiyeQuery(this.value)"></div>';

  if(rows.length===0){
    html += emptyState('Firma bulunamadı', 'Arama kutusunu temizleyin ya da Cari Kart Tanımla\'dan firma ekleyin.');
    return html;
  }

  html += '<div class="tbl-wrap"><table><thead><tr><th>Firma</th><th>Son İşlem</th><th class="num">Bakiye (TL)</th><th class="num">USD Karşılığı</th><th class="num">EUR Karşılığı</th><th class="num">GBP Karşılığı</th><th>Kredi Limiti</th><th></th></tr></thead><tbody>' +
    rows.map(r=>{
      const id = r.f.ID||r.f.id;
      const cls = r.b.bakiye>0.5 ? 'badge-danger' : (r.b.bakiye<-0.5 ? 'badge-success' : 'badge-primary');
      const kullanimYuzde = r.limit>0 ? Math.min(100, Math.round(Math.max(0,r.b.bakiye)/r.limit*100)) : 0;
      return '<tr><td><b>'+escapeHtml(r.ad)+'</b></td><td>'+(r.sonIslem?fmtDate(r.sonIslem):'—')+'</td>' +
        '<td class="num"><span class="badge '+cls+'" style="font-weight:600;">'+money(r.b.bakiye)+'</span></td>' +
        '<td class="num">'+(usdAlis?moneyDoviz(r.b.bakiye/usdAlis,'USD'):'—')+'</td>' +
        '<td class="num">'+(eurAlis?moneyDoviz(r.b.bakiye/eurAlis,'EUR'):'—')+'</td>' +
        '<td class="num">'+(gbpAlis?moneyDoviz(r.b.bakiye/gbpAlis,'GBP'):'—')+'</td>' +
        '<td>'+(r.limit>0 ? ('<div class="limit-bar-track"><div class="limit-bar-fill" style="width:'+kullanimYuzde+'%;background:'+(kullanimYuzde>=100?'var(--danger)':kullanimYuzde>=75?'var(--accent)':'var(--primary)')+';"></div></div><div class="hint" style="margin:2px 0 0;">%'+kullanimYuzde+' · limit '+money(r.limit)+'</div>') : '<span class="hint" style="margin:0;">Limit yok</span>') + '</td>' +
        '<td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" onclick="selectMuhasebeCariBakiyeFirma(\''+id+'\')">Detay</button> ' +
          (r.b.bakiye>0.5 && canDo('odemeEmirleri','add') ? '<button class="btn btn-ghost btn-sm" onclick="openOdemeEmriModal(\''+escapeHtml(r.ad).replace(/'/g,"\\'")+'\','+Math.round(r.b.bakiye*100)/100+')">Ödeme Emri</button>' : '') +
        '</td></tr>';
    }).join('') +
  '</tbody></table></div>';

  if(state.muhasebeCariBakiyeSecili){
    const f = state.firmalar.find(x=>(x.ID||x.id)===state.muhasebeCariBakiyeSecili);
    if(f) html += cariHesaplarDetayHtml(f);
  }

  return html;
}

      '<div class="kv"><span>Güncel bakiye</span><span class="num"><b style="color:'+(b.bakiye>0.5?'var(--danger)':(b.bakiye<-0.5?'var(--success)':'var(--ink)'))+';">'+money(b.bakiye)+'</b></span></div>' +

    '</div>';
  }
  return html;
}
function setMutabakatFirma(v){ state.mutabakatSeciliFirma = v; renderContentKeepFocus(); }
function mutabakatMektubuOlustur(){
  const ad = (state.mutabakatSeciliFirma||'').trim();
